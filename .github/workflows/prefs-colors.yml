name: prefs-colors
# Preferences' colours against Slack's tokens: the token tests, the native
# checkbox pixels, and screenshots of Availability / Notifications / Plugins
# in light, dark, a custom-hex account theme (light and dark) and Hot Dog
# Stand, over the whole client signed in to internal/fakeslack. Synthetic
# data only: nothing here talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run prefs-colors.yml --ref <branch>)
    paths:
      - "internal/ui/prefs*.go"
      - "internal/ui/taut_prefs.go"
      - "internal/ui/theme_tokens_test.go"
      - "internal/ui/theme/native.go"
      - "internal/ui/popups/prefs_availability.go"
      - "internal/ui/popups/datetime.go"
      - "internal/ui/popups/modal.go"
      - ".github/workflows/prefs-colors.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  prefs-colors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: token and pixel tests
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a go test -p 1 -count=1 -v -run 'TestPrefsColors|TestNativeCheckPixels|TestThemeTokens|TestThemeOverlayRulesReachNatives|TestPrefsPagesMatchSlack|TestAccountTheme' ./internal/ui/
      - name: Preferences colour screenshots
        env:
          PREFS_COLOR_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$PREFS_COLOR_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -timeout 15m -run 'TestPrefsColorShots$' ./internal/ui/
          ls "$PREFS_COLOR_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: prefs-colors-shots
          path: dist/shots
