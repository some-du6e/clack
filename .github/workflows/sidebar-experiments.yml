name: sidebar-experiments
# The sidebar package of docs/EXPERIMENTS.md against internal/fakeslack at
# 1440x900: the text filter (sidebar_text_filter, _m2, _m3), temporary
# mutes (temp_mute), the draft pencil's tooltip and menu, organize mode,
# each experiment flipped, every state saved as a screenshot. Synthetic
# only: nothing here talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run sidebar-experiments.yml --ref <branch>)
    paths:
      - "internal/ui/sidebar*.go"
      - "internal/ui/temp_mute_test.go"
      - "internal/ui/section_menu.go"
      - "internal/ui/popups/notify_menu.go"
      - "internal/core/sidebar_filter*.go"
      - "internal/core/temp_mute*.go"
      - "internal/fakeslack/closed_dms.go"
      - "internal/ui/messages/active_thread*.go"
      - "internal/core/section_move.go"
      - ".github/workflows/sidebar-experiments.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb

permissions:
  contents: read

jobs:
  sidebar-experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: core and the fake
        run: go test -count=1 -v -run 'TestSidebarTextFilter|TestTempMute|TestDNDEndHour|TestExperimentReadsListed' ./internal/core/
      - name: sidebar, bell menu + screenshots
        env:
          PREVIEW_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$PREVIEW_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -timeout 20m -run 'TestSidebarTextFilter|TestTempMute|TestSidebarDraft|TestSectionMoveToast|TestChannelBellMenu$|TestChannelNotifyAdvancedSettings$' ./internal/ui/
          xvfb-run -a go test -count=1 -v -run 'TestActiveThreadRoot' ./internal/ui/messages/
          ls -l "$PREVIEW_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: sidebar-experiments-shots
          path: dist/shots
