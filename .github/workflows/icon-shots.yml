name: icon-shots
# Clack's icons against Slack's own: downloads the icon set Slack's public
# web client ships (the Iconify JSON slack-datamine-plus extracts from the
# CDN; never committed), draws Clack's icons through Gio's GPU renderer
# (Mesa llvmpipe) and compares their ink and shape with Slack's glyphs
# rasterized the way Chrome does, in the composer's light and dark inks at
# 1x and 2x (TestIconsMatchSlack: every icon the code draws, within 6% of
# Slack's ink at 2x and 10% at 1x; contact sheets icons-vs-slack-{dark,light}-{1,2}x.png and
# icons-vs-slack.tsv in the icon-shots artifact). The glyphs of Slack's icon
# font (slack-icons-v2-05e8fec.woff2, dumped by .github/scripts/
# slack_icon_font.py) and the illustrations Slack ships as SVG files
# (TestArtMatchesSlack: art-vs-slack-*.png) come from the same public CDN,
# fetched without cookies. Also screenshots the composer's
# formatting bar (TestFormatBarShots) and the emoji picker's Emoji | GIFs
# row (TestEmojiTabRow). The ui-slick job adds the same row with BetterGifs
# installed (emoji-tabs-bettergifs-*.png in ui-slick-theme-shots).
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run icon-shots.yml --ref <branch>)
    paths:
      - "internal/ui/icons/**"
      - "internal/ui/theme/**"
      - "internal/ui/composer/chrome*.go"
      - "internal/ui/composer/autocomplete_view.go"
      - "internal/ui/huddleui/connection.go"
      - "internal/ui/huddleui/invitewin.go"
      - "internal/ui/focus_mode.go"
      - "internal/ui/slackc/kit/controls.go"
      - "internal/ui/popups/profile_card.go"
      - ".github/scripts/slack_icon_font.py"
      - "internal/ui/composer/formatbar_shot_test.go"
      - "internal/ui/popups/emoji*.go"
      - "internal/ui/popups/style.go"
      - "internal/ui/popups/search_view.go"
      - "internal/ui/blockkit/agenticons.go"
      - ".github/workflows/icon-shots.yml"
  workflow_dispatch:
    inputs:
      expect_fail:
        description: "proof runs: the tests that must fail, comma-separated (TestA,TestB/sub); the run passes only if each fails and nothing else does (docs/CI-SPEED.md, Proof runs)"
        required: false
        default: ""

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

# A newer run for the same branch, tag or PR cancels this one while it is
# queued or running, so stale pushes don't pile up in the shared queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  icon-shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: 1.5 x p95 (4.2 min) + 3, docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/expect-fail
        with:
          tests: ${{ inputs.expect_fail }}
          leg: ${{ github.job }}-${{ strategy.job-index }}
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: Slack's icon set (public web client, via slack-datamine-plus)
        run: |
          set -euo pipefail
          mkdir -p /tmp/slack-icons
          curl -sfL --retry 20 --retry-delay 30 --retry-max-time 900 --retry-all-errors -o /tmp/slack-icons/icons.json https://raw.githubusercontent.com/IzieStratt/sdmp/main/build/icons.json
          curl -sfL --retry 20 --retry-delay 30 --retry-max-time 900 --retry-all-errors https://raw.githubusercontent.com/IzieStratt/sdmp/main/build/meta.json | head -c 300; echo
          python3 -c "import json;d=json.load(open('/tmp/slack-icons/icons.json'));print(len(d['icons']),'icons')"
      - name: Slack's icon font and illustrations (public CDN)
        run: |
          set -euo pipefail
          mkdir -p /tmp/slack-icons/art
          cdn=https://a.slack-edge.com/bv1-13-br
          get() { curl -sfL --compressed --retry 20 --retry-delay 30 --retry-max-time 900 --retry-all-errors -o "$1" "$2"; }
          get /tmp/slack-icons/slack-icons-v2-05e8fec.woff2 "$cdn/slack-icons-v2-05e8fec.woff2"
          get /tmp/slack-icons/art/focus-d8ca34d.svg "$cdn/focus-d8ca34d.svg"
          get /tmp/slack-icons/art/slack_logo_mark-8890ba0.svg "$cdn/slack_logo_mark-8890ba0.svg"
          # the file-type svgicons (icons/file_icons.go)
          for f in archive-4f1161f.svg binary-4f9150d.svg code-0bc11dc.svg css-783bfd2.svg email-5606c9a.svg file-audio-d14bae1.svg file-excel-6b1196f.svg file-google-document-dcaf469.svg file-google-presentation-2af45fd.svg file-google-spreadsheet-55f60ac.svg file-illustrator-6b9428f.svg file-image-ba11488.svg file-indesign-efa9016.svg file-lucidchart-cda1932.svg file-lucidpress-e83f9f9.svg file-lucidspark-1a50065.svg file-pdf-0922d15.svg file-photoshop-1ef50cb.svg file-powerpoint-ee70589.svg file-sketch-6d4d19b.svg file-snippet-0a4c72a.svg file-text-post-caa3b6f.svg file-text-quip-fdaf2cb.svg file-video-3dda18b.svg file-word-68a194e.svg file-zoho-show-e5b4196.svg generic-b556cfe.svg html-dcbdfbf.svg php-f34c36d.svg; do get "/tmp/slack-icons/art/$f" "$cdn/$f"; done
          python3 -m pip install --quiet fonttools brotli
          python3 "$GITHUB_WORKSPACE/.github/scripts/slack_icon_font.py" /tmp/slack-icons/slack-icons-v2-05e8fec.woff2 /tmp/slack-icons/font.json
          ls -l /tmp/slack-icons /tmp/slack-icons/art
      - name: icons vs Slack, formatting bar, emoji tab row
        env:
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
          CLACK_SLACK_ICONS: /tmp/slack-icons/icons.json
          CLACK_SLACK_ICON_FONT: /tmp/slack-icons/font.json
          CLACK_SLACK_ART: /tmp/slack-icons/art
          ICON_SHOTS_DIR: ${{ github.workspace }}/dist/icon-shots
        run: |
          set -o pipefail
          mkdir -p dist "$ICON_SHOTS_DIR"
          xvfb-run -a go test -p 1 -count=1 -v -run 'TestIconsMatchSlack|TestFileEntityIcon|TestArtMatchesSlack|TestArtParts|TestArtRefsExist|TestIconCoverage|TestIconRefsExist|TestStrokeGamma|TestSlackNames|TestFormatBarShots|TestEmojiTabRow|TestBroadcastRowShots' \
            ./internal/ui/icons/ ./internal/ui/theme/ ./internal/ui/composer/ ./internal/ui/popups/ 2>&1 | tee dist/icon-shots.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: icon-shots
          path: |
            dist/icon-shots
            dist/icon-shots.log
      - if: ${{ always() && env.XF_ID }}
        uses: ./.github/actions/expect-fail-report

  # expect_fail's verdict (docs/CI-SPEED.md, "Proof runs"): every listed
  # test failed in some job and passed in none, nothing else failed, every
  # job that ran succeeded. Proof runs only.
  expect-fail:
    needs:
      - icon-shots
    if: ${{ always() && inputs.expect_fail != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10 # budget, min (a checkout, setup-go and the check)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: tools/expectfail
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: expect-fail-*
          path: ${{ runner.temp }}/xf
      - name: every listed test failed, nothing else did
        env:
          EXPECT_FAIL: ${{ inputs.expect_fail }}
          NEEDS: ${{ toJSON(needs) }}
        run: go run ./tools/expectfail -check "$RUNNER_TEMP/xf"
