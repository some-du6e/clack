name: icon-shots
# Clack's icons against Slack's own: downloads the icon set Slack's public
# web client ships (the Iconify JSON slack-datamine-plus extracts from the
# CDN; never committed), draws Clack's icons through Gio's GPU renderer
# (Mesa llvmpipe) and compares their ink and shape with Slack's glyphs
# rasterized the way Chrome does, in the composer's light and dark inks at
# 1x and 2x (TestIconsMatchSlack). Also screenshots the composer's
# formatting bar (TestFormatBarShots) and the emoji picker's Emoji | GIFs
# row (TestEmojiTabRow). The ui-slick job adds the same row with BetterGifs
# installed (emoji-tabs-bettergifs-*.png in ui-slick-theme-shots).
on:
  push:
    paths:
      - "internal/ui/icons/**"
      - "internal/ui/theme/**"
      - "internal/ui/composer/chrome*.go"
      - "internal/ui/composer/formatbar_shot_test.go"
      - "internal/ui/popups/emoji*.go"
      - "internal/ui/popups/style.go"
      - ".github/workflows/icon-shots.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  icon-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: Slack's icon set (public web client, via slack-datamine-plus)
        run: |
          set -euo pipefail
          mkdir -p /tmp/slack-icons
          curl -sfL -o /tmp/slack-icons/icons.json https://raw.githubusercontent.com/IzieStratt/slack-datamine-plus/main/build/icons.json
          curl -sfL https://raw.githubusercontent.com/IzieStratt/slack-datamine-plus/main/build/meta.json | head -c 300; echo
          python3 -c "import json;d=json.load(open('/tmp/slack-icons/icons.json'));print(len(d['icons']),'icons')"
      - name: icons vs Slack, formatting bar, emoji tab row
        env:
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
          CLACK_SLACK_ICONS: /tmp/slack-icons/icons.json
          ICON_SHOTS_DIR: ${{ github.workspace }}/dist/icon-shots
        run: |
          set -o pipefail
          mkdir -p dist "$ICON_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestIconsMatchSlack|TestStrokeGamma|TestSlackNames|TestFormatBarShots|TestEmojiTabRow' \
            ./internal/ui/icons/ ./internal/ui/theme/ ./internal/ui/composer/ ./internal/ui/popups/ 2>&1 | tee dist/icon-shots.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: icon-shots
          path: |
            dist/icon-shots
            dist/icon-shots.log
