name: huddle
# Tests internal/huddle and builds its headless live probe (a developer
# tool; not shipped). The app itself builds in ci.yml.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run huddle.yml --ref <branch>)
    paths: ['internal/huddle/**', 'internal/clip/**', 'internal/ui/huddleui/**', 'internal/core/dnd*.go', 'internal/fakeslack/huddles.go', 'internal/ui/notify*.go', 'internal/ui/openurl/**', 'cmd/huddle-demo/**', 'packaging/macos/**', 'internal/ui/screenlock/**', 'internal/ui/globalkey/**', 'third_party/rnnoise-go/**', 'internal/tflite/**', 'internal/ui/prefs_pages.go', 'internal/ui/huddle_av.go', 'go.mod', 'go.sum', '.github/workflows/huddle.yml']
  workflow_dispatch:
    inputs:
      expect_fail:
        description: "proof runs: the tests that must fail, comma-separated (TestA,TestB/sub); the run passes only if each fails and nothing else does (docs/CI-SPEED.md, Proof runs)"
        required: false
        default: ""

# A newer run for the same branch, tag or PR cancels this one while it is
# queued or running, so stale pushes don't pile up in the shared queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  huddle:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: 1.5 x p95 (7.5 min) + 3, docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/expect-fail
        with:
          tests: ${{ inputs.expect_fail }}
          leg: ${{ github.job }}-${{ strategy.job-index }}
      - name: deps (Xlib headers for the X11 screen capture; Xvfb and xsetroot to test it; OpenH264 to test its encoder)
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq libx11-dev xvfb x11-xserver-utils libopenh264-dev
      - name: vet
        run: go vet ./internal/huddle/...
      - name: test
        run: go test -race -gcflags=all=-d=checkptr=0 ./internal/huddle/... # the transpiled libopus trips checkptr
      - name: screen share capture and encoder (Xvfb, OpenH264)
        # the X11 backend grabs a root painted by xsetroot; OpenH264's
        # screen-content mode encodes the test screen and goh264 decodes it
        run: xvfb-run -a go test -count=1 -v -run 'TestX11ScreenCapture|TestOpenH264Encode|TestFakeScreenShare' ./internal/huddle
      - name: voice clips (Opus in MP4) read back by ffprobe and decoded by ffmpeg
        run: |
          sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq ffmpeg
          CLACK_FFPROBE=1 go test -count=1 -v ./internal/clip
      - name: test (no cgo)
        run: CGO_ENABLED=0 go test ./internal/huddle/...
      - name: probe
        run: CGO_ENABLED=0 go build -trimpath -o dist/huddle-probe ./internal/huddle/probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: huddle-probe-linux-amd64
          path: dist/huddle-probe
      - if: ${{ always() && env.XF_ID }}
        uses: ./.github/actions/expect-fail-report

  demo:
    # the huddle UI against the fake Chime (cmd/huddle-demo)
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: 1.5 x p95 (5.8 min) + 3, docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/expect-fail
        with:
          tests: ${{ inputs.expect_fail }}
          leg: ${{ github.job }}-${{ strategy.job-index }}
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config
      - name: vet
        run: go vet ./internal/ui/huddleui/... ./cmd/huddle-demo/...
      - name: test
        run: go test -count=1 ./internal/ui/huddleui/... ./internal/ui/openurl/...
      - name: audio & video prefs (fake Chime only) and the OS hooks
        # the join preview, AGC/NS options, Mod+Shift+Space, leave on lock,
        # the lounge music; then the X11 grab typed at with xdotool under
        # Xvfb and the logind/ScreenSaver signals on a private dbus-daemon
        run: |
          sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq xvfb xdotool dbus
          go test -count=1 -v -run 'TestJoinPreviewFlow|TestHuddleMicProcessingPrefs|TestHuddleGlobalMute|TestHuddleLeaveOnLock|TestHuddleLoungeMusic' ./internal/ui/huddleui
          xvfb-run -a go test -count=1 -v ./internal/ui/globalkey ./internal/ui/screenlock
      - name: incoming invites and raise hand (race)
        # against fakeslack and the fake Chime only: nothing rings anyone
        run: go test -race -gcflags=all=-d=checkptr=0 -count=1 -v -run 'TestIncomingInvite|TestRaiseHand|TestPendingStatus|TestHuddleLink' ./internal/ui/huddleui
      - name: pictures (Mesa llvmpipe)
        env:
          CLACK_PIXEL_TESTS: "1"
          CLACK_SHOTS: ${{ github.workspace }}/dist/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq xvfb libgl1-mesa-dri libegl-mesa0
          # TestHuddleShotsInvite: invite-window-*, invite-card-*, invite-tiles-*, invite-toolbar-hand, invite-sticker-picker
          # TestHuddleShotsJoinPreview: join-preview-{start,camera-talking,mic-menu,no-devices,join,dm}-{light,dark}
          # TestHuddleShotsBlur: blur-self-preview-{off,on}-{light,dark} (the synthetic person, background blur)
          xvfb-run -a go test -count=1 -v -run 'TestHuddleShots|TestMicNoteFor|TestHeader' ./internal/ui/huddleui
          ls -la dist/shots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: huddle-shots
          path: dist/shots
      - name: build
        run: CGO_ENABLED=1 go build -trimpath -o dist/huddle-demo ./cmd/huddle-demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: huddle-demo-linux-amd64
          path: dist/huddle-demo
      - if: ${{ always() && env.XF_ID }}
        uses: ./.github/actions/expect-fail-report

  macos:
    # the cgo/Objective-C side: AVFoundation permission checks (TCC), Core
    # Audio through miniaudio, the AVFoundation camera and VideoToolbox
    # encoder glue (VideoToolbox must encode synthetic frames headless), and
    # the session against the fake Chime. The runner has no camera and no one
    # to answer a TCC prompt, so capture itself only runs on a real Mac; the
    # fake-Chime camera test publishes the test pattern through VideoToolbox.
    runs-on: macos-latest
    timeout-minutes: 15 # budget: 1.5 x p95 (6.4 min) + 3, docs/CI-SPEED.md
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/expect-fail
        with:
          tests: ${{ inputs.expect_fail }}
          leg: ${{ github.job }}-${{ strategy.job-index }}
      - name: vet
        run: go vet ./internal/huddle/... ./internal/ui/huddleui/... ./internal/ui/openurl/...
      - name: opus on arm64 (the transpiled libopus was generated on linux/amd64)
        run: go test -count=1 -v -run 'TestOpus|TestMic(AGC|NoiseSuppression)' ./internal/huddle
      - name: VideoToolbox + camera publish
        if: ${{ !cancelled() }}
        run: go test -count=1 -v -run 'TestVTEncode|TestFakeCamera|TestPCMEncoderRoundTrip|TestSCKList|TestFakeScreenShare' ./internal/huddle
      # voice clips: the transpiled libopus on arm64, Chromium's MP4 layout,
      # the recorder on a synthetic microphone
      - name: voice clips
        if: ${{ !cancelled() }}
        run: go test -count=1 -v ./internal/clip
      - name: test
        if: ${{ !cancelled() }}
        run: go test -count=1 -v ./internal/huddle/... ./internal/ui/huddleui/... ./internal/ui/openurl/... ./internal/ui/screenlock/... ./internal/ui/globalkey/... 2>&1 | tee test.log | grep -E '^(=== RUN|--- |ok|FAIL|panic)|opus' ; test "${PIPESTATUS[0]}" = 0
      - name: permission checks from inside an .app bundle
        if: ${{ !cancelled() }}
        run: |
          set -eu
          go test -c -o build/avperm.test ./internal/huddle/avperm
          for kind in usage nousage; do
            app=build/$kind/Clack.app
            mkdir -p $app/Contents/MacOS
            cp build/avperm.test $app/Contents/MacOS/clack
            sed "s/@VERSION@/0.0.1/g" packaging/macos/Info.plist > $app/Contents/Info.plist
            if [ $kind = nousage ]; then
              /usr/libexec/PlistBuddy -c 'Delete :NSMicrophoneUsageDescription' -c 'Delete :NSCameraUsageDescription' $app/Contents/Info.plist
            fi
            plutil -lint $app/Contents/Info.plist
            codesign --force --sign - --entitlements packaging/macos/Clack.entitlements $app
            AVPERM_EXPECT=$kind $app/Contents/MacOS/clack -test.v -test.run 'TestBundleUsage|TestRequestAnswersOnce'
          done
      - name: build the demo
        if: ${{ !cancelled() }}
        run: CGO_ENABLED=1 go build -trimpath -o dist/huddle-demo ./cmd/huddle-demo
      - if: ${{ always() && env.XF_ID }}
        uses: ./.github/actions/expect-fail-report

  windows:
    # the Windows sides: WTS lock events, RegisterHotKey, and the
    # microphone processing (RNNoise's amd64 kernels) and join preview
    runs-on: windows-latest
    timeout-minutes: 15 # budget: 1.5 x p95 (2.4 min) + 3, docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/expect-fail
        with:
          tests: ${{ inputs.expect_fail }}
          leg: ${{ github.job }}-${{ strategy.job-index }}
      - name: vet
        run: go vet ./internal/ui/screenlock/... ./internal/ui/globalkey/...
      # bash: a pwsh step reports only its last command's exit code
      - name: test
        shell: bash
        run: |
          rc=0
          go test -count=1 -v ./internal/ui/screenlock/... ./internal/ui/globalkey/... || rc=1
          go test -count=1 -v -run 'TestMic|TestPreview|TestVideoEffect|TestGDIShares|TestMFEncode|TestFakeScreenShare' ./internal/huddle || rc=1
          # voice clips: Chromium's MP4 layout, libopus, the recorder on a synthetic microphone
          go test -count=1 -v ./internal/clip || rc=1
          exit $rc
      - if: ${{ always() && env.XF_ID }}
        uses: ./.github/actions/expect-fail-report

  # expect_fail's verdict across the jobs (docs/CI-SPEED.md, "Proof runs"):
  # every listed test failed in some job and passed in none, nothing else
  # failed, every job that ran succeeded. Proof runs only. A new job goes
  # in its needs (.github/scripts/expect_fail_wire.py adds it).
  expect-fail:
    needs:
      - huddle
      - demo
      - macos
      - windows
    if: ${{ always() && inputs.expect_fail != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10 # budget, min (a checkout, setup-go and the check)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: tools/expectfail
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: expect-fail-*
          path: ${{ runner.temp }}/xf
      - name: every listed test failed, nothing else did
        env:
          EXPECT_FAIL: ${{ inputs.expect_fail }}
          NEEDS: ${{ toJSON(needs) }}
        run: go run ./tools/expectfail -check "$RUNNER_TEMP/xf"
