name: huddle
# Tests internal/huddle and builds its headless live probe (a developer
# tool; not shipped). The app itself builds in ci.yml.
on:
  push:
    paths: ['internal/huddle/**', 'internal/ui/huddleui/**', 'internal/ui/openurl/**', 'cmd/huddle-demo/**', 'go.mod', 'go.sum', '.github/workflows/huddle.yml']
  workflow_dispatch:
jobs:
  huddle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./internal/huddle/...
      - name: test
        run: go test -race -gcflags=all=-d=checkptr=0 ./internal/huddle/... # the transpiled libopus trips checkptr
      - name: test (no cgo)
        run: CGO_ENABLED=0 go test ./internal/huddle/...
      - name: probe
        run: CGO_ENABLED=0 go build -trimpath -o dist/huddle-probe ./internal/huddle/probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: huddle-probe-linux-amd64
          path: dist/huddle-probe

  demo:
    # the huddle UI against the fake Chime (cmd/huddle-demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config
      - name: vet
        run: go vet ./internal/ui/huddleui/... ./cmd/huddle-demo/...
      - name: build
        run: CGO_ENABLED=1 go build -trimpath -o dist/huddle-demo ./cmd/huddle-demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: huddle-demo-linux-amd64
          path: dist/huddle-demo

  macos-video:
    # the AVFoundation camera and VideoToolbox encoder glue (cgo/ObjC): it
    # must compile, and VideoToolbox must encode synthetic frames headless.
    # The runner has no camera and no one to answer a TCC prompt, so
    # capture itself is only exercised on a real Mac; the fake-Chime camera
    # test publishes the test pattern through VideoToolbox here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./internal/huddle/... ./internal/ui/huddleui/... ./internal/ui/openurl/...
      - name: VideoToolbox + camera publish
        run: go test -count=1 -v -gcflags=all=-d=checkptr=0 -run 'TestOpusRoundTrip|TestVTEncode|TestFakeCamera|TestPCMEncoderRoundTrip' ./internal/huddle
      - name: test
        if: ${{ !cancelled() }}
        run: go test -count=1 -gcflags=all=-d=checkptr=0 ./internal/huddle/... ./internal/ui/openurl/...
      - name: demo
        if: ${{ !cancelled() }}
        run: CGO_ENABLED=1 go build -trimpath -o dist/huddle-demo ./cmd/huddle-demo
