name: views-audit
# The rail list views against real Slack (docs/VIEWS-AUDIT.md): runs the
# audit's tests (Threads, Drafts & sent, To-dos, Unreads, Activity: their
# keyboard and realtime updates too) on internal/fakeslack's
# views fixtures and the synthetic activity feed, headlessly through Gio's
# GPU renderer (Mesa llvmpipe), and uploads light and dark screenshots of
# each state (views-audit-shots); and the channel Pins tab and bookmark
# folders (their rows, menus, modals and peeks) on #pins-gallery. Nothing
# here talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run views-audit.yml --ref <branch>)
    paths:
      - "internal/ui/views/**"
      - "internal/fakeslack/views.go"
      - "internal/fakeslack/drafts.go"
      - "internal/core/drafts.go"
      - "internal/core/reads.go"
      - "internal/core/channel_pins*.go"
      - "internal/core/bookmark_folders*.go"
      - "internal/core/channel_managers*.go"
      - "internal/ui/popups/bookmark_folder_modal.go"
      - "internal/ui/views/folder_tab*.go"
      - "internal/ui/views/file_picker*.go"
      - "internal/fakeslack/pins_folders.go"
      - "internal/ui/popups/bookmark_modals.go"
      - "internal/ui/popups/modal.go"
      - ".github/workflows/views-audit.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  views-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: views audit tests and screenshots
        env:
          VIEWS_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          mkdir -p "$VIEWS_SHOTS_DIR"
          go test -count=1 -v -run 'TestUnscheduleDraft|TestActivityFeedParams|TestPinsTabLikeSlack|TestBookmarkFoldersLikeSlack|TestFolderRowsShouldShow|TestCanEditTabsLikeSlack|TestCanEditTabsOnGrid|TestTabKinds|TestMoveTabByIndex|TestTabRenameRemove|TestChannelManagersPersist|TestPinsRefetchAfterSlowReconnect|TestFolderMoveUploadLikeSlack' ./internal/core
          xvfb-run -a go test -count=1 -v -run 'TestThreadsTimeLikeSlack|TestDraftsTimesLikeSlack|TestDraftsDeleteDialog|TestActivityEmptyStates|TestActivitySelectOptions|TestActivitySettingsMenu|TestThreadsUpToDateDivider|TestThreadsEmptyState|TestDraftsScheduledActions|TestViewsAuditShotsDark|TestThreadsKeysLikeSlack|TestThreadsRealtimeLikeSlack|TestDraftsKeysAndRealtimeLikeSlack|TestTodosKeysAndRealtimeLikeSlack|TestUnreadsHomeEndLikeSlack|TestThreadsHeaderGroups|TestKeyboardShortcutsSearchGroups|TestTodosSectionsGroups|TestThreadsShowMoreReplies|TestTodosSectionListsLikeSlack|TestSentKeysLikeSlack|TestSavedKeysLikeSlack|TestUnreadsGlobalScrollLikeSlack|TestDMsUnreadsEmptyLikeSlack|TestThreadsTypedTextLikeSlack|TestThreadsEnterFocusesTheRootLikeSlack|TestThreadsShowMoreFocusLikeSlack|TestTodosFocusedRowActionsLikeSlack|TestSavedFocusedRowActionsLikeSlack|TestTodosTombstoneEnterLikeSlack|TestLaterRemoveCopyLikeSlack|TestTodosViewSelectsLikeSlack|TestChannelPinsRows|TestFolderTabRows|TestPinsFoldersShots|TestFolderTabMoveLikeSlack|TestFolderCreateAndMoveLikeSlack|TestFolderUploadLikeSlack|TestFolderFilePickerLikeSlack|TestPinsAddToListButton|TestFolderKnowledgeVariant|TestFoldersMoreShots|TestChannelFilesFolderSelectLikeSlack|TestManageTabsRenameDeleteLikeSlack|TestChannelFilesAddToFolder|TestChannelFilesManageTabs' ./internal/ui/views
          ls -la "$VIEWS_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: views-audit-shots
          path: dist/shots
