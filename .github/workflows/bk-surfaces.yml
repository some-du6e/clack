name: bk-surfaces
# Block Kit surfaces and message-level features on the fake Slack's
# blockkit-gallery (synthetic data only, nothing talks to Slack): message
# permalink pills and unfurl cards, legacy attachments, the modal stack
# driven by the fake app (errors, push, update, back, clear, ×), App
# Home, ephemerals, shortcuts, pasted permalinks becoming composer slugs.
# Screenshots in light and dark are the bk-surfaces-shots artifact.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run bk-surfaces.yml --ref <branch>)
    paths:
      - "internal/ui/blockkit/**"
      - "internal/ui/richview/**"
      - "internal/richtext/**"
      - "internal/ui/composer/**"
      - "internal/core/interactive*.go"
      - "internal/core/slugs.go"
      - "internal/store/convkind.go"
      - "internal/fakeslack/**"
      - "internal/ui/bk_surfaces_test.go"
      - "internal/ui/bk_inputs_test.go"
      - "third_party/gioui.org/widget/editor.go"
      - ".github/workflows/bk-surfaces.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  bk-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: tests and screenshots
        env:
          BK_SURFACES_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$BK_SURFACES_SHOTS_DIR"
          go test -count=1 -v -run 'TestMessageMention|TestMessageUnfurlCard|TestAttachments' ./internal/richtext
          go test -count=1 -v -run 'TestMessageSlug|TestPastedSlackLinks|TestSlugAtom|TestParsePermalink' ./internal/ui/composer
          go test -count=1 -v -run 'TestGallerySurfaces' ./internal/fakeslack
          go test -count=1 -v -run 'TestSubmitView|TestViewEvents|TestShortcutsAndHome' ./internal/core
          go test -count=1 -v ./internal/ui/blockkit
          xvfb-run -a go test -count=1 -v -run 'TestBlockKitSurfaces$|TestBlockKitModalFieldsEdit$' ./internal/ui/
          ls -la "$BK_SURFACES_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: bk-surfaces-shots
          path: dist/shots
