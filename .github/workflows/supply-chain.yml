name: supply-chain
# Re-verifies what Clack embeds or builds from third parties:
# - internal/jsrt/vendor: each file against the sha256 recorded in its README,
#   against the npm registry tarball (sha512 = recorded dist.integrity), and
#   the wasi-libc licence texts against wasi-libc at the commit jsrt.yml's
#   wasi-sdk pins.
# - third_party/licenses (and emoji-data's licence): each text against its
#   upstream file at the commit its README pins.
# - tools/licenses.py for every build Clack ships (the desktop targets and the
#   browser demo): it fails on a module without a licence file, an embedded
#   font, model or script nothing covers, and a compiled file's copyright line
#   or SPDX id no text accounts for. Only go list runs.
#   Tarballs are only hashed, extracted and diffed; nothing in them is run.
# - go.sum: `go mod download` checks it against sum.golang.org, `go mod verify`
#   checks the extracted module cache against it.
# - workflows: every action pinned to a commit SHA; taut/slick pins agree.
# (internal/jsrt/jsrt.wasm's reproducibility is checked by jsrt.yml's wasm job.)
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same branch, tag or PR cancels this one while it is
# queued or running, so stale pushes don't pile up in the shared queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: vendored files match the recorded sha256
        working-directory: internal/jsrt/vendor
        run: |
          set -euo pipefail
          awk '/^```sha256$/{f=1;next} /^```$/{f=0} f' README.md > /tmp/vendor.sha256
          sha256sum -c --strict /tmp/vendor.sha256
          # no vendored .js the README doesn't list
          ls *.js | sort > /tmp/have
          awk '{print $2}' /tmp/vendor.sha256 | grep '\.js$' | sort > /tmp/listed
          diff /tmp/listed /tmp/have
      - name: vendored files match the npm registry tarballs
        working-directory: internal/jsrt/vendor
        run: |
          set -euo pipefail
          vendor=$PWD
          awk '/^```npm$/{f=1;next} /^```$/{f=0} f' README.md > /tmp/vendor.npm
          test -s /tmp/vendor.npm
          while read -r pkg ver integrity maps; do
            reg=$(curl -fsSL --retry 20 --retry-delay 30 --retry-max-time 900 --retry-all-errors "https://registry.npmjs.org/$pkg/$ver" | jq -r .dist.integrity)
            [ "$reg" = "$integrity" ] || { echo "::error::$pkg@$ver: registry integrity $reg, recorded $integrity"; exit 1; }
            d=$(mktemp -d)
            curl -fsSL --retry 20 --retry-delay 30 --retry-max-time 900 --retry-all-errors -o "$d/pkg.tgz" "https://registry.npmjs.org/$pkg/-/$pkg-$ver.tgz"
            got="sha512-$(openssl dgst -sha512 -binary "$d/pkg.tgz" | base64 -w0)"
            [ "$got" = "$integrity" ] || { echo "::error::$pkg@$ver: tarball $got, expected $integrity"; exit 1; }
            mkdir "$d/x" && tar -xzf "$d/pkg.tgz" -C "$d/x" --no-same-owner
            for m in $maps; do
              cmp "$d/x/package/${m%%=*}" "$vendor/${m#*=}"
              echo "$pkg@$ver ${m%%=*} == ${m#*=}"
            done
          done < /tmp/vendor.npm
      - name: vendored wasi-libc licences match wasi-libc at wasi-sdk's commit
        working-directory: internal/jsrt/vendor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          awk '/^```wasi-libc$/{f=1;next} /^```$/{f=0} f' README.md > /tmp/vendor.wasi
          read -r commit maps < /tmp/vendor.wasi
          v=$(sed -n 's/^  WASI_SDK_VERSION: "\([0-9]*\)".*/\1/p' ../../../.github/workflows/jsrt.yml)
          pinned=$(gh api "repos/WebAssembly/wasi-sdk/contents/src/wasi-libc?ref=wasi-sdk-$v" --jq .sha)
          [ "$pinned" = "$commit" ] || { echo "::error::wasi-sdk-$v pins wasi-libc $pinned; the vendored licence texts are from $commit"; exit 1; }
          d=$(mktemp -d)
          for m in $maps; do
            curl -fsSL --retry 20 --retry-delay 30 --retry-max-time 900 --retry-all-errors -o "$d/f" "https://raw.githubusercontent.com/WebAssembly/wasi-libc/$commit/${m%%=*}"
            cmp "$d/f" "${m#*=}"
            echo "wasi-libc@${commit:0:12} ${m%%=*} == ${m#*=}"
          done
      - name: third_party/licenses match their upstream files
        working-directory: third_party/licenses
        run: |
          set -euo pipefail
          awk '/^```upstream$/{f=1;next} /^```$/{f=0} f' README.md > /tmp/licenses.upstream
          test -s /tmp/licenses.upstream
          d=$(mktemp -d)
          while read -r repo commit maps; do
            for m in $maps; do
              curl -fsSL --retry 20 --retry-delay 30 --retry-max-time 900 --retry-all-errors -o "$d/f" "https://raw.githubusercontent.com/$repo/$commit/${m%%=*}"
              cmp "$d/f" "${m#*=}"
              echo "$repo@${commit:0:12} ${m%%=*} == ${m#*=}"
            done
          done < /tmp/licenses.upstream
      - name: the AppImage runtime matches its recorded sha256
        working-directory: packaging/linux/appimage-runtime
        run: |
          set -euo pipefail
          awk '/^```sha256$/{f=1;next} /^```$/{f=0} f' README.md | sha256sum -c --strict -
          ls runtime-* | sort | diff - <(awk '/^```sha256$/{f=1;next} /^```$/{f=0} f' README.md | awk '{print $2}' | sort)
      # every texts directory licenses.py names is in the upstream block or
      # vendored with its own check (jsrt/vendor), so a new one can't skip it
      - name: every extra licence text is checked
        run: |
          set -euo pipefail
          for f in $(sed -n "s/.*('file', '\(third_party\/licenses\/[^']*\)').*/\1/p" tools/licenses.py); do
            case $f in *.NOTICE) continue;; esac # generated: the licences job rebuilds and diffs them
            grep -qF "=${f#third_party/licenses/}" third_party/licenses/README.md || { echo "::error::$f isn't in third_party/licenses/README.md's upstream block"; exit 1; }
          done

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # the same targets release.yml and site.yml write THIRD_PARTY_LICENSES.txt
      # for, so a dependency missing its licence fails here, not on the tag
      - name: tools/licenses.py for each build
        run: |
          set -euo pipefail
          for t in linux/amd64/cgo linux/arm64/cgo windows/amd64/cgo windows/arm64 darwin/arm64/cgo darwin/amd64/cgo; do
            python3 tools/licenses.py --target "$t" -o "/tmp/licences-${t//\//-}.txt" ./cmd/clack
          done
          python3 tools/licenses.py --target js/wasm -o /tmp/licences-js-wasm.txt ./cmd/clack-web
      - name: goh264's FFmpeg notice matches FFmpeg at the tag goh264 names
        run: python3 tools/ffmpeg_copyrights.py | diff third_party/licenses/goh264-ffmpeg.NOTICE -

  go-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # verify a fresh download, not a restored cache
      - name: go mod download (checked against sum.golang.org)
        run: go mod download all
      - name: go mod verify
        run: go mod verify
      - name: module list
        run: go list -m all

  rnnoise:
    # third_party/rnnoise-go is v0.3.0 from the Go module proxy, file for
    # file, except go.mod (lowered to Go 1.24) and CLACK_PATCHES.md. The
    # zip is only hashed against sum.golang.org's go.sum line and diffed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: vendored rnnoise-go matches the proxy's v0.3.0
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          cd "$d"
          go mod init check >/dev/null 2>&1
          # the zip is fetched and checked against sum.golang.org even though
          # extracting stops at upstream's go 1.26 line
          GOFLAGS=-mod=mod GOTOOLCHAIN=local go mod download -json github.com/VoiceBlender/rnnoise-go@v0.3.0 > info.json || true
          zip=$(jq -r .Zip info.json)
          test -f "$zip" || { echo "::error::download failed"; cat info.json; exit 1; }
          mkdir x && unzip -q "$zip" -d x
          dir=$(echo "$d"/x/github.com/*/rnnoise-go@v0.3.0)
          cd "$GITHUB_WORKSPACE/third_party/rnnoise-go"
          find . -type f ! -name go.mod ! -name CLACK_PATCHES.md | sort | while read -r f; do
            cmp "$f" "$dir/$f"
          done
          echo "all vendored files match $(jq -r .Version "$d/info.json") ($(jq -r .Sum "$d/info.json"))"

  typesetting:
    # third_party/typesetting is go-text/typesetting v0.3.5 from the Go
    # module proxy (its non-test files), file for file, except the files
    # third_party/typesetting/CLACK_PATCHES.md lists as changed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: vendored go-text matches the proxy's v0.3.5 (but for Clack's patches)
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          cd "$d"
          go mod init check >/dev/null 2>&1
          GOFLAGS=-mod=mod go mod download -json github.com/go-text/typesetting@v0.3.5 > info.json
          dir=$(jq -r .Dir info.json)
          test -d "$dir" || { echo "::error::download failed"; cat info.json; exit 1; }
          cd "$GITHUB_WORKSPACE/third_party/typesetting"
          patched='font/clack_glyf.go font/font.go font/glyphs.go font/metrics.go font/renderer.go font/variations.go font/opentype/clack_bytes.go font/opentype/reader.go fontscan/clack_mmap.go fontscan/clack_mmap_unix.go fontscan/clack_mmap_windows.go fontscan/clack_mmap_other.go fontscan/fontmap.go harfbuzz/unicode.go CLACK_PATCHES.md'
          for f in $patched; do grep -qF "\`$f\`" CLACK_PATCHES.md || [ "$f" = CLACK_PATCHES.md ] || { echo "::error::$f is patched but CLACK_PATCHES.md doesn't name it"; exit 1; }; done
          find . -type f | sed 's#^\./##' | sort | while read -r f; do
            case " $patched " in *" $f "*) continue ;; esac
            cmp "$f" "$dir/$f"
          done
          echo "every unpatched vendored file matches $(jq -r .Version "$d/info.json") ($(jq -r .Sum "$d/info.json"))"

  websocket:
    # third_party/websocket is coder/websocket, at the version go.mod
    # requires, from the Go module proxy (its non-test files but the
    # browser backend), file for file, except the files
    # third_party/websocket/CLACK_PATCHES.md lists as changed, and those
    # differ only in their build constraint. The version comes from go.mod
    # alone: CLACK_PATCHES.md must name it, so a go get that bumps go.mod
    # without a new copy fails here instead of building the old copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: vendored coder/websocket matches the proxy's copy of go.mod's version (but for Clack's build constraints)
        run: |
          set -euo pipefail
          v=$(go list -m -f '{{.Version}}' github.com/coder/websocket)
          head -1 third_party/websocket/CLACK_PATCHES.md | grep -qF " $v" || { echo "::error::go.mod requires coder/websocket $v but third_party/websocket/CLACK_PATCHES.md is for: $(head -1 third_party/websocket/CLACK_PATCHES.md)"; exit 1; }
          d=$(mktemp -d)
          cd "$d"
          go mod init check >/dev/null 2>&1
          GOFLAGS=-mod=mod go mod download -json "github.com/coder/websocket@$v" > info.json
          dir=$(jq -r .Dir info.json)
          test -d "$dir" || { echo "::error::download failed"; cat info.json; exit 1; }
          cd "$GITHUB_WORKSPACE/third_party/websocket"
          patched='accept.go close.go compress.go conn.go dial.go doc.go frame.go hijack.go netconn_notjs.go read.go write.go mask_go.go CLACK_PATCHES.md'
          for f in $patched; do grep -qF "\`$f\`" CLACK_PATCHES.md || [ "$f" = CLACK_PATCHES.md ] || { echo "::error::$f is patched but CLACK_PATCHES.md doesn't name it"; exit 1; }; done
          find . -type f | sed 's#^\./##' | sort | while read -r f; do
            case " $patched " in *" $f "*) continue ;; esac
            cmp "$f" "$dir/$f"
          done
          for f in $patched; do
            [ "$f" = CLACK_PATCHES.md ] && continue
            if ! diff <(grep -v '^//go:build' "$dir/$f" | sed '/./,$!d') <(grep -v '^//go:build' "$f" | sed '/./,$!d'); then
              echo "::error::$f changes more than its build constraint"; exit 1
            fi
          done
          echo "every vendored file matches $(jq -r .Version "$d/info.json") ($(jq -r .Sum "$d/info.json")), the patched ones but for their build constraint"

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: every action pinned to a commit SHA
        run: |
          set -euo pipefail
          if grep -nE '^\s*-?\s*uses:' .github/workflows/*.yml | grep -vE 'uses: *[^@ ]+@[0-9a-f]{40}( |$)'; then
            echo "::error::unpinned actions above"; exit 1
          fi
      # every workflow that builds against Taut or Slick by its pin (reads
      # the variable) defines that pin itself, as a full commit SHA, and
      # every definition names the same commit: a workflow reading a pin it
      # doesn't define checks out the default branch, and a short or named
      # ref would follow upstream
      - name: taut/slick pins agree across workflows
        run: |
          set -euo pipefail
          cd .github/workflows
          shopt -s nullglob
          wf=(*.yml *.yaml)
          for v in TAUT_PIN SLICK_PIN; do
            defs=$( (grep -lE "^\s*$v:" "${wf[@]}" || true) | sort)
            # $X, ${X}, env.X, env['X'] / env["X"]
            uses=$( (grep -lE "(\\\$\{?$v\b|env\.$v\b|env\[['\"]$v['\"]\])" "${wf[@]}" || true) | sort)
            [ -n "$defs" ] || { echo "::error::no workflow defines $v"; exit 1; }
            missing=$(comm -13 <(echo "$defs") <(echo "$uses"))
            [ -z "$missing" ] || { echo "::error::$v is read but not defined in: $missing"; exit 1; }
            bad=$( (grep -nE "^\s*$v:" "${wf[@]}" || true) | grep -vE "^[^:]+:[0-9]+:\s*$v: [0-9a-f]{40}( +#.*)?$" || true)
            [ -z "$bad" ] || { echo "::error::$v must be a full commit SHA"; echo "$bad"; exit 1; }
            n=$(grep -hE "^\s*$v:" "${wf[@]}" | awk '{print $2}' | sort -u | wc -l)
            [ "$n" = 1 ] || { echo "::error::$v differs between workflows"; grep -nE "^\s*$v:" "${wf[@]}"; exit 1; }
            echo "$v: $(grep -hE "^\s*$v:" "${wf[@]}" | awk '{print $2}' | sort -u) in $(echo $defs)"
          done
