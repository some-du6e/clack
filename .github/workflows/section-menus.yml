name: section-menus
# The sidebar section heading menus (⋯ and right-click), the rail's Create
# menu and the section modals end to end against internal/fakeslack
# (users.channelSections.*, channel_sections prefs, bulk mute, mark read),
# rendered headlessly at 1440x900 with each menu saved as a screenshot.
# Synthetic only: nothing here talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run section-menus.yml --ref <branch>)
    paths:
      - "internal/ui/section_menu*.go"
      - "internal/ui/create_channel*.go"
      - "internal/ui/popups/section_modals.go"
      - "internal/ui/popups/menu*.go"
      - "internal/core/section_menu*.go"
      - "internal/core/sidebar_rules.go"
      - "internal/fakeslack/sections.go"
      - ".github/workflows/section-menus.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  section-menus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: core + fake tests
        run: go test -count=1 -v -run 'TestSetSectionPref|TestSectionNameError|TestSectionLifecycle|TestMuteMany|TestMarkManyRead|TestSectionLink' ./internal/core
      - name: menus, actions + screenshots
        env:
          SECTION_MENU_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$SECTION_MENU_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -timeout 15m -run 'TestSectionMenu|TestCreateChannelEntryPoints' ./internal/ui/
          ls -l "$SECTION_MENU_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: section-menu-shots
          path: dist/shots
