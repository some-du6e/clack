name: command-modals
# Slash commands that open app modals, and the typing indicator, on the
# fake Slack's blockkit-gallery (synthetic data only, nothing talks to
# Slack): chat.command with Slack's client_token, the fake app's
# views.open (view_opened) and views.update, its modal's errors and push,
# Slackbot's failure ephemerals, and the typing line under the composer
# for one, two and several people. Screenshots in light and dark are the
# command-modals-shots artifact.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run command-modals.yml --ref <branch>)
    paths:
      - "internal/core/command*.go"
      - "internal/core/interactive*.go"
      - "internal/core/writes.go"
      - "internal/fakeslack/**"
      - "internal/ui/composer/**"
      - "internal/ui/blockkit/**"
      - "internal/ui/slackc/host.go"
      - "internal/ui/slackc/view.go"
      - "internal/ui/command_modal_test.go"
      - ".github/workflows/command-modals.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  command-modals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: tests and screenshots
        env:
          COMMAND_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$COMMAND_SHOTS_DIR"
          go test -count=1 -v -run 'TestCommand|TestTicketCommandFakeslack|TestViewEvents|TestSubmitView' ./internal/core
          go test -count=1 -v -run 'TestTyping|TestAssistantStatusLine' ./internal/ui/composer
          xvfb-run -a go test -count=1 -timeout 20m -v -run 'TestCommandModalAndTyping$' ./internal/ui/
          ls -la "$COMMAND_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: command-modals-shots
          path: dist/shots
