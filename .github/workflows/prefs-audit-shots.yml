name: prefs-audit-shots
# Renders every Preferences page Slack has (Availability … Advanced, and
# Appearance's Custom theme tab) headlessly at 1440x900, light and dark, a
# screenshot per screenful, over the whole client signed in to
# internal/fakeslack, then runs the page and round-trip tests. Synthetic
# data only: nothing here talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run prefs-audit-shots.yml --ref <branch>)
    paths:
      - "internal/ui/prefs*.go"
      - "internal/ui/popups/prefs_availability.go"
      - "internal/ui/theme/rolehex*.go"
      - "internal/core/prefs_more.go"
      - "internal/core/rail.go"
      - "internal/store/store.go"
      - "internal/fakeslack/fakeslack.go"
      - ".github/workflows/prefs-audit-shots.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb

permissions:
  contents: read

jobs:
  prefs-audit-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: page and round-trip tests
        run: go test -count=1 -v -run 'TestPrefs|TestSendOnModEnter|TestRoleHex' ./internal/ui/ ./internal/ui/composer ./internal/ui/theme
      - name: Preferences screenshots
        env:
          PREFS_AUDIT_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$PREFS_AUDIT_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -timeout 15m -run 'TestPrefsAuditShots$' ./internal/ui/
          ls "$PREFS_AUDIT_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: prefs-audit-shots
          path: dist/shots
