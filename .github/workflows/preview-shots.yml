name: preview-shots
# Renders the channel-preview footers headlessly at 1440x900 against
# internal/fakeslack (join pane, its Join… menu, after Join, the archived
# bar, the posting-restricted roadblock) and uploads the screenshots.
# Synthetic only: nothing here talks to Slack.
on:
  push:
    paths:
      - "internal/ui/joinpane.go"
      - "internal/ui/channel_preview_test.go"
      - "internal/ui/conversation.go"
      - "internal/core/preview.go"
      - "internal/core/posting.go"
      - ".github/workflows/preview-shots.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb

permissions:
  contents: read

jobs:
  preview-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: channel preview screenshots
        env:
          PREVIEW_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$PREVIEW_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestChannelPreviewJoin$|TestPostingRestrictedRoadblock$' ./internal/ui/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: preview-shots
          path: dist/shots
