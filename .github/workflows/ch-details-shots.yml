name: ch-details-shots
# Channel details' Slack parts (docs/CHANNELS-AUDIT.md) rendered headlessly
# at 1440x900 against internal/fakeslack: Settings (AI use, Guest access,
# Member / Guest permissions, member suggestions, Copy members), the last
# member's "Leave and archive", and a DM's Add people modal. Synthetic
# only: nothing here talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run ch-details-shots.yml --ref <branch>)
    paths:
      - "internal/ui/views/details.go"
      - "internal/ui/views/details_more.go"
      - "internal/ui/views/details_slack_test.go"
      - "internal/ui/details_audit_test.go"
      - "internal/ui/details_host.go"
      - "internal/core/chdetails.go"
      - ".github/workflows/ch-details-shots.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb

permissions:
  contents: read

jobs:
  ch-details-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: details tests
        run: go test -count=1 -run 'TestDetails|TestHoverTriggerChannelMembers' ./internal/ui/views/
      - name: details screenshots
        env:
          PREVIEW_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$PREVIEW_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestChannelDetailsSettingsSlackShot$|TestChannelDetailsLeaveArchiveShot$|TestChannelDetailsDMAddPeopleShot$|TestChannelDetailsMembersAndApps$|TestChannelDetailsTabsShot$' ./internal/ui/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: ch-details-shots
          path: dist/shots
