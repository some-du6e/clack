name: ch-details-shots
# Channel details' Slack parts (docs/CHANNELS-AUDIT.md) rendered headlessly
# at 1440x900 against internal/fakeslack: Settings (AI use, Guest access,
# Member / Guest permissions, member suggestions, Copy members), the last
# member's "Leave and archive", a DM's Add people modal, Start a Call ▾
# and the channel email modal (W13), and W14's Posting permissions, apps
# browser and Custom history (light and dark). Synthetic only: nothing
# here talks to Slack, starts a call, sends an email or changes a setting.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run ch-details-shots.yml --ref <branch>)
    paths:
      - "internal/ui/views/details.go"
      - "internal/ui/views/details_more.go"
      - "internal/ui/views/details_call.go"
      - "internal/ui/views/details_email.go"
      - "internal/ui/views/details_w13_test.go"
      - "internal/ui/popups/channel_email.go"
      - "internal/ui/details_w13_shots_test.go"
      - "internal/core/chdetails_email.go"
      - "internal/fakeslack/calls_email.go"
      - "internal/ui/views/details_posting.go"
      - "internal/ui/views/details_history.go"
      - "internal/ui/views/details_w14_test.go"
      - "internal/ui/popups/apps_browser.go"
      - "internal/ui/details_w14_test.go"
      - "internal/core/chposting.go"
      - "internal/core/apps_index.go"
      - "internal/core/history_preview.go"
      - "internal/ui/views/details_slack_test.go"
      - "internal/ui/details_audit_test.go"
      - "internal/ui/details_host.go"
      - "internal/core/chdetails.go"
      - ".github/workflows/ch-details-shots.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb

permissions:
  contents: read

jobs:
  ch-details-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: details tests
        run: |
          go test -count=1 -run 'TestDetails|TestHoverTriggerChannelMembers|TestHistoryBeginningLabel|TestPostingBullets' ./internal/ui/views/
          go test -count=1 -run 'TestCallApps|TestStartCall|TestChannelEmail|TestPosting|TestChannelPostingPrefsCalls|TestFeatureAccess|TestApps|TestHistoryPreview' ./internal/core/
      - name: details screenshots
        env:
          PREVIEW_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$PREVIEW_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestChannelDetailsSettingsSlackShot$|TestChannelDetailsLeaveArchiveShot$|TestChannelDetailsDMAddPeopleShot$|TestChannelDetailsMembersAndApps$|TestChannelDetailsTabsShot$|TestChannelDetailsCallEmailShots|TestChannelDetailsPostingShot$|TestChannelDetailsAppsBrowserShot$|TestChannelDetailsDMCustomHistoryShot$|TestChannelDetailsToPublicShot$|TestChannelDetailsManagingShot$|TestChannelDetailsHideLinkShot$' ./internal/ui/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: ch-details-shots
          path: dist/shots
