name: lists-shots
# Renders lists from the fake server headlessly (table, board and a
# filtered view in full view, a channel's list tab, the side panel, an
# item's pane with comments; light and dark; a live update; an editing
# round trip; the keyboard's focus ring, selection and edit states; a
# record's right-click menu and Remind me submenu, the item pane's
# actions, Later's list record rows; the header's section button under
# custom_file_sections) and uploads the screenshots. Synthetic only: nothing here
# talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run lists-shots.yml --ref <branch>)
    paths:
      - "internal/lists/**"
      - "internal/ui/listview/**"
      - "internal/fakeslack/lists*"
      - "internal/core/lists*.go"
      - "internal/ui/views/later_records.go"
      - "internal/richtext/listslug*.go"
      - "internal/ui/lists_records_test.go"
      - "internal/ui/shortcut/**"
      - "internal/ui/file_section_button.go"
      - "internal/ui/views/files_section_button.go"
      - ".github/workflows/lists-shots.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  lists-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: list screenshots
        env:
          LISTS_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$LISTS_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestRender|TestLiveUpdate|TestEdit|TestListKeys|TestRecordContextMenu|TestRecordPaneMenu|TestSectionButton|TestMoreActionsMenu' ./internal/ui/listview/
          # list records outside the grid (lists_in_later, search_file_channel_messages): core's saved-api calls, the slugs, the menus and Later's rows
          go test -count=1 -v -run 'TestListRecord|TestFileChannelFile' ./internal/core
          go test -count=1 -v -run 'TestListSlug|TestFileChannelSlugs' ./internal/richtext
          xvfb-run -a go test -count=1 -v -timeout 20m -run 'TestListRecordMenusShots|TestLaterListRecordRows' ./internal/ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: lists-shots
          path: dist/shots
