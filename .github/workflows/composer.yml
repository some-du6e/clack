# Temporary: type-checks the composer with every error reported, runs its
# tests and builds the composer dev harness (deleted with cmd/composerharness).
name: composer
on:
  push:
    branches: [ui-composer]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config
      - name: compile (all errors)
        run: go build -gcflags=-e ./internal/ui/composer/ 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
      - name: vet
        if: ${{ !cancelled() }}
        run: go vet ./internal/ui/composer/
      - name: test
        if: ${{ !cancelled() }}
        run: go test -count=1 ./internal/ui/composer/
      - name: harness
        if: ${{ !cancelled() && hashFiles('cmd/composerharness/*.go') != '' }}
        run: mkdir -p dist && CGO_ENABLED=1 go build -trimpath -o dist/composerharness ./cmd/composerharness
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('dist/composerharness') != '' }}
        with:
          name: composerharness
          path: dist/composerharness
