name: taut
# Builds every plugin in Taut's plugins/ with Taut's own `build:user-plugin`
# (the same .js a user imports in Clack's Preferences > Taut), uploads them as
# an artifact, and runs internal/taut's acceptance tests against them.
# The built plugins are Taut's (GPLv3) and are never committed here.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run taut.yml --ref <branch>)
    paths:
      - "internal/taut/**"
      - "internal/jsrt/**"
      - ".github/workflows/taut.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "taut git ref (branch, tag or sha); empty = TAUT_PIN"
        required: false
        default: ""

# Taut is third-party code (GPLv3) built and run here: by default CI uses the
# reviewed commit TAUT_PIN; dispatch with ref=main (or any ref) to test upstream.
env:
  TAUT_PIN: 6fe5123e3b4cffaa16c6dda71291ad5d82cdad37

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: clone taut
        env:
          TAUT_REF: ${{ inputs.ref || env.TAUT_PIN }}
        run: |
          git clone -q https://github.com/jeremy46231/taut /tmp/taut
          case "$TAUT_REF" in -*|"") echo "bad taut ref: $TAUT_REF" >&2; exit 1;; esac
          git -C /tmp/taut checkout -q "$TAUT_REF"
          echo "TAUT_SHA=$(git -C /tmp/taut rev-parse HEAD)" >> "$GITHUB_ENV"
          git -C /tmp/taut log --oneline -1
      - name: "install taut deps (no scripts, so no electron download)"
        working-directory: /tmp/taut
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: build:user-plugin for every plugin
        working-directory: /tmp/taut
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/taut-plugins"
          n=0
          for f in plugins/*.ts plugins/*.tsx; do
            name=$(basename "$f"); name=${name%.tsx}; name=${name%.ts}
            npm run -s build:user-plugin -- "$f" "$GITHUB_WORKSPACE/dist/taut-plugins/$name.js"
            n=$((n+1))
          done
          echo "built $n plugins from taut $TAUT_SHA"
          echo "$TAUT_SHA" > "$GITHUB_WORKSPACE/dist/taut-plugins/TAUT_SHA"
          ls -la "$GITHUB_WORKSPACE/dist/taut-plugins"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: taut-plugins
          path: dist/taut-plugins
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # this job runs third-party code; never share its Go cache
      - name: gofmt
        run: test -z "$(gofmt -l internal/taut | tee /dev/stderr)"
      - name: vet
        run: go vet ./internal/taut/...
      - name: unit + acceptance tests
        env:
          TAUT_PLUGINS_DIR: ${{ github.workspace }}/dist/taut-plugins
        run: |
          set -o pipefail
          go test -count=1 -timeout 15m -v ./internal/taut/... 2>&1 | tee dist/taut-test.log
      - name: acceptance summary
        if: ${{ !cancelled() }}
        run: |
          grep -E '^(=== RUN|--- (PASS|FAIL|SKIP)|ok|FAIL)' dist/taut-test.log | grep -E 'Plugin|ok|FAIL' | tail -120 || true
