name: ui-taut
# Builds every Taut plugin with Taut's own `build:user-plugin`, then runs
# internal/ui's Taut tests: startup cost with no plugins, and Preferences >
# Taut rendered headlessly (main, Advanced, Appearance, About, every plugin
# page with its options, React editors and data panels) over a synthetic
# workspace. Screenshots (synthetic data only) are uploaded as an artifact;
# the built plugins (GPLv3) are never committed.
on:
  push:
    paths:
      - "internal/ui/*.go"
      - "internal/ui/slackc/**"
      - "internal/taut/**"
      - ".github/workflows/ui-taut.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "taut git ref (branch, tag or sha)"
        required: false
        default: "main"

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb

jobs:
  ui-taut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: clone taut
        run: |
          git clone -q https://github.com/jeremy46231/taut /tmp/taut
          git -C /tmp/taut checkout -q "${{ inputs.ref || 'main' }}"
          git -C /tmp/taut log --oneline -1
      - name: install taut deps (no scripts)
        working-directory: /tmp/taut
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: build:user-plugin for every plugin
        working-directory: /tmp/taut
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/taut-plugins"
          for f in plugins/*.ts plugins/*.tsx; do
            name=$(basename "$f"); name=${name%.tsx}; name=${name%.ts}
            npm run -s build:user-plugin -- "$f" "$GITHUB_WORKSPACE/dist/taut-plugins/$name.js"
          done
          ls "$GITHUB_WORKSPACE/dist/taut-plugins" | wc -l
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: ui Taut tests
        env:
          TAUT_PLUGINS_DIR: ${{ github.workspace }}/dist/taut-plugins
          TAUT_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$TAUT_SHOTS_DIR"
          xvfb-run -a go test -count=1 -timeout 15m -v -run 'TestTaut' ./internal/ui/
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ui-taut-shots
          path: dist/shots
