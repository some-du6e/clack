name: ui-taut
# Builds every Taut plugin with Taut's own `build:user-plugin`, then runs
# internal/ui's Taut tests: startup cost with no plugins, and Preferences >
# Taut and Preferences > Slick rendered headlessly (main, Advanced, Appearance, About, every plugin
# page with its options, React editors and data panels) over a synthetic
# workspace. Screenshots (synthetic data only) are uploaded as an artifact;
# the built plugins (GPLv3) are never committed.
on:
  push:
    paths:
      - "internal/ui/*.go"
      - "internal/ui/slackc/**"
      - "internal/taut/**"
      - "internal/slick/**"
      - ".github/workflows/ui-taut.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "taut git ref (branch, tag or sha)"
        required: false
        default: "main"

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb

jobs:
  ui-taut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: clone taut
        run: |
          git clone -q https://github.com/jeremy46231/taut /tmp/taut
          git -C /tmp/taut checkout -q "${{ inputs.ref || 'main' }}"
          git -C /tmp/taut log --oneline -1
      - name: install taut deps (no scripts)
        working-directory: /tmp/taut
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: build:user-plugin for every plugin
        working-directory: /tmp/taut
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/taut-plugins"
          for f in plugins/*.ts plugins/*.tsx; do
            name=$(basename "$f"); name=${name%.tsx}; name=${name%.ts}
            npm run -s build:user-plugin -- "$f" "$GITHUB_WORKSPACE/dist/taut-plugins/$name.js"
          done
          ls "$GITHUB_WORKSPACE/dist/taut-plugins" | wc -l
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: clone slick and build its plugins (Slick's own build)
        run: |
          set -o pipefail
          git clone -q https://github.com/3kh0/slick /tmp/slick
          git -C /tmp/slick log --oneline -1
          (cd /tmp/slick && bun install --frozen-lockfile --ignore-scripts)
          mkdir -p dist/slick-plugins
          node internal/slick/build/build.mjs /tmp/slick dist/slick-plugins > dist/slick-build.log 2>&1 || { tail -40 dist/slick-build.log; exit 1; }
          cp -r /tmp/slick/themes dist/slick-plugins/themes
          ls dist/slick-plugins | wc -l
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: ui Taut tests
        env:
          TAUT_PLUGINS_DIR: ${{ github.workspace }}/dist/taut-plugins
          TAUT_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          SLICK_PLUGINS_DIR: ${{ github.workspace }}/dist/slick-plugins
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$TAUT_SHOTS_DIR"
          xvfb-run -a go test -count=1 -timeout 25m -v -run 'TestTaut|TestSlick|TestDeepLink' ./internal/ui/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: ui-taut-shots
          path: dist/shots
