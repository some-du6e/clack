name: composer-audit-shots
# The message composer against Slack (docs/COMPOSER-AUDIT.md): runs the
# audit's tests (the 12,000-character limit and its warning, the clip
# buttons Slack leaves out without a recorder, Run shortcut's disabled
# state, the @ button, an emptied edit asking to delete, Slack's live
# markdown, the composer keys, the schedule menu's rows, the formatting
# toggle's msg_input_sticky_composer pref; composer-2's Mod+Shift+F,
# draft GIFs, the Edit file dialog and alt text speed bump, the snippet
# dialog's tab stops, colours, counter, warning and picker, the floating
# bar's window bounds; gap-w10's full-width markers, the fence that ends
# a code line, Up out of a leading code block, lists inside a quote,
# Down in an empty box, the reply box's page keys, the offline help, the
# link dialog's rich text and the native spellcheck menu; gap-w28's Mod+K
# coachmark, quoted code blocks, the footer's fold point and overflow row
# and Navigate focusing the composer; edit-replies' edit round-trip of
# every rich_text element and the message slug; polish-1113b's @group
# tooltip, TextyTooltipUserGroup; tooltips-classes' emoji title tooltip,
# a person's slug card and every tooltip's window bounds, theme's
# PlaceTooltip; long-links' link slugs: every pasted link offered to
# chat.slugifyUrl, a link answer the "link" pill labelled with its
# display_url, sent as a truncated link and edited back as the pill) on
# the synthetic workspace
# and internal/fakeslack, then draws the composer headlessly through
# Gio's GPU renderer (Mesa llvmpipe) in light and dark and uploads the
# screenshots (composer-audit-shots). Nothing here talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run composer-audit-shots.yml --ref <branch>)
    paths:
      - "internal/ui/composer/**"
      - "internal/ui/nativemenu/**"
      - "internal/ui/popups/member_names_tip*.go"
      - "internal/ui/popups/popover.go"
      - "internal/ui/popups/tooltip_edges_test.go"
      - "internal/ui/theme/tooltip*.go"
      - "internal/core/slugs*.go"
      - "internal/fakeslack/slug_display*.go"
      - "internal/ui/richview/truncated_link_test.go"
      - ".github/workflows/composer-audit-shots.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: composer audit tests
        run: |
          go test -count=1 -v -run 'TestSlackLength|TestOverLimitBlocksSend|TestClipButtonsNeedARecorder|TestShortcutAndMentionButtons|TestEmptyEditAsksToDelete|TestMarkdownShortcutsLikeSlack|TestComposerKeysLikeSlack|TestComposerEditingKeysLikeSlack|TestScheduleMenuRows|TestFormattingTogglePref|TestPasteLimit|TestAutoformat|TestLiveMarkup|TestEnter|TestBackspace|TestAffinityFeaturesFollowExperiment|TestScheduleDialogLikeSlack|TestSnippetDialogLikeSlack|TestSnippetTypeOptions|TestPasteLimitCreatesSnippet|TestPlusMenuRows|TestScheduledSendBar|TestSlashListKeysByApp|TestFloatBarPosition|TestFloatBarShowsLikeSlack|TestFloatBarWindowBounds|TestConvertMarkdown|TestGif|TestNoGifRowWithoutThePicker|TestPlusMenuMacHints|TestEditFileDetailsLikeSlack|TestAltTextSpeedBumpLikeSlack|TestSnippetTabStops|TestSnippetTabKey|TestSnippetHighlightClasses|TestSnippetShareWarning|TestSnippetConvPicker|TestW10|TestSpellContextMenu|TestW28|TestFoldFooter|TestToolbarWidth|TestEditRoundTripEveryElement|TestEditDateAndColorLikeSlack|TestEditComposerMessageSlug|TestDocFromRichtextMessageMention|TestGroupTooltipLikeSlack|TestGroupTooltipTruncatesLikeSlack|TestEmojiTooltipLikeSlack|TestEmojiTooltipKeepsInsideTheWindow|TestSlugProfileCardLikeSlack|TestLinkSlugSerialisation|TestPastedLinksBecomeLinkSlugs|TestLinkSlugPasteSendsTruncatedLink|TestEditComposerLinkSlug|TestDocFromTruncatedLink|TestPastedSlackLinksBecomeSlugs|TestSlugAtomKinds' ./internal/ui/composer
          go test -count=1 -v -run 'TestSlugifyURLsLinkSlugs' ./internal/core
          go test -count=1 -v -run 'TestSlugDisplayURL' ./internal/fakeslack
          go test -count=1 -v -run 'TestTruncatedLinkChip|TestTruncatedLinkSpan' ./internal/ui/richview
          go test -count=1 -v -run 'TestTooltipMemberNamesLikeSlack|TestMemberNamesTipWraps|TestTooltipKeepsInsideTheWindow|TestSlackPlace' ./internal/ui/popups
          go test -count=1 -v -run 'TestPlaceTooltipLikeSlack|TestTipOriginFromPointer' ./internal/ui/theme
      - name: the send button and Enter through the window (whole app on fakeslack)
        run: go test -count=1 -v -run 'TestSendButtonClicks|TestW28NavigateFocusesComposer' ./internal/ui
      - name: screenshots (Mesa llvmpipe)
        env:
          COMPOSER_AUDIT_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          TOOLTIP_SHOTS_DIR: ${{ github.workspace }}/dist/shots/tooltips
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$COMPOSER_AUDIT_SHOTS_DIR" "$TOOLTIP_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestComposerAuditShots|TestExpComposerShots|TestComposer2Shots|TestW10Shots|TestW28Shots|TestComposerFollowsLiveThemeSwitch|TestEditComposerSlugShots|TestGroupTooltipShots|TestTextyTooltipShots|TestLinkSlugShots' ./internal/ui/composer
          xvfb-run -a go test -count=1 -v -run 'TestTooltipEdgeShots' ./internal/ui/popups
          ls -la "$COMPOSER_AUDIT_SHOTS_DIR"
      # a live Light/Dark switch against a fresh start in that mode: the
      # sidebar, messages, the composer, the emoji picker, a menu, a modal
      - name: live theme switch vs a fresh start (Mesa llvmpipe)
        if: ${{ !cancelled() }}
        env:
          LIVE_THEME_SHOTS_DIR: ${{ github.workspace }}/dist/shots/live-theme
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$LIVE_THEME_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -timeout 20m -run 'TestLiveThemeSwitchMatchesFresh' ./internal/ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: composer-audit-shots
          path: dist/shots
