name: hover-card
# The profile hover card, the channel-tab slug peeks, a canvas's channel
# card and Slack's ChannelHoverCard (a message's
# #channel, a channel-tab slug, a composer channel slug: the code channel
# card, the huddle badge, the rich topic) and the composer's app tooltip:
# timing/placement unit tests, the router tests
# per trigger location (messages, mentions, search results, channel
# details members, Activity reactions), the member/app/external fixture
# render tests on internal/fakeslack, a click on a person opening the
# profile pane (from the channel, and over the thread with its back
# button), and screenshots of the cards and panes over the whole client
# (GPU, synthetic fakeslack data only: nothing here talks to Slack).
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run hover-card.yml --ref <branch>)
    paths:
      - "internal/ui/hovercard/**"
      - "internal/ui/hover_card*.go"
      - "internal/ui/popups/profile_card.go"
      - "internal/ui/popups/app_card.go"
      - "internal/ui/popups/channel_card*.go"
      - "internal/ui/popups/code_card*.go"
      - "internal/core/code_card*.go"
      - "internal/core/experiments.go"
      - "internal/ui/huddleui/sidebar_suffix*.go"
      - "internal/ui/popups/member_tip.go"
      - "internal/core/channel_card*.go"
      - "internal/ui/channel_card_test.go"
      - "internal/ui/tab_slug_peek*.go"
      - "internal/ui/workflows_peek.go"
      - "internal/ui/popups/tab_peek.go"
      - "internal/ui/popups/canvas_channel_card.go"
      - "internal/core/tab_peeks*.go"
      - "internal/ui/views/channel_files_peek.go"
      - "internal/ui/composer/texty_tip*.go"
      - "internal/ui/popups/hover_*test.go"
      - "internal/ui/popups/search_view.go"
      - "internal/ui/views/details.go"
      - "internal/ui/views/activity.go"
      - "internal/ui/views/hover_triggers_test.go"
      - "internal/ui/messages/hover_bot_test.go"
      - "internal/core/app_card*.go"
      - "internal/core/app.go"
      - "internal/ui/richview/view.go"
      - "internal/ui/messages/row.go"
      - "internal/ui/host.go"
      - "internal/ui/secondary.go"
      - "internal/ui/profile_click_test.go"
      - "internal/ui/mention_click_test.go"
      - "internal/ui/popups/app_details.go"
      - "internal/ui/popups/app_icon.go"
      - "internal/fakeslack/**"
      - ".github/workflows/hover-card.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  hover-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: hover card tests and screenshots
        env:
          HOVER_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$HOVER_SHOTS_DIR"
          go test -count=1 -v ./internal/ui/hovercard
          go test -count=1 -v -run 'TestLocality|TestAppCardAndExternal|TestChannelCard|TestChannelTabSlugPeek' ./internal/core
          go test -count=1 -v -run 'TestHoverCard|TestHoverTrigger|TestLocalTimeLabel' ./internal/ui/popups
          xvfb-run -a go test -count=1 -v -run 'TestChannelHoverCard|TestComposerMemberTip' ./internal/ui/popups
          xvfb-run -a go test -count=1 -v -run 'TestSlugChannelCardAndAppTipLikeSlack|TestSlugProfileCardLikeSlack' ./internal/ui/composer
          go test -count=1 -v -run 'TestHoverTrigger' ./internal/ui/views
          go test -count=1 -v -run 'TestRowHoverTarget' ./internal/ui/messages
          go test -count=1 -v -run 'TestMentionHoverCard|TestCanvasChannelAndTabSlugCards' ./internal/ui/richview
          xvfb-run -a go test -count=1 -v -run 'TestHoverCardInChannel|TestHoverCardOverDialog|TestPersonClickOpensProfilePane|TestMentionHoverAndClick|TestChannelHoverCardInChannel|TestChannelHoverCardCodeHuddleTabs|TestTabSlugPeeks|TestCanvasChannelCard' ./internal/ui/
          # the shared huddle badge (the sidebar suffix and the channel card's): card-badge-*.png
          CLACK_PIXEL_TESTS=1 CLACK_SHOTS="$HOVER_SHOTS_DIR" xvfb-run -a go test -count=1 -v -run 'TestCardBadgeLikeSidebar|TestSidebarSuffixFaces|TestSidebarSuffixTooltipHover|TestSidebarFaceCrescent|TestSidebarTooltipShots' ./internal/ui/huddleui
          ls -la "$HOVER_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: hover-card-shots
          path: dist/shots
