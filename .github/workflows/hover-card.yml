name: hover-card
# The profile hover card: timing/placement unit tests, the router tests,
# the fixture render test on internal/fakeslack, and screenshots of the
# card over the whole client (GPU, synthetic fakeslack data only: nothing
# here talks to Slack).
on:
  push:
    paths:
      - "internal/ui/hovercard/**"
      - "internal/ui/hover_card*.go"
      - "internal/ui/popups/profile_card.go"
      - "internal/ui/popups/hover_card_test.go"
      - "internal/ui/richview/view.go"
      - "internal/ui/messages/row.go"
      - "internal/fakeslack/**"
      - ".github/workflows/hover-card.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  hover-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: hover card tests and screenshots
        env:
          HOVER_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$HOVER_SHOTS_DIR"
          go test -count=1 -v ./internal/ui/hovercard
          go test -count=1 -v -run 'TestHoverCard|TestLocalTimeLabel' ./internal/ui/popups
          go test -count=1 -v -run 'TestMentionHoverCard' ./internal/ui/richview
          xvfb-run -a go test -count=1 -v -run 'TestHoverCardInChannel' ./internal/ui/
          ls -la "$HOVER_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: hover-card-shots
          path: dist/shots
