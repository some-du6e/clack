name: spacing-shots
# Message list spacing against Slack's CSS: the row/baseline geometry tests
# (internal/ui/messages/spacing_test.go), the composer's formatting-bar
# overflow rule, and screenshots of three consecutive messages in a channel
# and in a thread pane, light and dark, rendered headlessly over an offline
# core. Synthetic only: nothing here talks to Slack.
on:
  push:
    paths:
      - "internal/ui/messages/**"
      - "internal/ui/composer/chrome*.go"
      - "internal/ui/composer/composer.go"
      - "internal/ui/richview/**"
      - "internal/ui/spacing_shots_test.go"
      - ".github/workflows/spacing-shots.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb

permissions:
  contents: read

jobs:
  spacing-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: geometry
        run: |
          go test -count=1 -v -run 'TestMessageGeometry|TestThreadTime' ./internal/ui/messages/
          go test -count=1 -v -run 'TestChromeBarWidth' ./internal/ui/composer/
      - name: screenshots
        env:
          SPACING_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$SPACING_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestSpacingShots$' ./internal/ui/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: spacing-shots
          path: dist/shots
