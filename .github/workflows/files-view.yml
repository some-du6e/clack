name: files-view
# The Files rail tab, ported from Slack's web client (docs/FILES-AUDIT.md,
# "Files view" and "Sections, Recently viewed and the rest"): starring
# (files.favorites.*), the ⋯ menu, Delete, Edit file details, list
# templates and the file opener; the sidebar's file sections
# (files.collections.*, Move to section, the section menu and modals),
# Recently viewed, Bulk manage, the "+" / "New" menus and paging, against
# internal/fakeslack, plus screenshots of all of it (the sidebar's both
# layouts, the menus, the dialogs, the empty states and the pagination
# row), light and dark. Synthetic only: nothing here talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run files-view.yml --ref <branch>)
    paths:
      - "internal/ui/views/files.go"
      - "internal/ui/views/files_deleted.go"
      - "internal/ui/views/files_sections.go"
      - "internal/ui/views/files_create.go"
      - "internal/ui/views/files_organize.go"
      - "internal/ui/views/files_pages.go"
      - "internal/ui/views/files_sections_test.go"
      - "internal/ui/files_open.go"
      - "internal/ui/files_open_test.go"
      - "internal/core/files_sections.go"
      - "internal/core/files_sections_test.go"
      - "internal/fakeslack/files_sections.go"
      - "internal/ui/popups/slack_place.go"
      - "internal/ui/views/files_view_test.go"
      - "internal/ui/views/files_empty_test.go"
      - "internal/ui/views/adapt.go"
      - "internal/core/files_view.go"
      - "internal/core/files_view_test.go"
      - "internal/fakeslack/files_view.go"
      - ".github/workflows/files-view.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  files-view:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: tests and screenshots
        env:
          VIEWS_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          mkdir -p "$VIEWS_SHOTS_DIR"
          go test -count=1 -v -run 'TestFilesView|TestListCreate' ./internal/core
          go test -count=1 -v -run 'TestFilesRecentlyViewed' ./internal/ui
          xvfb-run -a go test -count=1 -v -run 'TestFilesView|TestFilesEmpty|TestFilesSidebar' ./internal/ui/views
          ls -la "$VIEWS_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: files-view-shots
          path: dist/shots
