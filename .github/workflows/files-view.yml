name: files-view
# The Files rail tab, ported from Slack's web client (docs/FILES-AUDIT.md,
# "Files view" and "Sections, Recently viewed and the rest"): starring
# (files.favorites.*), the ⋯ menu, Delete, Edit file details, list
# templates and the file opener; the sidebar's file sections
# (files.collections.*, Move to section, the section menu and modals),
# Recently viewed, Bulk manage, the "+" / "New" menus and paging, against
# internal/fakeslack, plus screenshots of all of it (the sidebar's both
# layouts, the menus, the dialogs, the empty states and the pagination
# row), light and dark; and the channel's Files & links tab ("Files & links
# tab": search.modules.files / conversations.searchLinks, the rows, the
# radios, Sort, Load More, the menus, the keyboard and its shots; round 2:
# the search's suggestions, Share, the star, View link details, the media
# viewer's gallery, the grid's arrows and hiding / moving tabs).
# Synthetic only: nothing here talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run files-view.yml --ref <branch>)
    paths:
      - "internal/ui/views/files.go"
      - "internal/ui/views/files_deleted.go"
      - "internal/ui/views/files_sections.go"
      - "internal/ui/views/files_peek.go"
      - "internal/ui/views/files_create.go"
      - "internal/ui/views/files_organize.go"
      - "internal/ui/views/files_pages.go"
      - "internal/ui/views/files_sections_test.go"
      - "internal/ui/files_open.go"
      - "internal/ui/files_open_test.go"
      - "internal/core/files_sections.go"
      - "internal/core/files_sections_test.go"
      - "internal/fakeslack/files_sections.go"
      - "internal/ui/popups/slack_place.go"
      - "internal/ui/views/files_view_test.go"
      - "internal/ui/views/files_empty_test.go"
      - "internal/ui/views/adapt.go"
      - "internal/core/files_view.go"
      - "internal/core/files_view_test.go"
      - "internal/fakeslack/files_view.go"
      - "internal/ui/views/channel_files.go"
      - "internal/ui/views/channel_files_test.go"
      - "internal/core/channel_files.go"
      - "internal/core/channel_files_test.go"
      - "internal/fakeslack/channel_files.go"
      - "internal/ui/files_tab.go"
      - "internal/ui/files_tab_test.go"
      - "internal/core/channel_files_more.go"
      - "internal/core/channel_files_more_test.go"
      - "internal/core/channel_tabs_edit.go"
      - "internal/fakeslack/channel_files_more.go"
      - "internal/ui/views/channel_files_more.go"
      - "internal/ui/views/channel_files_more_test.go"
      - "internal/ui/views/link_details.go"
      - "internal/ui/views/details_tabs_manage.go"
      - "internal/ui/popups/share_file.go"
      - "internal/ui/popups/share_file_test.go"
      - "internal/ui/popups/lightbox_gallery.go"
      - "internal/ui/popups/bookmark_modals.go"
      - "internal/ui/files_tab_more.go"
      - "internal/ui/files_tab_more_test.go"
      - "internal/slack/file_is_image.go"
      - "internal/core/file_is_image_test.go"
      - "internal/ui/views/files_unthumbed_test.go"
      - "internal/ui/views/files_filters_test.go"
      - "internal/ui/files_filters_esc_test.go"
      - "internal/core/files_query.go"
      - "internal/ui/popups/files_filters.go"
      - "internal/ui/popups/usergroup_select.go"
      - "internal/core/browse.go"
      - "internal/core/files_filters_test.go"
      - ".github/workflows/files-view.yml"
  workflow_dispatch:
    inputs:
      expect_fail:
        description: "proof runs: the tests that must fail, comma-separated (TestA,TestB/sub); the run passes only if each fails and nothing else does (docs/CI-SPEED.md, Proof runs)"
        required: false
        default: ""

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

# A newer run for the same branch, tag or PR cancels this one while it is
# queued or running, so stale pushes don't pile up in the shared queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  files-view:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: 1.5 x p95 (4.8 min) + 3, docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/expect-fail
        with:
          tests: ${{ inputs.expect_fail }}
          leg: ${{ github.job }}-${{ strategy.job-index }}
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: tests and screenshots
        env:
          VIEWS_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          mkdir -p "$VIEWS_SHOTS_DIR"
          go test -count=1 -v -run 'TestFilesView|TestListCreate|TestChannelFiles|TestChannelFileSuggestions|TestShareFileTo|TestLinkShares|TestChannelTabWrites|TestMoveTabAfter|TestCanEditTabsChecked' ./internal/core
          go test -count=1 -v -run 'TestShareFileDialogLikeSlack|TestFileAccessText|TestFileGallery' ./internal/ui/popups
          go test -count=1 -v -run 'TestFilesRecentlyViewed|TestFilesTab|TestFilesFiltersEscapeThroughShell' ./internal/ui
          xvfb-run -a go test -count=1 -v -run 'TestFilesView|TestFilesEmpty|TestFilesSidebar|TestFilesPeek|TestChannelFiles' ./internal/ui/views
          ls -la "$VIEWS_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: files-view-shots
          path: dist/shots
      - if: ${{ always() && env.XF_ID }}
        uses: ./.github/actions/expect-fail-report

  # expect_fail's verdict across the jobs (docs/CI-SPEED.md, "Proof runs"):
  # every listed test failed in some job and passed in none, nothing else
  # failed, every job that ran succeeded. Proof runs only. A new job goes
  # in its needs (tools/expectfail's TestWorkflowsWireExpectFail says so).
  expect-fail:
    needs:
      - files-view
    if: ${{ always() && inputs.expect_fail != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10 # budget, min (a checkout, setup-go and the check)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: tools/expectfail
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: expect-fail-*
          path: ${{ runner.temp }}/xf
      - name: every listed test failed, nothing else did
        env:
          EXPECT_FAIL: ${{ inputs.expect_fail }}
          NEEDS: ${{ toJSON(needs) }}
        run: go run ./tools/expectfail -check "$RUNNER_TEMP/xf"
