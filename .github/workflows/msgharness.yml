# Temporary: builds the ui-messages dev harness (deleted with cmd/msgharness).
name: msgharness
on:
  push:
    branches: [ui-messages]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config
      - run: mkdir -p dist && CGO_ENABLED=1 go build -trimpath -o dist/msgharness ./cmd/msgharness
      - uses: actions/upload-artifact@v4
        with:
          name: msgharness
          path: dist/msgharness
