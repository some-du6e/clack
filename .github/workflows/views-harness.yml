# Temporary (ui-views): builds cmd/viewsharness for fidelity checks.
# Removed together with cmd/viewsharness before ui-views merges.
name: views-harness
on:
  push:
    branches: [ui-views]
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: vet views
        run: go vet ./internal/ui/views/... ./cmd/viewsharness
      - name: build
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -o dist/viewsharness ./cmd/viewsharness
      - uses: actions/upload-artifact@v4
        with:
          name: viewsharness-linux-amd64
          path: dist/viewsharness
