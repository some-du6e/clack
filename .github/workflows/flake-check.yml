  # The Threads view's live tests (dogfood-fixes-1: its reads, marks,
  # reconnects, gaps and reloads), every run counted, then once under the
  # race detector. Dispatch only, never with a push's whole set (flake-check
  # is a fifth of the account's job-minutes): -f only=threads-live
  # -f count=3; more repeats only to characterise a failure count=3 shows.
  threads-live:
    if: ${{ inputs.only != '' && startsWith('threads-live', inputs.only) }}
    name: "threads-live ${{ matrix.part }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: marks
            test: (TestThreadsUpToDateDividerLikeSlack|TestThreadsMarkedUnreadDividerLikeSlack|TestThreadsMarkVisibleLikeSlack|TestThreadsMarkVisibleOnScrollLikeSlack|TestThreadsMarkVisibleSkipsOwnMarksLikeSlack|TestThreadsSeenReplyGuardLikeSlack|TestThreadsHiddenFirstReadLikeSlack|TestThreadsUpToDateDivider|TestThreadsMarkVisibleFlingLikeSlack|TestThreadsUnreadRowPointLikeSlack|TestThreadsRemountNoScrollLikeSlack|TestThreadsAttentionAfterMinimizeLikeSlack|TestThreadsGhostLineDrawnLikeSlack|TestThreadsKeysHeldDownLikeSlack|TestThreadsFooterFocusLikeSlack|TestThreadsUnreadRowEdgesLikeSlack|TestThreadsChecksSpentWithoutListLikeSlack)
          - part: loads
            test: (TestThreadsSlowReconnectLikeSlack|TestThreadsFastReconnectLikeSlack|TestThreadsRefreshGapLikeSlack|TestThreadsSettleBeforeNextLoad|TestThreadsNamedThreadWaitsLikeSlack|TestThreadsAwayIgnoresRepliesLikeSlack|TestThreadsMountLoadLikeSlack|TestThreadsFailedReloadLikeSlack)
          - part: order
            test: (TestThreadsReloadLikeSlack|TestThreadsRefreshKeepsOldThreadsOffTopLikeSlack|TestThreadsReplyDuringReloadLikeSlack|TestThreadsOrderHeldOnReplyLikeSlack|TestThreadsPageAppendedLikeSlack|TestThreadsOrderUnreadFirstLikeSlack|TestThreadsRealtimeLikeSlack|TestThreadsKeysLikeSlack)
          - part: gaps
            test: (TestThreadsGapOnePerCardLikeSlack|TestThreadsGapCarryFloorLikeSlack|TestThreadsGapRemountLikeSlack|TestThreadsCarriedChangeLikeSlack|TestThreadsGapFloorLeavesLaterWindowsLikeSlack|TestThreadsGapAwayLikeSlack|TestThreadsReloadCutsToWindowLikeSlack|TestThreadsLiveMessages|TestThreadsLiveVote|TestThreadsLiveBatch|TestThreadsLiveEvictedRefetch|TestThreadsLiveFloor)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      # flake-count prints its own lines and the log's tail: the failures'
      # are printed here (the test names are an alternation)
      - name: "threads ${{ matrix.part }}, every run counted"
        env:
          TEST: ${{ matrix.test }}
          PKG: ./internal/ui/views
        run: |
          set +e
          sh "$GITHUB_WORKSPACE/.github/flake-count.sh"; rc=$?
          grep -E -- '--- FAIL|_test\.go:[0-9]+: |^panic: |DATA RACE' "$RUNNER_TEMP/flake.log" | head -300
          exit $rc
      - name: "threads ${{ matrix.part }}, once under the race detector"
        if: ${{ !cancelled() }}
        env:
          TEST: ${{ matrix.test }}
          PKG: ./internal/ui/views
          COUNT: "1"
        run: |
          set +e
          sh "$GITHUB_WORKSPACE/.github/flake-count.sh" -race; rc=$?
          grep -E -- '--- FAIL|_test\.go:[0-9]+: |^panic: |DATA RACE' "$RUNNER_TEMP/flake.log" | head -300
          exit $rc

