  release-suite:
    if: ${{ !inputs.only || startsWith('release-suite', inputs.only) }}
    name: "release-suite (runner ${{ matrix.runner }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # as release.yml: a clean module/build cache
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: go test ./...
        run: go test -timeout 30m ./...

  # flake-fix: the title bar tests after the gioui.org/app steps ci's
  # windows-applog runs before them (the OLE drops move the cursor and run
  # PowerShell's drag source, typed text clicks its window), COUNT rounds
  # on three fresh runners. A failed title bar run prints its log (the
  # stall dump: trace, window state, goroutines) and fails the job; the
  # other steps' failures are only counted.
  flake-fix-gio-sequence:
    if: ${{ !inputs.only || startsWith('flake-fix-gio-sequence', inputs.only) }}
    name: "flake-fix windows-applog's window steps in a row (runner ${{ matrix.runner }})"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: "OS file drops, typed text, the title bar (Gio's, Clack's window): COUNT rounds"
        shell: bash
        env:
          CGO_ENABLED: "0" # as in ci's windows-applog
          CLACK_WINDOWS_DROP_TESTS: "1"
          CLACK_WINDOWS_KEY_TESTS: "1"
          CLACK_WINDOWS_TITLEBAR_TESTS: "1"
          CLACK_TITLEBAR_SHOTS: ${{ runner.temp }}\titlebar-shots
        run: |
          go test -c -o "$RUNNER_TEMP/gioapp.test.exe" gioui.org/app
          go test -c -o "$RUNNER_TEMP/ui.test.exe" ./internal/ui
          titlebar=0
          other=0
          for i in $(seq "$COUNT"); do
            # ci's order: the drops, typed text, then the title bar step
            # (Gio's tests, then Clack's window)
            for run in 'app:TestOLEFileDrop|TestWMDropFiles|FileDrop|URIList' 'app:TestWinKeyText' 'app:TestCaptionHit|TestHiddenTitleBar' 'ui:^TestTitleBarWindow$'; do
              case "$run" in # where go test runs each
                app:*) bin="$RUNNER_TEMP/gioapp.test.exe"; dir="$GITHUB_WORKSPACE/third_party/gioui.org/app" ;;
                ui:*) bin="$RUNNER_TEMP/ui.test.exe"; dir="$GITHUB_WORKSPACE/internal/ui" ;;
              esac
              if ! (cd "$dir" && "$bin" -test.v -test.count=1 -test.timeout 10m -test.run "${run#*:}") > "$RUNNER_TEMP/round.log" 2>&1; then
                case "$run" in
                  *TestCaptionHit* | *TestTitleBarWindow*) titlebar=$((titlebar + 1)) ;;
                  *) other=$((other + 1)) ;;
                esac
                echo "::group::round $i: $run failed"
                head -4000 "$RUNNER_TEMP/round.log"
                echo "::endgroup::"
              fi
            done
          done
          echo "::notice title=windows-applog's window steps::the title bar tests failed $titlebar times in $COUNT rounds; the drops and typed text $other times"
          exit $(( titlebar > 0 ))

  # patched-tree-clicks: Block Kit clicks and redraws on rows under a
  # plugin patching Message / ThreadReplyGeneric, whose own msg override
  # went back to JS as their props (row.wrapped) and kept an updated row
  # bouncing between two revisions (lost clicks, α.92's redraw timeouts);
  # the lockstep variants make that timing happen every run
  patched-clicks:
    if: ${{ !inputs.only || startsWith('patched-clicks', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "messages: the vote buttons under ThreadReplyGeneric+Message (free-running and lockstep), COUNT runs"
        run: go test -count=$COUNT -timeout 60m -run 'TestVoteButtonsSurviveUpdates/ThreadReplyGeneric' ./internal/ui/messages
      - name: "messages: every vote variant and the patched Message's props, 3 runs"
        if: ${{ !cancelled() }}
        run: go test -count=3 -timeout 30m -run 'TestVoteButtonsSurviveUpdates$|TestMessagePatchGetsWrappersMsg$' ./internal/ui/messages
      - name: "the measure-pass audit: a test per family (slackc, kit, composer, messages, views, ui)"
        if: ${{ !cancelled() }}
        run: |
          rc=0
          go test -count=1 -v -run '^TestMeasurePassLeavesFocusAlone$' ./internal/ui/slackc || rc=1
          go test -count=1 -v -run '^TestFormTextInputFocusThroughMeasurePasses$' ./internal/ui/slackc/kit || rc=1
          go test -count=1 -v -run '^TestLinkDialogFocusAfterMeasurePass$' ./internal/ui/composer || rc=1
          go test -count=1 -v -run '^TestToolbarTiltIgnoresMeasurePass$' ./internal/ui/messages || rc=1
          go test -count=1 -v -run '^TestChannelFilesSuggestionsSurviveMeasurePass$' ./internal/ui/views || rc=1
          go test -count=1 -v -timeout 15m -run '^TestSidebarTextFilterMeasurePassKeepsFocus$' ./internal/ui || rc=1
          exit $rc

  # slackc-sweep: a window's patched roots age by its own frames (one idle
  # 5 s came back to every root unmounted and mounted again; the huddle
  # window's frames swept the still main window's; a root two windows draw
  # outlives one closing; a closed window's own roots go at once), and
  # Message gets MessageWrapper's very msg. `only=patched-clicks` runs
  # this job with the one above.
  patched-clicks-roots:
    if: ${{ !inputs.only || startsWith('patched-clicks-roots', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "slackc: patched roots age by their own window's frames, COUNT runs"
        run: go test -count=$COUNT -run '^(TestIdleWindowKeepsPatchedRoots|TestUndrawnPatchedRootsUnmount|TestOtherWindowsFramesKeepPatchedRoots|TestClosedSubWindowRootsUnmount|TestRootSharedByTwoWindowsOutlivesOneClosing)$' ./internal/ui/slackc
      - name: "slackc: the same under the race detector, 3 runs (a closing window's sweep runs on a goroutine of its own)"
        if: ${{ !cancelled() }}
        run: go test -race -count=3 -run '^(TestClosedSubWindowRootsUnmount|TestRootSharedByTwoWindowsOutlivesOneClosing)$' ./internal/ui/slackc
      - name: "messages: Message gets MessageWrapper's very msg, 3 runs"
        if: ${{ !cancelled() }}
        run: go test -count=3 -v -run '^TestMessagePatchGetsWrappersExactMsg$' ./internal/ui/messages

  # plugin-escape: one overlay stack per window (slackc layers.go). The
  # shell's overlays keep the shell's Escape (its binding closes the
  # topmost; a menu or popover opened from Channel details or Preferences
  # closes before them). Where a plugin's layer is involved Escape goes the
  # way the DOM does a modal: the focused element first (a plugin input's
  # keydown to JS, which can stop it; no answer in 300 ms and it goes on),
  # then the layer it was aimed at as it was pressed (a plugin's layer
  # still open takes every Escape aimed at it). A layer that closes
  # gives the focus back in that frame to what had it (Gio patch 34's
  # focus answers).
  plugin-escape:
    if: ${{ !inputs.only || startsWith('plugin-escape', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "Gio patch 34: the focus answers, COUNT runs"
        run: go test -count=$COUNT -run 'FocusTagCanFocusWithin' gioui.org/io/input
      - name: "slackc: the overlay stack's Escape and focus, COUNT runs"
        if: ${{ !cancelled() }}
        run: go test -count=$COUNT -run '^(TestEscapeGoesToTheLayerHoldingTheFocus|TestNativeLayersKeepTheirEscape|TestPluginLayerOverNativeGetsEscapeFirst|TestLayerGivesFocusBack|TestLayerOpenedFromAClosedOneGivesItsFocusBack|TestClosedLayerFieldKeepsNoFocus|TestLayerGivesNoFocusWhileInert|TestPluginInputEscapeBubbles|TestTwoEscapesBeforeJSAnswers|TestStillOpenPopoverTakesEveryEscape|TestLateEscapeAnswerClosesNothingNew|TestEscapeWithoutAnswerGoesOn|TestEscapeAfterTheLastLayerWent|TestStackOnlyInItsWindow)$' ./internal/ui/slackc
      - name: "kit: a Popover's Escape (top first, its field's listeners first) and focus, COUNT runs"
        if: ${{ !cancelled() }}
        run: go test -count=$COUNT -run '^(TestPopoverAutoFocusFieldKeepsCaret|TestFormTextInputFocusThroughMeasurePasses|TestPopoverEscapeCloses|TestNestedPopoversCloseTopFirst|TestConfirmInsidePopoverClosesFirst|TestPopoverGivesFocusBack|TestPopoverTakesFocusBackFromRemovedField|TestPopoverInputCanStopEscape|TestFormTextInputOnKeyDownCanStopEscape|TestRichTextInputPopoverGivesFocusBack)$' ./internal/ui/slackc/kit
      - name: "ui: Escape and the focus in each stacking in the main window, 3 runs"
        if: ${{ !cancelled() }}
        run: go test -count=3 -v -timeout 30m -run '^(TestEscapeClosesPluginPopoverFirst|TestEscapeWithThePumpUp|TestPopoverInsideEditProfile|TestPopoverInViewsModal|TestDialogOverPopover|TestEscapeOwners|TestEscapeClosesWhatChannelDetailsOpenedFirst|TestEscapeClosesPreferencesColourPopoverFirst|TestEscapeClosesMenuOverEditProfileFirst|TestEscapeKeepsGuardedModal|TestHoverPeekGivesNoFocus|TestModalFromMenuGivesFocusBackToThreadComposer|TestReplayIntroClosesGuardedModal|TestEscapeKeepsDirtyEditProfile|TestW28NavigateFocusesComposer)$' ./internal/ui

  # 2026-11-16: the jsrt release-burst tests counted the runtime's own
  # garbage's frees too (20018 of 20000 once), and TestHuddlesLinkInvites
  # timed the Huddles page's 600 ms from up to a frame after it started
  # (526 ms once); both now count only what they test
  flakes-1116:
    if: ${{ !inputs.only || startsWith('flakes-1116', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS xvfb libgl1-mesa-dri libegl-mesa0
      - name: "jsrt: release bursts count their own handles, COUNT runs"
        run: go test -count=$COUNT -run '^(TestReleaseBurstIsOneTask|TestPostDuringReleaseBurst)$' ./internal/jsrt
      - name: "jsrt: the same under the race detector, 5 runs"
        if: ${{ !cancelled() }}
        run: go test -race -count=5 -run '^(TestReleaseBurstIsOneTask|TestPostDuringReleaseBurst)$' ./internal/jsrt
      - name: "ui: the Huddles link's invites (llvmpipe, as huddles-audit-shots), 5 runs"
        if: ${{ !cancelled() }}
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a go test -count=5 -v -timeout 40m -run '^TestHuddlesLinkInvites$' ./internal/ui/

  # Activity's rows draw their messages as they are now
  # (views/activity_msgs.go; Karim's vote counts "up and down like crazy"
  # in Activity): a vote's chat.update in the frame after it lands,
  # natively, under a pass-through plugin on Activity's components (its JS
  # in lockstep, or busy through six revisions) and under a text patch of
  # the messages slice, in step with the thread pane beside the page and
  # kept when the pane closes; a reload after an unheard change; an edit,
  # the removals (an edited-out mention, a tombstone, a deletion), a
  # missing message, a reaction to a message fetched by id or held by an
  # evicted window, a message fetched again by id; an entry pushed while
  # the page was off screen, a busy socket while it was, a removal while a
  # load was out, the preview pane; the Threads view and the Saved page; a
  # deleted or edited reply's thread entry leaving, the badges' zero
  # marking the rows read. store, core: the messages fetched by id and the reactions a fetch must
  # not undo, the reads that land after the socket's writes and the order
  # their revisions go out in, core's table of message changes and
  # Slack's removal rules. messages: a read's revision of a message the
  # channel list never loaded stays out of it. Then once more under -race
  # (the change table is written on the event pump and read by the UI).
  # Dispatch with only=activity-live-msg.
  activity-live-msg:
    if: ${{ !inputs.only || startsWith('activity-live-msg', inputs.only) }}
    runs-on: ubuntu-latest
    env:
      LIVE_TESTS: '^(TestActivityLive(VoteCounts|VoteJSHeld|VoteSlicePatchHeldReaction|SlicePatchReachesFetchedMessages|EditsJSHeld|ThreadEditsJSHeld|ThreadNewReplyJSHeld|ThreadNewReplyFreshJSHeld|ThreadProjectionJSHeld|MaskedWithInnerPatches|MaskedThreadWithInnerPatches|SlicePatchNoReconvert|RootVoteAfterGap|RootRowsBesidePane|SearchIdle|FailedGroup|CopylessRefetch|EvictedRefetch|VoteSlicePatch|VoteBesideThread|Edit|Delete|MissingMessage|Reaction|WindowEvicted|EntryWhileHidden|ManyChangesHidden|RemovedDuringLoad|Preview)|TestThreadsLive(Messages|Vote|Batch|EvictedRefetch|Floor)|TestSavedLive(Messages|BotUpdate|EvictedRefetch)|TestActivityThreadLeaves(WithItsDeletedReply|WhenItsReplyDropsTheMention)|TestActivityBadgesZero(ReadLocally|ThenLoad|InSocketOrder|Classic)|TestActivityFloorConvertsDrawnRows|TestViewsKeepARewrittenAuthorWhileJSIsBusy)$'
      STORE_TESTS: '^(TestFetchedMessages(TakeSocketChanges|KeepReactions|Bounded)|TestFetchedReplayTruncatedUsers|TestApplyReactionLastListed|TestFetchedSizeAfterMutate|TestRefreshRangeRead|TestWindowReadKeepsFetchedRevision)$'
      CORE_TESTS: '^(TestMessageChangeTable|TestMessageChangeTableForgets|TestReactionReachesFetchedMessage|TestHydrateKeepsReactionsDuringFetch|TestMessageChangedRemoves|TestMentionsViewerRichKeywords|TestFetchedRootAnnounced|TestReadRevisionAnnounced|TestWindowReadKeepsReactions|TestOlderRepliesStored|TestRemovesNotTakenByReactions|TestWindowReadKeepsSocketRevision|TestWindowReadAnnouncesRevision|TestThreadReadKeepsSocketWrites|TestReadRevisionOrderedWithSocket|TestOlderPageRead|TestThreadsUnreadLeavesDeleted|TestReadsAnnounce|TestRefetch(Batch|Gone|Backoff|RetriesByItself)|TestChangedOldMessageStaysOutOfWindow|TestHydrateDropsMissingFetched|TestReadRevisionKeepsPinDuringRead|TestWindowReadKeepsPageRevisionWithReaction|TestClassicBadgesZero)$'
      HUB_TESTS: '^TestHub(Update(OutsideLoadedHistory|AfterWholeEviction|DuringFirstLoad|AfterLocalCopyAtTop)|KeepLiveAfterStartOver|ReloadKeepsRangeAfterOldChange)$'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "views: Activity's, Threads' and Saved's live messages (one verbose run, then COUNT)"
        run: |
          rc=0
          xvfb-run -a go test -count=1 -v -timeout 20m -run "$LIVE_TESTS" ./internal/ui/views || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 40m -run "$LIVE_TESTS" ./internal/ui/views || rc=1
          exit $rc
      - name: "store, core, messages: the reads, the message change table, the hub, COUNT runs"
        if: ${{ !cancelled() }}
        run: |
          rc=0
          go test -count=$COUNT -v -run "$STORE_TESTS" ./internal/store || rc=1
          go test -count=$COUNT -v -run "$CORE_TESTS" ./internal/core || rc=1
          xvfb-run -a go test -count=$COUNT -v -run "$HUB_TESTS" ./internal/ui/messages || rc=1
          exit $rc
      - name: "the same under -race, 3 runs"
        if: ${{ !cancelled() }}
        run: |
          rc=0
          xvfb-run -a go test -race -count=3 -timeout 50m -run "$LIVE_TESTS" ./internal/ui/views || rc=1
          go test -race -count=3 -run "$STORE_TESTS" ./internal/store || rc=1
          go test -race -count=3 -run "$CORE_TESTS" ./internal/core || rc=1
          xvfb-run -a go test -race -count=3 -run "$HUB_TESTS" ./internal/ui/messages || rc=1
          exit $rc

  # activity-order: Activity's rows in Slack's order (views/activity_order.go,
  # tsND's upserts; Karim 2026-11-21: a thread's new reply left its row where
  # it was, "Just now" at the bottom). Over the socket a mention, a reaction
  # a minute later and a reply in each of two threads: each thread's bundle
  # comes again with the reply's ts and goes to the top; the order, times,
  # senders and texts after each event, after activity_invalidated's reload
  # and after a restart on the saved cache; the reducer port against Slack's
  # own upserts; what a reload keeps (an answered invitation leaves, the
  # later pages stay on a type tab and under the VIP sort, a thread twin,
  # the socket's newer copy); the live updates, Unreads and paging around
  # it. Dispatch with only=activity-order.
  activity-order:
    if: ${{ !inputs.only || startsWith('activity-order', inputs.only) }}
    runs-on: ubuntu-latest
    env:
      ORDER_TESTS: '^(TestActivityOrder(LikeSlack|MatchesSlacksReducer)|TestActivityRtmUpsertNewSlice|TestActivityPlainReload|TestActivityReload(DropsTheNewestRowGone|ThreadTwinKeepsLaterPages|KeepsTheSocketsCopy|KeepsLaterPages)|TestActivityMergeKeepsLaterPagesOutOfTimeOrder|TestActivityAnsweredInviteLeaves|TestActivityUnreadsRefreshRetains|TestActivityUnreadsShowsOnlyUnread|TestActivityLiveUpdatesLikeSlack|TestActivityPagedListShowsEveryEntry|TestActivityLiveRemovedDuringLoad|TestActivityBadgesZeroThenLoad)$'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "views: Activity's order (one verbose run, then COUNT, then 3 under -race)"
        run: |
          set +e
          rc=0
          xvfb-run -a go test -count=1 -v -timeout 20m -run "$ORDER_TESTS" ./internal/ui/views || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 40m -run "$ORDER_TESTS" ./internal/ui/views || rc=1
          xvfb-run -a go test -race -count=3 -timeout 40m -run "$ORDER_TESTS" ./internal/ui/views || rc=1
          exit $rc

  # edit-latency: an app's message edited every 500 ms over the socket
  # (Karim's uptime monitor, 2026-11-18: a plan block whose title is the
  # outage's duration, "updates really slowly like every 33 seconds") draws
  # each edit within a frame of core taking it in: in the channel, as the
  # root of its open thread pane, and both at once; natively and under
  # pass-through plugins (the messages slice, the components a message
  # draws through). Frames are drawn when the app asks for one, as a
  # window does. Its first run adds the known slice gaps held to bounds
  # that pass today (CLACK_SLICE_TEXT: a rewriting plugin's view of each
  # edit within 4 frames and 80 ms, a newly shown row's first draw within
  # 500 ms), so they can't grow unseen. Dispatch with only=edit-latency.
  edit-latency:
    if: ${{ !inputs.only || startsWith('edit-latency', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "ui: each edit to the frame that draws it, per surface (one verbose run, then COUNT)"
        env:
          CLACK_LATENCY_TESTS: "1"
        run: |
          rc=0
          CLACK_SLICE_TEXT=1 xvfb-run -a go test -count=1 -v -timeout 25m -run '^(TestEditLatency|TestSliceFirstDraw)$' ./internal/ui || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 50m -run '^TestEditLatency$' ./internal/ui || rc=1
          exit $rc

  # thread-replies: a reply posted to the thread open in the pane draws
  # there in the frame after the socket brings it, and no later than
  # Activity has its entry (Karim, 2026-11-18: "threads are a shit show rn
  # ... i see it like in my activity tab first"): replies from people the
  # client never fetched, users/info answering after 1.5 s, the entries
  # before or after the message, someone else never fetched typing in the
  # thread 100 ms before each; Activity with the thread beside it; a reply
  # counts once the pane's row paints it, within two frames and 250 ms;
  # natively, under a messages-slice patch and under a component patch.
  # Dispatch with only=thread-replies.
  thread-replies:
    if: ${{ !inputs.only || startsWith('thread-replies', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "ui: a reply to the open thread, socket to the pane's frame (one verbose run, then COUNT)"
        env:
          CLACK_LATENCY_TESTS: "1"
        run: |
          rc=0
          xvfb-run -a go test -count=1 -v -timeout 20m -run '^TestThreadReplyLatency$' ./internal/ui || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 40m -run '^TestThreadReplyLatency$' ./internal/ui || rc=1
          exit $rc

  # agent-blocks: the agent block and label tests (app-tasks-tab rounds
  # 2-3): plan and task content cut with Show more, MCP cards closing,
  # height transitions on update, task icons, the stopped label, through
  # core, richview, messages and blockkit. Dispatch with only=agent-blocks.
  agent-blocks:
    if: ${{ !inputs.only || startsWith('agent-blocks', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "core, richview, messages, blockkit: the agent tests, COUNT times"
        run: |
          rc=0
          go test -count=$COUNT -timeout 30m -run 'TestAgent' ./internal/core ./internal/ui/richview || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 30m -run 'TestAgent' ./internal/ui/messages ./internal/ui/blockkit || rc=1
          exit $rc

  # toast-names: a toast names the members its message mentions, those the
  # store didn't hold when the message came too (α.110's review: "@U07DANA
  # can you join?"; core announces a message before fetching anyone it
  # names): a group DM whose history the store never loaded, users/info
  # answering after 1 s, its title naming the group's members (one the
  # sidebar already lists too); ten mentions at once; members still
  # unknown after the wait (no id, a label kept); a DM's partner; no toast
  # for a message deleted while it waited. Names as Slack's: a group DM's
  # title is getMpimDisplayNameAlphabetical (sorted, display_real_names,
  # "Name hidden"), the sender and a DM's partner follow display_real_names,
  # a mention getMemberMentionName or the mentions-real-names rule; a
  # member the viewer hid reads "Hidden user" (no @) and sends no toast;
  # a group DM whose members users/info never brought reads "New message
  # in " as Slack's does; the title's people come before 100+ mentions.
  # Dispatch with only=toast-names.
  toast-names:
    if: ${{ !inputs.only || startsWith('toast-names', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "ui: a toast's mention of a member the store didn't hold (one verbose run, then COUNT)"
        run: |
          rc=0
          xvfb-run -a go test -count=1 -v -timeout 10m -run '^TestNotify(Names|Drops|Members)' ./internal/ui || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 20m -run '^TestNotify(Names|Drops|Members)' ./internal/ui || rc=1
          exit $rc

  # activity-stamp: an activity entry whose message is deleted, or edited
  # to drop the viewer's mention, while the entry waits behind another
  # entry's lookups never shows (α.110's review; Karim's 2026-11-17 ghost
  # thread row): the entry is stamped in socket order. users/info answering
  # after 1.5 s. Dispatch with only=activity-stamp.
  activity-stamp:
    if: ${{ !inputs.only || startsWith('activity-stamp', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "views: an entry whose message goes while it waits (one verbose run, then COUNT)"
        run: |
          rc=0
          xvfb-run -a go test -count=1 -v -timeout 10m -run '^TestActivityEntryLeavesWhenItsMessageGoesWhileItWaits$' ./internal/ui/views || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 20m -run '^TestActivityEntryLeavesWhenItsMessageGoesWhileItWaits$' ./internal/ui/views || rc=1
          exit $rc

  # sender-lookups: socket messages and thread replies from people the
  # client never fetched, in a channel nothing on screen shows, ask
  # users/info for no one (α.110 review: each such sender's users/info and
  # its "names" made the UI read every conversation on screen again).
  # Dispatch with only=sender-lookups.
  sender-lookups:
    if: ${{ !inputs.only || startsWith('sender-lookups', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "ui: senders nothing on screen shows are asked for by no one (one verbose run, then COUNT)"
        env:
          CLACK_LATENCY_TESTS: "1"
        run: |
          rc=0
          xvfb-run -a go test -count=1 -v -timeout 10m -run '^TestSocketSendersAskedForNoOne$' ./internal/ui || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 20m -run '^TestSocketSendersAskedForNoOne$' ./internal/ui || rc=1
          exit $rc

  # reactions-live: other people's reactions in a channel draw as they
  # come (Karim, 2026-11-19: "reactions are not syncing", "in a channel
  # for another"): reaction_added / reaction_removed over the socket on a
  # plain message, a thread root, a reply in the open pane, a file message
  # and one the viewer reacted to, in the channel on screen and in one not
  # open, each within two frames; a refresh, a re-open and a reconnect keep
  # them. Natively and under component and messages-slice patches (one
  # marking every message's text, so rows draw the plugins' view).
  # Dispatch with only=reactions-live.
  reactions-live:
    if: ${{ !inputs.only || startsWith('reactions-live', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "ui: other people's reactions, socket to frame (one verbose run, then COUNT)"
        env:
          CLACK_LATENCY_TESTS: "1"
        run: |
          rc=0
          xvfb-run -a go test -count=1 -v -timeout 20m -run '^TestChannelReactionsLive$' ./internal/ui || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 40m -run '^TestChannelReactionsLive$' ./internal/ui || rc=1
          exit $rc

  # reactions-more: a live reaction_added keeps the event's url (a Slack
  # Connect partner's custom emoji: cBAo's h.url) and a fetch's replay
  # keeps it; a malformed add changes nothing; the Pins tab draws core's
  # reactions on the plugins' view under a messages-slice patch. Dispatch
  # with only=reactions-more.
  reactions-more:
    if: ${{ !inputs.only || startsWith('reactions-more', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "core, store, views: reaction urls, malformed events, the Pins tab under a slice patch (COUNT runs)"
        run: |
          rc=0
          go test -count=$COUNT -v -run '^(TestReactionAddedKeepsItsURL|TestMalformedReactionChangesNothing)$' ./internal/core || rc=1
          go test -count=$COUNT -v -run '^TestReactionURLSurvivesAFetch$' ./internal/store || rc=1
          xvfb-run -a go test -count=$COUNT -v -run '^TestPinsTabReactionsAreCoresUnderSlicePatch$' ./internal/ui/views || rc=1
          exit $rc

  # activity-edits: an edit of an Activity entry's message draws in its
  # row in the frame after the socket brings it (Slack's Activity row reads
  # the live message): someone's mention edited every 500 ms with the
  # Activity page open, frames drawn when the app asks; natively, under a
  # messages-slice patch, and under a patch of the components an Activity
  # row draws through (ActivityItem, ActivityThread, the row contents),
  # where a JS tree of the revision before can hold an edit back.
  # Dispatch with only=activity-edits.
  activity-edits:
    if: ${{ !inputs.only || startsWith('activity-edits', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "ui: each edit to the Activity row's frame (one verbose run, then COUNT)"
        env:
          CLACK_LATENCY_TESTS: "1"
        run: |
          rc=0
          xvfb-run -a go test -count=1 -v -timeout 20m -run '^TestActivityEditLatency$' ./internal/ui || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 40m -run '^TestActivityEditLatency$' ./internal/ui || rc=1
          exit $rc

  # slice-gaps: known gaps, run only on request (only=slice-gaps, never on
  # a push): under a plugin rewriting messages through the messages slice,
  # a thread pane's newly shown reply draws the plugins' view from its
  # first frame (Clack's draws core's copy until JS's is ready: ~250 ms),
  # and each edit's rewritten view draws in the frame after the socket
  # (Clack's: a JS round trip, 3 frames). Slack renders the patched slice
  # in the render itself. Red until those change.
  slice-gaps:
    if: ${{ inputs.only == 'slice-gaps' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "ui: a newly shown row's first frame, and each edit's rewritten view, under a slice patch (COUNT runs)"
        env:
          CLACK_SLICE_GAPS: "1"
          CLACK_LATENCY_TESTS: "1"
        run: |
          set -o pipefail # the tests' status, not tee's
          rc=0
          xvfb-run -a go test -count=$COUNT -v -timeout 20m -run '^TestSliceFirstDraw$' ./internal/ui 2>&1 | tee "$RUNNER_TEMP/first-draw.log" || rc=1
          grep -q "first draw, the thread pane opened:" "$RUNNER_TEMP/first-draw.log" || { echo "the first-draw test measured nothing"; rc=1; }
          xvfb-run -a go test -count=$COUNT -v -timeout 30m -run '^TestEditLatency$/^slice-text$' ./internal/ui 2>&1 | tee "$RUNNER_TEMP/slice-text.log" || rc=1
          grep -q "slice-text, channel:" "$RUNNER_TEMP/slice-text.log" || { echo "the slice-text mode ran nothing"; rc=1; }
          exit $rc

  # views-rewrites: a view a plugin rewrites outside the text (Censorship's
  # mask in blocks, ShowRealUser's sender) stands while the plugins' JS is
  # busy: a reaction never brings core's copy back in the views drawn from
  # viewMsg; a message fetched by id (Activity's hydration) reaches the
  # plugins' messages slice, marked as it lands (no sweep waited for), and
  # a channel's list never draws it as one a plugin injected (a jump to it
  # pages back); an edit bringing a word a plugin masks into a message it
  # left alone never draws the word, and one under a sender-only patch
  # draws at once. Dispatch with only=views-rewrites.
  views-rewrites:
    if: ${{ !inputs.only || startsWith('views-rewrites', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "views: rewritten views through a reaction while JS is busy (COUNT runs)"
        run: |
          rc=0
          xvfb-run -a go test -count=$COUNT -v -timeout 20m -run '^(TestActivityLiveVoteSlicePatchHeldReaction|TestViewsKeepARewrittenAuthorWhileJSIsBusy|TestActivityLiveVoteSlicePatch|TestActivityLiveSlicePatchReachesFetchedMessages|TestActivityFetchedViewWithoutTheSweep|TestViewsEditBringingAMaskedWordNeverShowsIt|TestViewsEditUnderASenderPatchDrawsAtOnce)$' ./internal/ui/views || rc=1
          xvfb-run -a go test -count=$COUNT -v -timeout 20m -run '^(TestFetchedMessageStaysOutOfTheList|TestEditBringingAMaskedWordNeverShowsIt|TestEditHoldEndsAtEditHold|TestEditUnderASenderPatchDrawsNextFrame)$' ./internal/ui/messages || rc=1
          exit $rc

  # The DM badges (core rail.go DMsBadge; Karim's 2026-11-16 "ghost
  # pings"): Slack's rHEx dmsBadgeCount leaves out the bot DMs the DMs page
  # doesn't list (Slackbot's, the Slack system user's, an app's), and under
  # the activity inbox the tab counts unread conversations (6Z4k Sm). The
  # badges look up every unread IM's member (members.go readBadgePeople),
  # and without the inbox the Activity tab and the app badge read
  # channel_badges and the alerts (classic_badges.go). Dispatch with
  # only=dm-badges.
  dm-badges:
    if: ${{ !inputs.only || startsWith('dm-badges', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "core: the DM badges' rules, the DMs tab's rows, COUNT runs"
        run: go test -count=$COUNT -v -run '^(TestDMBadgeSkips|TestDMsBadgeRule|TestSnapshotDMBadgeSkips|TestDMsTabFilters|TestHomeBadgeRule|TestBadgeReadersAskForUnreadIMMembers|TestCountsAnswerAsksForUnreadIMMember|TestMarkedUnreadAsksForIMMember|TestMembersPassKeepsBadgePeople|TestClassicActivityBadgeLikeSlack|TestClassicAppBadgeLikeSlack|TestClassicBadgesUpdatesLikeSlack|TestBotDMIsDUy0G|TestMembersPassThenSnapshotAsksNoClosedDMs|TestBootAsksOpenDMPartnersOnly|TestExperimentReadsListed|TestDefaultExperimentsMatchAccount|TestFakeslackExperimentsMatchAccount)$' ./internal/core
      - name: "ui: the DM badges, the DMs page, the classic Activity and app badges over fakeslack's DMs, COUNT runs"
        if: ${{ !cancelled() }}
        run: go test -count=$COUNT -v -timeout 30m -run '^(TestDMsBadgeLikeSlack|TestDMBadgesClassicLikeSlack|TestDMBadgeMemberLoadsLate|TestTitleDockTaskbarAgreeLikeSlack|TestActivityRailBadgeLikeSlack)$' ./internal/ui

  # The Slack system user's DM (Karim's 2026-11-21 "got a message from
  # system slack and didnt notice until i opened normal slack"): its
  # sidebar row under Apps, bold with its unread count as the badge (fgSa,
  # 9dui), client.counts' IM and group DM rule (mtwS applyCountsToChannels:
  # mention_count || has_unreads), an app's posts on the socket with no
  # user, im_marked and a restart, over fakeslack's Size.SystemDM.
  # Dispatch with only=system-dm-row.
  system-dm-row:
    if: ${{ !inputs.only || startsWith('system-dm-row', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "store: client.counts' IM and group DM unread count, COUNT runs"
        run: go test -count=$COUNT -v -run '^TestCountsDMUnreadWithoutMentionsIsOne$' ./internal/store
      - name: "ui: the system DM's row and counts over fakeslack's Size.SystemDM, COUNT runs"
        if: ${{ !cancelled() }}
        run: go test -count=$COUNT -v -timeout 30m -run '^(TestSystemDMRowLikeSlack|TestSystemDMUnreadWithoutMentionsLikeSlack)$' ./internal/ui

  # plugin-render-2: a reply also sent to the channel, in the channel's list
  # and its thread pane, gets a plugin root per pane (one shared root got
  # each pane's props in turn and rendered every frame), and so does each
  # composer of one thread; JS's own commits that change no host node send
  # Go nothing (api.redux.refresh re-rendered every usePatchVersion patch,
  # and each root sent its same tree again); a profile change, a renamed
  # channel tab or a names pref converts again just the messages that name
  # them, patched and unpatched, without counting as a view's read
  plugin-render:
    if: ${{ !inputs.only || startsWith('plugin-render', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "slackc + jsrt + taut + core: panes, same-output commits, refresh, conversion refs, COUNT runs"
        run: |
          rc=0
          go test -count=$COUNT -run '^(TestPanesHaveRootsOfTheirOwn|TestRemountKeyedInPane)$' ./internal/ui/slackc || rc=1
          go test -count=$COUNT -run '^(TestSameOutputSendsNoTree|TestPortalUnderHiddenNativeAnswers)$' ./internal/jsrt || rc=1
          go test -count=$COUNT -v -run '^(TestRefreshSendsNoSameTree|TestUserEventsForUndrawnMembersCostNothing|TestChangeDuringFirstConversion|TestIndexRefsStaleness|TestConvBumpRedraws|TestOffScreenViewsDrawNothing|TestMemberChangesOnlyForWhatJSHolds|TestInvalidationsJoinTheQueuedTask|TestRawEventsConvertNothing|TestUnconvertedMessagesKeepNoGeneration|TestRefetchDecodesOnlyWhatChanged|TestInjectedMessagesOneStorePass|TestRefreshRedrawsOnlyChanges)$' ./internal/taut || rc=1
          go test -count=$COUNT -run '^(TestMessageRefs|TestMessageRefsBotsAndEmoji|TestDocFingerprints|TestStoredMessageReadsNoMember|TestEventsMarkDocChanges|TestUserEventAfterSilentRename|TestPrefsBaselineFollowsInstalls|TestRenamedCanvasTitle|TestEmojiRemovalNamesAndAliases)$' ./internal/core || rc=1
          exit $rc
      - name: "messages + blockkit + composer + ui: every list's roots, renames and prefs re-convert, loads, views under the throttle and with only the frames asked for, thread replies, a patched root's updates, the mirror's wait, a dropped model's reload, element hosts, composers' panes, COUNT runs"
        if: ${{ !cancelled() }}
        run: |
          rc=0
          go test -count=$COUNT -v -timeout 60m -run '^(TestBroadcastReplyInBothPanesIdle|TestRenamesRedrawRows|TestRenameDuringLoad|TestInjectedTakesEqualConversions|TestDocPrefsConvertLoadedMessages|TestPatchedRowTakesChangeWithoutAnotherFrame|TestBroadcastPreambleReadsMentionsAsItDraws|TestMessagePatchGetsWrappersExactMsg|TestPatchedRootSurvivesUpdates|TestVoteButtonsSurviveUpdates|TestViewedRowTakesUpdates|TestReconvertKeepsAnUpdate|TestBroadcastPreambleFollowsARename|TestUnviewedRowTakesUpdatesOnce|TestSenderRenameWhileDrawing|TestListsPastTheModelLimitTakeLiveMessages|TestVoteRootInBothPanesUnderASlicePatch|TestEditMaskedWhileTheChannelIsBusy|TestViewedRowGoesBackToItsSource|TestOverlayKeepsTheViewsMasks|TestMessageTextDropsFilesAndAttachments|TestPreviewMemberStatusRedrawsNothing|TestSenderRenameMidFrameDraws|TestDroppedModelTakesCoresWindow|TestDroppedModelPagesBackAfterItsReload|TestReadyViewDrawsWithOnlyInvalidateFrames|TestViewedRowGoesBackWithOnlyInvalidateFrames|TestFirstReadAfterARefreshDrawsTheView|TestRowWaitsForTheMirror|TestLoadOnlyChangeNeverDrawsTheOldCount|TestResyncClaimsOnlyWhatCameBefore|TestSwitchedListWaitsForTheNewRevision|TestKeepLiveTakesTheEventsEmitSeq|TestDroppedModelKeepsItsEditUnderAReaction)$' ./internal/ui/messages || rc=1
          go test -count=$COUNT -v -timeout 20m -run '^(TestActivityLiveDroppedModel)$' ./internal/ui/views || rc=1
          go test -count=$COUNT -v -timeout 20m -run '^(TestGalleryElementPayloads|TestDrawnHostOutlivesNewerHosts)$' ./internal/ui/blockkit || rc=1
          go test -count=$COUNT -v -timeout 10m -run '^(TestComposersForOneThreadSendTheirOwn|TestComposerVanishRemountsInItsPane)$' ./internal/ui/composer || rc=1
          go test -count=$COUNT -v -timeout 20m -run '^(TestComposersDrawInTheirListsPanes|TestPatchedViewShowsUnderQuietFrames)$' ./internal/ui || rc=1
          exit $rc

  # The inline video player on Clack's real window (internal/ui
  # TestRealWindowVideoFrames): Media Foundation on windows-latest,
  # AVFoundation on macos-latest play #files-gallery's video in App.Run's
  # own window; quiet frames, partial frames inside the tile, the paused
  # budget. One App per process, so each run is its own process; at most
  # 3. Dispatch with only=rw-video.
  rw-video:
    if: ${{ !inputs.only || startsWith('rw-video', inputs.only) }}
    name: "rw-video (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: the inline player on the real window (TestRealWindowVideoFrames)
        shell: bash
        env:
          CGO_ENABLED: "1"
          CLACK_MEDIA_TESTS: "1"
        run: |
          n=$COUNT; [ "$n" -gt 3 ] && n=3
          go test -c -o "$RUNNER_TEMP/ui-video.test" ./internal/ui || exit 1
          cd internal/ui
          rc=0
          for i in $(seq 1 "$n"); do
            CLACK_REAL_WINDOW_TESTS=1 CLACK_MACOS_WINDOW_TESTS=1 "$RUNNER_TEMP/ui-video.test" -test.v -test.count=1 -test.timeout 10m -test.run '^TestRealWindowVideoFrames$' || rc=1
          done
          exit $rc

  # Video playback's backends (internal/media/mf, internal/media/avf): the
  # fixtures played by the OS's own decoder into a headless Gio window,
  # Media Foundation on windows-latest (Direct3D 11 on the Basic Render
  # Driver), AVFoundation on macos-latest (Metal): colours, metadata,
  # events, seek, the paused budget, the end, close. At most 3 runs (each
  # plays the fixture several times). Dispatch with only=video.
  video:
    if: ${{ !inputs.only || startsWith('video', inputs.only) }}
    name: "video (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: the backends play the fixtures (internal/media/...)
        shell: bash
        env:
          CGO_ENABLED: "1"
          CLACK_MEDIA_TESTS: "1"
        run: |
          n=$COUNT; [ "$n" -gt 3 ] && n=3
          go test -count=$n -v -timeout 30m ./internal/media/...

  # What one frame costs the GPU (branch gpu-frame-cost): Clack's window
  # rendered by each backend (Mesa llvmpipe's GL on Linux, WARP's Direct3D
  # 11 on Windows, the runner's Metal on macOS). The placement probe logs
  # how exactly each one repeats a path's coverage when only its stencil
  # region moves. Dispatch with only=gpu-cost.
  gpu-cost:
    if: ${{ !inputs.only || startsWith('gpu-cost', inputs.only) }}
    name: "gpu-cost (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        if: ${{ runner.os == 'Linux' }}
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS xvfb libgl1-mesa-dri libegl-mesa0
      - name: placement probe (gioui.org/gpu/headless)
        shell: bash
        env:
          CLACK_GPU_COST_PROBE: "1"
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then x=(xvfb-run -a); else x=(); fi
          if [ "$RUNNER_OS" = Windows ]; then export CGO_ENABLED=0; fi
          "${x[@]}" go test -count=1 -v -timeout 10m -run '^(TestClackPlacementNoise|TestClackAtlasShrinks|TestClackAtlasShrinksUsedNowAndThen|TestClackAtlasGrowKeepsSize|TestClackStateCacheIdentical|TestClackLayerPages|TestClackSubPixelCache|TestClackSplitsUnderTransform|TestClackPartialFrames|TestClackPartialSameOps|TestClackPartialDamageRects|TestClackExternalImage|TestClackExternalKeys|TestClackExternalPartial)$' gioui.org/gpu/headless
      - name: the shadows and the panel's corners, old and new (internal/ui/theme TestFrameCostPixels)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then x=(xvfb-run -a); else x=(); fi
          if [ "$RUNNER_OS" = Windows ]; then export CGO_ENABLED=0; fi
          "${x[@]}" go test -count=1 -v -timeout 25m -run '^(TestFrameCostPixels|TestFrameCostSeams)$' ./internal/ui/theme
      - name: Clack's whole window over fakeslack, old and new (internal/ui TestFrameCostWindow)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CLACK_GPU_COST: "1"
          CLACK_PIXEL_TESTS: "1"
          CLACK_GPU_COST_SHOTS: ${{ runner.temp }}/gpu-cost-shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
          RUNS: ${{ inputs.count || '1' }}
        run: |
          mkdir -p "$CLACK_GPU_COST_SHOTS"
          if [ "$RUNNER_OS" = Linux ]; then x=(xvfb-run -a); else x=(); fi
          if [ "$RUNNER_OS" = Windows ]; then export CGO_ENABLED=0; fi
          # count=N runs it up to 3 times (a run takes 2-10 min per OS)
          n="$RUNS"; [ "$n" -gt 3 ] && n=3
          "${x[@]}" go test -count="$n" -v -timeout 60m -run '^TestFrameCostWindow$' ./internal/ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: gpu-cost-shots-${{ runner.os }}
          path: ${{ runner.temp }}/gpu-cost-shots
  # Gio patch 46 (partial frames): a partial frame is the whole frame's
  # pixels (gpu/headless TestClackPartial*), what a caret's blink, the
  # typing indicator, a spinner's turn and an animated emoji's frame cost
  # whole and partial over Clack's window (TestFrameCostDamage), and a
  # caret's blink on App.Run's real window (TestRealWindowCaretCost), on
  # llvmpipe, Metal and WARP. only=gpu-cost runs it with gpu-cost;
  # only=gpu-cost-damage alone.
  gpu-cost-damage:
    if: ${{ !inputs.only || startsWith('gpu-cost-damage', inputs.only) }}
    name: "gpu-cost-damage (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        if: ${{ runner.os == 'Linux' }}
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS xvfb libgl1-mesa-dri libegl-mesa0
      - name: partial frames are whole frames' pixels (gioui.org/gpu, gpu/headless)
        shell: bash
        env:
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then x=(xvfb-run -a); else x=(); fi
          if [ "$RUNNER_OS" = Windows ]; then export CGO_ENABLED=0; fi
          rc=0
          go test -count=1 -v -run '^(TestClackDamage|TestClackSticky)' gioui.org/gpu || rc=1
          "${x[@]}" go test -count=1 -v -timeout 10m -run '^(TestClackPartialFrames|TestClackPartialSameOps|TestClackPartialDamageRects|TestClackPartialSpinner)$' gioui.org/gpu/headless || rc=1
          exit $rc
      # what a caret's blink, the typing indicator, a
      # spinner's turn and an animated emoji's frame cost whole and as
      # partial frames, with the whole frame's pixels
      - name: small changes, whole and partial (internal/ui TestFrameCostDamage)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CLACK_GPU_COST: "1"
          CLACK_GPU_COST_SHOTS: ${{ runner.temp }}/gpu-cost-damage-shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$CLACK_GPU_COST_SHOTS"
          if [ "$RUNNER_OS" = Linux ]; then x=(xvfb-run -a); else x=(); fi
          if [ "$RUNNER_OS" = Windows ]; then export CGO_ENABLED=0; fi
          "${x[@]}" go test -count=1 -v -timeout 25m -run '^TestFrameCostDamage$' ./internal/ui
      # and a caret's blink on App.Run's real window: partial frames of its
      # pixels, a tenth of a whole frame's draws, half its CPU on the
      # software rasterizers; a scroll's frames with partial frames on and
      # off; on Xvfb the window's own pixels read back (python3-xlib).
      # count=N runs it N times, a process each (one App per process), for
      # its flake rate.
      - name: a caret's blink on the real window (internal/ui TestRealWindowCaretCost)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CLACK_REAL_WINDOW_TESTS: "1"
          CLACK_MACOS_WINDOW_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
          RUNS: ${{ inputs.count || '1' }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq python3-xlib
            x=(xvfb-run -a -s "-screen 0 1920x1080x24")
          else x=(); fi
          if [ "$RUNNER_OS" = Windows ]; then export CGO_ENABLED=0; fi
          go test -c -o "$RUNNER_TEMP/ui-caret.test" ./internal/ui
          cd internal/ui
          fails=0
          for i in $(seq 1 "$RUNS"); do
            "${x[@]}" "$RUNNER_TEMP/ui-caret.test" -test.count=1 -test.v -test.timeout 10m -test.run '^TestRealWindowCaretCost$' || fails=$((fails+1))
          done
          echo "TestRealWindowCaretCost: $fails of $RUNS runs failed"
          [ "$fails" = 0 ]
          # and at the size the orchestrator measured α.105 at (55% of a core
          # on llvmpipe with the caret blinking)
          CLACK_CARET_WINDOW=1440x900 "${x[@]}" "$RUNNER_TEMP/ui-caret.test" -test.count=1 -test.v -test.timeout 10m -test.run '^TestRealWindowCaretCost$'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: gpu-cost-damage-shots-${{ runner.os }}
          path: ${{ runner.temp }}/gpu-cost-damage-shots
          if-no-files-found: ignore

  # inspect-freeze (round 2, 2026-11-18): the inspect freeze's pointer
  # reset (Gio patch 49) on every kind of hover Clack has, with Windows'
  # mouse id as well as macOS' and X11's, and the freeze's edges (the
  # sign-in screen, file drops, frozen reports, held keys, the image
  # cache's hold). Dispatch with only=inspect-freeze.
  inspect-freeze:
    if: ${{ !inputs.only || startsWith('inspect-freeze', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "the freeze's reset and edges, COUNT runs"
        run: |
          rc=0
          go test -count=$COUNT -v -run '^TestResetPointers$' gioui.org/io/input || rc=1
          go test -count=$COUNT -v -run '^TestHoverResetPointers$' gioui.org/gesture || rc=1
          go test -count=$COUNT -v -run '^TestResetPointersClearsBodyHover$' ./internal/ui/richview || rc=1
          go test -count=$COUNT -v -run '^TestResetPointersLeavesTree$' ./internal/ui/slackc || rc=1
          go test -count=$COUNT -v -run '^(TestHoldLive|TestHoldLiveHoldsPlayers)$' ./internal/imgcache || rc=1
          go test -count=$COUNT -v -run '^(TestFreeze\w*|TestCaptureOpensReview)$' ./internal/ui/inspect || rc=1
          go test -count=$COUNT -v -timeout 40m -run '^(TestInspectFreeze\w*|TestInspectSessionEndsAtSignIn|TestInspectFileDropsIgnored|TestInspectFrozenReportDescribesFrozenFrame|TestInspectReactionPill)$' ./internal/ui || rc=1
          exit $rc

  # inspect-draw (2026-11-21): the inspect review's pen (draw.go): lines
  # burned into the copy where and as wide as they were drawn at 1x and
  # 2x, undo, Esc back to blurring with the app's input intact after, and
  # nothing of it with the tool off; the review's other tests alongside.
  # Dispatch with only=inspect-draw -f count=3.
  inspect-draw:
    if: ${{ !inputs.only || startsWith('inspect-draw', inputs.only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "the pen and the review, COUNT runs"
        run: |
          rc=0
          go test -count=$COUNT -v -run '^(TestPen\w*|TestDragGrabsRegion|TestCaptureOpensReview|TestClickStillPicksAndEscDrops|TestFreezeCapturesTheFrozenFrame|TestComposeRegionAsIs|TestComposeRedactKeepsNothingInside)$' ./internal/ui/inspect || rc=1
          go test -race -count=$COUNT -run '^TestPen\w*$' ./internal/ui/inspect || rc=1
          exit $rc

  # theme-contrast round 4: the fade's continuity, the cascade per variable,
  # the DMs rows drawn (activity_inbox on and off, the peek card's scope),
  # the control strip's held press. Dispatch with only=theme-contrast-4
  # count=3; the last step runs the GPU-free ones once under -race.
  theme-contrast-4:
    if: ${{ !inputs.only || startsWith('theme-contrast-4', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS xvfb libgl1-mesa-dri libegl-mesa0
      - name: "theme + css, COUNT runs"
        run: |
          rc=0
          go test -count=$COUNT -run '^(TestLightTextFadeContinuous|TestSidebarRuleFollowsSheets|TestThemeInkMatchesSlack)$' ./internal/ui/theme || rc=1
          go test -count=$COUNT -run '^TestRootTokensDeclares$' ./internal/ui/slackc/css || rc=1
          exit $rc
      - name: "views: the DMs rows and the card, COUNT runs (Mesa llvmpipe)"
        if: ${{ !cancelled() }}
        env:
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a go test -count=$COUNT -timeout 20m -run '^(TestDMsRowsDrawn|TestDMsListChromeScope|TestDMsPeekCardTokens|TestThemeTokensCascadePerVariable|TestDMsListHoverByMode)$' ./internal/ui/views
      - name: "ui: the control strip and the draw sites, COUNT runs (Mesa llvmpipe)"
        if: ${{ !cancelled() }}
        env:
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a go test -count=$COUNT -timeout 25m -run '^(TestAccountThemeControlStripPress|TestPeekHeaderRule|TestAccountThemeFocusButtonActive|TestAccountThemeCreateButtonOpen|TestAccountThemeDrawSites)$' ./internal/ui
      - name: "-race, once: the GPU-free ones"
        if: ${{ !cancelled() }}
        run: |
          rc=0
          go test -race -count=1 -run '^(TestLightTextFadeContinuous|TestSidebarRuleFollowsSheets)$' ./internal/ui/theme || rc=1
          go test -race -count=1 -run '^TestRootTokensDeclares$' ./internal/ui/slackc/css || rc=1
          go test -race -count=1 -run '^(TestDMsPeekCardTokens|TestThemeTokensCascadePerVariable|TestDMsListHoverByMode)$' ./internal/ui/views || rc=1
          exit $rc

  # Plugins' Slack API calls settle the way Slack's API request does
  # (client-boot 0hZc apiCall, QCxN, Umoo, 7quX; build 35b42de8b870): the
  # response with its request ids, and every rejection (err.data the
  # answer's JSON, Slack's messages, a 429's and internal_error's 3 tries,
  # a rate-limit code failing at once, no answer, a timeout, a page that
  # isn't JSON), for Taut and Slick plugins, over internal/fakeslack.
  # Dispatch with only=plugin-api.
  plugin-api:
    if: ${{ !inputs.only || startsWith('plugin-api', inputs.only) }}
    runs-on: ubuntu-latest
    env:
      TAUT_TESTS: '^(TestAPICallNotOkLikeSlack|TestAPICallResolvesLikeSlack|TestAPICallRateLimitedLikeSlack|TestAPICallRetriesLikeSlack|TestUserAPIErrorsLikeTaut|TestPresenceSubscriptionLikeSlack)$'
      SLICK_TESTS: '^(TestSlickAPICallErrorsLikeSlack|TestSlickReduxThunkNames|TestSlickPresenceThunks)$'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: taut, slick (one verbose run, then COUNT)
        run: |
          set +e
          rc=0
          go test -count=1 -v -run "$TAUT_TESTS" ./internal/taut || rc=1
          go test -count=1 -v -run "$SLICK_TESTS" ./internal/slick || rc=1
          go test -count=$COUNT -run "$TAUT_TESTS" ./internal/taut || rc=1
          go test -count=$COUNT -run "$SLICK_TESTS" ./internal/slick || rc=1
          exit $rc

  # Session-cookie GETs stay on Slack's file paths (slack.FileURL): a file
  # host's pages (files.slack.com/ssb/redirect), dot segments however many
  # times a server decodes them, look-alike, NFKC and overlong dots and
  # separators, names with a literal % that still download, the sign-in
  # client's /ssb/redirect guard (bannedPage), POST hops, and Taut's fetch
  # (its redirects and its first request's sign-out gate). Dispatch with
  # only=fileurl-dotdot.
  fileurl-dotdot:
    if: ${{ !inputs.only || startsWith('fileurl-dotdot', inputs.only) }}
    runs-on: ubuntu-latest
    env:
      SLACK_TESTS: '^(TestDownloadRefusesDotSegments|TestFileHostsNeedFilePaths|TestBannedPageNormalises|TestCheckRedirectStripsCredentials)$'
      TAUT_TESTS: '^(TestFetchRedirectKeepsCredentialsOffSlackPages|TestPluginFetchRefusesSignOut)$'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: slack, taut (one verbose run, then COUNT)
        run: |
          rc=0
          go test -count=1 -v -run "$SLACK_TESTS" ./internal/slack || rc=1
          go test -count=1 -v -run "$TAUT_TESTS" ./internal/taut || rc=1
          go test -count=$COUNT -run "$SLACK_TESTS" ./internal/slack || rc=1
          go test -count=$COUNT -run "$TAUT_TESTS" ./internal/taut || rc=1
          exit $rc

  # dm-senders: a DM's rows name their senders as Slack's do (Karim,
  # 2026-11-19: "unknown author for dms"). A DM opened by its route, by a
  # notification's jump and by a launch that restores it while boot's
  # calls are out names its partner (unknown, users/info out: the loading
  # bar), a partner users/info doesn't return is the non-existent bar, and
  # a message with no user, username or bot is the unknown bar, never the
  # word "Unknown". Dispatch with only=dm-senders.
  dm-senders:
    if: ${{ !inputs.only || startsWith('dm-senders', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "ui: DM senders on every path (one verbose run, then COUNT)"
        run: |
          rc=0
          xvfb-run -a go test -count=1 -v -timeout 10m -run '^TestDMSendersLikeSlack$' ./internal/ui || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 30m -run '^TestDMSendersLikeSlack$' ./internal/ui || rc=1
          exit $rc

  # dm-senders-slugs: a DM's message links ("💬" pills) name the linked
  # message's own sender as Slack's getMessageSlugAttributes does, read
  # from the messages store and fetched by id (messages.list) when it
  # isn't there: "Private message" while that is out, "Unknown author"
  # only while the sender's users/info is, never where Slack names them.
  # A link with no author_id, one whose author_id nobody fetched, the
  # thread pane, and a toast's text (the label, or the link for a message
  # Slack doesn't have). Dispatch with only=dm-senders (with dm-senders)
  # or only=dm-senders-slugs.
  dm-senders-slugs:
    if: ${{ !inputs.only || startsWith('dm-senders-slugs', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "ui: message links in a DM, the thread pane and a toast (one verbose run, then COUNT)"
        run: |
          rc=0
          xvfb-run -a go test -count=1 -v -timeout 10m -run '^(TestDMMessageSlugsLikeSlack|TestNotifyWritesMessageSlugsLikeSlack)$' ./internal/ui || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 30m -run '^(TestDMMessageSlugsLikeSlack|TestNotifyWritesMessageSlugsLikeSlack)$' ./internal/ui || rc=1
          exit $rc

  # profile-role-band (2026-11-21): the member hover card against Slack's
  # MemberProfileHoverCard for every role fakeslack serves (roles.go): no
  # role band on Grid (only Deactivated account), Workspace Owner/Admin
  # off Grid, no org or guest label, the card and full profile alike; the
  # real name; the DND presence from dnd.teamInfo; the status emoji by
  # emoji_name and the text's emoji; core's ports of iz33/ue25/pH4l and
  # dndV2. Dispatch with only=profile-role-band.
  profile-role-band:
    if: ${{ !inputs.only || startsWith('profile-role-band', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "the hover card's roles, name, presence and status, COUNT runs"
        run: |
          set +e
          rc=0
          go test -count=$COUNT -v -run '^(TestHoverCardRoleBand|TestHoverCardOwnerHeightOnGrid|TestHoverCardShowsRealName|TestHoverCardStatusEmojiByName|TestHoverCardMemberDND|TestHoverCardHuddleStatus|TestHoverCardBlankNameLink|TestFullProfileNoRoleLabels|TestHoverCardVariants|TestHoverCardPronounsLikeSlack|TestSearchRowsPeople)$' ./internal/ui/popups || rc=1
          go test -count=$COUNT -v -run '^(TestEmojiDisplayInfoLikeSlack|TestStatusTextPartsLikeSlack|TestUserStatusEmojiByName|TestMemberDND|TestMemberDNDOmittedAnswerIsFresh|TestMemberDNDStaleAfterSlowReconnect)$' ./internal/core || rc=1
          go test -count=$COUNT -v -run '^(TestIconCoverage|TestAllIconsParse)$' ./internal/ui/icons || rc=1
          exit $rc

  # inspect-blur-fast (2026-11-18, round 2 2026-11-19): the inspect tool's
  # pick-to-review path at 1918x1080 (Karim's Windows window) at 1x and 2x,
  # on the headless GPU (llvmpipe, WARP): the review's shot drawn in the
  # frame after the pick's, its image bounded against the whole shot's
  # blur, each capture's stage times logged; the keys in the release's
  # frame; the shots' GPU (made as a session starts, let go of after its
  # shot, never waited for); deliveries in order; the picker inside popups
  # (a Block Kit modal and its select, a menu, the emoji picker, a profile
  # card's parts, a rail peek's rows, the Ctrl+K switcher, a frozen
  # tooltip, plugin layers); Gio's rollback op keys and SetSize; round 4: a
  # region's (and a pick of nothing's) copy keys armed 300 ms after its
  # review shows, a held Enter's repeats dropped, a toast and channel
  # details' stacked dialogs picked as themselves; the tool in each of
  # huddleui's windows (2026-11-20). Dispatch with only=inspect-blur-fast.
  inspect-blur-fast:
    if: ${{ !inputs.only || startsWith('inspect-blur-fast', inputs.only) }}
    name: "inspect-blur-fast (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        if: ${{ runner.os == 'Linux' }}
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS xvfb libgl1-mesa-dri libegl-mesa0
      - name: "the pick-to-review path and the picker in popups, COUNT runs"
        shell: bash
        env:
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then x=(xvfb-run -a); else x=(); fi
          if [ "$RUNNER_OS" = Windows ]; then export CGO_ENABLED=0; fi
          rc=0
          go test -count=$COUNT -v -timeout 20m -run '^(TestReviewShotNextFrame|TestFreezeReviewShotNextFrame|TestEnterRightAfterPick|TestEscDuringPreparation|TestRegionEnterOpensReview|TestRegionCopyArms|TestHeldCopyKeyRepeats|TestEnterMidMarkKeepsIt|TestGiveUpDropsCapture|TestCloseLogsCapture|TestShooterSetWantedNeverWaits|TestShooterStartStopStart|TestShooterReleasesAfterShot|TestShooterFailedWindows|TestShooterTwoSessions|TestExperimentNotesFromTheRecorder|TestDeliveriesInOrder|TestDeliveriesInOrderWithText|TestNoShotLogsAtOnce|TestSaveUniqueStems|TestFreezeDeferredTooltip|TestBlurMatchesOld|TestPaintShotMatchesOld|TestBlurOutsideAllocs)$' ./internal/ui/inspect || rc=1
          go test -count=$COUNT -v -timeout 10m -run '^(TestInspectCardAfterContent|TestInspectCardMarkHoldsContent|TestInspectPluginOverlayLayer|TestInspectTreeTooltipEitherTheme)$' ./internal/ui/slackc || rc=1
          "${x[@]}" go test -count=$COUNT -v -timeout 10m -run '^(TestClackSetSize|TestClackRollbackKeys)$' gioui.org/gpu/headless || rc=1
          "${x[@]}" go test -count=$COUNT -v -timeout 10m -run '^(TestDetailsDialogInspectCard)$' ./internal/ui/views || rc=1
          go test -count=$COUNT -v -timeout 15m -run '^(TestInspectHuddleWindow|TestInspectScreensharePopout|TestInspectPresenterPanel|TestInspectInviteWindow|TestInspectJoinPreview)$' ./internal/ui/huddleui || rc=1
          "${x[@]}" go test -count=$COUNT -v -timeout 40m -run '^(TestInspectReviewTiming|TestInspectPicksBlockKitModal|TestInspectPicksMenu|TestInspectPicksPopover|TestInspectPicksProfileCard|TestInspectPicksPeek|TestInspectPicksSwitcher|TestInspectPicksSelectMenu|TestInspectPicksPickers|TestOverlayKindsBoxTheirLayer|TestInspectFreezeHoldsPopups|TestInspectRegionArming|TestInspectPicksToast|TestInspectSubWindowsGate)$' ./internal/ui || rc=1
          exit $rc

  # canvas-mention: the timing tests of a navigation into a canvas's or a
  # list's file channel (ui/canvas_open.go): files.info and messages.list
  # held back, a 4 s wait that ends, jumps dropped by a newer click, the
  # split view's back stack after a wait. Dispatch with only=canvas-jumps.
  canvas-jumps:
    # dispatch only: its tests' files aren't in the push paths
    if: ${{ inputs.only != '' && startsWith('canvas-jumps', inputs.only) }}
    runs-on: ubuntu-latest
    env:
      UI_TESTS: '^(TestCanvasJumpWaitsForFilesInfo|TestCanvasJumpWaitEnds|TestCanvasJumpDroppedByAnotherOpen|TestCanvasJumpFetchFailureOpensNothing|TestSplitFileWaitKeepsBackStack|TestActivityPaneKeepsViewWhileJumpResolves|TestActivityPaneJumpDropped|TestActivityPaneKeepsListWhileJumpWaits|TestActivityCanvasMentionOpensThread|TestCanvasMentionMessageOpensThread|TestListFileChannelOpensList|TestFileLinkInSplitStaysInSplit|TestNavigationWaitDropped|TestHiddenFilesDontWait)$'
      VIEWS_TESTS: '^(TestActivityCanvasMentionRowLateFilesInfo|TestActivityFileItemFollowsLateView|TestActivityCanvasMentionClickInbox)$'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS xvfb libgl1-mesa-dri libegl-mesa0
      - name: ui, views (COUNT runs each)
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          rc=0
          # one verbose pass names every test that ran, then COUNT quiet ones
          xvfb-run -a go test -count=1 -v -timeout 20m -run "$UI_TESTS" ./internal/ui 2>&1 | grep -E '^(=== RUN|--- (PASS|FAIL)|FAIL|ok)|_test\.go:[0-9]+:' || true
          xvfb-run -a go test -count=$COUNT -timeout 40m -run "$UI_TESTS" ./internal/ui || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 20m -run "$VIEWS_TESTS" ./internal/ui/views || rc=1
          exit $rc

  # system-dm-avatar (2026-11-21): the Slack system user (USLACK) drawn as
  # Slack's bundled logo (getMemberProfileImage 6Knt: n8qp) everywhere:
  # imgcache rasterizes that one shipped SVG and no other; the store's
  # avatar rule; no badge on a USLACK message (JA+h memberIsHuman ||
  # isSlackSystemUser); its card renders nothing and its presence is
  # Slackbot's heart; the system DM's sidebar row, header and bot_message
  # rows over fakeslack's fixture, pixels on the headless GPU.
  # Dispatch with only=system-dm-avatar.
  system-dm-avatar:
    if: ${{ !inputs.only || startsWith('system-dm-avatar', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS xvfb libgl1-mesa-dri libegl-mesa0
      - name: imgcache, store, core, popups, ui (COUNT runs)
        env:
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set +e
          rc=0
          go test -count=$COUNT -v -run '^(TestBundledSlackLogoDraws|TestNetworkSVGStaysUndecodable|TestRasterSVGRefusesWhatItCannotDraw|TestRasterSVGChargesItsBuffers|TestRasterSVGBoundsItsInput|TestParsePathData)$' ./internal/imgcache || rc=1
          go test -count=$COUNT -v -run '^TestAvatarURLSlackSystemUser$' ./internal/store || rc=1
          go test -count=$COUNT -v -run '^(TestSenderBadge|TestSenderIdentity)$' ./internal/core || rc=1
          xvfb-run -a go test -count=$COUNT -v -timeout 20m -run '^TestSlackSystemUserCard$' ./internal/ui/popups || rc=1
          xvfb-run -a go test -count=$COUNT -v -timeout 30m -run '^(TestSlackSystemDMAvatar|TestSidebarSystemUserPresence|TestSidebarAvatarSystemUserNoPresence)$' ./internal/ui || rc=1
          exit $rc

  # caret-align (2026-11-20): the caret in Clack's inputs against their
  # placeholders and text, by Blink's rules (internal/ui/theme/carettest:
  # the font's rounded height on the placeholder's baseline, 1 CSS px
  # wide, snapped, at the text's start), in views' agents invite picker
  # and search box and popups' field, at 1x, 1.5x and 2x in both themes,
  # on llvmpipe, WARP and Metal (Gio patch 54); and Gio's own widget
  # tests on Linux. Dispatch with only=caret-align.
  caret-align:
    if: ${{ !inputs.only || startsWith('caret-align', inputs.only) }}
    name: "caret-align (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        if: ${{ runner.os == 'Linux' }}
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS xvfb libgl1-mesa-dri libegl-mesa0
      - name: "the caret against the placeholder and the text, COUNT runs"
        shell: bash
        env:
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set +e
          if [ "$RUNNER_OS" = Linux ]; then x=(xvfb-run -a); else x=(); fi
          if [ "$RUNNER_OS" = Windows ]; then export CGO_ENABLED=0; fi
          rc=0
          "${x[@]}" go test -count=$COUNT -v -timeout 30m -run '^(TestCaretAlignViewsInputs)$' ./internal/ui/views || rc=1
          "${x[@]}" go test -count=$COUNT -v -timeout 30m -run '^(TestCaretAlignPopupsField)$' ./internal/ui/popups || rc=1
          "${x[@]}" go test -count=$COUNT -v -timeout 30m -run '^(TestCaretAlignEditorBox|TestCaretAlignZoomedWidth|TestCaretScrolledOutOfView)$' ./internal/ui/theme/carettest || rc=1
          # Gio's own widget tests; these two fail on ui without this
          # branch too (6db17b41: TestNoFilterAllocs gets 1 alloc per op,
          # TestIndexPositionRunes/many_newlines 42 positions for 41), so
          # they are skipped here
          if [ "$RUNNER_OS" = Linux ]; then "${x[@]}" go test -count=1 -timeout 15m -skip '^(TestNoFilterAllocs|TestIndexPositionRunes)$' gioui.org/widget || rc=1; fi
          exit $rc

  # 2026-11-20 (Karim, α.113): "i swear i just saw the [/] icon flicker
  # like crazy" in a thread composer under OwlMode's patches. The footer's
  # layout across a sweep of widths, frame after frame, with and without
  # plugin buttons, and the overflow row with its tooltips.
  composer-toolbar:
    if: ${{ !inputs.only || startsWith('composer-toolbar', inputs.only) }}
    name: "composer-toolbar (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        if: ${{ runner.os == 'Linux' }}
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS xvfb libgl1-mesa-dri libegl-mesa0
      - name: "composer: the footer toolbar's fold, its row and tooltips, under plugins and without, COUNT runs"
        shell: bash
        env:
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then x=(xvfb-run -a); else x=(); fi
          if [ "$RUNNER_OS" = Windows ]; then export CGO_ENABLED=0; fi
          "${x[@]}" go test -count=$COUNT -v -timeout 20m -run '^TestComposerToolbar' ./internal/ui/composer

  # A socket gap leaves no hole (Karim's #clack on α.112, 2026-11-20: 6:54
  # PM, then 9:53 PM, the three hours between missing): a socket that goes
  # silent is closed after Slack's 90 s without a pong (client-boot Kot3);
  # at a slow connect every window's end goes stale (Slack's
  # resetReachedEnd) and the open one is read forward from it, or starts
  # over at the newest page; the socket's messages past it wait meanwhile.
  # Silent, dropped and slept sockets, a window paged back to an old
  # message, more than a page missed, and the list drawing every message
  # with the other channel unread. Dispatch with only=history-gap.
  history-gap:
    if: ${{ !inputs.only || startsWith('history-gap', inputs.only) }}
    runs-on: ubuntu-latest
    env:
      SLACK_TESTS: '^(TestRTMClosesSilentSocket|TestRTMPongTimeoutCountsSleep|TestRTMPongIsAnyReplyToThePing)$'
      STORE_TESTS: '^(TestResetReachedEndHoldsTheSocketsMessages|TestCatchUpJoinsTheWindow|TestCatchUpTakesTheConfirmedSend|TestNewestPageJoinsTheWaitingMessages|TestOlderPageJoinsOnlyWhereTheWindowStarts|TestNewestPageKeepsTheViewersSends|TestNewestPageReadAcrossAResetStaysStale|TestNewestPageThatMissesStartsANewEpoch)$'
      CORE_TESTS: '^TestSocketGap'
      HUB_TESTS: '^TestNewestPageOfAnotherWindowIsTakenWhole$'
      UI_TESTS: '^TestSocketGapListDrawsEveryMessage$'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: slack, store, core, messages, ui (one verbose run, then COUNT)
        run: |
          set +e
          rc=0
          go test -count=1 -v -run "$SLACK_TESTS" ./internal/slack || rc=1
          go test -count=1 -v -run "$STORE_TESTS" ./internal/store || rc=1
          go test -count=1 -v -timeout 10m -run "$CORE_TESTS" ./internal/core || rc=1
          xvfb-run -a go test -count=1 -v -run "$HUB_TESTS" ./internal/ui/messages || rc=1
          xvfb-run -a go test -count=1 -v -timeout 15m -run "$UI_TESTS" ./internal/ui || rc=1
          go test -count=$COUNT -run "$SLACK_TESTS" ./internal/slack || rc=1
          go test -count=$COUNT -run "$STORE_TESTS" ./internal/store || rc=1
          go test -count=$COUNT -timeout 20m -run "$CORE_TESTS" ./internal/core || rc=1
          xvfb-run -a go test -count=$COUNT -run "$HUB_TESTS" ./internal/ui/messages || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 30m -run "$UI_TESTS" ./internal/ui || rc=1
          exit $rc
      - name: core, -race
        run: |
          set +e
          rc=0
          go test -race -count=1 -timeout 15m -run "$CORE_TESTS" ./internal/core || rc=1
          go test -race -count=1 -run "$SLACK_TESTS|$STORE_TESTS" ./internal/slack ./internal/store || rc=1
          exit $rc

  # msg-latency-2's lanes (jsrt UserBlocking, UserChain, the in-order lane,
  # CallThen): a send's checks, transforms and thunk run ahead of the
  # plugin runtime's backlog, a checked send goes out with no composer
  # frame after Enter, typing goes out before its message, a native
  # dispatch and a click keep their order, a plugin send via JS keeps each
  # message, a frame's move goes before its press; the plugins' state
  # views are read in chunks (a whole bucket behind a backlog in about one
  # queue trip). Dispatch with only=msg-lanes.
  msg-lanes:
    if: ${{ !inputs.only || startsWith('msg-lanes', inputs.only) }}
    runs-on: ubuntu-latest
    env:
      JSRT_TESTS: '^(TestBoundaryEventsKeepTheirOrder|TestMovesAcrossTargetsKeepTheirOrder|TestWheelDeltasAddUp|TestUserTimerLeavesThePlainQueueItsTurns|TestUserBlockingRunsFirst|TestUserBlockingPreemptsBatch|TestUserBlockingAfterInOrderTasks|TestUserBlockingContinuations|TestUserBlockingChainEnds|TestUserTimerAfterInOrderTasks|TestInOrderCallBeforeLaterInput|TestSendChainHoldsTheQueue|TestUserYieldLoopLetsTheQueueRun|TestInOrderRunsAheadOfRenders|TestQueuedRectsAndMovesCoalesce|TestMoveBeforeLaterUpUnderBacklog)$'
      TAUT_TESTS: '^(TestCallTruthyAheadOfBacklog|TestBucketReadBehindBacklog|TestBucketReadChunkEdges|TestBucketReadLeavesTheThreadTurns|TestDispatchSeqOutlivesItsContext|TestCheckThenDispatchGraceCoversTheChecksOnly|TestInjectedMessagesDecodedOnce|TestSendCheckKilledByTheWatchdog)$'
      COMPOSER_TESTS: '^(TestSendCheckAheadOfJSBacklog|TestSendCheckedMessageGoesOutWithoutAFrame|TestSendThunkWorkAheadOfJSBacklog|TestSendSeesTheClickBeforeIt|TestTypingGoesOutBeforeTheMessage|TestNativeDispatchBeforeLaterClick|TestSendViaJSKeepsEachMessage|TestSendViaJSOnTheUserLane|TestSendViaJSHeldBackPutsTheMessageBack|TestSendViaJSErrorAfterSendKeepsItSent|TestEditOnTheUserLane|TestRuntimePostsStayAheadOfASend)$'
      SLACKC_TESTS: '^TestFrameMoveBeforePress$'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: jsrt, taut, composer, slackc (one verbose run, then COUNT)
        run: |
          set +e
          rc=0
          go test -count=1 -v -run "$JSRT_TESTS" ./internal/jsrt || rc=1
          go test -count=1 -v -run "$TAUT_TESTS" ./internal/taut || rc=1
          go test -count=1 -v -timeout 10m -run "$COMPOSER_TESTS" ./internal/ui/composer || rc=1
          go test -count=1 -v -run "$SLACKC_TESTS" ./internal/ui/slackc || rc=1
          go test -count=$COUNT -run "$JSRT_TESTS" ./internal/jsrt || rc=1
          go test -count=$COUNT -timeout 20m -run "$TAUT_TESTS" ./internal/taut || rc=1
          go test -count=$COUNT -timeout 30m -run "$COMPOSER_TESTS" ./internal/ui/composer || rc=1
          go test -count=$COUNT -run "$SLACKC_TESTS" ./internal/ui/slackc || rc=1
          exit $rc

  # msg-latency-2's notifications in order: a burst notifies in the order
  # its messages came (nothing to wait for, or each waiting for its
  # sender's one users/info), messages from a new person in order with the
  # person asked for once, a notification names the new people it waited
  # for, and under a showNotification patch with the plugin JS behind they
  # neither swap nor queue behind each other. Dispatch with
  # only=notify-order.
  notify-order:
    if: ${{ !inputs.only || startsWith('notify-order', inputs.only) }}
    runs-on: ubuntu-latest
    env:
      UI_TESTS: '^(TestNotificationsOfAConversationKeepTheirOrder|TestNotificationBurstInOrder|TestNotificationWaitsForNewPeople|TestNotificationsFromNewPersonInOrder|TestNotificationsDontWaitForEachOther)$'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: ui (one verbose run, then COUNT)
        run: |
          set +e
          rc=0
          xvfb-run -a go test -count=1 -v -timeout 10m -run "$UI_TESTS" ./internal/ui || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 40m -run "$UI_TESTS" ./internal/ui || rc=1
          exit $rc

  # msg-latency-2's harness: a socket event (or Enter) to the frame that
  # draws its row, the whole client over the fake's socket with frames
  # drawn as the window draws them, without plugins: others' messages
  # from people it holds and people it never fetched, own sends and their
  # echoes, quiet and under a busy workspace's socket (Karim's α.102 "like
  # a second and they come in clumped"). One verbose run, then COUNT.
  # Dispatch with only=msg-latency.
  msg-latency:
    if: ${{ !inputs.only || startsWith('msg-latency', inputs.only) }}
    runs-on: ubuntu-latest
    env:
      CLACK_LATENCY_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: ui (one verbose run, then COUNT)
        run: |
          set +e
          rc=0
          go test -count=1 -v -timeout 20m -run '^TestMessageLatency$' ./internal/ui || rc=1
          go test -count=$COUNT -timeout 60m -run '^TestMessageLatency$' ./internal/ui || rc=1
          exit $rc

  # plugin-reaction-pill: reaction pills under a patched ReactionBar (a
  # pass-through patch with no CSS, and OwlMode's shape with its rules)
  # and under a plugin's class on the pill's button against the native
  # pills: emoji box, bounds, count ink and the bar's pixels, light and
  # dark, and the plugins' rings and colours where they name the pills
  # (reaction-pill-shots artifact). pill-views: the same in the Threads,
  # Unreads and Activity views, and a plugin's own .c-reaction as Slack's.
  # Dispatch with only=reaction-pill.
  reaction-pill:
    if: ${{ !inputs.only || startsWith('reaction-pill', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS xvfb libgl1-mesa-dri libegl-mesa0
      - name: patched reaction pills against the native ones, COUNT runs
        env:
          MESSAGES_AUDIT_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$MESSAGES_AUDIT_SHOTS_DIR"
          rc=0
          xvfb-run -a go test -count=$COUNT -v -timeout 30m -run '^TestPatchedReactionPillLikeNative$' ./internal/ui/messages || rc=1
          xvfb-run -a go test -count=$COUNT -v -timeout 30m -run '^TestViewsPatchedReactionPillLikeNative$' ./internal/ui/views || rc=1
          go test -count=$COUNT -v -run '^TestPluginOwnReactionLikeSlack$' ./internal/ui/slackc || rc=1
          exit $rc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: reaction-pill-shots
          path: dist/shots

  # system-dm-toast (2026-11-21): the toast for an app's post in the DM
  # with Slack's system user (ui/notify_dm.go, notify_system_dm_test.go):
  # Slack's title, body and icon, the click, the frame flash and the
  # badge, and the prefs that hold it back (desktop push, mute, Do Not
  # Disturb, notify anyway, a VIP), then the real toast in Windows'
  # Notification Center. Dispatch with only=system-dm-toast (both jobs),
  # only=system-dm-toast-linux or only=system-dm-toast-windows (one).
  system-dm-toast-linux:
    if: ${{ inputs.only != '' && startsWith('system-dm-toast-linux', inputs.only) }}
    runs-on: ubuntu-latest
    env:
      UI_TESTS: '^(TestSystemDMToast|TestMacNotifierSystemDM|TestWantsNotify|TestThreadsAudit|TestDeferStreamingNotification|TestNotify|TestToast|TestMacNotifier)'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "ui: the system DM's toast (one verbose run, then COUNT)"
        run: |
          set +e
          rc=0
          xvfb-run -a go test -count=1 -v -timeout 15m -run '^(TestSystemDMToast|TestMacNotifierSystemDM)' ./internal/ui || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 30m -run "$UI_TESTS" ./internal/ui || rc=1
          # notify-file-meta (2026-11-21): the toast text's file and clip lines
          go test -count=$COUNT -timeout 10m -run '^(TestFileTypeLikeSlack|TestNoteFilesOf|TestNoteFileTitle|TestNotificationText)' ./internal/richtext || rc=1
          exit $rc
  system-dm-toast-windows:
    if: ${{ inputs.only != '' && startsWith('system-dm-toast-windows', inputs.only) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: "ui: the system DM's toast in Notification Center (COUNT runs)"
        shell: bash # $COUNT is the job's env (pwsh would read its own variable)
        env:
          CGO_ENABLED: "0" # as in ci's windows-applog
          CLACK_WINDOWS_TOAST_TESTS: "1"
        run: go test -count=$COUNT -v -timeout 25m -run '^(TestWindowsToastSystemDM|TestSystemDMToastLikeSlack)$' ./internal/ui


  # thread-load: a thread of 1,078,423 synthetic replies (Karim, 2026-11-20:
  # "make this thread load really fucking fast") opens and pages the way
  # Slack's thread pane does: the store's slices against Slack's own
  # reducer (TestThreadHistoryLikeSlack), core's requests (one page of 28
  # from the root, two around a reply, loadPre and loadPost), and the pane
  # opened through the permalink, from the channel and from Activity, then
  # scrolled through older pages (time to the first replies, requests,
  # heap, frames), and after a slow connect a thread at its end goes stale
  # with the channels and its read past the old end joins what the socket
  # brought. Dispatch with only=thread-load.
  thread-load:
    if: ${{ !inputs.only || startsWith('thread-load', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "store, core and ui: the huge thread's pages, COUNT runs (one verbose)"
        run: |
          set +e
          rc=0
          go test -count=$COUNT -v -timeout 10m -run '^(TestThreadHistoryLikeSlack|TestThreadPageKeepsRootOutOfSlice|TestResetReachedEndCoversThreads)$' ./internal/store || rc=1
          go test -count=$COUNT -v -timeout 15m -run '^(TestThreadOpensLikeSlack|TestThreadNewestPageLikeSlack|TestSocketGapThreadAtItsEnd)$' ./internal/core || rc=1
          go test -count=$COUNT -v -timeout 10m -run '^(TestThreadPaneAfterSlowConnect|TestThreadLoadingRepliesRow)$' ./internal/ui/messages || rc=1
          xvfb-run -a go test -count=1 -v -timeout 20m -run '^TestHugeThreadLoadsLikeSlack$' ./internal/ui || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 40m -run '^TestHugeThreadLoadsLikeSlack$' ./internal/ui || rc=1
          exit $rc

  # threads-ship (2026-11-21): the review of thread-load-speed's blockers
  # (wf_15e6e96d-4f5): a List item's comments page like the thread pane,
  # a poll with the socket away refreshes the pane's rows, a pane closed
  # or hidden while it pages starts over as a pane mounted afresh (its
  # scrollmark by message), a followed thread opens at its last read with
  # no window holding its root, Mod+Z and Up read the newest slice, the
  # reply box stays through a slow connect, and find in thread lands a
  # result outside the slice. Dispatch with only=thread-load (or
  # only=thread-load-ship for these alone).
  thread-load-ship:
    if: ${{ !inputs.only || startsWith('thread-load-ship', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "core, messages, listview and ui: the threads-ship blockers, COUNT runs"
        run: |
          set +e
          rc=0
          go test -count=$COUNT -v -timeout 10m -run '^(TestThreadStartTsFollowedWithoutRoot|TestThreadPollRefreshesPaneRows)$' ./internal/core || rc=1
          go test -count=$COUNT -v -timeout 10m -run '^(TestThreadReplyBoxStaysAfterSlowConnect|TestFindInThreadNewerResultLands|TestFindInThreadClosedStopsReading)$' ./internal/ui/messages || rc=1
          go test -count=$COUNT -v -timeout 10m -run '^TestItemCommentsPageLikeSlack$' ./internal/ui/listview || rc=1
          xvfb-run -a go test -count=$COUNT -v -timeout 25m -run '^(TestThreadPaneClosedWhilePageLoads|TestThreadPaneHiddenAndShownKeepsPaging|TestThreadReopenAfterJumpStartsAtItsStart|TestThreadPaneRefreshesAtPoll|TestUndoAndEditLastReadTheNewestSlice)$' ./internal/ui || rc=1
          exit $rc

  # thread-open-root (2026-11-17, round 2 2026-11-18): a thread pane never
  # shows a reply as its root (Karim, α.105: a link to a reply in a bot's
  # digest of active threads opened the reply alone, as the root), and the
  # rest of Slack's jumpToMessage: a reply's permalink with and without
  # thread_ts, a thread parent's link (openThreadForRootMessage; not in a
  # bot's DM), message_mention pills, the window around an old message
  # (two conversations.history calls), the split view's back stack and
  # reply, the reply route's history entry, one replies fetch per
  # hand-over, thread-only and latest-reply links, slack:// links in
  # messages, foreign workspaces, deep links, OpenThread, the pane's
  # hand-over, a followed thread's toast, the log's tags; the pane's
  # hand-over on each open and the highlight's keyframes (messages), row
  # and surface links, search results and Activity's Open in home, the
  # lookups (core). Round 3 adds the jump's anchor line (Karim, α.108:
  # links highlighted a message without scrolling to it; Gio patch 50) and
  # an archived channel's tombstone thread paging up (Karim: "i cant scroll
  # up from this thread"). Round 4: Slack's general anchoring, thread pane
  # starts, jumps to a ts no row holds, windows kept while shown. One
  # verbose run, then COUNT. Dispatch:
  # only=thread-open-root.
  thread-open-root:
    if: ${{ !inputs.only || startsWith('thread-open-root', inputs.only) }}
    runs-on: ubuntu-latest
    env:
      TESTS: '^(TestReplyPermalinkOpensParentThread|TestReplyPermalinkWithoutThreadOpensParentThread|TestThreadPaneNeverShowsReplyAsRoot|TestDeepLinkToReplyOpensParentThread|TestFollowedThreadToastOpensParentThread|TestReplyPermalinkSplitClickOpensInSplit|TestParentLinkOpensItsThread|TestMessageMentionPillOpensThread|TestPermalinkLoadsAroundOldMessage|TestSplitViewLinkKeepsBackStack|TestReplyRouteLeavesNoHistory|TestReplyRootedPaneFetchesThreadOnce|TestThreadOnlyLinksOpenTheThread|TestForeignWorkspaceLinkOpensBrowser|TestNavigationLogsTagIDs|TestJumpWindowIsTheListsOwn|TestJumpWindowPagesWithinItself|TestJumpWindowTakesLiveChanges|TestEnteringConversationAfterJump|TestColdJumpLoadsOnlyTheWindow|TestColdJumpRefreshedBeforeFirstFrame|TestHandOverHighlightsRootAfterWindow|TestFollowLinkOpensSlackLinksInClient|TestTopicCardLinksFollowSlackLinks|TestJumpToLoadedMessageOnAnchorLine|TestJumpToLateMessageOnAnchorLine|TestJumpHoldsThroughRowsGrowingAbove|TestJumpToReplyOnAnchorLine|TestArchivedTombstoneWindowPagesOlder|TestArchivedTombstoneThreadScrollsUp|TestJumpWindowKeepsReactionsAfterOtherJumps|TestWindowNewerFailureDoesNotBlockOlder|TestJumpWindowEndStaysPut|TestAnchorLineKeepsRowAfterScroll|TestNewMessageNearEndSticks|TestJumpToMissingMessageLandsOnNext|TestJumpToMissingInWindowDoesNotClimb|TestThreadReHighlightScrollsLazilyToTop|TestHighlightRootFromElsewhereAnchors|TestEnteringWithUnreadsShowsNewest|TestHighlightRootRouteKeepsWindow|TestPageKeysScrollTheList|TestArchivedTombstoneJumpScrollsBothWays|TestHoverToolbarJumpFromActivity|TestFlashEndsWhenRowLeaves|TestJumpWindowLastPageStaysPut|TestUnreadConversationOpensAtNewest|TestOwnSendJumpsToNewest|TestNewMessageNearEndSticksDarkClean|TestEmptyComposerPageKeys|TestSharedMessageOpensItsReply)$'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: ui (links, deep links, panes and toasts open a message's thread as Slack's jumpToMessage does)
        run: |
          go test -count=1 -v -timeout 45m -run "$TESTS" ./internal/ui
          go test -count=$COUNT -timeout 120m -run "$TESTS" ./internal/ui
      - name: messages, views, popups, blockkit (the pane's hand-over, the highlight, row and surface links, search, Activity)
        if: ${{ !cancelled() }}
        run: |
          go test -count=1 -v -run '^(TestReplyRootedPaneHandsOnEachOpen|TestJumpHighlightKeyframes|TestHandOverWaitsForReadAfterJoin|TestChannelNameArrivesBetweenFrames|TestEveryRowFlashes|TestRepeatJumpKeepsFlash|TestFlashTintsSeeThroughFills|TestWindowSwitchCountsFromItsModel|TestWindowLoadTakesUpdateWhileOut|TestWindowMostRecentLeavesWindow|TestWindowDownArrowOntoLastMessage|TestWindowFocusNewestLeavesWindow|TestWindowDateJumpPastItsEnd|TestListCacheKeepsShownWindow|TestDrawnWindowTakenBack|TestInjectedMessagesStayInTheirSlice|TestWindowPageKeepsLiveChanges|TestRenameDuringWindowPage|TestLiveReadsWindow|TestWindowEndKeyLeavesWindow|TestPageUpMovesAPageLess21|TestPageKeyTakesTheDOMNames|TestNewMessageAfterPageUpKeepsPlace|TestShrinkingNearEndKeepsToIt|TestDeletedLineRowKeepsNextInPlace|TestEndStopsTheWheelCurve|TestPluginJumpStartsAFlash|TestTombstoneSquareLikeSlack|TestWindowRowsDrawPluginViews)$' ./internal/ui/messages
          go test -count=$COUNT -run '^(TestReplyRootedPaneHandsOnEachOpen|TestJumpHighlightKeyframes|TestHandOverWaitsForReadAfterJoin|TestChannelNameArrivesBetweenFrames|TestEveryRowFlashes|TestRepeatJumpKeepsFlash|TestFlashTintsSeeThroughFills|TestWindowSwitchCountsFromItsModel|TestWindowLoadTakesUpdateWhileOut|TestWindowMostRecentLeavesWindow|TestWindowDownArrowOntoLastMessage|TestWindowFocusNewestLeavesWindow|TestWindowDateJumpPastItsEnd|TestListCacheKeepsShownWindow|TestDrawnWindowTakenBack|TestInjectedMessagesStayInTheirSlice|TestWindowPageKeepsLiveChanges|TestRenameDuringWindowPage|TestLiveReadsWindow|TestWindowEndKeyLeavesWindow|TestPageUpMovesAPageLess21|TestPageKeyTakesTheDOMNames|TestNewMessageAfterPageUpKeepsPlace|TestShrinkingNearEndKeepsToIt|TestDeletedLineRowKeepsNextInPlace|TestEndStopsTheWheelCurve|TestPluginJumpStartsAFlash|TestTombstoneSquareLikeSlack|TestWindowRowsDrawPluginViews)$' ./internal/ui/messages
          go test -count=$COUNT -v -run '^(TestRowLinksFollowSlackLinks|TestActivityOpenInHomeOpensAtReply)$' ./internal/ui/views
          go test -count=$COUNT -v -run '^TestSearchResultOpensReplyAtReply$' ./internal/ui/popups
          go test -count=$COUNT -v -run '^TestSurfaceLinksFollowSlackLinks$' ./internal/ui/blockkit
          go test -count=$COUNT -v -run '^(TestTopicLinksFollowSlackLinks|TestSearchCardForeignPermalinkOpensBrowser)$' ./internal/ui/popups
          go test -count=$COUNT -v -run '^TestCanvasLinksFollowSlackLinks$' ./internal/ui/canvasview
          go test -count=$COUNT -v -run '^(TestSeeThroughFillsOverUnder|TestOpaqueFillsStayOverUnder)$' ./internal/ui/richview
          go test -count=$COUNT -v -run '^(TestMirrorHoldsJumpWindows|TestFetchedMessageMarkedOnce)$' ./internal/taut
          go test -count=$COUNT -v -run '^TestEmptyInputHandsPageKeysToList$' ./internal/ui/composer
          go test -count=$COUNT -v -run '^TestPluginLinksFollowSlackLinks$' ./internal/ui/slackc
      - name: the lookups and the log's tags (core, logtag, ui)
        if: ${{ !cancelled() }}
        run: |
          go test -count=$COUNT -v -run '^(TestReplyThread|TestCachedSlugKeepsParentThread|TestReplyThreadOpenRoot|TestReplyThreadSingleFlight|TestHistoryAround|TestRepliesForReplyKeyedByParent|TestLatestReply|TestReplyThreadForgetsChangedMessages)$' ./internal/core
          go test -count=$COUNT -v -run '^(TestWindowsAreSlices|TestWindowReadsMergeLive|TestHeldWindowsStay|TestWindowReachingNewestIsAnEpoch)$' ./internal/store
          go test -count=$COUNT -v -run '^TestID$' ./internal/logtag
          go test -count=$COUNT -run '^(TestDeepLinkMessage|TestNavLogTags)$' ./internal/ui
      - name: gio (patch 50, List.ScrollDelta)
        if: ${{ !cancelled() }}
        run: go test -count=$COUNT -v -run '^(TestListScrollDelta|TestListStopScroll)$' gioui.org/layout

  # jump-reactions: reactions on a jump window's messages draw after the
  # list left the conversation for old messages elsewhere and came back to
  # the window it kept (edit-latency's reactions round, thread-open-root's
  # review: core dropped the shown window past 8, and reactions found no
  # message). Dispatch with only=jump-reactions.
  jump-reactions:
    if: ${{ !inputs.only || startsWith('jump-reactions', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "ui: reactions on a jump window after leaving it (one verbose run, then COUNT)"
        env:
          CLACK_LATENCY_TESTS: "1"
        run: |
          rc=0
          xvfb-run -a go test -count=1 -v -timeout 15m -run '^TestJumpWindowReactionsAfterLeaving$' ./internal/ui || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 30m -run '^TestJumpWindowReactionsAfterLeaving$' ./internal/ui || rc=1
          exit $rc

  # msg-latency-3: the socket events' lookups run off the event pump
  # (core pump_later.go): users.prefs after a pref_change or a
  # search_frecency/search_recents, the sections reread, conversations.info
  # after a self-join, a channel_joined, a group DM's conversion or a
  # message in a conversation core doesn't know, dnd.info after the
  # viewer's dnd_updated, a saved message's messages.list and an assistant
  # status's bot's users/info. A message right behind one draws in the next
  # frame; a held conversation's messages, edits and deletions keep the
  # socket's order. Dispatch with only=pump-lookups.
  pump-lookups:
    if: ${{ !inputs.only || startsWith('pump-lookups', inputs.only) }}
    runs-on: ubuntu-latest
    env:
      CORE_TESTS: '^(TestSocketLookupsLeaveThePump|TestPrefChangeValueAppliesAtOnce|TestHeldReplyDeletionWaitsForIt|TestHeldMessagesKeepTheirOrder|TestHeldDMDoesntWaitForPrefs|TestNewGroupDMsFirstMessageBadges|TestSectionRereadsTakeTheNewest|TestLeftChannelStaysLeft|TestOlderDNDAnswerGivesWay|TestSavedStateBeforeItsLookup|TestRemovesNotTakenByReactions)$'
      UI_TESTS: '^(TestMessageBehindLookupLatency|TestPreviewFooterChannelCreatedElsewhere)$'
      CLACK_LATENCY_TESTS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: core, ui (one verbose run, then COUNT)
        run: |
          set +e
          rc=0
          go test -count=1 -v -timeout 10m -run "$CORE_TESTS" ./internal/core || rc=1
          xvfb-run -a go test -count=1 -v -timeout 15m -run "$UI_TESTS" ./internal/ui || rc=1
          go test -count=$COUNT -timeout 20m -run "$CORE_TESTS" ./internal/core || rc=1
          xvfb-run -a go test -count=$COUNT -timeout 40m -run "$UI_TESTS" ./internal/ui || rc=1
          exit $rc
      - name: core, -race
        run: go test -race -count=1 -timeout 15m -run "$CORE_TESTS" ./internal/core


  # launch-speed (Karim, 2026-11-21: "Make launching the app take less
  # than a Mac app bounce"): Clack launched the way a user launches it,
  # against fakeslackd, cold, warm and with the OS's file cache purged
  # (.github/perf/launch.py). macOS: the bundle as release.yml makes it
  # (a perfharness build: it accepts the loopback fake), through
  # LaunchServices; Linux on Xvfb and Windows for reference. Each run's
  # startup timeline counts from the process's exec. Only when asked
  # (only=launch-speed, or one OS: launch-speed-mac, -linux, -windows).
  launch-speed-mac:
    if: ${{ inputs.only != '' && startsWith('launch-speed-mac', inputs.only) }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Clack.app (perfharness, made and signed as release.yml makes it) and fakeslackd
        run: |
          set -eu
          sw_vers; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          app="$RUNNER_TEMP/launch/Clack.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          CGO_ENABLED=1 go build -tags perfharness -trimpath -ldflags="-s -w" -o "$app/Contents/MacOS/clack" ./cmd/clack
          cp assets/icon/clack.icns "$app/Contents/Resources/clack.icns"
          sed "s/@VERSION@/0.0.1/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          printf 'APPL????' > "$app/Contents/PkgInfo"
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --deep --sign - --entitlements packaging/macos/Clack.entitlements "$app"
          codesign --verify --deep --strict "$app"
          ls -la "$app/Contents/MacOS"
          go build -o "$RUNNER_TEMP/launch/fakeslackd" ./internal/fakeslack/fakeslackd
      - name: plugins (the Library's ChatTabs and five Taut plugins)
        run: .github/perf/launch-library.sh "$RUNNER_TEMP/launch/library"
      - name: launch timeline (cold, warm x5, purged x2, inits, CPU profile, the Dock)
        run: python3 -I .github/perf/launch.py --app "$RUNNER_TEMP/launch/Clack.app" --fake "$RUNNER_TEMP/launch/fakeslackd" --out "$RUNNER_TEMP/launch/out" --library "$RUNNER_TEMP/launch/library" --warm 5 --purged 2 --extra --screenshot --theme --label macOS
      - name: the CPU profile's top (the first 3 s of a warm start)
        if: ${{ !cancelled() }}
        run: |
          f="$RUNNER_TEMP/launch/out/cpu-warm.pprof"
          [ -s "$f" ] && go tool pprof -top -nodecount=70 "$f" 2>&1 | head -85
          true
      # after the launches, so its film and the swift compile don't slow them
      - name: one bounce of the Dock's launch animation (bounce.sh, the budget's yardstick)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: .github/perf/bounce.sh "$RUNNER_TEMP/launch/out/bounce"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: launch-mac
          path: ${{ runner.temp }}/launch/out


  # ci's macos launch budget alone (.github/perf/launch-budget.sh), for a
  # quick round or a red run on an old commit: only=launch-budget
  launch-budget:
    if: ${{ inputs.only != '' && startsWith('launch-budget', inputs.only) }}
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: launch budget (Clack.app through LaunchServices, within one Dock bounce)
        run: .github/perf/launch-budget.sh "$RUNNER_TEMP/launch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: launch-budget
          path: ${{ runner.temp }}/launch/out

  launch-speed-linux:
    if: ${{ inputs.only != '' && startsWith('launch-speed-linux', inputs.only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps, Xvfb
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS xvfb libgl1-mesa-dri libegl-mesa0
      - name: clack (perfharness) and fakeslackd
        run: |
          set -eu
          nproc; free -m | head -2
          mkdir -p "$RUNNER_TEMP/launch"
          CGO_ENABLED=1 go build -tags perfharness -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/launch/clack" ./cmd/clack
          go build -o "$RUNNER_TEMP/launch/fakeslackd" ./internal/fakeslack/fakeslackd
      - name: plugins (the Library's ChatTabs and five Taut plugins)
        run: .github/perf/launch-library.sh "$RUNNER_TEMP/launch/library"
      - name: launch timeline (cold, warm x5, purged x2, inits, CPU profile)
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          Xvfb :98 -screen 0 1440x900x24 > /dev/null 2>&1 &
          for i in $(seq 1 50); do [ -e /tmp/.X11-unix/X98 ] && break; sleep 0.1; done
          DISPLAY=:98 python3 -I .github/perf/launch.py --app "$RUNNER_TEMP/launch/clack" --fake "$RUNNER_TEMP/launch/fakeslackd" --out "$RUNNER_TEMP/launch/out" --library "$RUNNER_TEMP/launch/library" --warm 5 --purged 2 --extra --theme --label "Linux (Xvfb, llvmpipe)"
      - name: the CPU profile's top (the first 3 s of a warm start)
        if: ${{ !cancelled() }}
        run: |
          f="$RUNNER_TEMP/launch/out/cpu-warm.pprof"
          [ -s "$f" ] && go tool pprof -top -nodecount=50 "$f" 2>&1 | head -65
          true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: launch-linux
          path: ${{ runner.temp }}/launch/out

  launch-speed-windows:
    if: ${{ inputs.only != '' && startsWith('launch-speed-windows', inputs.only) }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Clack.exe (perfharness) and fakeslackd
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/launch"
          go env CGO_ENABLED CC
          go build -tags perfharness -trimpath -ldflags="-s -w -H windowsgui" -o "$RUNNER_TEMP/launch/Clack.exe" ./cmd/clack
          go build -o "$RUNNER_TEMP/launch/fakeslackd.exe" ./internal/fakeslack/fakeslackd
      - name: plugins (the Library's ChatTabs and five Taut plugins)
        shell: bash
        run: .github/perf/launch-library.sh "$RUNNER_TEMP/launch/library"
      - name: launch timeline (cold, warm x5, inits, CPU profile)
        shell: bash
        run: python -I .github/perf/launch.py --app "$RUNNER_TEMP/launch/Clack.exe" --fake "$RUNNER_TEMP/launch/fakeslackd.exe" --out "$RUNNER_TEMP/launch/out" --library "$RUNNER_TEMP/launch/library" --warm 5 --extra --theme --label Windows
      - name: the CPU profile's top (the first 3 s of a warm start)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          f="$RUNNER_TEMP/launch/out/cpu-warm.pprof"
          [ -s "$f" ] && go tool pprof -top -nodecount=50 "$f" 2>&1 | head -65
          true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: launch-windows
          path: ${{ runner.temp }}/launch/out
