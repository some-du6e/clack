name: flake-check
# Runs the tests that used to flake (and failed releases on unrelated
# commits) 20 times each, so a timing assumption that creeps back shows up
# here instead of on a tag. Each was made deterministic; see the commit
# that added this workflow for the root causes:
#   TestDraftKeepsAttachedFiles (composer)   two drafts.create in flight
#   TestCreateChannel / ...Flow (core, ui)   boot's stars.list undoing a star;
#                                            waiting on a check not yet done
#   TestGalleryElementPayloads (blockkit)    clicking a block still loading
#   TestCameraUnsupported, TestHuddleShotsTiles (huddle)
#                                            pion logging after Leave
#   TestEmojiTooltip, TestInlineCodeDraws    EGL init racing other binaries
#   TestSlickViewMessageLoggerThreads        reading the plugin's view after
#                                            a fixed 300 ms
#   TestImageOnlySendFlow (composer)         an attached file's tile marked
#                                            uploading only once its upload
#                                            goroutine ran
#   TestSearchRecentsReadGroups (core)       boot's recents load and a forced
#                                            group's both loading (the flag
#                                            set inside the goroutine);
#                                            TestRecentsLoadOnce pins it
# and 2026-11-11's (the flakes-1111 job, 50 runs each under -race):
#   TestRealtimeSendEchoOneMessage (core)    boot's prefetch, queued behind
#                                            three others, refetching a
#                                            channel History had loaded and
#                                            wiping the echoed send
#   TestListEditRoundTrip (core)             not reproduced; it logs core's
#                                            state if it times out again
#                                            (diag_flakes_test.go)
#   TestChannelLeaveRejoin (ui)              the header copy resolved while a
#                                            member outliving the leave
#   TestEditRoundTrip (listview)             a third-star click on a 3-star
#                                            item sends a clear; core.List
#                                            cloning outside its lock
#   TestHuddleLoungeMusic (huddleui)         MusicPlaying is on before the
#                                            song is loaded
# and 2026-11-12's (flakes-1112, 50 runs each; each test now makes its race
# happen every run, so the old order fails 50 of 50):
#   TestChannelLeaveRejoin (ui)              reopened after the fake recorded
#                                            the leave, before its reply; the
#                                            leave's done went to Threads
#   TestHeaderTopicHoverCard (ui)            the header's conversations.info
#                                            stored the fake's topic over the
#                                            test's
#   TestAccountThemeWriteBack (ui)           core read before the reply;
#   TestSetPrefConcurrentKeepsEvery (core)   two pref writes at once kept one
#                                            (core.mergePrefs)
#   TestOLEFileDrop (windows)                the source's timed moves entered
#                                            at the second point when the drag
#                                            loop started late
# and flakes-1112b's (50 runs each, the race forced every run as above):
#   TestCloseToTrayWindow (ui, windows)      Gio's DestroyEvent comes from
#                                            WM_DESTROY, so Run returned up
#                                            to 3.4 ms before DestroyWindow
#                                            freed the HWND; the test now
#                                            waits for DestroyWindow to
#                                            return (a WH_GETMESSAGE hook)
#                                            and (a real bug) the fonts
#                                            loading after the window was
#                                            hidden: no frame took them and
#                                            drainIdle ran no posted work
#                                            and (a Gio bug, patch 14) a
#                                            wakeup queued while DestroyEvent
#                                            waited, delivered to nobody:
#                                            WM_DESTROY never returned
#   TestFakeScreenShare, TestFakeCamera      a keyframe (~350 KB at once)
#     (huddle)                               lost on loopback: the first, or
#                                            the one answering the fake's
#                                            PLI. The fake asked only once,
#                                            after 5 pictures, and had no
#                                            NACK; now it NACKs, asks when it
#                                            can't decode and asks again
#                                            until its PLI is answered
#   TestDetailsDMAddPeopleCustomHistory      the first-message read and the
#     (ui/views)                             preview both in flight; the
#                                            test wanted the read first
#   TestTodosKeysAndRealtimeLikeSlack        E's reload landed between the
#     (ui/views)                             test picking Delete's row and
#                                            the keys; the test's saved.list
#                                            put the completed to-do back
# and polish-1113c's (50 runs, the race forced every run; the old fault
# failed 50 of 50 in run 43502002431):
#   TestHeaderFacepileRetriesFailedRead (ui) the one-shot users/list fault
#                                            went to whichever read came
#                                            first: boot's open channel's
#                                            header read, sent after
#                                            waitReady, took it and the
#                                            test's channel read worked; the
#                                            fault now fails only that
#                                            channel's people read
#                                            (the server drops it)
# and polish-1113's (50 runs each, the race forced every run):
#   TestChannelLinkTargets (ui)              core's "names" event (a mention
#                                            or member named, boot's
#                                            usergroups) dropped the resolved
#                                            header of a channel outside the
#                                            sidebar until a new lookup
#                                            answered ("header conv <nil>");
#                                            the header now keeps its copy
#                                            while it's looked up again
# and flakes-1114's (50 runs, the race forced every run):
#   TestTaskbarWindow (ui, windows-shell)    core's count replaced the
#                                            test's just after a close hid
#                                            or minimized the window; the
#                                            new title went through Gio's
#                                            Configure, whose ShowWindow
#                                            brought the window back (a
#                                            real bug: Gio patch 20). The
#                                            test now changes the count
#                                            after each close and revive
# and flake-fix's (2026-11-14: first ci attempts that failed and passed
# on a rerun; the flake-fix-* jobs, each on two fresh runners):
#   TestTaskbarWindow (ui, windows-shell)    the "always" flash, posted from
#                                            notificationShown's goroutine
#                                            while the notification's wake-up
#                                            was still being handled, lost
#                                            its Invalidate on the minimized
#                                            window (no frames to cover it):
#                                            Gio patch 26; and Clack drained
#                                            posted work on wake-ups only,
#                                            though Gio hands an Invalidate's
#                                            wake-up out as any event
#   TestFocusAssistModes (desktop)           a Do not disturb switch crashed
#                                            WpnUserService just after an
#                                            AddAllowedApp, which was lost
#                                            without an error; the cache
#                                            check assumed it had worked
#   TestTitleBarWindow (ui, windows-applog)  close's hover red sampled at a
#                                            fixed 500 ms, mid-fade
#   TestHiddenTitleBarButtonsInput (gio)     frames stopped after a caption
#                                            button's pointer up: runLoop's
#                                            PeekMessage(PM_NOREMOVE) saw a
#                                            message GetMessage never gave,
#                                            and the thread waited there with
#                                            a frame due (Gio patch 27; the
#                                            sequence job's stall dump, 3 in
#                                            60 rounds); and the first hover
#                                            went to where the cursor was
#   TestTitleBarWindow (ui, the same step)   the same first hover, in a loop
#   TestQueuedLoadsDontParkGoroutines        the start order of 2000 loads
#     (imgcache)                             released at once is the
#                                            scheduler's; released one at a
#                                            time it is exact
#   TestStartWritesFileAndTail (applog)      Tail's 1 s wait for 300 queued
#                                            lines on Windows' disk (94 were
#                                            in), and the Fatal skipped Close:
#                                            TempDir couldn't remove the file
# and flake-fix-2's (2026-11-15: α.85's release; the race forced every run):
#   TestDetailsSendEmailsLikeSlack           the details' conversations.info
#     (ui/views)                             stored fakeslack's channel name
#                                            over the test's after the email
#                                            modal had kept the old one, so
#                                            the copied address and Slackbot's
#                                            prompt named another channel
#                                            than w.name(); newW13Env now
#                                            waits for that read. The test
#                                            holds it back 1 s and the
#                                            address's create until the
#                                            client stored it (the old order
#                                            fails every run)
#   TestDetailsCallButtonLikeSlack,          the same read against the call
#   TestDetailsCallMenuStartsCall (ui/views) tooltip's name
# Synthetic data only (internal/fakeslack, the fake Chime).
on:
  workflow_dispatch:
    inputs:
      count:
        description: "runs per test"
        required: false
        default: "20"
      only:
        description: "run only the jobs whose id starts with this (empty: all)"
        required: false
        default: ""
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run flake-check.yml --ref <branch>)
    paths:
      - ".github/workflows/flake-check.yml"
      - ".github/flake-count.sh"
      - "internal/ui/composer/drafts_sync.go"
      - "internal/ui/composer/draft_files_test.go"
      - "internal/ui/composer/attach.go"
      - "internal/ui/composer/image_send_test.go"
      - "internal/core/search_recents.go"
      - "internal/core/search_recents_test.go"
      - "internal/core/manage.go"
      - "internal/ui/views/activity_order.go"
      - "internal/ui/views/activity_order_test.go"
      - "internal/ui/views/activity_order_live_test.go"
      - "internal/ui/views/activity_order_reload_test.go"
      - "internal/ui/views/activity_order_reload_live_test.go"
      - "internal/fakeslack/activity_live.go"
      - "internal/core/create_test.go"
      - "internal/ui/create_channel_test.go"
      - "internal/ui/popups/create_channel.go"
      - "internal/ui/blockkit/elements_gallery_test.go"
      - "internal/huddle/session.go"
      - "internal/huddle/videosend_test.go"
      - "internal/ui/theme/pixeltest/**"
