name: flake-check
# Runs the tests that used to flake (and failed releases on unrelated
# commits) 20 times each, so a timing assumption that creeps back shows up
# here instead of on a tag. Each was made deterministic; see the commit
# that added this workflow for the root causes:
#   TestDraftKeepsAttachedFiles (composer)   two drafts.create in flight
#   TestCreateChannel / ...Flow (core, ui)   boot's stars.list undoing a star;
#                                            waiting on a check not yet done
#   TestGalleryElementPayloads (blockkit)    clicking a block still loading
#   TestCameraUnsupported, TestHuddleShotsTiles (huddle)
#                                            pion logging after Leave
#   TestEmojiTooltip, TestInlineCodeDraws    EGL init racing other binaries
#   TestSlickViewMessageLoggerThreads        reading the plugin's view after
#                                            a fixed 300 ms
#   TestImageOnlySendFlow (composer)         an attached file's tile marked
#                                            uploading only once its upload
#                                            goroutine ran
#   TestSearchRecentsReadGroups (core)       boot's recents load and a forced
#                                            group's both loading (the flag
#                                            set inside the goroutine);
#                                            TestRecentsLoadOnce pins it
# and 2026-11-11's (the flakes-1111 job, 50 runs each under -race):
#   TestRealtimeSendEchoOneMessage (core)    boot's prefetch, queued behind
#                                            three others, refetching a
#                                            channel History had loaded and
#                                            wiping the echoed send
#   TestListEditRoundTrip (core)             not reproduced; it logs core's
#                                            state if it times out again
#                                            (diag_flakes_test.go)
#   TestChannelLeaveRejoin (ui)              the header copy resolved while a
#                                            member outliving the leave
#   TestEditRoundTrip (listview)             a third-star click on a 3-star
#                                            item sends a clear; core.List
#                                            cloning outside its lock
#   TestHuddleLoungeMusic (huddleui)         MusicPlaying is on before the
#                                            song is loaded
# and 2026-11-12's (flakes-1112, 50 runs each; each test now makes its race
# happen every run, so the old order fails 50 of 50):
#   TestChannelLeaveRejoin (ui)              reopened after the fake recorded
#                                            the leave, before its reply; the
#                                            leave's done went to Threads
#   TestHeaderTopicHoverCard (ui)            the header's conversations.info
#                                            stored the fake's topic over the
#                                            test's
#   TestAccountThemeWriteBack (ui)           core read before the reply;
#   TestSetPrefConcurrentKeepsEvery (core)   two pref writes at once kept one
#                                            (core.mergePrefs)
#   TestOLEFileDrop (windows)                the source's timed moves entered
#                                            at the second point when the drag
#                                            loop started late
# and flakes-1112b's (50 runs each, the race forced every run as above):
#   TestCloseToTrayWindow (ui, windows)      Gio's DestroyEvent comes from
#                                            WM_DESTROY, so Run returned up
#                                            to 3.4 ms before DestroyWindow
#                                            freed the HWND; the test now
#                                            waits for DestroyWindow to
#                                            return (a WH_GETMESSAGE hook)
#                                            and (a real bug) the fonts
#                                            loading after the window was
#                                            hidden: no frame took them and
#                                            drainIdle ran no posted work
#                                            and (a Gio bug, patch 14) a
#                                            wakeup queued while DestroyEvent
#                                            waited, delivered to nobody:
#                                            WM_DESTROY never returned
#   TestFakeScreenShare, TestFakeCamera      the only keyframe lost (written
#     (huddle)                               before pion's SRTP was up) and
#                                            the fake asked for one only
#                                            after 5 pictures; it now asks
#                                            when it can't decode
#   TestDetailsDMAddPeopleCustomHistory      the first-message read and the
#     (ui/views)                             preview both in flight; the
#                                            test wanted the read first
#   TestTodosKeysAndRealtimeLikeSlack        E's reload landed between the
#     (ui/views)                             test picking Delete's row and
#                                            the keys; the test's saved.list
#                                            put the completed to-do back
#                                            (the server drops it)
# Synthetic data only (internal/fakeslack, the fake Chime).
on:
  workflow_dispatch:
    inputs:
      count:
        description: "runs per test"
        required: false
        default: "20"
      only:
        description: "run only the jobs whose id starts with this (empty: all)"
        required: false
        default: ""
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run flake-check.yml --ref <branch>)
    paths:
      - ".github/workflows/flake-check.yml"
      - ".github/flake-count.sh"
      - "internal/ui/composer/drafts_sync.go"
      - "internal/ui/composer/draft_files_test.go"
      - "internal/ui/composer/attach.go"
      - "internal/ui/composer/image_send_test.go"
      - "internal/core/search_recents.go"
      - "internal/core/search_recents_test.go"
      - "internal/core/manage.go"
      - "internal/core/create_test.go"
      - "internal/ui/create_channel_test.go"
      - "internal/ui/popups/create_channel.go"
      - "internal/ui/blockkit/elements_gallery_test.go"
      - "internal/huddle/session.go"
      - "internal/huddle/videosend_test.go"
      - "internal/ui/theme/pixeltest/**"
      - "internal/ui/messages/slick_test.go"
      - "internal/jsrt/loop.go"
      - "internal/taut/taut.go"
      - "internal/core/realtime_msgs_test.go"
      - "internal/core/lists_test.go"
      - "internal/ui/channels_audit_test.go"
      - "internal/ui/listview/render_test.go"
      - "internal/ui/huddleui/avprefs_test.go"
      - "internal/ui/exp_channels_test.go"
      - "internal/ui/theme_account_test.go"
      - "internal/core/prefs_merge_test.go"
      - "internal/core/reads.go"
      - "internal/fakeslack/faults.go"
      - "third_party/gioui.org/app/clack_drop_windows_test.go"
      - "third_party/gioui.org/app/os.go"
      - "internal/ui/runfromtray_windows_test.go"
      - "internal/ui/runfromtray.go"
      - "internal/ui/runfromtray_test.go"
      - "internal/huddle/fake_video.go"
      - "internal/huddle/share_test.go"
      - "internal/ui/views/details_w14_test.go"
      - "internal/ui/views/views_keys_test.go"

permissions:
  contents: read

env:
  COUNT: ${{ inputs.count || '20' }}
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config

jobs:
  go:
    if: ${{ !inputs.only || startsWith('go', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: core (create channel, stars/saved kept across the boot fetch)
        run: go test -race -count=$COUNT -run 'TestCreateChannel$|TestExtrasKeepEditsMadeMeanwhile$' ./internal/core
      - name: composer (files-only drafts)
        run: go test -race -count=$COUNT -run 'TestDraftKeepsAttachedFiles$' ./internal/ui/composer
      - name: blockkit (element payloads)
        run: go test -race -count=$COUNT -timeout 30m -run 'TestGalleryElementPayloads$' ./internal/ui/blockkit
      - name: ui (create channel flow)
        run: go test -count=$COUNT -timeout 30m -run 'TestCreateChannelFlow$' ./internal/ui
      - name: slow runner (one CPU)
        run: |
          go test -cpu 1 -count=$COUNT -run 'TestCreateChannel$|TestExtrasKeepEditsMadeMeanwhile$' ./internal/core
          go test -cpu 1 -count=$COUNT -run 'TestDraftKeepsAttachedFiles$' ./internal/ui/composer
          go test -cpu 1 -count=$COUNT -timeout 30m -run 'TestGalleryElementPayloads$' ./internal/ui/blockkit

  image-send:
    if: ${{ !inputs.only || startsWith('image-send', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: composer (an image sent on its own; its tile uploading from the first frame)
        run: go test -count=$COUNT -run 'TestImageOnlySendFlow$' ./internal/ui/composer
      - name: composer, race detector
        if: ${{ !cancelled() }}
        run: go test -race -count=$COUNT -run 'TestImageOnlySendFlow$' ./internal/ui/composer
      - name: composer, slow runner (one CPU)
        if: ${{ !cancelled() }}
        run: go test -cpu 1 -count=$COUNT -run 'TestImageOnlySendFlow$' ./internal/ui/composer

  search-recents:
    if: ${{ !inputs.only || startsWith('search-recents', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: core (recents loaded once, whichever trigger comes first)
        run: go test -count=$COUNT -run 'TestSearchRecentsReadGroups$|TestRecentsLoadOnce$' ./internal/core
      - name: core, race detector
        if: ${{ !cancelled() }}
        run: go test -race -count=$COUNT -run 'TestSearchRecentsReadGroups$|TestRecentsLoadOnce$' ./internal/core
      - name: core, slow runner (one CPU)
        if: ${{ !cancelled() }}
        run: go test -cpu 1 -count=$COUNT -run 'TestSearchRecentsReadGroups$|TestRecentsLoadOnce$' ./internal/core

  huddle:
    if: ${{ !inputs.only || startsWith('huddle', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps (internal/huddle's X11 screen share needs the headers)
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: huddle (no logging after Leave)
        run: go test -race -gcflags=all=-d=checkptr=0 -count=$COUNT -run 'TestCameraUnsupported$|TestNoLogAfterLeave$|TestFakeChime$' ./internal/huddle

  pixel:
    if: ${{ !inputs.only || startsWith('pixel', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS xvfb libgl1-mesa-dri libegl-mesa0
      - name: GPU tests (Mesa llvmpipe; packages in parallel, as in ci.yml before -p 1)
        env:
          CLACK_PIXEL_TESTS: "1"
          CLACK_SHOTS: ${{ runner.temp }}/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$CLACK_SHOTS"
          xvfb-run -a go test -count=$COUNT -run 'TestCodeSpanAfterEmoji|TestInlineCodeDraws|TestEmojiTooltip|TestReactionTooltipDraws|TestHuddleShotsTiles' \
            ./internal/ui/richview ./internal/ui/composer ./internal/ui/messages ./internal/ui/huddleui

  slick:
    if: ${{ !inputs.only || startsWith('slick', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        continue-on-error: true # GitHub release downloads sometimes 504 three times running
        with:
          bun-version: 1.4.4
      - name: bun from npm (setup-bun's download failed)
        if: steps.setup-bun.outcome == 'failure'
        run: |
          for i in 1 2 3; do npm install -g bun@1.4.4 && break; sleep 15; done
          bun --version
      - name: clone slick
        run: |
          git clone -q https://github.com/3kh0/slick /tmp/slick
          git -C /tmp/slick log --oneline -1
      - name: "install slick deps (no scripts)"
        working-directory: /tmp/slick
        run: bun install --frozen-lockfile --ignore-scripts
      - name: build every plugin with slick's build
        run: |
          set -o pipefail
          mkdir -p dist/slick-plugins
          node internal/slick/build/build.mjs /tmp/slick dist/slick-plugins 2>&1 | tail -5
          cp -r /tmp/slick/themes dist/slick-plugins/themes
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: MessageLogger threads (and the logger next to it)
        env:
          SLICK_PLUGINS_DIR: ${{ github.workspace }}/dist/slick-plugins
        run: |
          go test -count=$COUNT -timeout 30m -run 'TestSlickViewMessageLoggerThreads$|TestSlickViewMessageLogger$' ./internal/ui/messages
          go test -race -cpu 1 -count=$COUNT -timeout 30m -run 'TestSlickViewMessageLoggerThreads$' ./internal/ui/messages

  flakes-1111:
    if: ${{ !inputs.only || startsWith('flakes-1111', inputs.only) }}
    name: "flakes-1111 ${{ matrix.test }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: TestRealtimeSendEchoOneMessage
            pkg: ./internal/core
          - test: TestPrefetchSkipsLoadedWhileQueued # the echo flake's cause, every time
            pkg: ./internal/core
          - test: TestListEditRoundTrip
            pkg: ./internal/core
          - test: TestChannelLeaveRejoin
            pkg: ./internal/ui
          - test: TestEditRoundTrip
            pkg: ./internal/ui/listview
          - test: TestHuddleLoungeMusic
            pkg: ./internal/ui/huddleui
            flags: -gcflags=all=-d=checkptr=0 # pion under -race, as in the huddle job
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "${{ matrix.test }}, race detector, every run counted"
        env:
          TEST: ${{ matrix.test }}
          PKG: ${{ matrix.pkg }}
          FLAGS: ${{ matrix.flags }}
        run: |
          set +e
          log="$RUNNER_TEMP/flake.log"
          go test -v -race $FLAGS -count=$COUNT -timeout 60m -run "^${TEST}\$" "$PKG" > "$log" 2>&1
          rc=$?
          fails=$(grep -cE "^--- FAIL: ${TEST} \(" "$log")
          passes=$(grep -cE "^--- PASS: ${TEST} \(" "$log")
          echo "::notice title=${TEST}::${fails} of ${COUNT} runs failed (${passes} passed, exit ${rc})"
          # each failed run's own output (its last 150 lines), then any race reports
          awk -v run="=== RUN   ${TEST}" -v done="--- FAIL: ${TEST} (" -v ok="--- PASS: ${TEST} (" '
            $0 == run { n = 0; inrun = 1 }
            inrun { buf[n++ % 150] = $0 }
            index($0, done) == 1 { print "::group::failed run"; for (i = (n > 150 ? n - 150 : 0); i < n; i++) print buf[i % 150]; print "::endgroup::"; inrun = 0 }
            index($0, ok) == 1 { inrun = 0 }' "$log" | head -3000
          awk '/^WARNING: DATA RACE/,/^==================$/' "$log" | head -400
          tail -5 "$log"
          exit $rc

  flakes-1112:
    if: ${{ !inputs.only || startsWith('flakes-1112', inputs.only) }}
    name: "flakes-1112 ${{ matrix.test }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: TestChannelLeaveRejoin
            pkg: ./internal/ui
          - test: TestHeaderTopicHoverCard
            pkg: ./internal/ui
          - test: TestAccountThemeWriteBack
            pkg: ./internal/ui
          - test: TestSetPrefConcurrentKeepsEvery
            pkg: ./internal/core
          - test: TestListEditRoundTrip # not reproduced; its DIAG lines say why if it times out
            pkg: ./internal/core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "${{ matrix.test }}, race detector, every run counted"
        env:
          TEST: ${{ matrix.test }}
          PKG: ${{ matrix.pkg }}
        run: sh "$GITHUB_WORKSPACE/.github/flake-count.sh" -race

  flakes-1112-ole:
    if: ${{ !inputs.only || startsWith('flakes-1112-ole', inputs.only) }}
    name: "flakes-1112 TestOLEFileDrop (windows-applog)"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        late: ["0", "900"] # CLACK_OLE_LATE_START_MS: DoDragDrop held back, as on gap-w13's runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: "TestOLEFileDrop, drag loop late by ${{ matrix.late }} ms, every run counted"
        shell: bash
        env:
          CGO_ENABLED: "0" # as in ci's windows-applog (no -race without cgo)
          CLACK_WINDOWS_DROP_TESTS: "1"
          CLACK_OLE_LATE_START_MS: ${{ matrix.late }}
          TEST: TestOLEFileDrop
          PKG: gioui.org/app
        run: sh "$GITHUB_WORKSPACE/.github/flake-count.sh"

  flakes-1112b-tray:
    if: ${{ !inputs.only || startsWith('flakes-1112b-tray', inputs.only) }}
    name: "flakes-1112b TestCloseToTrayWindow (windows-applog)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: "TestCloseToTrayWindow, every run counted"
        shell: bash
        env:
          CGO_ENABLED: "0" # as in ci's windows-applog (no -race without cgo)
          CLACK_WINDOWS_TRAY_TESTS: "1"
          TEST: TestCloseToTrayWindow
          PKG: ./internal/ui
          FLAKE_TAIL: "300"
        run: sh "$GITHUB_WORKSPACE/.github/flake-count.sh"

  flakes-1112b-share:
    if: ${{ !inputs.only || startsWith('flakes-1112b-share', inputs.only) }}
    name: "flakes-1112b ${{ matrix.test }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: [TestFakeScreenShare, TestFakeCamera] # each loses its first keyframe at the fake every run
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps (internal/huddle's X11 screen share needs the headers)
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "${{ matrix.test }}, race detector, every run counted"
        env:
          TEST: ${{ matrix.test }}
          PKG: ./internal/huddle
        run: sh "$GITHUB_WORKSPACE/.github/flake-count.sh" -race -gcflags=all=-d=checkptr=0

  flakes-1112b-views:
    if: ${{ !inputs.only || startsWith('flakes-1112b-views', inputs.only) }}
    name: "flakes-1112b ${{ matrix.test }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: TestDetailsDMAddPeopleCustomHistory
            pkg: ./internal/ui/views
          - test: TestTodosKeysAndRealtimeLikeSlack
            pkg: ./internal/ui/views
          - test: TestDrainIdleRunsPosted # TestCloseToTrayWindow's posted work, on linux
            pkg: ./internal/ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "${{ matrix.test }}, race detector, every run counted"
        env:
          TEST: ${{ matrix.test }}
          PKG: ${{ matrix.pkg }}
        run: sh "$GITHUB_WORKSPACE/.github/flake-count.sh" -race
