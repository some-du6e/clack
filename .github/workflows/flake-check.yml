      - "third_party/gioui.org/app/window.go"
      # the emoji-anim job's own (its timing tests guard these)
      - "internal/imgcache/anim.go"
      - "internal/imgcache/imgcache.go"
      - "internal/imgcache/anim_test.go"
      - "internal/imgcache/explodes_test.go"
      - "internal/imgcache/livequiet_test.go"
      - "internal/ui/quiet.go"
