permissions:
  contents: read

env:
  COUNT: ${{ inputs.count || '20' }}
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config

# A newer run for the same branch, tag or PR cancels this one while it is
# queued or running, so stale pushes don't pile up in the shared queue.
# A dispatch with other inputs gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.count }}-${{ inputs.only }}
  cancel-in-progress: true

jobs:
  go:
    if: ${{ !inputs.only || startsWith('go', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: core (create channel, stars/saved kept across the boot fetch)
        run: go test -race -count=$COUNT -run 'TestCreateChannel$|TestExtrasKeepEditsMadeMeanwhile$' ./internal/core
      - name: composer (files-only drafts)
        run: go test -race -count=$COUNT -run 'TestDraftKeepsAttachedFiles$' ./internal/ui/composer
      - name: blockkit (element payloads)
        run: go test -race -count=$COUNT -timeout 30m -run 'TestGalleryElementPayloads$' ./internal/ui/blockkit
      - name: ui (create channel flow)
        run: go test -count=$COUNT -timeout 30m -run 'TestCreateChannelFlow$' ./internal/ui
      - name: slow runner (one CPU)
        run: |
          go test -cpu 1 -count=$COUNT -run 'TestCreateChannel$|TestExtrasKeepEditsMadeMeanwhile$' ./internal/core
          go test -cpu 1 -count=$COUNT -run 'TestDraftKeepsAttachedFiles$' ./internal/ui/composer
          go test -cpu 1 -count=$COUNT -timeout 30m -run 'TestGalleryElementPayloads$' ./internal/ui/blockkit

  # The video players' concurrency under the race detector (round 3's
  # review: Handle.loop's onEvent taking the controller's lock across the
  # UI goroutine, handle goroutines and time.AfterFunc unmounts, the
  # RangeSource's two GETs, the fake backend, Base.Emit/CloseEvents):
  # internal/media and videoplayer whole, then ui's video tests on the
  # fake backend. Dispatch with only=race-video (no other job's id starts
  # with "race-video", nor this one with "video").
  race-video:
    if: ${{ !inputs.only || startsWith('race-video', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: media and videoplayer under -race
        run: |
          n=$COUNT; [ "$n" -gt 3 ] && n=3
          go test -race -count=$n -timeout 30m ./internal/media/ ./internal/ui/videoplayer/
      - name: ui's video tests under -race (the fake backend)
        if: ${{ !cancelled() }}
        run: |
          n=$COUNT; [ "$n" -gt 3 ] && n=3
          go test -race -count=$n -timeout 40m -run '^TestVideo' ./internal/ui/

  # the members cache (store/members.go) and its unknown member fetcher
  # (core/members.go): eviction order, the pass's schedule, users/info's
  # chunks and pending ids, and every main view drawing its people again
  # after all but the viewer were evicted (one verbose run, then COUNT)
  members:
    if: ${{ !inputs.only || startsWith('members', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: store, core, slack (race detector)
        run: go test -race -count=$COUNT -run 'TestMembers|TestUnknownMembersFetched$' ./internal/store ./internal/core ./internal/slack
      - name: ui (evicted members drawn again in every main view)
        run: |
          go test -count=1 -v -timeout 20m -run 'TestEvictedMembersComeBack$' ./internal/ui
          go test -count=$COUNT -timeout 60m -run 'TestEvictedMembersComeBack$' ./internal/ui

  # members-tab: channel details' Members tab after someone joins or leaves
  # (core/membership_counts.go, views/details.go remountMembers): the tab's
  # count follows at once and a burst of joins reads users/counts at most
  # twice (2 s throttle); the list is fetched again when the tab is shown
  # again; the rows' names under display_real_names.
  members-tab:
    if: ${{ !inputs.only || startsWith('members-tab', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: views (the Members tab over fakeslack's rosters), one verbose run then COUNT
        run: |
          set +e
          rc=0
          go test -count=1 -v -timeout 10m -run '^TestMembersTab' ./internal/ui/views || rc=1
          go test -count=$COUNT -timeout 40m -run '^TestMembersTab' ./internal/ui/views || rc=1
          exit $rc

  image-send:
    if: ${{ !inputs.only || startsWith('image-send', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: composer (an image sent on its own; its tile uploading from the first frame)
        run: go test -count=$COUNT -run 'TestImageOnlySendFlow$' ./internal/ui/composer
      - name: composer, race detector
        if: ${{ !cancelled() }}
        run: go test -race -count=$COUNT -run 'TestImageOnlySendFlow$' ./internal/ui/composer
      - name: composer, slow runner (one CPU)
        if: ${{ !cancelled() }}
        run: go test -cpu 1 -count=$COUNT -run 'TestImageOnlySendFlow$' ./internal/ui/composer

  search-recents:
    if: ${{ !inputs.only || startsWith('search-recents', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: core (recents loaded once, whichever trigger comes first)
        run: go test -count=$COUNT -run 'TestSearchRecentsReadGroups$|TestRecentsLoadOnce$' ./internal/core
      - name: core, race detector
        if: ${{ !cancelled() }}
        run: go test -race -count=$COUNT -run 'TestSearchRecentsReadGroups$|TestRecentsLoadOnce$' ./internal/core
      - name: core, slow runner (one CPU)
        if: ${{ !cancelled() }}
        run: go test -cpu 1 -count=$COUNT -run 'TestSearchRecentsReadGroups$|TestRecentsLoadOnce$' ./internal/core

  # 2026-11-21's flakes, fixed on ci-speed: TestWarmWindowWritesSurviveBoot
  # (core) wrote before Boot's sections call reached the fake, so
  # MoveToSection's own reread was the call held; TestRailPeekDMsRowMenu
  # (ui) could end its 60 ms wait before the peek's throttled check ran;
  # TestSpellcheckNeverBlocksFrame (composer) timed frames on a shared
  # runner. COUNT runs each, as loaded runners ran them: core under -race,
  # composer on one CPU, ui in four processes at once
  flakes-1121:
    if: ${{ !inputs.only || startsWith('flakes-1121', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: core (writes on the warm window while Boot's answers are out), race detector
        run: go test -race -count=$COUNT -timeout 30m -run '^TestWarmWindowWritesSurviveBoot$' ./internal/core
      - name: composer (a slow spell engine never holds a frame), one CPU
        if: ${{ !cancelled() }}
        run: go test -cpu 1 -count=$COUNT -timeout 30m -run '^TestSpellcheckNeverBlocksFrame$' ./internal/ui/composer
      - name: ui (the DMs peek's row menu), four processes at once
        if: ${{ !cancelled() }}
        run: |
          go test -c -o "$RUNNER_TEMP/ui.test" ./internal/ui
          cd internal/ui
          pids=""
          for i in 1 2 3 4; do
            "$RUNNER_TEMP/ui.test" -test.paniconexit0 -test.count=$COUNT -test.timeout 30m -test.run '^TestRailPeekDMsRowMenu$' > "$RUNNER_TEMP/peek-$i.log" 2>&1 &
            pids="$pids $!"
          done
          rc=0
          i=0
          for p in $pids; do
            i=$((i + 1))
            wait "$p" || { rc=1; echo "== process $i failed"; tail -n 80 "$RUNNER_TEMP/peek-$i.log"; }
          done
          exit $rc

  # imgcache's decode memory (emoji-load-6): Copy image copies the
  # original however long it takes and its thumbnail only when the original
  # can't be decoded at all, the viewer shows the thumbnail for an original
  # past the decode memory, the GIF picker keeps to the small lane, and the
  # budget's waits (big slot, memory, contexts). Dispatch with
  # only=decode-memory; count=1 is enough (the slow-original test waits 9 s).
  decode-memory:
    if: ${{ !inputs.only || startsWith('decode-memory', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: popups (Copy image, the viewer, the GIF picker)
        run: go test -count=$COUNT -v -run '^(TestCopyImage|TestStandInReasons|TestLightboxShowsThumbnailForOverCapOriginal|TestGIFPicker)' ./internal/ui/popups
      - name: imgcache and its budget
        if: ${{ !cancelled() }}
        run: go test -count=$COUNT -v -run '^(TestBig|TestSmallLane|TestContextEndsWaits|TestFreeGivesBack|TestHeldBytesInCacheBudget|TestBusyRetryDoesntRefetch|TestPressureEndsInALoad|TestSustainedPressureNoEndlessSpinner)' ./internal/imgcache ./internal/imgcache/internal/budget

  # The animated custom emoji (:explodes:, Karim's "so choppy and laggy"
  # on α.98; branch emoji-anim-smooth): webptest.Explodes' frames on its
  # timeline under load (photos past the cache's budget), every size of one
  # image on one timeline, a slow window catching up, a player that
  # outlives a stalled frame, the loop count, live ImageOps and the images
  # a quiet frame draws again (imgcache); an animation tick drawn as a quiet
  # frame (the last frame's ops again, no layout) in the harness and on
  # App.Run's real X11 window (ui, Xvfb); and Gio patch 35: what a frame was
  # asked for (an Invalidate asks nothing; X11's window too), live images
  # through the renderer and on a real GPU context (llvmpipe), a replayed
  # frame's filters and key log. Every check holds however slow the runner
  # (they're against the timeline, not the clock); the imgcache step is
  # about 25 s a run, so 20 runs need the longer timeout. Dispatch with
  # only=emoji-anim (count=20 is the default).
  emoji-anim:
    if: ${{ !inputs.only || startsWith('emoji-anim', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps, Xvfb, Mesa llvmpipe, python-xlib
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS xvfb libgl1-mesa-dri libegl-mesa0 python3-xlib
      - name: imgcache (timeline, budget, stalls, loop count, live ops, quiet frames)
        run: go test -count=$COUNT -v -timeout 30m -run '^(TestExplodesPlaysOnTimeUnderLoad|TestAnimSizesShareTimeline|TestAnimCatchesUp|TestKeepingPlayerSurvivesStall|TestOffscreenGIFReleased|TestGIFLoopCount|TestAnimatedGIF|TestAnimWebPEmojiPlays|TestAnimationsOff|TestLargeGIFAnimatesAtDrawnSize|TestLiveOps|TestFrameRedrawnKeepsImagesFresh)$' ./internal/imgcache
      - name: ui (an animation tick is a quiet frame; a new member's motion default)
        if: ${{ !cancelled() }}
        run: go test -count=$COUNT -v -timeout 30m -run '^(TestAnimationTickIsQuiet|TestA11yNewUserDefaultsLikeSlack)$' ./internal/ui
      - name: ui on App.Run's real X11 window (quiet frames, Xvfb)
        if: ${{ !cancelled() }}
        env:
          CLACK_REAL_WINDOW_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          n=$COUNT; [ "$n" -gt 5 ] && n=5 # an App and a window each: 5 runs at most
          xvfb-run -a -s "-screen 0 1920x1080x24" go test -count=$n -v -timeout 30m -run '^TestRealWindowQuietFrames$' ./internal/ui
      - name: Gio patch 35 (what a frame was asked for, on X11 too; live images, a real GPU context; replayed frames)
        if: ${{ !cancelled() }}
        env:
          CLACK_X11_ASKED_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x1024x24" go test -count=$COUNT -v -timeout 30m -run '^(TestLiveImageOp|TestDrawOpsLiveImage|TestFrameEventAsked|TestFrameEventAskedX11|TestReplayKeepsFilters|TestReplayKeepsKeyLog|TestLiveImageFrames)$' gioui.org/op/paint gioui.org/gpu gioui.org/app gioui.org/io/input gioui.org/gpu/headless
      - name: richview (the custom emoji draws live)
        if: ${{ !cancelled() }}
        run: go test -count=$COUNT -v -run '^TestCustomEmojiAnimatedWebPDraws$' ./internal/ui/richview

  # huddle-polish (2026-11-19, Karim's α.112 huddle report): the static
  # (the transpiled libopus on a goroutine whose stack moves mid-call),
  # Test Speaker, the docked bar's states, the huddle window in your theme
  # (pictures) and the stylesheet tokens its theme shares with the main
  # window's
  huddle-polish:
    if: ${{ !inputs.only || startsWith('huddle-polish', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps, Xvfb and Mesa (internal/huddle's X11 screen share needs the headers)
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS xvfb libgl1-mesa-dri libegl-mesa0
      - name: "huddle: Opus frames don't depend on the caller's goroutine stack"
        if: ${{ !cancelled() }}
        run: go test -count=$COUNT -v -run '^(TestOpusDecodeIgnoresCallerStack|TestOpusEncodeIgnoresCallerStack|TestCodecGoroutineStackStill)$' ./internal/huddle
      - name: "huddle: Speaker picks (the output you're on plays until the new one is in; overlapping picks: the newest plays)"
        if: ${{ !cancelled() }}
        run: go test -race -gcflags=all=-d=checkptr=0 -count=$COUNT -v -run '^(TestOverlappingSpeakerPicks|TestSwitchAudio)$' ./internal/huddle
      - name: "huddleui: Test Speaker"
        if: ${{ !cancelled() }}
        run: go test -count=$COUNT -v -run '^(TestTestSpeakerIconLikeSlack|TestTestSpeakerKeepsTheMusic|TestSpeakerPickPlaysOnTheNewOutput|TestAudioSettingsMenu)$' ./internal/ui/huddleui
      - name: "huddleui: the docked bar's states (Slack's HuddleBottomBar rule)"
        if: ${{ !cancelled() }}
        run: go test -count=$COUNT -v -run '^(TestDockStatesLikeSlack|TestDockHiddenForAnExternalGuestLikeSlack|TestExternalGuestWindowFollowsYourTheme|TestDockFullAfterAnUnseenWindowLikeSlack)$' ./internal/ui/huddleui
      - name: "huddleui, theme: the toolbar's and the caption's inks in the chrome's scope (Slack's theme oracle)"
        if: ${{ !cancelled() }}
        run: |
          rc=0
          go test -count=$COUNT -v -run '^(TestHuddleToolbarInksLikeSlack|TestHuddleWindowCaptionReads)$' ./internal/ui/huddleui || rc=1
          go test -count=$COUNT -v -run '^(TestThemeInkMatchesSlack|TestIAThemeDefaultMatchesMeasured|TestThemeMappingPresetsAndPalettes)$' ./internal/ui/theme || rc=1
          exit $rc
      - name: "huddleui: the huddle window in your theme (Mesa llvmpipe)"
        if: ${{ !cancelled() }}
        env:
          CLACK_PIXEL_TESTS: "1"
          CLACK_SHOTS: ${{ github.workspace }}/dist/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a go test -count=$COUNT -v -run '^TestHuddleWindowFollowsYourTheme$' ./internal/ui/huddleui
      - name: "css: a stylesheet's root tokens resolved on several goroutines at once (the huddle windows share the main window's; plain and -race)"
        if: ${{ !cancelled() }}
        # each test in its own process: a crash in one (a fatal concurrent
        # map write, an index out of range) doesn't hide the other
        run: |
          rc=0
          for t in TestRootTokensConcurrentColor TestRootTokensConcurrentBackground; do
            go test -count=$COUNT -v -run "^$t\$" ./internal/ui/slackc/css || rc=1
            go test -race -count=$COUNT -v -run "^$t\$" ./internal/ui/slackc/css || rc=1
          done
          exit $rc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: huddle-polish-shots
          path: dist/shots
          if-no-files-found: ignore

  # and the docked bar after you close the huddle window, on a real
  # window (Xvfb here, the runner's desktop below)
  huddle-bar:
    if: ${{ !inputs.only || startsWith('huddle-bar', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps, Xvfb and Mesa
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS xvfb libgl1-mesa-dri libegl-mesa0
      - name: "huddleui: the bar after the huddle window closes"
        env:
          CLACK_HUDDLE_WINDOW_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a go test -count=$COUNT -v -run '^(TestDockAfterHuddleWindowCloses|TestDockAfterAnUnseenHuddleWindowCloses)$' ./internal/ui/huddleui

  huddle-bar-win:
    if: ${{ !inputs.only || startsWith('huddle-bar-win', inputs.only) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: "huddleui: the bar after the huddle window closes (WM_CLOSE)"
        shell: bash
        env:
          CGO_ENABLED: "0" # as in ci's windows-applog
          CLACK_HUDDLE_WINDOW_TESTS: "1"
        run: go test -count=$COUNT -v -run '^(TestDockAfterHuddleWindowCloses|TestDockAfterAnUnseenHuddleWindowCloses)$' ./internal/ui/huddleui
      - name: "ui: the main window draws the bar after the huddle window closes (WM_CLOSE)"
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CGO_ENABLED: "0"
          CLACK_HUDDLE_WINDOW_TESTS: "1"
          CLACK_REAL_WINDOW_TESTS: "1"
        run: go test -count=$COUNT -v -timeout 20m -run '^TestRealWindowHuddleBarAfterClose$' ./internal/ui

  huddle:
    if: ${{ !inputs.only || startsWith('huddle', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps (internal/huddle's X11 screen share needs the headers)
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: huddle (no logging after Leave)
        run: go test -race -gcflags=all=-d=checkptr=0 -count=$COUNT -run 'TestCameraUnsupported$|TestNoLogAfterLeave$|TestFakeChime$' ./internal/huddle

  pixel:
    if: ${{ !inputs.only || startsWith('pixel', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS xvfb libgl1-mesa-dri libegl-mesa0
      - name: GPU tests (Mesa llvmpipe; packages in parallel, as in ci.yml before -p 1)
        env:
          CLACK_PIXEL_TESTS: "1"
          CLACK_SHOTS: ${{ runner.temp }}/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$CLACK_SHOTS"
          xvfb-run -a go test -count=$COUNT -run 'TestCodeSpanAfterEmoji|TestInlineCodeDraws|TestEmojiTooltip|TestReactionTooltipDraws|TestHuddleShotsTiles' \
            ./internal/ui/richview ./internal/ui/composer ./internal/ui/messages ./internal/ui/huddleui

  # A plugin's Block Kit-style button row (OwlMode's Save in Taut and
  # Forget) as Slack lays it out and draws it: the row's flex rules, the
  # button's c-button box with what CSS sets on it, its icon and label
  # as a flex row; a composer.addButton toggle as Slack's composer
  # button; a plugin's ring round its ReactionBar's pills; and Taut's
  # OwlMode itself under (demo) Owl's DM confirmation; what a rule adds to
  # a Button's box (shadows, images, wide borders) and a plugin's own
  # button.c-button elements. Layout from the rects JS reads and
  # LayoutShape, and the pixels (Mesa llvmpipe).
  # Dispatch with only=owl-save.
  owl-save:
    if: ${{ !inputs.only || startsWith('owl-save', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: build Taut's OwlMode (the reviewed TAUT_PIN; GPLv3, never committed)
        env:
          TAUT_PIN: 6fe5123e3b4cffaa16c6dda71291ad5d82cdad37
        run: |
          git clone -q https://github.com/jeremy46231/taut /tmp/taut
          git -C /tmp/taut checkout -q "$TAUT_PIN"
          cd /tmp/taut && npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p "$GITHUB_WORKSPACE/dist/taut-plugins"
          npm run -s build:user-plugin -- plugins/OwlMode.tsx "$GITHUB_WORKSPACE/dist/taut-plugins/OwlMode.js"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # this job runs third-party code; never share its Go cache
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS xvfb libgl1-mesa-dri libegl-mesa0
      - name: "kit + messages: the row's layout and pixels (light and dark), OwlMode's own Save in Taut, the composer button, the reaction ring, COUNT runs"
        env:
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
          TAUT_PLUGINS_DIR: ${{ github.workspace }}/dist/taut-plugins
        run: |
          set +e
          rc=0
          xvfb-run -a go test -count=$COUNT -v -run '^(TestOwl|TestButtonCSS|TestPluginCButton)' ./internal/ui/slackc/kit || rc=1
          xvfb-run -a go test -count=$COUNT -v -run '^TestOwl' ./internal/ui/messages || rc=1
          xvfb-run -a go test -count=$COUNT -v -timeout 20m -run '^TestTautViewOwlSaveButton$' ./internal/ui || rc=1
          exit $rc

  slick:
    if: ${{ !inputs.only || startsWith('slick', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        continue-on-error: true # GitHub release downloads sometimes 504 three times running
        with:
          bun-version: 1.4.4
      - name: bun from npm (setup-bun's download failed)
        if: steps.setup-bun.outcome == 'failure'
        run: |
          for i in 1 2 3; do npm install -g bun@1.4.4 && break; sleep 15; done
          bun --version
      - name: clone slick
        run: |
          git clone -q https://github.com/3kh0/slick /tmp/slick
          git -C /tmp/slick log --oneline -1
      - name: "install slick deps (no scripts)"
        working-directory: /tmp/slick
        run: bun install --frozen-lockfile --ignore-scripts
      - name: build every plugin with slick's build
        run: |
          set -o pipefail
          mkdir -p dist/slick-plugins
          node internal/slick/build/build.mjs /tmp/slick dist/slick-plugins 2>&1 | tail -5
          cp -r /tmp/slick/themes dist/slick-plugins/themes
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # this job runs third-party code (Slick main); never share its Go cache
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: MessageLogger threads (and the logger next to it)
        env:
          SLICK_PLUGINS_DIR: ${{ github.workspace }}/dist/slick-plugins
        run: |
          go test -count=$COUNT -timeout 30m -run 'TestSlickViewMessageLoggerThreads$|TestSlickViewMessageLogger$' ./internal/ui/messages
          go test -race -cpu 1 -count=$COUNT -timeout 30m -run 'TestSlickViewMessageLoggerThreads$' ./internal/ui/messages

  # mention-pill-wrap: a mention pill that wraps, MentionProfiles' picture
  # at the start of its first line, in channel and thread rows: the rule
  # alone, a MentionProfiles-shaped plugin over Karim's patched
  # components, and Slick's own plugin (pill-wrap-shots artifact)
  pill-wrap:
    if: ${{ !inputs.only || startsWith('pill-wrap', inputs.only) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        continue-on-error: true # GitHub release downloads sometimes 504 three times running
        with:
          bun-version: 1.4.4
      - name: bun from npm (setup-bun's download failed)
        if: steps.setup-bun.outcome == 'failure'
        run: |
          for i in 1 2 3; do npm install -g bun@1.4.4 && break; sleep 15; done
          bun --version
      - name: clone slick
        run: |
          git clone -q https://github.com/3kh0/slick /tmp/slick
          git -C /tmp/slick log --oneline -1
      - name: "install slick deps (no scripts)"
        working-directory: /tmp/slick
        run: bun install --frozen-lockfile --ignore-scripts
      - name: build every plugin with slick's build
        run: |
          set -o pipefail
          mkdir -p dist/slick-plugins
          node internal/slick/build/build.mjs /tmp/slick dist/slick-plugins 2>&1 | tail -5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # this job runs third-party code (Slick main); never share its Go cache
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS xvfb libgl1-mesa-dri libegl-mesa0
      - name: wrapped mention pills in rows, COUNT runs
        env:
          SLICK_PLUGINS_DIR: ${{ github.workspace }}/dist/slick-plugins
          MESSAGES_AUDIT_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$MESSAGES_AUDIT_SHOTS_DIR"
          rc=0
          xvfb-run -a go test -count=$COUNT -timeout 30m -run '^(TestWrappedPill|TestPillPadding|TestPillPictureSlot|TestPillAfterAndEdges|TestPillEllipsisAfterPicture|TestPillBoundsHoldPictureLine|TestPillPictureInAlignedTable|TestCodeChip|TestColorSwatchAfterValue|TestMissingMemberBarBreaks|TestPillClampOpenEnd|TestTableCellWidthPerLine|TestPillClickRectHoldsPictureLine|TestPillEllipsisDrawsOverPill)' ./internal/ui/richview || rc=1
          xvfb-run -a go test -count=$COUNT -v -timeout 40m -run '^(TestWrappedMentionPictureInRows|TestSlickViewMentionProfilesWrap)$' ./internal/ui/messages || rc=1
          exit $rc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: pill-wrap-shots
          path: dist/shots

  flakes-1111:
    if: ${{ !inputs.only || startsWith('flakes-1111', inputs.only) }}
    name: "flakes-1111 ${{ matrix.test }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: TestRealtimeSendEchoOneMessage
            pkg: ./internal/core
          - test: TestPrefetchSkipsLoadedWhileQueued # the echo flake's cause, every time
            pkg: ./internal/core
          - test: TestListEditRoundTrip
            pkg: ./internal/core
          - test: TestChannelLeaveRejoin
            pkg: ./internal/ui
          - test: TestEditRoundTrip
            pkg: ./internal/ui/listview
          - test: TestHuddleLoungeMusic
            pkg: ./internal/ui/huddleui
            flags: -gcflags=all=-d=checkptr=0 # pion under -race, as in the huddle job
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: "${{ matrix.test }}, race detector, every run counted"
        env:
          TEST: ${{ matrix.test }}
          PKG: ${{ matrix.pkg }}
          FLAGS: ${{ matrix.flags }}
        run: |
          set +e
          log="$RUNNER_TEMP/flake.log"
          go test -v -race $FLAGS -count=$COUNT -timeout 60m -run "^${TEST}\$" "$PKG" > "$log" 2>&1
          rc=$?
          fails=$(grep -cE "^--- FAIL: ${TEST} \(" "$log")
          passes=$(grep -cE "^--- PASS: ${TEST} \(" "$log")
          echo "::notice title=${TEST}::${fails} of ${COUNT} runs failed (${passes} passed, exit ${rc})"
          # each failed run's own output (its last 150 lines), then any race reports
          awk -v run="=== RUN   ${TEST}" -v done="--- FAIL: ${TEST} (" -v ok="--- PASS: ${TEST} (" '
            $0 == run { n = 0; inrun = 1 }
            inrun { buf[n++ % 150] = $0 }
            index($0, done) == 1 { print "::group::failed run"; for (i = (n > 150 ? n - 150 : 0); i < n; i++) print buf[i % 150]; print "::endgroup::"; inrun = 0 }
            index($0, ok) == 1 { inrun = 0 }' "$log" | head -3000
          awk '/^WARNING: DATA RACE/,/^==================$/' "$log" | head -400
          tail -5 "$log"
          exit $rc

