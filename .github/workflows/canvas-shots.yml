name: canvas-shots
# Renders canvases from the fake server headlessly (full view, side panel,
# channel tab; light and dark; the whole kitchen-sink document; a live
# update; the header's section button under custom_file_sections; the
# comment stream and a comment thread) and uploads the screenshots.
# Synthetic only: nothing here talks
# to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run canvas-shots.yml --ref <branch>)
    paths:
      - "internal/canvas/**"
      - "internal/ui/canvasview/**"
      - "internal/fakeslack/canvas*"
      - "internal/fakeslack/canvases/**"
      - "internal/core/canvas*.go"
      - "internal/ui/icons/canvas*.go"
      - "internal/ui/file_section_button*.go"
      - "internal/ui/canvas_comments*.go"
      - "internal/ui/views/canvas_comments*.go"
      - "internal/ui/messages/thread_comment*.go"
      - ".github/workflows/canvas-shots.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  canvas-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: canvas screenshots
        env:
          CANVAS_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$CANVAS_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestRender|TestLiveUpdate|TestEdit|TestDefaultLine|TestAddCover|TestFocusSection|TestTitleEmoji|TestEmojiTrigger|TestSectionButton' ./internal/ui/canvasview/
          xvfb-run -a go test -count=1 -v -run 'TestCanvasEmojiSource|TestFileSectionHeaderWiring|TestCanvasComments' ./internal/ui/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: canvas-shots
          path: dist/shots
