name: slick
# Builds every plugin in Slick's src/plugins/ with Slick's own build
# (build:plugin's buildUserPlugin, or Slick's page build options for the
# first-party plugins build:plugin refuses, plus their main.ts halves; see
# internal/slick/build/build.mjs), uploads them as an artifact, and runs
# internal/slick's acceptance tests against them, unmodified. The built
# plugins are Slick's (GPLv3) and are never committed here. Taut's tests
# run too, since Slick shares Taut's runtime.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run slick.yml --ref <branch>)
    paths:
      - "internal/slick/**"
      - "internal/taut/**"
      - "internal/jsrt/**"
      - ".github/workflows/slick.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "slick git ref (branch, tag or sha); empty = SLICK_PIN"
        required: false
        default: ""
      run:
        description: "go test -run pattern for internal/slick (empty = every test)"
        required: false
        default: ""

# Slick is third-party code (GPLv3) built and run here: by default CI uses the
# reviewed commit SLICK_PIN; dispatch with ref=main (or any ref) to test upstream.
env:
  SLICK_PIN: f52d55dbd458feb0d6cd77136c6ab07c4a727a5a

permissions:
  contents: read

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        continue-on-error: true # GitHub release downloads sometimes 504 three times running
        with:
          bun-version: 1.4.4
      - name: bun from npm (setup-bun's download failed)
        if: steps.setup-bun.outcome == 'failure'
        run: |
          for i in 1 2 3; do npm install -g bun@1.4.4 && break; sleep 15; done
          bun --version
      - name: clone slick
        env:
          SLICK_REF: ${{ inputs.ref || env.SLICK_PIN }}
        run: |
          git clone -q https://github.com/3kh0/slick /tmp/slick
          case "$SLICK_REF" in -*|"") echo "bad slick ref: $SLICK_REF" >&2; exit 1;; esac
          git -C /tmp/slick checkout -q "$SLICK_REF"
          echo "SLICK_SHA=$(git -C /tmp/slick rev-parse HEAD)" >> "$GITHUB_ENV"
          git -C /tmp/slick log --oneline -1
      - name: "install slick deps (no scripts, so no electron download)"
        working-directory: /tmp/slick
        run: bun install --frozen-lockfile --ignore-scripts
      - name: build every plugin with slick's build
        run: |
          set -o pipefail
          mkdir -p dist/slick-plugins
          node internal/slick/build/build.mjs /tmp/slick dist/slick-plugins 2>&1 | tee dist/slick-build.log
          cp -r /tmp/slick/themes dist/slick-plugins/themes
          echo "$SLICK_SHA" > dist/slick-plugins/SLICK_SHA
          ls -la dist/slick-plugins
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: slick-plugins
          path: dist/slick-plugins
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # this job runs third-party code; never share its Go cache
      - name: gofmt
        run: test -z "$(gofmt -l internal/slick internal/taut | tee /dev/stderr)"
      - name: vet
        run: go vet ./internal/slick/... ./internal/taut/...
      - name: slick unit + acceptance tests
        env:
          SLICK_PLUGINS_DIR: ${{ github.workspace }}/dist/slick-plugins
          RUN: ${{ inputs.run }}
        run: |
          set -o pipefail
          go test -count=1 -timeout 20m -v ${RUN:+-run "$RUN"} ./internal/slick/... 2>&1 | tee dist/slick-test.log
      - name: acceptance summary
        if: ${{ !cancelled() }}
        run: |
          grep -E '^\s*--- (PASS|FAIL|SKIP)|^(ok|FAIL)\b|ACCEPT' dist/slick-test.log | tail -150 || true
      - name: taut tests still green (shared runtime)
        run: go test -count=1 -timeout 15m ./internal/taut/...
