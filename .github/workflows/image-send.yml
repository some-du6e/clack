name: image-send
# Sending a file or image with no text, step by step against Slack's web
# client (docs/FILES-AUDIT.md, "Sending files"): the eager upload and its
# processing wait, the placeholder row, the share's args, the swap to the
# shared message, the file title line, failure handling under injected
# faults, the composer after send; then screenshots of the composer tile,
# the placeholder and the final row, light and dark, rendered headlessly
# against internal/fakeslack. Synthetic only: nothing here talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run image-send.yml --ref <branch>)
    paths:
      - "internal/core/upload_send.go"
      - "internal/core/writes.go"
      - "internal/core/send.go"
      - "internal/fakeslack/drafts.go"
      - "internal/fakeslack/faults.go"
      - "internal/localimg/**"
      - "internal/imgcache/**"
      - "internal/fakeslack/gifs.go"
      - "internal/ui/richview/animated.go"
      - "internal/ui/gif_shots_test.go"
      - "internal/richtext/message.go"
      - "internal/ui/richview/filemeta.go"
      - "internal/ui/richview/pending.go"
      - "internal/ui/richview/blocks.go"
      - "internal/ui/composer/attach.go"
      - "internal/ui/composer/composer.go"
      - "internal/ui/composer/taut.go"
      - "internal/ui/messages/row.go"
      - "internal/ui/popups/file_upload_error.go"
      - "internal/ui/image_send_shots_test.go"
      - ".github/workflows/image-send.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb

permissions:
  contents: read

jobs:
  image-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: core, fakeslack, richview, composer
        run: |
          go test -count=1 -v -run 'TestImageOnlySendPlaceholder|TestImageSendAllUploaded|TestFileSendFailureRemovesPlaceholder|TestPrepareUploadPollsOffline|TestPlaceholderStatus|TestImageSendFaults|TestUploadProgressAndPrepared|TestUploadForInput|TestDraftFiles' ./internal/core/
          go test -count=1 -v -run 'TestFileMetaLine|TestFileImage|TestMediaGallery|TestVideoCard|TestAudioCard|TestGenericFileCard|TestSnippetCard|TestPillowGrid|TestAnimatedImageDrawnEveryFrame|TestStillPlayButtonAndExpand|TestAttachmentStillPlays' ./internal/ui/richview/
          go test -count=1 -v ./internal/imgcache/
          go test -count=1 -v -run 'TestFiles|TestAnimatedGIFFile' ./internal/richtext/
          xvfb-run -a go test -count=1 -v -run 'TestImageOnlySendFlow|TestImageSendFailurePutsFilesBack|TestDraftKeepsAttachedFiles|TestAttConcurrentAddFilesClear|TestSendOnModEnter' ./internal/ui/composer/
      - name: render
        run: xvfb-run -a go test -count=1 -v -timeout 10m -run 'TestImageSendShots$|TestFilesChannel$|TestGIFShots$' ./internal/ui/
      - name: screenshots
        env:
          IMAGE_SEND_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$IMAGE_SEND_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -timeout 15m -run 'TestImageSendShots$|TestGIFShots$' ./internal/ui/
          ls -la "$IMAGE_SEND_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: image-send-shots
          path: dist/shots
