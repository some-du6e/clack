name: messages-audit-shots
# Message rows against Slack (docs/MESSAGES-AUDIT.md): runs the audit's
# tests (labels, the reaction tooltip, the (edited) tooltip) and draws the
# rows it changed on the synthetic #release channel of
# internal/ui/messages/compact_shots_test.go (made-up people and messages,
# fakeslack's pictures), light and dark, headlessly through Gio's GPU
# renderer (Mesa llvmpipe): the thread pane with a pinned reply and a reply
# also sent to the channel, the reaction tooltip, skin-tone pills
# (getReactionGroups) with their group tooltip, "Pinned by" with its
# member link, message links (two
# message_mention slugs, a message unfurl card drawing its member, with and
# without "Underline links to websites") and link decorations (one
# underline per hovered link, the card's time and context hovers), and
# Later's labels on saved messages and to-dos with the toolbar's
# Complete to-do (gap-w7), and a hidden person's messages
# (HiddenMessageBody, Show anyway, HiddenUserAvatar; gap-w8)
# (messages-audit-shots artifact). Nothing here talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run messages-audit-shots.yml --ref <branch>)
    paths:
      - "internal/ui/messages/messages_audit_shots_test.go"
      - "internal/ui/messages/reaction_tip.go"
      - "internal/ui/messages/pin_icon.go"
      - "internal/ui/messages/row.go"
      - "internal/ui/messages/reaction_groups.go"
      - "internal/ui/messages/reaction_groups_test.go"
      - "internal/ui/messages/row_labels_test.go"
      - "internal/ui/messages/gap_shots_test.go"
      - "internal/ui/messages/huddle_msg.go"
      - "internal/ui/messages/huddle_msg_test.go"
      - "internal/ui/richview/tooltip.go"
      - "internal/ui/richview/msgcard.go"
      - "internal/ui/richview/decoration_test.go"
      - "internal/ui/messages/links_shots_test.go"
      - "internal/richtext/msgmention.go"
      - "internal/richtext/canvasslug*.go"
      - "internal/ui/richview/canvasslug*.go"
      - "internal/ui/richview/canvasfile*.go"
      - "internal/richtext/canvasfile.go"
      - "internal/fakeslack/canvas_file.go"
      - "internal/ui/messages/canvas_link_shots_test.go"
      - "internal/fakeslack/canvas_section.go"
      - "internal/ui/messages/actions_rules.go"
      - "internal/ui/messages/later_label_test.go"
      - "internal/ui/messages/later_shots_test.go"
      - "internal/ui/popups/actions_todo.go"
      - "internal/ui/popups/actions_todo_test.go"
      - "internal/core/saved_meta.go"
      - "internal/core/saved_meta_test.go"
      - "internal/ui/messages/hidden_msg.go"
      - "internal/ui/messages/hidden_msg_test.go"
      - "internal/core/chdetails.go"
      - "internal/core/hidden_users_test.go"
      - "internal/ui/popups/actions_share.go"
      - "internal/workobject/**"
      - "internal/richtext/workobject*.go"
      - "internal/ui/richview/workobject*.go"
      - "internal/ui/messages/workobjects.go"
      - "internal/ui/workobject*.go"
      - "internal/core/workobjects*.go"
      - "internal/fakeslack/workobjects.go"
      - ".github/workflows/messages-audit-shots.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  messages-audit-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS fonts-lato
      - name: audit tests and screenshots
        env:
          MESSAGES_AUDIT_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          CLACK_PIXEL_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          mkdir -p "$MESSAGES_AUDIT_SHOTS_DIR"
          go test -count=1 -v -run 'TestMessageMentionLabel|TestMessageUnfurlCard|TestCanvasSlug' ./internal/richtext
          go test -count=1 -v -run 'TestMemberName' ./internal/store
          go test -count=1 -v -run 'TestMessageKeepsEditor|TestSavedMeta|TestToggleTodoLikeSlack|TestUserHiddenLikeSlack|TestMentionsViewerDirectly|TestMentionsViewerInReply' ./internal/core
          xvfb-run -a go test -count=1 -v -run 'TestEditedTipLikeSlack|TestEditedLabel|TestEditedByTip|TestFullTimestamp|TestLinkUnderlineSpansSpaces|TestStyleDecorationSpansSpaces|TestMsgCardLinks|TestDecorationShots|TestSlugPillNotUnderlined|TestCanvasSlugClick|TestCanvasAnchorCard|TestCanvasFileCard' ./internal/ui/richview
          xvfb-run -a go test -count=1 -v -run 'TestToolbarThreadAndShareLikeSlack|TestContextMenuOnMessageBody|TestReactionTipText|TestReactionTooltipDraws|TestCSSReactionTooltip|TestReactionBarCollapseLikeSlack|TestRowHeightsMatchSlack|TestMessagesAuditShots|TestHuddleMessageRowLikeSlack|TestHuddleMessageShots|TestLinksShots|TestReactionGroup|TestEditedByLikeSlack|TestPinnedByMemberLink|TestMessagesAuditGapShots|TestLaterLabelLikeSlack|TestLaterLabelDraws|TestLaterLabelShots|TestHiddenSender|TestHiddenMessageMentionContents|TestHiddenSystem|TestHiddenJoinsSummaryLikeSlack|TestTombstoneColumnLikeSlack|TestCanvasLinkShots|TestCanvasFileShots' ./internal/ui/messages
          # the to-do and reminder rows (gap-w7)
          xvfb-run -a go test -count=1 -v -run 'TestTodoAndReminderLabelsLikeSlack|TestTodoActionClickToasts|TestTodoToastText|TestSaveRowLikeSlack|TestMessageContextMenuThreadAction' ./internal/ui/popups
          # work object cards and their flexpane (docs/MESSAGES-AUDIT.md, Work objects)
          go test -count=1 -v ./internal/workobject
          go test -count=1 -v -run 'TestWorkObject' ./internal/richtext ./internal/core
          xvfb-run -a go test -count=1 -v -run 'TestWorkObject' ./internal/ui/richview
          xvfb-run -a go test -count=1 -timeout 20m -v -run 'TestWorkObjectFlexpane' ./internal/ui
          ls -la "$MESSAGES_AUDIT_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: messages-audit-shots
          path: dist/shots
