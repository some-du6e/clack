name: composer-taut
# Builds Taut's plugins with Taut's own `build:user-plugin` (never committed:
# they're GPLv3) and runs the composer's plugin tests against them: typing,
# sends, pastes and live markup through the composer's real call sites, plus
# the no-plugin allocation checks and benchmarks.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run composer-taut.yml --ref <branch>)
    paths:
      - "internal/ui/composer/**"
      - "internal/taut/**"
      - "internal/jsrt/**"
      - ".github/workflows/composer-taut.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "taut git ref (branch, tag or sha); empty = TAUT_PIN"
        required: false
        default: ""

# Taut is third-party code (GPLv3) built and run here: by default CI uses the
# reviewed commit TAUT_PIN; dispatch with ref=main (or any ref) to test upstream.
env:
  TAUT_PIN: 6fe5123e3b4cffaa16c6dda71291ad5d82cdad37

permissions:
  contents: read

jobs:
  composer-taut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: clone taut
        env:
          TAUT_REF: ${{ inputs.ref || env.TAUT_PIN }}
        run: |
          git clone -q https://github.com/jeremy46231/taut /tmp/taut
          case "$TAUT_REF" in -*|"") echo "bad taut ref: $TAUT_REF" >&2; exit 1;; esac
          git -C /tmp/taut checkout -q "$TAUT_REF"
          git -C /tmp/taut log --oneline -1
      - name: install taut deps (no scripts)
        working-directory: /tmp/taut
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: build:user-plugin
        working-directory: /tmp/taut
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/taut-plugins"
          for name in SilentTyping InvisibleForward ClearURLs RealMarkdown AnonymizeFilenames NativeAtChannel; do
            f=$(ls plugins/$name.ts plugins/$name.tsx 2>/dev/null | head -1)
            npm run -s build:user-plugin -- "$f" "$GITHUB_WORKSPACE/dist/taut-plugins/$name.js"
          done
          ls -la "$GITHUB_WORKSPACE/dist/taut-plugins"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # this job runs third-party code; never share its Go cache
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config
      - name: composer plugin tests
        env:
          TAUT_PLUGINS_DIR: ${{ github.workspace }}/dist/taut-plugins
        run: go test -count=1 -timeout 10m -v -run 'TestTaut|TestRouting|TestSyncHooks|TestDraftIDs|TestAutocompleteRows' ./internal/ui/composer/
      - name: benchmarks (no plugins)
        run: go test -run '^$' -bench 'ThunkGuard|SendTyping|SyncHooks' -benchmem -benchtime 200000x ./internal/ui/composer/
