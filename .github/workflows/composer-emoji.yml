name: composer-emoji
# Unicode emoji in the composer and every text input: native emoji to
# emoji atoms (Slack's replaceNativeEmoji), the slot font + image overlay
# for widget.Editor fields, the Gio cluster-position patch, the ":"
# autocomplete's skin tone, the tofu scans, and screenshots (emoji images
# from Slack's public static emoji CDN, no cookie). Nothing here talks to
# Slack's API.
on:
  push:
    paths:
      - "internal/emoji/**"
      - "internal/ui/theme/editoremoji*"
      - "internal/ui/theme/emojislot*"
      - "internal/ui/theme/text.go"
      - "internal/ui/theme/theme.go"
      - "internal/ui/composer/**"
      - "internal/ui/popups/emoji_*"
      - "internal/ui/slackc/input.go"
      - "third_party/gioui.org/widget/index.go"
      - ".github/workflows/composer-emoji.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  composer-emoji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: emoji tests and tofu scans
        run: |
          go test -count=1 -v -run 'TestMatchUnicode' ./internal/emoji
          go test -count=1 -v -run 'TestEditorFont|TestThemeEditorEmoji|TestEmoji' ./internal/ui/theme
          go test -count=1 -v -run 'TestNativeEmoji|TestComposerEmojiNoTofu|TestEmojiMatchItemsTone|TestTyped|TestEmojiBlocks|TestBlocksRoundTrip' ./internal/ui/composer
          go test -count=1 -v -run 'TestSearchEmojiSkinTone' ./internal/ui/popups
      - name: screenshots (Mesa llvmpipe)
        env:
          EMOJI_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$EMOJI_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestComposerEmojiShots' ./internal/ui/composer
          ls -la "$EMOJI_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: composer-emoji-shots
          path: dist/shots
