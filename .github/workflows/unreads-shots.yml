name: unreads-shots
# Slack's Unreads view and channel join banner (docs/PREFS-AUDIT.md): runs
# their tests on internal/fakeslack's Unreads fixtures, headlessly through
# Gio's GPU renderer (Mesa llvmpipe), and uploads light and dark
# screenshots of each state (unreads-shots). Nothing here talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run unreads-shots.yml --ref <branch>)
    paths:
      - "internal/ui/views/unreads*.go"
      - "internal/ui/joinbanner.go"
      - "internal/ui/unreads_shots_test.go"
      - "internal/core/unreads.go"
      - "internal/fakeslack/unreads.go"
      - ".github/workflows/unreads-shots.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  unreads-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: tests and screenshots
        env:
          VIEWS_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          UNREADS_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          mkdir -p "$VIEWS_SHOTS_DIR"
          xvfb-run -a go test -p 1 -count=1 -v -run 'TestUnreads' ./internal/ui/views
          xvfb-run -a go test -p 1 -count=1 -v -run 'TestUnreadsSidebarLink|TestJoinBanner|TestPrefsPagesMatchSlack|TestPrefsAuditAppliedRoundTrip$' ./internal/ui
          ls -la "$VIEWS_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: unreads-shots
          path: dist/shots
