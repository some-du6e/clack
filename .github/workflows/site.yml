name: site
# Clack's website (site/, see site/README.md). Two builds, each held to every
# budget:
#   - snapshot: the committed data/ (what this commit's page says)
#   - newest: data/ fetched again from GitHub (the newest complete release,
#     the plugin Library), built with --pages the way site-pages.yml builds
#     what it deploys (site-pages.yml runs these same checks on its build)
# The budgets:
#   - tools/check.mjs: index.html, with all of its CSS and JS inlined, is at
#     most 30 KB gzipped; nothing loads from another host; the one font is
#     the local subset and covers every heading character; every local file
#     exists; images have alt, width and height and are lazy below the hero;
#     the build is indexable, with a sitemap, a canonical link and CNAME
#   - tools/weigh.mjs: headless Chrome loads the page from a gzip server on
#     127.0.0.1 on desktops, a tablet and phones, scrolls to the bottom and
#     adds up the bytes: at most 300 KB a visit with the font, one font, no
#     request off 127.0.0.1, and nothing wider than the window (it first
#     proves that check catches a page that's too wide)
#   - Lighthouse CI on the home page and the 404 page, mobile and desktop,
#     three runs each: performance >= 99 (median run), accessibility 100,
#     FCP, LCP, TBT and CLS budgets, total bytes, no third-party, script or
#     stylesheet requests, one font; SEO on the home page only (the 404 page
#     is noindex on purpose)
# The demo job builds the web demo (cmd/clack-web: Clack on Gio's js/wasm
# target with the fake workspace in the page, served at /demo/), here and
# never on a dev machine, and drives it in headless Chrome. A push that
# touches only the demo's Go side runs it alone (the changes job).
# The compare job puts this build beside an earlier commit's (SITE_BEFORE):
# the same sections at the same widths, before and after, in the
# site-before-after artifact (tools/shots.mjs). It holds nothing to a
# budget; an empty SITE_BEFORE skips it.
# Static pages only: nothing here talks to Slack or deploys anything.
on:
  push:
    paths:
      - "site/**"
      - "assets/icon.svg"
      - "internal/pluginlib/compat.go"
      - ".github/workflows/site.yml"
      # the web demo: Clack's Go side
      - "cmd/clack-web/**"
      - "internal/**"
      - "third_party/**"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - "site/**"
      - "assets/icon.svg"
      - "internal/pluginlib/compat.go"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # site=true when this push touched the page itself (or it isn't a push)
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          site=true
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD > changed.txt
            cat changed.txt
            grep -qE '^(site/|assets/icon\.svg$|internal/pluginlib/compat\.go$|\.github/workflows/site\.yml$)' changed.txt || site=false
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"

  budget:
    needs: changes
    if: ${{ needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [snapshot, newest]
    name: budget (${{ matrix.source }})
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # sharp is an optional dependency for tools/images.mjs only
      - name: tools (Lighthouse CI)
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE: ${{ matrix.source }}
        run: |
          if [ "$SOURCE" = newest ]; then node build.mjs --refresh --strict --pages; else node build.mjs --strict --pages; fi
      - name: static checks
        run: node tools/check.mjs --production --pages
      - name: page weight in headless Chrome
        if: ${{ !cancelled() }}
        run: node tools/weigh.mjs
      - name: Lighthouse, mobile
        if: ${{ !cancelled() }}
        run: ./node_modules/.bin/lhci autorun --config=lighthouserc.json
      - name: Lighthouse, desktop
        if: ${{ !cancelled() }}
        run: ./node_modules/.bin/lhci autorun --config=lighthouserc.desktop.json
      - name: Lighthouse scores
        if: ${{ !cancelled() }}
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          python3 -I - "$GITHUB_STEP_SUMMARY" "$SOURCE" <<'EOF'
          import json, glob, sys
          rows = []
          for preset in ("mobile", "desktop"):
              for f in sorted(glob.glob(f"lhci/{preset}/*.report.json")):
                  r = json.load(open(f))
                  c, a = r["categories"], r["audits"]
                  page = r["finalDisplayedUrl"].split("/", 3)[-1] or "/"
                  rows.append(f"| {preset} | /{page.lstrip('/')} | " + " | ".join(str(round((c[k]["score"] or 0) * 100)) for k in ("performance", "accessibility", "best-practices", "seo"))
                              + " | " + " | ".join(a[k].get("displayValue", "") for k in ("first-contentful-paint", "largest-contentful-paint", "total-blocking-time", "cumulative-layout-shift", "total-byte-weight")) + " |")
          out = [f"### Lighthouse ({sys.argv[2]})", "", "| preset | page | perf | a11y | best practices | SEO | FCP | LCP | TBT | CLS | bytes |", "|---|---|---|---|---|---|---|---|---|---|---|", *rows, ""]
          open(sys.argv[1], "a").write("\n".join(out) + "\n")
          print("\n".join(out))
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: site-${{ matrix.source }}
          path: |
            site/dist
            site/weigh
            site/lhci

  compare:
    needs: changes
    if: ${{ needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    env:
      # round 2 of the site, the build getclack.club went live with
      SITE_BEFORE: 1608949c0e8fcca26536c00609f3b3174a21d3a7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ env.SITE_BEFORE != '' }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: ${{ env.SITE_BEFORE != '' }}
        with:
          node-version: 24
      - name: both builds
        if: ${{ env.SITE_BEFORE != '' }}
        run: |
          git fetch --no-tags --depth=1 origin "$SITE_BEFORE"
          git worktree add --detach "$RUNNER_TEMP/before" "$SITE_BEFORE"
          node "$RUNNER_TEMP/before/site/build.mjs" --strict --pages --out "$RUNNER_TEMP/before-dist"
          node site/build.mjs --strict --pages
      - name: before and after
        if: ${{ env.SITE_BEFORE != '' }}
        run: node site/tools/shots.mjs --before "$RUNNER_TEMP/before-dist" --after site/dist --out site/shots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ env.SITE_BEFORE != '' && !cancelled() }}
        with:
          name: site-before-after
          path: site/shots

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: the in-memory wiring (memnet, demo.StartInMemory)
        run: |
          go test -count=1 ./internal/memnet/
          go test -count=1 -v -run '^TestInMemory$' ./internal/demo/
      - name: the site, with the demo's page
        working-directory: site
        run: node build.mjs --strict --pages
      - name: the demo's program (GOOS=js GOARCH=wasm)
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w -X main.version=$(git rev-parse --short HEAD)" -o site/dist/demo/main.wasm ./cmd/clack-web
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" site/dist/demo/
          node site/tools/demo-size.mjs site/dist/demo "$(git rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: static checks, with the demo
        working-directory: site
        run: node tools/check.mjs --production --pages --demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: site-demo
          path: site/dist/demo
          if-no-files-found: ignore
