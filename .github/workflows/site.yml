name: site
# Clack's website (site/, see site/README.md). Builds it from the committed
# snapshots and holds it to its "loads instantly" budgets:
#   - tools/check.mjs: index.html, with all of its CSS and JS inlined, is at
#     most 30 KB gzipped; nothing loads from another host; every local file
#     the pages name exists; images have alt, width and height and are lazy
#     below the hero
#   - tools/weigh.mjs: headless Chrome loads the page from a gzip server on
#     127.0.0.1 at desktop 1x and 2x and on phones, light and dark, scrolls
#     to the bottom and adds up the bytes: at most 300 KB a visit, no
#     request off 127.0.0.1, no sideways scroll
#   - Lighthouse CI, mobile and desktop, three runs each: performance >= 99
#     (median run), accessibility 100, FCP, LCP, TBT and CLS budgets, total
#     bytes, no third-party, font, script or stylesheet requests
# Then it rebuilds from the newest release and Library index (what the
# Pages deploy does) and checks that too. Static pages only: nothing here
# talks to Slack, and nothing is deployed.
on:
  push:
    paths:
      - "site/**"
      - "assets/icon.svg"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "assets/icon.svg"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # sharp is an optional dependency for tools/images.mjs only
      - name: tools (Lighthouse CI)
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: build
        run: node build.mjs --strict
      - name: static checks
        run: node tools/check.mjs
      - name: page weight in headless Chrome
        if: ${{ !cancelled() }}
        run: node tools/weigh.mjs
      - name: Lighthouse, mobile
        if: ${{ !cancelled() }}
        run: ./node_modules/.bin/lhci autorun --config=lighthouserc.json
      - name: Lighthouse, desktop
        if: ${{ !cancelled() }}
        run: ./node_modules/.bin/lhci autorun --config=lighthouserc.desktop.json
      - name: Lighthouse scores
        if: ${{ !cancelled() }}
        run: |
          python3 -I - "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, glob, sys
          rows = []
          for preset in ("mobile", "desktop"):
              for f in sorted(glob.glob(f"lhci/{preset}/*.report.json")):
                  r = json.load(open(f))
                  c, a = r["categories"], r["audits"]
                  rows.append(f"| {preset} | " + " | ".join(str(round((c[k]["score"] or 0) * 100)) for k in ("performance", "accessibility", "best-practices", "seo"))
                              + " | " + " | ".join(a[k]["displayValue"] for k in ("first-contentful-paint", "largest-contentful-paint", "total-blocking-time", "cumulative-layout-shift", "total-byte-weight")) + " |")
          out = ["### Lighthouse", "", "| preset | perf | a11y | best practices | SEO | FCP | LCP | TBT | CLS | bytes |", "|---|---|---|---|---|---|---|---|---|---|", *rows, ""]
          open(sys.argv[1], "a").write("\n".join(out) + "\n")
          print("\n".join(out))
          EOF
      - name: build from the newest release (what the Pages deploy runs)
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node build.mjs --refresh --strict --out "$RUNNER_TEMP/site-newest" && node tools/check.mjs "$RUNNER_TEMP/site-newest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: site
          path: |
            site/dist
            site/weigh
            site/lhci
