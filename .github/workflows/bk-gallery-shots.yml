name: bk-gallery-shots
# Block Kit layout: the richtext/richview/fakeslack unit tests, then the
# blockkit-gallery channel (internal/fakeslack gallery*.go, every block and
# variant) rendered headlessly at 1440x900 in light and dark, top to
# bottom, plus the "Show more" thread. Synthetic only: nothing here talks
# to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run bk-gallery-shots.yml --ref <branch>)
    paths:
      - "internal/richtext/**"
      - "internal/ui/richview/**"
      - "internal/ui/blockkit/**"
      - "internal/fakeslack/gallery*"
      - "internal/ui/bk_gallery_test.go"
      - "internal/ui/messages/row.go"
      - ".github/workflows/bk-gallery-shots.yml"
  workflow_dispatch:
    inputs:
      expect_fail:
        description: "proof runs: the tests that must fail, comma-separated (TestA,TestB/sub); the run passes only if each fails and nothing else does (docs/CI-SPEED.md, Proof runs)"
        required: false
        default: ""

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb

permissions:
  contents: read

# A newer run for the same branch, tag or PR cancels this one while it is
# queued or running, so stale pushes don't pile up in the shared queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: 1.5 x p95 (3.5 min) + 3, docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/expect-fail
        with:
          tests: ${{ inputs.expect_fail }}
          leg: ${{ github.job }}-${{ strategy.job-index }}
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: block kit unit tests
        run: go test -count=1 ./internal/richtext ./internal/fakeslack ./internal/ui/richview ./internal/ui/blockkit
      - name: gallery screenshots
        env:
          BK_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$BK_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestBlockKitGallery$' ./internal/ui/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: bk-gallery-shots
          path: dist/shots
      - if: ${{ always() && env.XF_ID }}
        uses: ./.github/actions/expect-fail-report

  # expect_fail's verdict across the jobs (docs/CI-SPEED.md, "Proof runs"):
  # every listed test failed in some job and passed in none, nothing else
  # failed, every job that ran succeeded. Proof runs only. A new job goes
  # in its needs (tools/expectfail's TestWorkflowsWireExpectFail says so).
  expect-fail:
    needs:
      - gallery
    if: ${{ always() && inputs.expect_fail != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10 # budget, min (a checkout, setup-go and the check)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: tools/expectfail
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: expect-fail-*
          path: ${{ runner.temp }}/xf
      - name: every listed test failed, nothing else did
        env:
          EXPECT_FAIL: ${{ inputs.expect_fail }}
          NEEDS: ${{ toJSON(needs) }}
        run: go run ./tools/expectfail -check "$RUNNER_TEMP/xf"
