name: at-channel
# @channel / @here / @everyone: Slack's permission, large-channel and
# channel-pref checks and the "Notify N people?" confirmation, against
# fixtures and internal/fakeslack, plus the dialog rendered headlessly
# (light and dark) and saved as screenshots. Synthetic only: nothing here
# talks to Slack.
on:
  push:
    paths:
      - "internal/core/broadcast*.go"
      - "internal/core/teamprefs.go"
      - "internal/ui/composer/broadcast*.go"
      - "internal/ui/popups/modal.go"
      - "internal/fakeslack/**"
      - ".github/workflows/at-channel.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  at-channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: core rules
        run: go test -count=1 -v -run 'TestBroadcast|TestProhibitedBroadcast|TestLoadBroadcastPerms|TestStopChannelMentions|TestShouldWarnBroadcast|TestWarnKeyword|TestTeamPref|TestLocalEphemeral' ./internal/core
      - name: composer sends and the dialog
        env:
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
          BROADCAST_SHOTS_DIR: ${{ github.workspace }}/dist/shots
        run: |
          mkdir -p "$BROADCAST_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestBroadcast' ./internal/ui/composer
          ls -l "$BROADCAST_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: at-channel-shots
          path: dist/shots
