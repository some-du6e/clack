name: bench-css
on:
  push:
    branches: [taut-ui-css]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: css tests
        run: go test -count=1 ./internal/ui/slackc/css/
      - name: css benchmarks
        run: go test -run XXX -bench . -benchmem ./internal/ui/slackc/css/
