name: feel-shots
# The sidebar's top links (Drafts & sent's badges) and the empty channel
# composer, unfocused and focused, light and dark, at Slack's 1440x900
# with a 328px sidebar, rendered headlessly over an offline core
# (TestFeelShots), plus palette.json with the colours they were drawn
# with; and the inspect tool's outline and report image (TestInspectShots,
# over internal/fakeslack). Synthetic only: nothing here talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run feel-shots.yml --ref <branch>)
    paths:
      - "internal/ui/sidebar.go"
      - "internal/ui/feel_shots_test.go"
      - "internal/ui/icons/**"
      - "internal/ui/theme/**"
      - "internal/ui/composer/chrome*.go"
      - "internal/ui/inspect/**"
      - "internal/ui/inspect_wire.go"
      - "internal/ui/inspect_test.go"
      - ".github/workflows/feel-shots.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb

permissions:
  contents: read

jobs:
  feel-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: screenshots
        env:
          FEEL_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$FEEL_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestFeelShots$' ./internal/ui/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: feel-shots
          path: dist/shots
      # The inspect tool (internal/ui/inspect, a Clack developer shortcut):
      # its outline and label over a reaction pill and the image a pick
      # copies (the window with the pill outlined over the redacted
      # report), light and dark, through the real headless capture.
      - name: inspect tool shots
        if: ${{ !cancelled() }}
        env:
          INSPECT_SHOTS_DIR: ${{ github.workspace }}/dist/inspect-shots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$INSPECT_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestInspectShots$|TestComposeOutlineAndPanel$' ./internal/ui/ ./internal/ui/inspect/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: inspect-shots
          path: dist/inspect-shots
