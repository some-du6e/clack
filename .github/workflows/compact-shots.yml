name: compact-shots
# Messages & media > Theme > Compact (messages_theme "dense"): runs the
# Compact geometry, live-toggle and row tests, draws a synthetic #release
# channel and one of its threads (internal/ui/messages/compact_shots_test.go:
# made-up people and messages, fakeslack's pictures) in Clean and Compact,
# light and dark, and builds side-by-sides against the same rows in Slack's
# markup under Slack's shipping CSS (client-boot-styles, the public CDN file)
# and design tokens (.github/scripts/compact_ref.py), then measures every row
# of Slack's markup in Chrome and fails when Clack's row (or the table
# TestRowHeightsMatchSlack holds it to) is more than 1px off. Nothing here talks to
# Slack's API or opens the Slack client.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run compact-shots.yml --ref <branch>)
    paths:
      - "internal/ui/messages/**"
      - "internal/ui/richview/view.go"
      - "internal/ui/richview/flow.go"
      - "internal/ui/richview/blocks.go"
      - "internal/ui/uipref/**"
      - "internal/ui/prefs_theme.go"
      - ".github/scripts/compact_ref.py"
      - ".github/workflows/compact-shots.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  compact-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS fonts-lato
      - name: Compact and Clean geometry, idle, fling and scroll-gap tests
        run: |
          go test -count=1 -v -run 'TestCompact|TestRowHeightsMatchSlack|TestMessageGeometry|TestIdle|TestFling|TestPrependKeeps|TestChannelNameArrives|TestRowLayoutAllocs' ./internal/ui/messages
          go test -count=1 -v -run 'TestLeadFirstLine|TestEditedLabel' ./internal/ui/richview
      - name: channel and thread screenshots
        env:
          COMPACT_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          CLACK_PIXEL_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          mkdir -p "$COMPACT_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestCompactShots$' ./internal/ui/messages
          ls "$COMPACT_SHOTS_DIR"
      - name: side-by-sides with Slack's CSS; row heights against Chrome's
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p /tmp/slack-ref
          curl -sfL --compressed --retry 5 -o /tmp/slack-ref/client-boot-styles.css https://a.slack-edge.com/bv1-13-br/client-boot-styles.cf726c4f2eaecc74.min.css
          curl -sfL --retry 5 -o /tmp/slack-ref/icons.json https://raw.githubusercontent.com/IzieStratt/slack-datamine-plus/main/build/icons.json
          python3 .github/scripts/compact_ref.py dist/shots /tmp/slack-ref/client-boot-styles.css internal/ui/slackc/css/slackvars.go /tmp/slack-ref/icons.json internal/ui/messages/testdata/slack-row-heights.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: compact-shots
          path: dist/shots
