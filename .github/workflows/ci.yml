      # tool's freeze of a message body's and a sidebar heading's hovers
      - name: the inspect freeze's pointer reset (Gio patch 49, fakeslack)
        if: ${{ !cancelled() }}
        shell: bash # every go test counts (pwsh steps fail only on the last command)
        env:
          CGO_ENABLED: "0"
        run: |
          rc=0
          go test -count=1 -v -run '^(TestResetPointers|TestHoverResetPointers)$' gioui.org/io/input gioui.org/gesture || rc=1
          go test -count=1 -v -timeout 10m -run '^TestInspectFreezeResetsHover$' ./internal/ui || rc=1
          exit $rc
      # Karim's 2026-11-18 reports came from Windows (α.108, 1918x1080 at
      # 1x): the inspect tool's review drawn in the frame after the pick's at
      # 1918x1080 at 1x and 2x on the headless GPU (WARP), each capture's
      # stage times logged; Enter and Esc in the pick's frame; the shots'
      # GPU made as a session starts and let go of after its shot; captures
      # copied in order; the picker inside popups (a Block Kit modal and its
