      # tried again, the window alive; the screens' sleep stops frames
      # until their wake or a click; each wake and sleep is in the log.
      - name: macOS wake, sleep and occlusion (Gio patch 32)
        if: ${{ !cancelled() }}
        env:
          CLACK_MACOS_WINDOW_TESTS: "1"
        run: go test -count=1 -v -timeout 10m -run '^(TestOccludedWindowPausesMac|TestNoDrawableSkipsFrameMac|TestScreensSleepWakeMac)$' gioui.org/app
      # A notification's click (Karim, α.89: "the thing to hop to the
      # desired message when clicking a notif doesn't work"): App.Run's
      # window comes forward (shown after a close hid it, restored from the
      # Dock after a minimize, key, the app active) and opens the message,
      # highlighted, or a reply's thread at the reply, from another
      # conversation. First with notify_mac_test.go's fake center, then from
      # a test Clack.app through the real UNUserNotificationCenter, the
      # click being the response macOS hands the center's delegate
      # (usernotifyprobe.Click).
      - name: macOS notification click jumps to the message
        if: ${{ !cancelled() }}
        env:
          CLACK_MACOS_WINDOW_TESTS: "1"
        run: |
          set +e
          rc=0
          go test -count=1 -v -timeout 10m -run '^TestMacNotificationClickJumps$' ./internal/ui || rc=1
          mkdir -p build && go test -c -o build/ui-click.test ./internal/ui || exit 1
          app="$GITHUB_WORKSPACE/build/click/Clack.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp build/ui-click.test "$app/Contents/MacOS/clack"
          cp assets/icon/clack.icns "$app/Contents/Resources/clack.icns"
          sed "s/@VERSION@/0.0.1/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier io.github.some-du6e.clack.probe-click" "$app/Contents/Info.plist"
          printf 'APPL????' > "$app/Contents/PkgInfo"
          codesign --force --deep --sign - --entitlements packaging/macos/Clack.entitlements "$app"
          cd internal/ui
          CLACK_MACOS_NOTIFY_BUNDLE=1 "$app/Contents/MacOS/clack" -test.v -test.count=1 -test.timeout 10m -test.run '^TestMacNotificationClickJumps$' || rc=1
          log show --last 10m --style compact --predicate 'process == "usernoted"' | grep -i 'probe-click' | tail -60
          exit $rc
      # Keys posted as a keyboard makes them (cocoatest.PostKey: the
      # layout's characters) and delivered by AppKit: NSApp sendEvent:, the
      # menu bar's key equivalents, Gio's view and its interpretKeyEvents:.
      # Gio patch 29: ⌘ presses AppKit's text system sends no command for
      # (⌘⌥⇧D, ⌃⌥⇧⌘D) reach a window's filters, once. Then the inspect
      # tool on App.Run's own window: the Konami code turns it on and off,
      # Hyper+D starts and ends a session. The logs have what the view got
      # of each key (cocoatest.TraceKeys).
      - name: macOS keys through AppKit (Gio patch 29, the inspect tool)
        if: ${{ !cancelled() }}
        env:
          CLACK_MACOS_WINDOW_TESTS: "1"
        run: |
          set +e
          go test -count=1 -v -timeout 10m -run '^TestMacCommandKeys$' gioui.org/app
          gio=$?
          go test -count=1 -v -timeout 10m -run '^(TestMacInspectKeys|TestMacComposerFormatKeys)$' ./internal/ui
          ui=$?
          exit $((gio | ui))
      # P6 (gap audit 2026-11-15): ⌘V reads the general pasteboard natively
      # (internal/desktop/pasteboard_darwin.m), as Chromium's ClipboardMac:
      # Finder's copied files attach as those files, an image comes as
      # public.png's bytes or NSImage's as a PNG, rich text with a picture
      # stays text, a busy main thread never holds the read. JXA puts the
      # data on the real pasteboard; TestMain runs app.Main for the reads'
      # main-thread hops (CLACK_MACOS_PASTEBOARD_TESTS).
      - name: macOS paste from the pasteboard (P6)
        if: ${{ !cancelled() }}
        env:
          CLACK_MACOS_PASTEBOARD_TESTS: "1"
        run: go test -count=1 -v -timeout 10m -run '^TestMacPaste' ./internal/ui/composer
      # P6b: ⌘V in App.Run's own composer, through the Edit menu's paste:
      # and Gio's pasteboard string. A Finder copy attaches its files and
      # leaves out their names (Finder's plain text), as Slack's
      # useUploadPastedFiles preventDefaults the paste; plain text, an
      # image and TextEdit's rich text with a picture are as before.
      - name: macOS ⌘V into the composer (P6b)
        if: ${{ !cancelled() }}
        env:
          CLACK_MACOS_WINDOW_TESTS: "1"
        run: go test -count=1 -v -timeout 10m -run '^TestMacComposerPaste$' ./internal/ui
      # docs/GAPS-2026-11-14.md gap 9 (W40). Gio patch 25 on real NSWindows:
      # Displays against NSScreen, a window opened at Bounds (points from
      # the primary screen's top left), its ConfigEvents' bounds through a
      # move, a later Bounds and the minimum, opened maximized (zoomed on
      # the screen, unzoomed to the frame) and full screen. Then App.Run's
      # own window, each launch with ui.json seeded: opened at the saved
      # bounds, a move and a zoom written back, Quit; saved maximized off
      # every screen; saved full screen (last: the runner never leaves it).
      - name: macOS window place (Gio patch 25, W40)
        if: ${{ !cancelled() }}
        env:
          CLACK_MACOS_WINDOW_TESTS: "1"
        run: |
          set +e
          rc=0
          go test -count=1 -v -timeout 10m -run '^(TestDisplaysMac|TestBoundsMac)$' gioui.org/app || rc=1
          go test -c -o "$RUNNER_TEMP/ui-bounds.test" ./internal/ui || exit 1
          cd internal/ui
          for t in TestMacWindowBounds TestMacWindowBoundsOffScreen TestMacWindowBoundsFullScreen; do
            "$RUNNER_TEMP/ui-bounds.test" -test.v -test.count=1 -test.timeout 10m -test.run "^$t\$" || rc=1
          done
          exit $rc
      - name: build
        if: ${{ !cancelled() }}
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -o dist/clack-darwin-arm64 ./cmd/clack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clack-darwin-arm64
          path: dist/clack-darwin-arm64

  # The macOS checks that measure frames, CPU and pixels: Gio's drawLayers
  # fix and frame cost on Metal, the freeze guards, idle (TestMacIdleCPU,
  # TestIdleFrames, quiet frames, the caret's partial frames). A job of
  # their own beside macos, so the two take ~12 min at once, not ~26 in a row.
  macos-idle:
    if: ${{ !inputs.only || startsWith('macos-idle', inputs.only) }}
    runs-on: macos-latest
    timeout-minutes: 25 # budget, min (the old macos job p95 33.1, about half of it here): docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Gio drawLayers fix on Metal (patched passes, stock v0.10.3 panics)
        env:
          CLACK_PIXEL_TESTS: "1"
        run: .github/scripts/gio-layer-fix.sh
      # Gio patches 37-44 on Metal: the state caches and command batching
      # change no pixel, the window's drawing held to the old way, shared
      # layer pages, sub-pixel paths, atlas pages; patch 46: partial frames
      # are the whole frame's pixels, the frame texture's draw into the
      # target included (TestClackPartial*); patch 51: an MTLTexture the
      # device made, drawn as an external image, gives an ImageOp's
      # pixels, retained once per key, a new key damaging only its op
      - name: Gio frame cost on Metal
        if: ${{ !cancelled() }}
        env:
          CLACK_PIXEL_TESTS: "1"
        run: |
          go test -count=1 -v -timeout 15m -run '^(TestClackAtlasShrinks|TestClackAtlasShrinksUsedNowAndThen|TestClackAtlasGrowKeepsSize|TestClackStateCacheIdentical|TestClackLayerPages|TestClackSubPixelCache|TestClackSplitsUnderTransform|TestClackPartialFrames|TestClackPartialSameOps|TestClackPartialDamageRects|TestClackPartialSpinner|TestClackExternalImage|TestClackExternalKeys|TestClackExternalPartial|TestClackSetSize|TestClackRollbackKeys)$' gioui.org/gpu/headless
          go test -count=1 -v -timeout 20m -run '^(TestFrameCostPixels|TestFrameCostSeams)$' ./internal/ui/theme
      - name: macOS freeze guards (no blocking work on the AppKit main thread)
        run: |
          go test -count=1 -v ./internal/ui/uiguard
          go test -count=1 -v -run 'TestThemeMapping|TestHCTSolveBounded|TestParseIAThemeJunk|FuzzIATheme' ./internal/ui/theme
          go test -count=1 -v -run 'TestNoExecOnUIPaths|TestOSPrefersDarkOffUI|TestOSSchemeFollow|TestWatchdogReport|TestTakeShaperDoesNotWait|TestAccountTheme|TestAppearancePageDraws|TestFormatWithMarkupPref' ./internal/ui
          go test -count=1 -timeout 20m -v -run 'TestStartupStatesNeverBlock|TestStartupWithHangingTools|TestEveryExecSetsWaitDelay' ./internal/ui
          go test -count=1 -v -run 'Paste|TestAttRunHangingChild' ./internal/ui/composer
      # Idle on the real macOS window (TestMacIdleCPU): App.Run's window
      # with Metal and the AppKit glue, signed in to the fake with realtime
      # on, left alone on each surface and then hidden; each period's
      # frames, who asked for them, its CPU and its CPU profile's top.
      # Then TestIdleFrames headless, as linux-idle runs it, and the quiet
      # frames of an animated emoji on the real window
      # (TestRealWindowQuietFrames, Gio patch 35).
      # Video playback's backend (internal/media/avf): the fixtures played
      # by AVFoundation into a headless Gio window on Metal
      - name: video playback (AVFoundation, internal/media/...)
        if: ${{ !cancelled() }}
        env:
          CLACK_MEDIA_TESTS: "1"
        run: go test -count=1 -v -timeout 15m ./internal/media/...
      - name: idle on the real window (TestMacIdleCPU), idle frames (TestIdleFrames), quiet frames (TestRealWindowQuietFrames)
        if: ${{ !cancelled() }}
        run: |
          set +e
          rc=0
          go test -c -o "$RUNNER_TEMP/ui-idle.test" ./internal/ui || exit 1
          cd internal/ui
          CLACK_MACOS_WINDOW_TESTS=1 CLACK_IDLE_CPUPROFILE="$RUNNER_TEMP/idlecpu" "$RUNNER_TEMP/ui-idle.test" -test.v -test.count=1 -test.timeout 15m -test.run '^TestMacIdleCPU$' || rc=1
          for f in "$RUNNER_TEMP"/idlecpu-*.pprof; do
            [ -s "$f" ] || continue
            echo "== $(basename "$f")"
            go tool pprof -top -nodecount=30 "$RUNNER_TEMP/ui-idle.test" "$f" 2>&1 | head -42
          done
          # TestIdleFrames' groups in four processes at once (see linux-idle)
          CLACK_IDLE_FRAMES=1 FANOUT_FLAGS='-test.timeout 25m' ../../.github/scripts/fanout.sh "$RUNNER_TEMP/ui-idle.test" TestIdleFrames motion 'views|unreads' 'pointer|code' 'galleries|main' || rc=1
          # Gio patch 35 and ui's quiet frames on Metal: a frame only an
          # animated emoji asked for draws the last frame's ops again
          CLACK_MACOS_WINDOW_TESTS=1 "$RUNNER_TEMP/ui-idle.test" -test.v -test.count=1 -test.timeout 10m -test.run '^TestRealWindowQuietFrames$' || rc=1
          # Gio patch 46 on Metal: a caret's blink is a partial frame
          CLACK_MACOS_WINDOW_TESTS=1 "$RUNNER_TEMP/ui-idle.test" -test.v -test.count=1 -test.timeout 10m -test.run '^TestRealWindowCaretCost$' || rc=1
          # the inline video player (AVFoundation) on the real window
          CLACK_MACOS_WINDOW_TESTS=1 CLACK_MEDIA_TESTS=1 "$RUNNER_TEMP/ui-idle.test" -test.v -test.count=1 -test.timeout 10m -test.run '^TestRealWindowVideoFrames$' || rc=1
          exit $rc
