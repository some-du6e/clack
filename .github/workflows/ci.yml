name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        if: ${{ !cancelled() }}
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -o dist/clack-linux-amd64 ./cmd/clack
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: clack-linux-amd64
          path: dist/clack-linux-amd64

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: resources (icon #1, manifest, version info)
        run: |
          # TODO: drop this guard once assets/icon/ is committed
          if [ ! -f assets/icon/clack.ico ]; then echo "::warning::assets/icon/clack.ico missing; building without resources"; exit 0; fi
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --in packaging/windows/winres.json --out cmd/clack/rsrc --arch amd64 --file-version 0.0.0.0 --product-version "0.0.0-dev+${GITHUB_SHA::7}"
      - name: build (cross, no cgo)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H windowsgui" -o dist/clack-windows-amd64.exe ./cmd/clack
      - uses: actions/upload-artifact@v4
        with:
          name: clack-windows-amd64
          path: dist/clack-windows-amd64.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        if: ${{ !cancelled() }}
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -o dist/clack-darwin-arm64 ./cmd/clack
      - uses: actions/upload-artifact@v4
        with:
          name: clack-darwin-arm64
          path: dist/clack-darwin-arm64
