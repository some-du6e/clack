name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "run only the jobs whose id starts with this (empty: all). full-test: just full-test, for a branch whose push run (keep it, don't cancel it) ran the other jobs on the same sha; macos, windows, linux: one OS"
        required: false
        default: ""

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config

permissions:
  contents: read

# A newer run of the same kind (push, PR or dispatch) for the same branch,
# tag or PR cancels this one while it is queued or running, so stale pushes
# don't pile up in the shared queue. The event is part of the group so a push
# never cancels a dispatched run, the only kind that runs full-test on a branch.
# A dispatch's `only` is in the group too, so -f only=full-test never cancels
# a dispatched run of every job (or one OS's).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.only }}
  cancel-in-progress: true

jobs:
  # gofmt, vet and the linux binary. The linux work that used to be one
  # job (21 min, all of it serial) is these linux-* jobs, in parallel.
  linux-build:
    if: ${{ !inputs.only || startsWith('linux-build', inputs.only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget, min (p95 4.2): docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      # a merge that keeps one side of a conflict on the gpu/headless -run
      # lists drops a Gio patch's tests from CI with every job green
      # (third_party/gioui.org/CLACK_PATCHES.md, patch 52's "Merging")
      - name: every Gio patch test in gpu/headless runs on all three GPUs
        run: python3 .github/scripts/headless-tests.py
      - name: vet
        run: go vet ./...
      # The app must not link golang.org/x/image/webp: its init would
      # register an unbudgeted WebP decoder with package image, which
      # image.Decode could then reach, bypassing imgcache's per-decode
      # memory budget. imgcache vendors internal/imgcache/internal/webp and
      # registers that instead (internal/imgcache/webpreg checks the
      # registration holds in a build that doesn't link x/image/webp).
      - name: the binary does not link x/image/webp
        if: ${{ !cancelled() }}
        run: |
          if go list -deps ./cmd/clack | grep -qx golang.org/x/image/webp; then
            echo "::error::cmd/clack links golang.org/x/image/webp; its unbudgeted decoder would be reachable through image.Decode. Use internal/imgcache/internal/webp."
            exit 1
          fi
      - name: build
        if: ${{ !cancelled() }}
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -o dist/clack-linux-amd64 ./cmd/clack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: clack-linux-amd64
          path: dist/clack-linux-amd64

  # `go test ./...`, split: internal/ui's and internal/ui/messages' top-level
  # tests packed into 4 shards by their recorded times (test-shard.py,
  # .github/test-times.json: about 4 min of each package's tests per shard;
  # hashed by name they ran 2.4 to 6.8 min), every other package in the
  # rest shard. linux-coverage checks the shards ran every test once.
  linux-test:
    if: ${{ !inputs.only || startsWith('linux-test', inputs.only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget, min (p95 6.8; 5.2 once packed by time): docs/CI-SPEED.md
    name: linux-test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4, rest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: test (${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
          HEAVY: github.com/some-du6e/clack/internal/ui,github.com/some-du6e/clack/internal/ui/messages
        run: |
          if [ "$SHARD" = rest ]; then set -- --rest; else set -- --shard "$SHARD" --times .github/test-times.json; fi
          python3 .github/scripts/test-shard.py run --heavy "$HEAVY" "$@" --out "$RUNNER_TEMP/shard"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: test-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shard
          retention-days: 7

  # Fails unless every package finished in its shard and each of the
  # split packages' tests ran exactly once across the shards.
  linux-coverage:
    needs: linux-test
    if: ${{ !cancelled() && needs.linux-test.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget, min (p95 0.2): docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: test-shard-*
          path: ${{ runner.temp }}/shards
      - name: every test ran in some shard
        run: python3 .github/scripts/test-shard.py check "$RUNNER_TEMP"/shards/test-shard-*

  # release.yml's test job, step for step: every package in one
  # `go test` on a clean cache. The shards above split internal/ui
  # across jobs, so none of them carries the whole suite's load, and
  # timing races that only show under it (TestInspectKonami in α.82,
  # TestFilesViewSectionsSidebar in α.83) passed ci and failed the
  # tagged release. This fails the ui/main push instead. ui and main
  # only (~18 min), or any branch by hand (gh workflow run ci.yml --ref
  # <branch>); a newer push to the same ref cancels the older run.
  full-test:
    if: ${{ (github.ref == 'refs/heads/ui' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && (!inputs.only || startsWith('full-test', inputs.only)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40 # budget, min (p95 21.6; its go test -timeout is 30m): docs/CI-SPEED.md
    concurrency:
      group: ci-full-test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # as release.yml: a clean module/build cache
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: test
        run: go test -timeout 30m ./...

  # Report-only (docs/PARITY.md): tools/parity.py runs the Slack-parity
  # tests (tools/parity_checks.json) against Slack's committed output and
  # says per dimension whether Clack is the same as Slack, what no check
  # covers, and every divergence; the report is the job summary and the
  # parity-report artifact. It starts at once instead of waiting for the
  # linux-test shards. continue-on-error: it never fails ci yet, and the
  # runner exits 0 on divergences (--strict would gate).
  parity:
    if: ${{ !inputs.only || startsWith('parity', inputs.only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget, min (p95 2.8): docs/CI-SPEED.md
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: runner tests
        run: python3 -I tools/parity_test.py
      - name: parity
        if: ${{ !cancelled() }}
        run: python3 -I tools/parity.py --out "$RUNNER_TEMP/parity"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: parity-report
          path: ${{ runner.temp }}/parity
          if-no-files-found: ignore
          retention-days: 30

  # Gio patches on the vendored gioui.org, Xvfb and Mesa's llvmpipe
  linux-gio:
    if: ${{ !inputs.only || startsWith('linux-gio', inputs.only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20 # budget, min (p95 8.1): docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      # Gio patch 11 (third_party/gioui.org/CLACK_PATCHES.md): OS file-drop
      # events through Window.Event, text/uri-list parsing (X11, Wayland)
      - name: Gio file-drop events (vendored gioui.org/app)
        if: ${{ !cancelled() }}
        run: go test -count=1 -v -run 'FileDrop|URIList' gioui.org/app
      # Gio patches 18 and 19: the router's and the renderer's per-frame
      # buffers let go of earlier frames' tags and images, the shaper of the
      # text it shaped
      - name: Gio lets go of what earlier frames held (vendored gioui.org/io/input, gpu, text)
        if: ${{ !cancelled() }}
        run: go test -count=1 -v -run 'ReleasesTagsOfEarlierFrames|ReleaseImagesOfEarlierFrames|ShaperReleasesSource' gioui.org/io/input gioui.org/gpu gioui.org/text
      # Gio patch 28: Source.KeyPresses has every key press, the ones
      # widgets take included (the inspect tool's Konami code), once each;
      # a press no filter matches gets a frame and stays unhandled
      - name: Gio key presses whoever takes them (vendored gioui.org/io/input)
        if: ${{ !cancelled() }}
        run: go test -count=1 -v -run 'KeyPresses|SinceInput' gioui.org/io/input
      # Gio patch 21: a hover-only Source (the inspect tool lays the window
      # out with one): hover, scroll and focus stay, clicks and keys don't
      - name: Gio hover-only input (vendored gioui.org/io/input)
        if: ${{ !cancelled() }}
        run: go test -count=1 -v -run 'HoverOnly' gioui.org/io/input
      # Gio patch 34: the focused tag, whether a tag can keep the focus, and
      # whether one was drawn inside another (slackc's overlay layers)
      - name: Gio focus answers (vendored gioui.org/io/input)
        if: ${{ !cancelled() }}
        run: go test -count=1 -v -run 'FocusTagCanFocusWithin' gioui.org/io/input
      # Gio patch 49: every handler's pointer state started over where the
      # pointer is (the inspect tool's freeze ends: no widget read its
      # events while the window drew a frame again)
      - name: Gio pointer state reset (vendored gioui.org/io/input, gesture)
        if: ${{ !cancelled() }}
        run: go test -count=1 -v -run '^(TestResetPointers|TestHoverResetPointers)$' gioui.org/io/input gioui.org/gesture
      # Gio patch 53: a tag's area in the window, and what of it its clip
      # areas show (the video tiles' share of their list)
      - name: Gio area bounds (vendored gioui.org/io/input)
        if: ${{ !cancelled() }}
        run: go test -count=1 -v -run '^TestClackAreaBounds$' gioui.org/io/input
      # Gio patches 37-44: a rounded clip's interior and a stroked one's
      # hole, ops split around them, a clip path's stencil regions, layers
      # of one depth on one atlas page, the sub-pixel path cache key, GL's
      # attribute query; patch 46: a frame's damage, sticky atlas places
      # (the pixels: gpu/headless's TestClack* and theme's
      # TestFrameCostPixels below, and the macos-idle and windows-applog
      # jobs' Gio frame cost steps on Metal and Direct3D 11)
      - name: Gio frame cost (vendored gioui.org/op/clip, gpu)
        if: ${{ !cancelled() }}
        run: |
          go test -count=1 -v -run 'TestRRectInterior|TestRRectStrokeHole' gioui.org/op/clip
          go test -count=1 -v -run 'TestAddRegion|TestCollectClipInterior|TestPackLayersOneDepthOnePage|TestSplitOp|TestCollectStrokeHole|TestCollectPanelSplit|TestCollectSubPixelKey|TestPackLayersLegacy|TestClackOpCacheReturningPathHits|TestClackDamage|TestClackSticky' gioui.org/gpu
          go test -count=1 -v -run 'TestQueryVertAttribBinding' gioui.org/gpu/internal/opengl
      # Gio patch 45: a StartAligned ScrollToEnd list lays out short content
      # from its start and still keeps to its end (the thread pane)
      - name: Gio start-aligned lists (vendored gioui.org/layout)
        if: ${{ !cancelled() }}
        run: go test -count=1 -v -run 'TestListStartAligned' gioui.org/layout
      # Gio patch 26: an Invalidate made while the client handles a wake-up
      # gets a wake-up of its own (hidden and minimized windows draw no
      # frame to cover it); the real windows are windows-shell's
      - name: Gio wakes the client for every Invalidate (vendored gioui.org/app)
        if: ${{ !cancelled() }}
        run: go test -count=1 -v -run 'TestInvalidateWhileHandlingAWakeup' gioui.org/app
      # Gio patch 35: a live image draws its image as it is when the frame
      # is drawn (the renderer's uploads; only the paints a frame shows
      # ask), a FrameEvent says whether the window's own frames asked for
      # it (an Invalidate asks nothing), and a frame drawn again keeps the
      # handlers' filters and the key log (ui's quiet frames); the X11
      # window's and the real GPU's are below, under Xvfb
      # Gio patch 51: an external image (a texture something else made, as
      # a video decoder's frame) asks once per paint shown, wraps once per
      # key, draws its still without one (the renderer's uploads; the real
      # devices' pixels are windows-applog's and macos's)
      - name: Gio live and external images and what a frame was asked for (vendored gioui.org/op/paint, gpu, app)
        if: ${{ !cancelled() }}
        run: go test -count=1 -v -run 'TestLiveImageOp|TestDrawOpsLiveImage|TestDrawOpsExternal|TestFrameEventAsked$|TestReplayKeeps' gioui.org/op/paint gioui.org/gpu gioui.org/app gioui.org/io/input
      # Gio patch 22: what each point of a window with a hidden title bar
      # is (the caption buttons, the top band, the caption, the client);
      # the Windows codes on real windows are windows-applog's. Patch 24:
      # what a double-click on a macOS drag area does for each "Double-click
      # a window's title bar to" setting; the real windows are macos's
      - name: Gio hidden title bar hit test (vendored gioui.org/app)
        if: ${{ !cancelled() }}
        run: go test -count=1 -v -run 'TestCaptionHit|TestHiddenTitleBarOption|TestTitlebarDoubleClickAction' gioui.org/app
      # the X11 path on a real X server: python-xlib plays a file manager's
      # XDND source against a Gio window (enter, positions, drop, leave).
      # Gio patch 35: on the X11 window, a frame only Window.Invalidate
      # brought has FrameEvent.Asked false, and an op.InvalidateCmd's, its
      # later wake-up's and a real (XTEST) press's frames are asked for
      - name: XDND file drops and what a frame was asked for, on Xvfb (Gio patches 11, 35)
        if: ${{ !cancelled() }}
        env:
          CLACK_X11_DROP_TESTS: "1"
          CLACK_X11_ASKED_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq xvfb libgl1-mesa-dri libegl-mesa0 python3-xlib
          # and patches 46/47 on X11: an unmapped window stops its frames and
          # lets its frame texture go; XSETTINGS from a real settings manager
          xvfb-run -a go test -count=1 -v -timeout 5m -run 'TestXDNDFileDrop|TestUnmappedStopsFramesX11|TestClackXSettingsX11' gioui.org/app
          xvfb-run -a -s "-screen 0 1280x1024x24" go test -count=1 -v -timeout 5m -run '^TestFrameEventAskedX11$' gioui.org/app
      - name: pixel tests (Mesa llvmpipe)
        env:
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq xvfb libgl1-mesa-dri libegl-mesa0
          # -p 1: test binaries bringing up Mesa's EGL at once is what made
          # eglInitialize fail (0x3001); pixeltest.NewWindow also retries.
          # TestTextMatchesChrome: text against Chrome 156's (theme/testdata/text-render; font-shots' text-render jobs re-measure it)
          # TestWrapped*, TestCodeChipWrapBorders, TestPillEllipsisDrawsOverPill: a mention pill that wraps, its picture (MentionProfiles' ::before), a rule's background, border and shadow per line, its hover (its text painted once), inline code's sliced border, a clamp's "…" over a component pill, in richview and in channel and thread rows (css and plugin-patched)
          # TestOwlSaveButtonPixels: a plugin's Block Kit-style button (OwlMode's Save in Taut) drawn as Slack's: its border and label in the plugin's colour, the icon, a 6px gap, the label, centred (light + dark)
          # TestOwlComposerButtonPixels: a composer.addButton toggle as Slack's composer button (no pressed tile, the 4px hover tile, its tooltip after 500 ms); TestOwlReactionsRing: a plugin's box-shadow ring round its ReactionBar's pills (OwlMode's owl ring), in place of the reacted pill's own
          # TestComposerToolbarOverflowTooltips: the footer's tooltips above its open overflow row
          xvfb-run -a go test -p 1 -count=1 -run 'TestCodeSpanAfterEmoji|TestInlineCodeDraws|TestSelectionOverCode|TestComposerSelectionOverCode|TestEmojiTooltip|TestReactionTooltipDraws|TestPlaceholderHashMatchesText|TestSlugPillNotUnderlined|TestDecorationShots|TestTextMatchesChrome|TestSideBarEnds|TestNewlineGapShots|TestFrameCostPixels|TestFrameCostSeams|TestWrappedPillPictureDraws|TestWrappedPillCSSBackground|TestWrappedPillBorderShadow|TestWrappedPillHover|TestCodeChipWrapBorders|TestWrappedMentionPictureInRows|TestPillEllipsisDrawsOverPill|TestOwlSaveButtonPixels|TestOwlComposerButtonPixels|TestOwlReactionsRing|TestComposerToolbarOverflowTooltips' ./internal/ui/richview ./internal/ui/composer ./internal/ui/messages ./internal/ui/theme ./internal/ui/slackc/kit
          # the profile hover card's name / title / pronouns column against Slack's CSS (light + dark)
          xvfb-run -a go test -count=1 -v -run '^TestHoverCardPronounsLikeSlack$' ./internal/ui/popups
          # Gio patch 35 on a real GPU context: the same ops drawn twice show a live image as it is at each
          xvfb-run -a go test -count=1 -v -run '^TestLiveImageFrames$' gioui.org/gpu/headless
          # Gio patches 37-44 in pixels: the state caches change none, shared
          # layer pages and splits under a transform none, a cached path at
          # a new sub-pixel offset is built there, atlas pages shrink and go;
          # patch 46: a partial frame is the whole frame's pixels, bit for bit;
          # patch 51: external images (TestClackExternal*), a new key's damage
          xvfb-run -a go test -count=1 -v -run '^(TestClackAtlasShrinks|TestClackAtlasShrinksUsedNowAndThen|TestClackAtlasGrowKeepsSize|TestClackStateCacheIdentical|TestClackLayerPages|TestClackSubPixelCache|TestClackSplitsUnderTransform|TestClackPartialFrames|TestClackPartialSameOps|TestClackPartialDamageRects|TestClackPartialSpinner|TestClackExternalImage|TestClackExternalKeys|TestClackExternalPartial|TestClackSetSize|TestClackRollbackKeys)$' gioui.org/gpu/headless
      - name: Gio drawLayers fix (patched passes, stock v0.10.3 panics)
        env:
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: .github/scripts/gio-layer-fix.sh xvfb-run -a

  # The freeze watchdog's flight recorder (internal/tracerec) on newer Go
  # than go.mod's: from Go 1.25 its go1.25 build tag takes
  # runtime/trace's FlightRecorder instead of golang.org/x/exp/trace's,
  # which deadlocks on Go 1.26's tracer (and with it, quitting). go.mod's
  # go line is only a minimum, so a local build with a newer Go takes
  # this path; GOTOOLCHAIN=local keeps the runner's.
  newer-go:
    if: ${{ !inputs.only || startsWith('newer-go', inputs.only) }}
    name: newer-go (${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget, min (p95 0.5): docs/CI-SPEED.md
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.x', 'stable']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: the flight recorder (internal/tracerec)
        env:
          GOTOOLCHAIN: local
        run: go version && go test -count=1 -v ./internal/tracerec

  linux-race-taut:
    if: ${{ !inputs.only || startsWith('linux-race-taut', inputs.only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget, min (p95 6.9): docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: plugins start in parallel with boot (race detector; the JS engine is one wasm instance)
        run: go test -race -count=1 -timeout 30m ./internal/taut ./internal/slick

  linux-race-boot:
    if: ${{ !inputs.only || startsWith('linux-race-boot', inputs.only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget, min (p95 3.4): docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: sign-out stops all traffic (50 runs, race detector)
        run: go test -race -count=50 -run 'TestAuthFailedStopsCore$' ./internal/core
      - name: plugins start in parallel with boot, 20 runs (race detector)
        run: go test -race -count=20 -run 'TestPluginsStartBeforeBoot$' ./internal/taut

  linux-idle:
    if: ${{ !inputs.only || startsWith('linux-idle', inputs.only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20 # budget, min (p95 14.5; 6.3 in 4 idle processes): docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      # Idle: the client left alone for 10 s per surface (channel, thread,
      # Activity, Preferences, the sidebar with unreads, the huddle window),
      # with and without reduced motion; fails past a caret's blinks plus
      # a clock tick, and logs who asked for every frame. TestIdleFrames'
      # groups each boot their own client, so they run at once in four
      # processes of one test binary (fanout.sh checks each group ran once;
      # one after another they took 11 min)
      - name: idle frames (TestIdleFrames, TestHuddleWindowIdleFrames)
        if: ${{ !cancelled() }}
        env:
          CLACK_IDLE_FRAMES: "1"
          FANOUT_FLAGS: -test.timeout 20m
        run: |
          rc=0
          go test -c -o "$RUNNER_TEMP/ui.test" ./internal/ui
          go test -count=1 -v -timeout 20m -run '^TestHuddleWindowIdleFrames$' ./internal/ui/huddleui || rc=1
          (cd internal/ui && ../../.github/scripts/fanout.sh "$RUNNER_TEMP/ui.test" TestIdleFrames motion 'views|unreads' 'pointer|code' 'galleries|main') || rc=1
          exit $rc
      # Gio patch 35 and ui's quiet frames on App.Run's real X11 window
      # (Xvfb, Mesa's llvmpipe): a frame only an animated emoji asked for
      # draws the last frame's ops again, without a layout; patch 46: a
      # caret's blink is a partial frame of its pixels, at a fraction of a
      # whole frame's draws and CPU; the same on Metal and Direct3D are the
      # macos-idle and windows-idle jobs'
      - name: quiet frames and the caret's partial frames on the real window (TestRealWindowQuietFrames, TestRealWindowCaretCost, Xvfb)
        if: ${{ !cancelled() }}
        env:
          CLACK_REAL_WINDOW_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          # python3-xlib: TestRealWindowCaretCost reads the window's pixels back
          sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq xvfb libgl1-mesa-dri libegl-mesa0 python3-xlib
          xvfb-run -a -s "-screen 0 1920x1080x24" go test -count=1 -v -timeout 10m -run '^(TestRealWindowQuietFrames|TestRealWindowCaretCost)$' ./internal/ui
      # the inspect tool's review drawn in the frame after the pick's at
      # 1918x1080 at 1x and 2x on the headless GPU (Mesa's llvmpipe), each
      # capture's stage times logged (windows-applog runs it on WARP)
      - name: the inspect tool's pick to review (TestInspectReviewTiming, llvmpipe)
        if: ${{ !cancelled() }}
        env:
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq xvfb libgl1-mesa-dri libegl-mesa0
          xvfb-run -a go test -count=1 -v -timeout 15m -run '^TestInspectReviewTiming$' ./internal/ui

  windows:
    if: ${{ !inputs.only || startsWith('windows', inputs.only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget, min (p95 6.9): docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: resources (icon #1, manifest, version info)
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --in packaging/windows/winres.json --out cmd/clack/rsrc --arch amd64 --file-version 0.0.0.0 --product-version "0.0.0-dev+${GITHUB_SHA::7}"
      - name: mingw (cgo, for miniaudio huddle audio)
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq gcc-mingw-w64-x86-64
      - name: build (cross, cgo via mingw)
        run: |
          mkdir -p dist
          CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H windowsgui" -o dist/clack-windows-amd64.exe ./cmd/clack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clack-windows-amd64
