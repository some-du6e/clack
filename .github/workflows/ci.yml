      # overlay roots and tree tooltips, a toast); a region's copy keys armed
      # once its review has been on screen 300 ms, a held Enter's repeats
      # dropped; the tool in the huddle window, a popped-out share, the
      # presenter's panel, an invite window and the join preview (Karim,
      # 2026-11-20, in a huddle on Windows: "no dev tools")
      - name: the inspect tool's pick to review, and the picker in popups (WARP, fakeslack)
        if: ${{ !cancelled() }}
        shell: bash # every go test counts (pwsh steps fail only on the last command)
        env:
          CGO_ENABLED: "0"
          CLACK_PIXEL_TESTS: "1"
        run: |
          rc=0
          go test -count=1 -v -timeout 15m -run '^(TestInspectReviewTiming|TestInspectPicksBlockKitModal|TestInspectPicksMenu|TestInspectPicksPopover|TestInspectPicksProfileCard|TestInspectPicksPeek|TestInspectPicksSwitcher|TestInspectPicksSelectMenu|TestInspectPicksPickers|TestOverlayKindsBoxTheirLayer|TestInspectFreezeHoldsPopups|TestInspectRegionArming|TestInspectPicksToast|TestInspectSubWindowsGate)$' ./internal/ui || rc=1
          go test -count=1 -v -run '^(TestReviewShotNextFrame|TestFreezeReviewShotNextFrame|TestEnterRightAfterPick|TestEscDuringPreparation|TestRegionEnterOpensReview|TestRegionCopyArms|TestHeldCopyKeyRepeats|TestEnterMidMarkKeepsIt|TestGiveUpDropsCapture|TestCloseLogsCapture|TestShooterSetWantedNeverWaits|TestShooterStartStopStart|TestShooterReleasesAfterShot|TestShooterFailedWindows|TestShooterTwoSessions|TestExperimentNotesFromTheRecorder|TestDeliveriesInOrder|TestDeliveriesInOrderWithText|TestNoShotLogsAtOnce|TestSaveUniqueStems|TestFreezeDeferredTooltip|TestBlurMatchesOld|TestPaintShotMatchesOld|TestBlurOutsideAllocs)$' ./internal/ui/inspect || rc=1
          go test -count=1 -v -run '^(TestInspectCardAfterContent|TestInspectCardMarkHoldsContent|TestInspectPluginOverlayLayer|TestInspectTreeTooltipEitherTheme)$' ./internal/ui/slackc || rc=1
          go test -count=1 -v -timeout 10m -run '^(TestInspectHuddleWindow|TestInspectScreensharePopout|TestInspectPresenterPanel|TestInspectInviteWindow|TestInspectJoinPreview)$' ./internal/ui/huddleui || rc=1
          exit $rc
      - name: thread reply box gap (layout, fakeslack)
        if: ${{ !cancelled() }}
        shell: bash # every go test counts (pwsh steps fail only on the last command)
        env:
          CGO_ENABLED: "0"
        run: |
          rc=0
          go test -count=1 -v -run '^TestThreadComposerTopMargin$' ./internal/ui/composer || rc=1
          go test -count=1 -v -timeout 10m -run '^TestThreadsAuditReplyGap$' ./internal/ui || rc=1
          exit $rc
      # Slack's frameless window (gap 2, W34). Gio patch 22's HiddenTitleBar
      # on real windows: no caption over the client area, WM_NCHITTEST for
      # the caption buttons (HTMAXBUTTON: Snap Layouts), the caption and the
      # top edge, the buttons' input reaching Gio's widgets through
      # SendInput and not run by Windows. Then App.Run's own window signed
      # in to internal/fakeslack: Electron's caption buttons over the top
      # nav (light and dark, hovered), maximize and restore, a double-click
      # on the nav, close to the tray, Slack's 668x400 minimum.
      # Screenshots of the window's top go in titlebar-shots.
      - name: the title bar (HiddenTitleBar, Clack's caption buttons over the top nav)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_TITLEBAR_TESTS: "1"
          CLACK_TITLEBAR_SHOTS: ${{ runner.temp }}\titlebar-shots
        run: |
          rc=0
          go test -count=1 -v -timeout 10m -run 'TestCaptionHit|TestHiddenTitleBar' gioui.org/app || rc=1
          go test -count=1 -v -timeout 15m -run '^(TestTitleBarWindow|TestMainWindowOptions|TestWcoGeometry|TestWcoThemeText)$' ./internal/ui || rc=1
          exit $rc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: titlebar-shots
          path: ${{ runner.temp }}/titlebar-shots
          if-no-files-found: ignore
      # The window opens where it was (gap 9, W40). Gio patch 25 on real
      # windows: Displays against GetSystemMetrics and SPI_GETWORKAREA, a
      # window created at Bounds, its ConfigEvents' bounds through a move, a
      # minimize and a restore, a later Bounds on a windowed and a
      # maximized window, created maximized, full screen, and hidden then
      # shown maximized. Then App.Run's own window (fakeslack), each launch
      # with ui.json seeded: opened at the saved bounds, a move and a
      # maximize written back, Quit; saved maximized off every display,
      # opened maximized and restored onto the display; saved full screen.
      - name: the window's place (Bounds and Displays, Slack's mainWindowSettings)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_BOUNDS_TESTS: "1"
        run: |
          rc=0
          go test -count=1 -v -timeout 10m -run '^(TestDisplaysWindows|TestBoundsWindows)$' gioui.org/app || rc=1
