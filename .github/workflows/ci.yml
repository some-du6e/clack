          cd internal/ui
          for t in TestWindowBoundsWindow TestWindowBoundsOffScreenWindow TestWindowBoundsFullScreenWindow; do
            "$RUNNER_TEMP/ui-bounds.test.exe" -test.v -test.count=1 -test.timeout 10m -test.run "^$t\$" || rc=1
          done
          exit $rc

  # Clack's slack:// registration and the single-instance hand-off, close to
  # the tray, the tray's states and menu, the jump list, Focus Assist,
  # toasts, the taskbar
  windows-shell:
    if: ${{ !inputs.only || startsWith('windows-shell', inputs.only) }}
    runs-on: windows-latest
    timeout-minutes: 20 # budget, min (p95 10.4): docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: slack:// handler (HKCU registration, the shell's list of slack:// handlers, the hand-off over the instance socket)
        if: ${{ !cancelled() }}
        env:
          CLACK_WINDOWS_ASSOC_TESTS: "1" # TestURLHandlerShell changes the runner user's slack:// association
        run: go test -count=1 -v -run 'TestURLHandler|TestHandlerCommands|TestForwardOnWindows|TestURLLaunchArgs' ./internal/desktop
      # The real exe: it registers itself at start (reg query), Windows
      # routes `start slack://…` to it (nothing else on the runner has
      # slack://), and the running Clack takes the link from the launch
      # Windows started. slack://T0FAKE/… fails ParseMagicLink (team ids are
      # 9+ characters), so the sign-in stops before any request: nothing
      # here talks to Slack.
      - name: Clack.exe and slack:// links (registration at start, start slack://… reaching the running Clack, the flags)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go install github.com/tc-hib/go-winres@v0.3.3
          & (Join-Path (go env GOPATH) 'bin\go-winres.exe') make --in packaging/windows/winres.json --out cmd/clack/rsrc --arch amd64 --file-version 0.0.0.0 --product-version 0.0.0-ci
          if ($LASTEXITCODE -ne 0) { throw 'go-winres' }
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags="-s -w -H windowsgui" -o build\Clack.exe .\cmd\clack
          if ($LASTEXITCODE -ne 0) { throw 'go build' }
          $exe = (Resolve-Path build\Clack.exe).Path
          $cmd = "`"$exe`" `"%1`""
          $log = Join-Path $env:LOCALAPPDATA 'Clack\logs\clack.log'
          $script:mark = 0
          function Mark-Log { $script:mark = if (Test-Path $log) { @(Get-Content $log).Count } else { 0 } }
          function Wait-Log([string]$text, [string]$what, [int]$secs = 90) {
            for ($i = 0; $i -lt $secs * 4; $i++) {
              if ((Test-Path $log) -and (@(Get-Content $log | Select-Object -Skip $script:mark) | Where-Object { $_.Contains($text) })) { return }
              Start-Sleep -Milliseconds 250
            }
            if (Test-Path $log) { Get-Content $log | Select-Object -Skip $script:mark | Select-Object -Last 80 }
            throw "no '$text' in the log after ${secs}s: $what"
          }
          function Assert-Reg([string]$key, [string]$value, [string]$want) {
            $a = if ($value -eq '') { @($key, '/ve') } else { @($key, '/v', $value) }
            $out = (& reg query @a 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "reg query $key [$value]: $out" }
            Write-Host $out.Trim()
            if (-not $out.Contains($want)) { throw "reg query $key [$value]: want '$want'" }
          }
          function Assert-NoReg([string]$key, [string]$value) {
            $a = if ($value) { @($key, '/v', $value) } else { @($key) }
            $out = (& reg query @a 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0) { throw "reg query $key [$value] still finds: $out" }
          }
          function Stop-Clack($p) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            $p.WaitForExit(15000) | Out-Null
          }

          # nothing on the runner has slack://
          Assert-NoReg 'HKCU\Software\Classes\slack'
          Assert-NoReg 'HKCU\Software\Classes\Clack.slack'

          # 1. A start registers Clack, and takes the legacy key: no other app has slack://
          Mark-Log
          $p = Start-Process -PassThru -FilePath $exe
          try {
            Wait-Log 'desktop: slack:// handler: Clack is registered and is the default' 'the registration at start'
            Assert-Reg 'HKCU\Software\Classes\Clack.slack' 'URL Protocol' 'REG_SZ'
            Assert-Reg 'HKCU\Software\Classes\Clack.slack\shell\open\command' '' $cmd
            Assert-Reg 'HKCU\Software\Classes\Clack.slack\DefaultIcon' '' "`"$exe`",0"
            Assert-Reg 'HKCU\Software\Clack\Capabilities' 'ApplicationName' 'Clack'
            Assert-Reg 'HKCU\Software\Clack\Capabilities' 'ApplicationDescription' 'native Slack client'
            Assert-Reg 'HKCU\Software\Clack\Capabilities\URLAssociations' 'slack' 'Clack.slack'
            Assert-Reg 'HKCU\Software\RegisteredApplications' 'Clack' 'Software\Clack\Capabilities'
            Assert-Reg 'HKCU\Software\Classes\slack' 'URL Protocol' 'REG_SZ'
            Assert-Reg 'HKCU\Software\Classes\slack\shell\open\command' '' $cmd
            Assert-Reg 'HKCU\Software\Classes\slack\OpenWithProgids' 'Clack.slack' 'REG_NONE'

            # 2. Windows starts Clack.exe "slack://…"; that launch hands the link to this one and exits
            Mark-Log
            cmd /c start "" "slack://T0FAKE/magic-login/xyz"
            Wait-Log 'desktop: another launch handed over a slack:// sign-in link' 'the running Clack getting the link'
            Wait-Log 'sign-in: a sign-in link came from outside Clack; signing in with it' 'the sign-in card taking it'
            Wait-Log "sign-in: couldn't read the team and token from the sign-in link" 'the sign-in attempt (the fake link stops it there)'
            if ($p.HasExited) { throw "the first Clack exited ($($p.ExitCode))" }
            # the window's Clack processes: not the introduction's renderer
            # (Clack.exe intro-preview, which the first run's intro starts)
            function Count-Clack { @(Get-CimInstance Win32_Process -Filter "Name='Clack.exe'" | Where-Object { $_.CommandLine -notlike '*intro-preview*' }).Count }
            for ($i = 0; $i -lt 40 -and (Count-Clack) -gt 1; $i++) { Start-Sleep -Milliseconds 250 }
            $n = Count-Clack
            if ($n -ne 1) { throw "$n Clack processes: the launch Windows started didn't hand over and exit" }
            if (Select-String -Path $log -SimpleMatch -Pattern 'magic-login/xyz' -Quiet) { throw 'the sign-in link is in the log' }
          } finally { Stop-Clack $p }

          # 3. Another app takes the legacy key (as Slack desktop does at its start): Clack's next start leaves it
          $other = Join-Path $env:SystemRoot 'System32\cmd.exe'
          $otherCmd = "`"$other`" /c exit `"%1`""
          Set-ItemProperty -Path 'HKCU:\Software\Classes\slack\shell\open\command' -Name '(default)' -Value $otherCmd
          Mark-Log
          $p = Start-Process -PassThru -FilePath $exe
          try {
            Wait-Log 'has the default, so Windows asks which app to use' 'the registration beside another app'
            Assert-Reg 'HKCU\Software\Classes\slack\shell\open\command' '' $otherCmd
            Assert-Reg 'HKCU\Software\Classes\Clack.slack\shell\open\command' '' $cmd
            Assert-Reg 'HKCU\Software\RegisteredApplications' 'Clack' 'Software\Clack\Capabilities'
          } finally { Stop-Clack $p }

          # 4. -unregister-url-handler removes Clack's keys and leaves the other app's
          $r = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList '-unregister-url-handler'
          if ($r.ExitCode -ne 0) { throw "-unregister-url-handler exited $($r.ExitCode)" }
          Assert-NoReg 'HKCU\Software\Classes\Clack.slack'
          Assert-NoReg 'HKCU\Software\Clack\Capabilities'
          Assert-NoReg 'HKCU\Software\RegisteredApplications' 'Clack'
          Assert-NoReg 'HKCU\Software\Classes\slack\OpenWithProgids' 'Clack.slack'
          Assert-Reg 'HKCU\Software\Classes\slack\shell\open\command' '' $otherCmd

          # 5. -register-url-handler takes the legacy key on request; unregistering then removes it
          $r = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList '-register-url-handler'
          if ($r.ExitCode -ne 0) { throw "-register-url-handler exited $($r.ExitCode)" }
          Assert-Reg 'HKCU\Software\Classes\slack\shell\open\command' '' $cmd
          Assert-Reg 'HKCU\Software\Clack\Capabilities\URLAssociations' 'slack' 'Clack.slack'
          $r = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList '-unregister-url-handler'
          if ($r.ExitCode -ne 0) { throw "-unregister-url-handler exited $($r.ExitCode)" }
          Assert-NoReg 'HKCU\Software\Classes\slack\shell\open\command'
          Assert-NoReg 'HKCU\Software\Classes\Clack.slack'
          Get-Content $log | Select-String -SimpleMatch 'slack://', 'sign-in:' | ForEach-Object { $_.Line }
          exit 0 # the last reg query's expected exit 1 would otherwise end the step

      # The introduction's preview renderer as a release runs it: the
      # Clack.exe built above (-H windowsgui) started as `intro-preview`
      # by TestIntroSlackPreview's window, a D3D11 headless frame, the
      # renderer's report (real components, reads only, no plugin, the
      # user's folder untouched), quit mid-render. The beat's shots are the
      # intro-preview-windows artifact.
      - name: the introduction's preview renderer (Clack.exe intro-preview)
        if: ${{ !cancelled() }}
        shell: bash # every go test counts (pwsh steps fail only on the last command)
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p "$RUNNER_TEMP/intro-shots"
          CLACK_INTRO_PREVIEW_BIN="$GITHUB_WORKSPACE/build/Clack.exe" LOGIN_SHOTS_DIR="$RUNNER_TEMP/intro-shots" \
            go test -count=1 -v -timeout 15m -run '^(TestIntroSlackPreview|TestIntroPreviewPluginHome|TestIntroPreviewQuit|TestIntroPreviewWindowGone)$' ./internal/ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: intro-preview-windows
          path: ${{ runner.temp }}/intro-shots

      # Closing the window keeps Clack in the notification area (Slack's
      # runFromTray): Gio patch 13's Window.Hide and the show in
      # ActionRaise on real HWNDs (windowed and maximized), the hidden
      # window's wake-ups without frames, a title or minimum size keeping a
      # hidden or minimized window as it was (patch 20), the caret blink time from
      # GetCaretBlinkTime (set on the runner with SetCaretBlinkTime and put
      # back), the RunFromTray balloon through Shell_NotifyIcon, and
      # App.Run's own window signed in to internal/fakeslack hiding on
      # SC_CLOSE / WM_CLOSE, running posted work while hidden, coming back
      # on Raise and closing on Quit. Gio patch 26: an Invalidate made while
      # the app handles a hidden or minimized window's wake-up gets its own.
      - name: close to the tray (Window.Hide, the tray balloon, runFromTray in App.Run, the caret blink time)
        if: ${{ !cancelled() }}
        shell: bash # every go test counts (pwsh steps fail only on the last command)
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_TRAY_TESTS: "1"
        run: |
          rc=0
          go test -count=1 -v -timeout 10m -run 'TestHideAndRaise|TestHideWithoutDriver|TestCaretBlinkFromOS|TestOptionKeepsHiddenAndMinimized|TestInvalidateWhileHandling' gioui.org/app || rc=1
          go test -count=1 -v -run 'TestNotifyIconDataSize|TestTrayBalloon|TestPutUTF16' ./internal/desktop || rc=1
          go test -count=1 -v -timeout 15m -run '^(TestCloseToTrayWindow|TestCloseToTray|TestRunFromTrayRow|TestDrainIdleRunsPosted)$' ./internal/ui || rc=1
          exit $rc

      # Slack's notification-area icon, its menu and the taskbar's jump
      # list (gap 8, W39: internal/desktop tray_windows.go,
      # jumplist_windows.go, focusassist_windows.go; internal/ui tray.go):
      # the tray's rest, unread and highlight .ico frames as HICONs
      # (LoadImage's pick per SM_CXSMICON), its native menu read back, the
      # icon on the runner's taskbar found by its tooltip through UI
      # Automation, a click, the menu opened by its right button and an
      # item invoked; the jump list Windows saves for a scratch app id;
      # the Focus Assist read (WNF and IQuietHoursSettings); the Run
      # value's --startup; Gio patch 23's StartHidden; App.Run's own window
      # launched on login with Keep in Background, then its tray state,
      # menu, reset-window and jump list. bash: every go test counts.
      # Screenshots in toast-shots.
      - name: the tray's states and menu, the jump list, Focus Assist, Keep in Background
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_TRAY_TESTS: "1"
          CLACK_TOAST_SHOTS: ${{ runner.temp }}\toast-shots
        run: |
          rc=0
          go test -count=1 -v -timeout 10m -run '^TestStartHidden$' gioui.org/app || rc=1
          go test -count=1 -v -timeout 10m -run '^(TestTrayIconFromICO|TestTrayMenuItems|TestTrayShell|TestJumpList|TestFocusAssistRead|TestLaunchOnLoginRunValue|TestFitCenteredLikeSlack|TestFocusAssistOnLikeSlack|TestFocusAssistActiveCachesLikeSlack)$' ./internal/desktop || rc=1
          go test -count=1 -v -timeout 15m -run '^(TestTrayWindow|TestTrayStateLikeSlack|TestTrayIconFollowsUnreads|TestTrayMenuLikeSlack|TestLaunchOnLoginTrayAndPrefs|TestJumpListLikeSlack|TestAppActions|TestResetWindow|TestStartHiddenLikeSlack|TestSoundPlaybackHoldsTheSound)$' ./internal/ui || rc=1
          exit $rc
      # The real exe: Clack.exe --startup (the Run value) with Keep in
      # Background, the default, keeps its window hidden; the jump list's
      # Move Clack to Current Display (a second launch with
      # slack://app/?action=reset-window) hands over and the window comes
      # out maximized; the jump list Windows saved for Clack.exe has the
      # task; the exe carries the task's icon (icon group #2).
      - name: Clack.exe --startup (Keep in Background) and the jump list's Move Clack to Current Display
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path build\Clack.exe)) {
            go install github.com/tc-hib/go-winres@v0.3.3
            & (Join-Path (go env GOPATH) 'bin\go-winres.exe') make --in packaging/windows/winres.json --out cmd/clack/rsrc --arch amd64 --file-version 0.0.0.0 --product-version 0.0.0-ci
            $env:CGO_ENABLED = '0'
            go build -trimpath -ldflags="-s -w -H windowsgui" -o build\Clack.exe .\cmd\clack
            if ($LASTEXITCODE -ne 0) { throw 'go build' }
          }
          $exe = (Resolve-Path build\Clack.exe).Path
          $res = Join-Path $env:RUNNER_TEMP 'clack-res'
          & (Join-Path (go env GOPATH) 'bin\go-winres.exe') extract --dir $res $exe
          if ($LASTEXITCODE -ne 0) { throw 'go-winres extract' }
          $groups = (Get-Content (Join-Path $res 'winres.json') -Raw | ConvertFrom-Json).RT_GROUP_ICON
          if (-not $groups.'#2') { throw "Clack.exe has no icon group #2 (the jump list task's screen.ico): $($groups | ConvertTo-Json -Compress)" }
          Add-Type @'
          using System; using System.Text; using System.Runtime.InteropServices;
          public static class ClackWin {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool IsZoomed(IntPtr h);
            public static IntPtr Find(uint want) {
              IntPtr found = IntPtr.Zero;
              EnumWindows((h, l) => { uint pid; GetWindowThreadProcessId(h, out pid); var c = new StringBuilder(64); GetClassName(h, c, 64);
                if (pid == want && c.ToString() == "clack") { found = h; return false; } return true; }, IntPtr.Zero);
              return found;
            }
          }
          '@
          $log = Join-Path $env:LOCALAPPDATA 'Clack\logs\clack.log'
          $script:mark = if (Test-Path $log) { @(Get-Content $log).Count } else { 0 }
          function Wait-Log([string]$text, [string]$what, [int]$secs = 90) {
            for ($i = 0; $i -lt $secs * 4; $i++) {
              if ((Test-Path $log) -and (@(Get-Content $log | Select-Object -Skip $script:mark) | Where-Object { $_.Contains($text) })) { return }
              Start-Sleep -Milliseconds 250
            }
            if (Test-Path $log) { Get-Content $log | Select-Object -Skip $script:mark | Select-Object -Last 80 }
            throw "no '$text' in the log after ${secs}s: $what"
          }
          $since = (Get-Date).AddSeconds(-2)
          $p = Start-Process -PassThru -FilePath $exe -ArgumentList '--startup'
          try {
            Wait-Log 'ui: launched on login: the window stays in the notification area (Keep in Background)' 'the login launch'
            $h = [IntPtr]::Zero
            for ($i = 0; $i -lt 120 -and $h -eq [IntPtr]::Zero; $i++) { $h = [ClackWin]::Find([uint32]$p.Id); Start-Sleep -Milliseconds 250 }
            if ($h -eq [IntPtr]::Zero) { throw 'no Clack window' }
            Start-Sleep -Seconds 3
            if ([ClackWin]::IsWindowVisible($h)) { throw 'Keep in Background: the window is visible' }
            Write-Host 'the login launch kept its window hidden'
            Start-Process -Wait -FilePath $exe -ArgumentList 'slack://app/?action=reset-window'
            Wait-Log 'desktop: another launch handed over a slack:// link' 'the jump list task reaching the running Clack'
            for ($i = 0; $i -lt 80 -and -not ([ClackWin]::IsWindowVisible($h) -and [ClackWin]::IsZoomed($h)); $i++) { Start-Sleep -Milliseconds 250 }
            if (-not [ClackWin]::IsWindowVisible($h)) { throw 'reset-window: the window stayed hidden' }
            if (-not [ClackWin]::IsZoomed($h)) { throw 'reset-window: the window is not maximized' }
            Write-Host 'Move Clack to Current Display: shown and maximized'
            $dir = Join-Path $env:APPDATA 'Microsoft\Windows\Recent\CustomDestinations'
            $want = @('Move Clack to Current Display', 'slack://app/?action=reset-window', 'Tasks', $exe)
            $ok = $false
            for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
              foreach ($f in Get-ChildItem $dir -Filter '*.customDestinations-ms' -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -ge $since }) {
                $b = [System.IO.File]::ReadAllBytes($f.FullName)
                # UTF-16 strings sit at even or odd offsets: read it both ways
                $texts = @([System.Text.Encoding]::Unicode.GetString($b), [System.Text.Encoding]::Unicode.GetString($b, 1, $b.Length - 1))
                if (@($want | Where-Object { $w = $_; -not @($texts | Where-Object { $_.Contains($w) }) }).Count -eq 0) { $ok = $true; Write-Host "the jump list: $($f.Name)" }
              }
              if (-not $ok) { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ok) {
              $adv = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' -ErrorAction SilentlyContinue
              Write-Host "Start_TrackDocs: $($adv.Start_TrackDocs)"
              Get-ChildItem $dir -ErrorAction SilentlyContinue | Format-Table Name, Length, LastWriteTime | Out-String | Write-Host
              Get-Content $log | Select-String -SimpleMatch 'jump list', 'desktop:', 'ui: ' | Select-Object -Last 40 | ForEach-Object { $_.Line }
              throw "no saved jump list with $($want -join ', ')"
            }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            $p.WaitForExit(15000) | Out-Null
          }

      # Toasts (WinRT, internal/desktop/toast_windows.go). Windows drops a
      # toast from an app id it doesn't know without an error, so a scratch
      # id shows one without and one with the registration Clack writes
      # (HKCU\Software\Classes\AppUserModelId), and Notification Center's
      # history says which Windows kept. Then UI Automation clicks a toast's
      # button in the shell's toast window: the Activated event has to reach
      # the test process. Screenshots of the desktop go in toast-shots.
      - name: toasts (app id registration, Notification Center, a click through UI Automation)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_TOAST_TESTS: "1"
          CLACK_TOAST_SHOTS: ${{ runner.temp }}\toast-shots
        run: go test -count=1 -v -timeout 10m -run 'TestToast' ./internal/desktop
      # The installer registers Clack's own id (and its icon) for the toasts
      # an installed Clack shows, and the uninstaller removes both.
      - name: toasts from the installed Clack (the installer's app id registration, uninstall)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_TOAST_TESTS: "1"
          CLACK_TOAST_SHOTS: ${{ runner.temp }}\toast-shots
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path build\Clack.exe)) {
            go install github.com/tc-hib/go-winres@v0.3.3
            & (Join-Path (go env GOPATH) 'bin\go-winres.exe') make --in packaging/windows/winres.json --out cmd/clack/rsrc --arch amd64 --file-version 0.0.0.0 --product-version 0.0.0-ci
            go build -trimpath -ldflags="-s -w -H windowsgui" -o build\Clack.exe .\cmd\clack
            if ($LASTEXITCODE -ne 0) { throw 'go build' }
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'choco install innosetup failed' }
          }
          & $iscc /Qp '/DAppVersion=0.0.1' '/DAppVersionNum=0.0.1.0' "/DSourceExe=$PWD\build\Clack.exe" "/DOutputDir=$PWD\dist" packaging\windows\clack.iss
          if ($LASTEXITCODE -ne 0) { throw 'iscc failed' }
          $key = 'HKCU:\Software\Classes\AppUserModelId\io.github.some-du6e.clack'
          $png = Join-Path $env:LOCALAPPDATA 'Clack\clack.png'
          if (Test-Path $key) { throw "$key exists before the install" }
          $p = Start-Process -Wait -PassThru -FilePath (Get-Item dist\Clack-0.0.1-windows-amd64-setup.exe).FullName -ArgumentList '/VERYSILENT', '/CURRENTUSER', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($p.ExitCode -ne 0) { throw "setup exited $($p.ExitCode)" }
          $k = Get-ItemProperty $key
          Write-Host "DisplayName '$($k.DisplayName)', IconUri '$($k.IconUri)'"
          if ($k.DisplayName -ne 'Clack') { throw "DisplayName is '$($k.DisplayName)'" }
          if ($k.IconUri -ne $png) { throw "IconUri is '$($k.IconUri)', want '$png'" }
          if (-not (Test-Path $png)) { throw "no $png" }
          $env:CLACK_TOAST_INSTALLED = '1'
          go test -count=1 -v -run 'TestToastInstalledAUMID' ./internal/desktop
          if ($LASTEXITCODE -ne 0) { throw 'TestToastInstalledAUMID' }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Clack'
          Start-Process -Wait -FilePath "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # the uninstaller finishes from a temp copy of itself: wait for its keys to go
          for ($i = 0; $i -lt 120 -and (Test-Path $key); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $key) { throw "uninstall left $key" }
          for ($i = 0; $i -lt 20 -and (Test-Path $png); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $png) { throw "uninstall left $png" }
      # Clack's own toasts (internal/ui notify_windows_test.go): the WinRT
      # notifier shows a fakeslack DM's toast, UI Automation types into its
      # reply box and clicks a second DM's toast in Notification Center, and
      # Clack sends the reply and opens the DM.
      - name: Clack's toasts (a fakeslack DM's toast clicked opens the DM; the reply box sends)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_TOAST_TESTS: "1"
          CLACK_TOAST_SHOTS: ${{ runner.temp }}\toast-shots
        run: go test -count=1 -v -timeout 15m -run '^TestWindowsToast' ./internal/ui
      # The taskbar button (gap-w19, internal/desktop/taskbar_windows.go,
      # internal/ui/dock.go): Slack's unread badge as the overlay icon
      # through ITaskbarList3 (S_OK, and the HICON's pixels read back), the
      # frame flash as the shell hears it (HSHELL_FLASH through
      # RegisterShellHookWindow), the "idle" flash's show-inactive and
      # minimize of a window hidden to the tray, GetLastInputInfo's idle
      # time after a SendInput, and App.Run's own window doing all of it
      # from Clack's count, close and notification paths. Screenshots of
      # the taskbar go in toast-shots.
      - name: taskbar (the unread badge overlay, the frame flash, windowFlashBehavior's close and revive)
        if: ${{ !cancelled() }}
        shell: bash # every go test counts (pwsh steps fail only on the last command)
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_TASKBAR_TESTS: "1"
          CLACK_TOAST_SHOTS: ${{ runner.temp }}\toast-shots
          BADGE_SHOTS_DIR: ${{ runner.temp }}\toast-shots
        run: |
          rc=0
          go test -count=1 -v -timeout 10m -run 'TestTaskbar|TestSystemIdleTime|TestBadge|TestLanczos' ./internal/desktop || rc=1
          go test -count=1 -v -timeout 15m -run '^(TestTaskbarWindow|TestTaskbarOverlayFollowsCount|TestFlashOnNotification|TestCloseKeepsAppInTaskbar|TestWindowsAppearancePref|TestCloseToTray|TestTitleDockTaskbarAgreeLikeSlack)$' ./internal/ui || rc=1
          exit $rc
      # Focus Assist's modes set through IQuietHoursSettings, each read back
      # through the WNF state as Slack's windows-focus-assist reads it, and
      # Clack as a priority app. It switches the runner's Do not disturb,
      # which crashes the notification service on Server 2025 (restarted
      # within seconds; a change made just before can be lost), so it runs
      # last, in its own process, after every toast and taskbar step; it
      # makes each change again until it reads back, skips if the service
      # stays down, and puts the profile back. The cache and Slack's muting
      # rule are TestFocusAssistActiveCachesLikeSlack's (the tray step).
      - name: Focus Assist's modes (Do not disturb switched through IQuietHoursSettings, then put back)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_TRAY_TESTS: "1"
          CLACK_WINDOWS_FOCUS_ASSIST_TESTS: "1"
        run: go test -count=1 -v -timeout 5m -run '^TestFocusAssistModes$' ./internal/desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: toast-shots
          path: ${{ runner.temp }}/toast-shots
          if-no-files-found: ignore


  windows-scroll:
    if: ${{ !inputs.only || startsWith('windows-scroll', inputs.only) }}
    runs-on: windows-latest
    timeout-minutes: 15 # budget, min (p95 3.9): docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # Wheel scrolling on Windows: frame times while synthetic mouse-wheel
      # notches scroll a long fakeslack channel at 60 Hz (layout, and the
      # Direct3D 11 render when the runner has a device). The numbers are
      # in the log; nothing fails on them.
      - name: wheel scrolling frame times (internal/ui TestWheelFrameProbe)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
          CLACK_WHEEL_PROBE: "1"
          CLACK_BENCH_GPU: "1"
        run: go test -count=1 -v -timeout 30m -run '^TestWheelFrameProbe$' ./internal/ui

      # Middle-click autoscroll (Gio patch 14), on by default on Windows as
      # in Chromium: the router tests, Chromium's panning cursors made from
      # their .cur files, and SendInput's real middle button held and
      # clicked over a long fakeslack channel in Clack's own window.
      - name: middle-click autoscroll (TestPanCursors, internal/ui/autoscroll, SendInput on Clack's window)
        if: ${{ !cancelled() }}
        shell: bash # every go test counts (pwsh steps fail only on the last command)
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_AUTOSCROLL_TESTS: "1"
        run: |
          rc=0
          go test -count=1 -v -run '^TestPanCursors$' gioui.org/app || rc=1
          go test -count=1 -v ./internal/ui/autoscroll || rc=1
          go test -count=1 -v -timeout 10m -run '^(TestAutoscrollWindow|TestAutoscrollInClack)$' ./internal/ui || rc=1
          exit $rc


  windows-idle:
    if: ${{ !inputs.only || startsWith('windows-idle', inputs.only) }}
    runs-on: windows-latest
    timeout-minutes: 20 # budget, min (p95 17.2; 9.8 in 4 idle processes): docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # The idle-frame budget on Windows (see linux-idle: four processes).
      - name: idle frames (TestIdleFrames, TestHuddleWindowIdleFrames)
        if: ${{ !cancelled() }}
        shell: bash # every go test counts (pwsh steps fail only on the last command)
        env:
          CGO_ENABLED: "0"
          CLACK_IDLE_FRAMES: "1"
          FANOUT_FLAGS: -test.timeout 20m
        run: |
          rc=0
          go test -c -o "$RUNNER_TEMP/ui.test.exe" ./internal/ui
          go test -count=1 -v -timeout 20m -run '^TestHuddleWindowIdleFrames$' ./internal/ui/huddleui || rc=1
          (cd internal/ui && ../../.github/scripts/fanout.sh "$RUNNER_TEMP/ui.test.exe" TestIdleFrames motion 'views|unreads' 'pointer|code' 'galleries|main') || rc=1
          exit $rc
      # Gio patch 35 and ui's quiet frames on App.Run's real Direct3D
      # window: a frame only an animated emoji asked for draws the last
      # frame's ops again, without a layout; patch 46: a caret's blink is
      # a partial frame
      - name: quiet frames and the caret's partial frames on the real window (TestRealWindowQuietFrames, TestRealWindowCaretCost)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
          CLACK_REAL_WINDOW_TESTS: "1"
        run: go test -count=1 -v -timeout 10m -run '^(TestRealWindowQuietFrames|TestRealWindowCaretCost)$' ./internal/ui
      # Video playback's backend (internal/media/mf): the fixtures played
      # by Media Foundation into a headless Gio window (Direct3D 11 on the
      # Basic Render Driver), with cgo, which the steps above leave off
      - name: video playback (Media Foundation, internal/media/...)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "1"
          CLACK_MEDIA_TESTS: "1"
        run: go test -count=1 -v -timeout 15m ./internal/media/...
      # The inline player on the real window: Media Foundation plays
      # #files-gallery's video in App.Run's own window (quiet frames, its
      # partial frames inside the tile, nothing while paused)
      - name: the inline video player on the real window (TestRealWindowVideoFrames, Media Foundation)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "1"
          CLACK_MEDIA_TESTS: "1"
          CLACK_REAL_WINDOW_TESTS: "1"
        run: go test -count=1 -v -timeout 10m -run '^TestRealWindowVideoFrames$' ./internal/ui
      # patch 46's memory on Karim's window (a 1918x1080 client area at 1x,
      # his light custom theme, a thread open), with partial frames and
      # without, a process each, three pairs: the pairs' median difference
      # is the frame texture and the clear texture (TestRealWindowMemory).
      # The runner's display is 1024x768 until it's set
      # (Set-DisplayResolution, else ChangeDisplaySettings).
      - name: partial frames' memory on a 1918x1080 window (TestRealWindowMemory)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
          CLACK_REAL_WINDOW_TESTS: "1"
        run: |
          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {
            try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { Write-Host "Set-DisplayResolution: $_" }
          } else {
            Add-Type @'
          using System; using System.Runtime.InteropServices;
          public class ClackDisplay {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra; public int dmFields;
              public int dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels; public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll")] public static extern int EnumDisplaySettings(string dev, int mode, ref DEVMODE dm);
            [DllImport("user32.dll")] public static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
            public static int Set(int w, int h) {
              DEVMODE dm = new DEVMODE(); dm.dmSize = (short)Marshal.SizeOf(dm);
              EnumDisplaySettings(null, -1, ref dm);
              dm.dmPelsWidth = w; dm.dmPelsHeight = h; dm.dmFields = 0x80000 | 0x100000;
              return ChangeDisplaySettings(ref dm, 0);
            }
          }
          '@
            Write-Host "ChangeDisplaySettings: $([ClackDisplay]::Set(1920, 1080))"
          }
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "the display: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
          go test -count=1 -v -timeout 15m -run '^TestRealWindowMemory$' ./internal/ui


  macos:
    if: ${{ !inputs.only || startsWith('macos', inputs.only) }}
    runs-on: macos-latest
    timeout-minutes: 25 # budget, min (p95 33.1 before macos-idle and the idle processes): docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: macOS-only tests (system fonts, AppKit glue, the menu bar)
        run: |
          go test -count=1 -v -run 'TestCodeRunsHaveOutlines|TestCodeSpanAfterEmoji|TestInlineCodeDraws' ./internal/ui/theme ./internal/ui/richview ./internal/ui/composer
          go test -count=1 -v -run 'TestEmoji' ./internal/ui/theme
          go test -count=1 -v -run 'TestOwnProfilePane|TestOtherProfilePane' ./internal/ui/popups
          go test -count=1 -v -run 'TestSwipe|TestNav|TestNativeMenuBar|TestMacMenu|TestMenuState|TestZoom|TestDiagnosticsText|TestMissedFrameLogLine|TestTitleDockTaskbarAgreeLikeSlack|TestMacOptions|TestMacActivation|TestMacNotifier|TestMainWindowOptions|TestCloseHidesWithoutTray|TestMacNavCaption' ./internal/ui
          go test -count=1 -v -run 'TestUserNotification' ./internal/desktop
          go test -count=1 -v ./internal/applog
          go test -count=1 -v ./internal/ui/menubar
          go test -count=1 -v ./internal/ui/screenlock ./internal/ui/globalkey
          # Cmd+Backspace / Cmd+Delete / Option+Backspace in Block Kit text inputs (Gio editor patch 4)
          go test -count=1 -v -run 'TestModalTextInputsEdit$' ./internal/ui/blockkit
          go test -count=1 -v -run 'TestBlockKitModalFieldsEdit$' ./internal/ui
      # Gio patch 49: the inspect freeze's end catches every widget up with
      # the mouse (macOS leaves its id 0), and the tool's freeze of a
      # message body's and a sidebar heading's hovers
      - name: the inspect freeze's pointer reset (Gio patch 49, fakeslack)
        if: ${{ !cancelled() }}
        run: |
          rc=0
          go test -count=1 -v -run '^(TestResetPointers|TestHoverResetPointers)$' gioui.org/io/input gioui.org/gesture || rc=1
          go test -count=1 -v -timeout 10m -run '^TestInspectFreezeResetsHover$' ./internal/ui || rc=1
          exit $rc
      # the plugin engine's wasm memory in address space reserved with mmap,
      # committed with mprotect as it grows, released on Close
      # (internal/jsrt/wasmmem_unix.go): arm64, and amd64 (Intel Macs) under
      # Rosetta 2 (jsrt.yml's platforms job runs the whole package on both)
      - name: jsrt wasm memory (mmap reservation; arm64, then amd64 under Rosetta)
        if: ${{ !cancelled() }}
        run: |
          go test -count=1 -v -run 'TestWasm|TestReserv' ./internal/jsrt
          if /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null; then
            GOARCH=amd64 go test -count=1 -v -run 'TestWasm|TestReserv' ./internal/jsrt
          else
            echo "::warning::no Rosetta 2 on this runner: the amd64 run is jsrt.yml's (macos-15-intel)"
          fi
      # The introduction's preview renderer as a release runs it: clack
      # in a Clack.app made and ad-hoc signed as release.yml makes it,
      # started as `intro-preview` from Contents/MacOS by
      # TestIntroSlackPreview's window: a Metal headless frame, the
      # renderer's report (real components, reads only, no plugin, the
      # user's folder untouched) and its AppKit standing (no
      # NSApplication, never a regular app with a Dock icon, never active);
      # a renderer whose window went cleans up. The beat's shots are the
      # intro-preview-macos artifact.
      - name: the introduction's preview renderer (Clack.app's clack intro-preview, Metal, never an app)
        if: ${{ !cancelled() }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/intro-shots"
          app="$RUNNER_TEMP/intro/Clack.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          go build -o "$app/Contents/MacOS/clack" ./cmd/clack
          cp assets/icon/clack.icns "$app/Contents/Resources/clack.icns"
          sed "s/@VERSION@/0.0.1/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          printf 'APPL????' > "$app/Contents/PkgInfo"
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --deep --sign - --entitlements packaging/macos/Clack.entitlements "$app"
          codesign --verify --deep --strict "$app"
          CLACK_INTRO_PREVIEW_BIN="$app/Contents/MacOS/clack" LOGIN_SHOTS_DIR="$RUNNER_TEMP/intro-shots" \
            go test -count=1 -v -timeout 15m -run '^(TestIntroSlackPreview|TestIntroPreviewPluginHome|TestIntroPreviewQuit|TestIntroPreviewWindowGone)$' ./internal/ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: intro-preview-macos
          path: ${{ runner.temp }}/intro-shots
      # docs/GAPS-2026-11-14.md gap 1 (W33). usernotifyprobe's tests run
      # from Clack.app bundles built the way release.yml builds one, each with
      # its own bundle id so each starts undecided. TestUserNotifyProbe logs
      # what UNUserNotificationCenter answers each kind of bundle (the PROBE
      # lines, and usernoted's log after them): reports, not checks.
      # TestShowUserNotificationInBundle checks internal/desktop's notifier
      # from the release's ad-hoc signed bundle and must pass.
      - name: notifications from ad-hoc signed bundles (UNUserNotificationCenter)
        if: ${{ !cancelled() }}
        run: |
          set -u +e
          go test -c -o build/unprobe.test ./internal/desktop/usernotifyprobe || exit 1
          go test -c -o build/unprobe-rebuilt.test -ldflags "-X github.com/some-du6e/clack/internal/desktop/usernotifyprobe.build=2" ./internal/desktop/usernotifyprobe || exit 1
          sw_vers
          echo "user $(id -un) ($(id -u)); console owner $(stat -f %Su /dev/console)"
          # bundle DIR ID SIGN [BINARY]: a Clack.app as release.yml makes one,
          # the probe's test binary as its executable. SIGN adhoc is the
          # release's codesign --sign - over the bundle; linker leaves only the
          # Go linker's signature on the binary (Info.plist not bound).
          bundle() {
            app=build/$1/Clack.app
            mkdir -p $app/Contents/MacOS $app/Contents/Resources
            cp ${4:-build/unprobe.test} $app/Contents/MacOS/clack
            cp assets/icon/clack.icns $app/Contents/Resources/clack.icns
            sed "s/@VERSION@/0.0.1/g" packaging/macos/Info.plist > $app/Contents/Info.plist
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $2" $app/Contents/Info.plist
            printf 'APPL????' > $app/Contents/PkgInfo
            if [ "$3" = adhoc ]; then
              codesign --force --deep --sign - --entitlements packaging/macos/Clack.entitlements $app
            fi
            codesign -dv --verbose=2 $app 2>&1 | grep -E '^(Identifier|Format|CodeDirectory|CDHash|Signature|TeamIdentifier|Info.plist|Sealed|Runtime)' | sed "s/^/  $1: /"
          }
          probe() { # DIR VARIANT STEPS
            build/$1/Clack.app/Contents/MacOS/clack -test.v -test.timeout 4m -test.run '^TestUserNotifyProbe$' -probe=$2 -probe.steps=$3 -probe.wait=10s
            echo "  exit $?"
          }
          echo "== show: internal/desktop's notifier from the release's bundle"
          bundle show io.github.some-du6e.clack.probe-show adhoc
          build/show/Clack.app/Contents/MacOS/clack -test.v -test.timeout 4m -test.run '^TestShowUserNotificationInBundle$' -probe.show
          shown=$?
          echo "== bare: the test binary outside any bundle"
          build/unprobe.test -test.v -test.timeout 4m -test.run '^TestUserNotifyProbe$' -probe=bare -probe.steps=provisional
          echo "== adhoc-prompt: Clack's bundle id, signed as the release is, run from Contents/MacOS"
          bundle adhoc io.github.some-du6e.clack adhoc
          probe adhoc adhoc-prompt prompt,post
          echo "== adhoc-provisional: the same with provisional authorization (no prompt)"
          bundle prov io.github.some-du6e.clack.probe-provisional adhoc
          probe prov adhoc-provisional provisional,post
          echo "== adhoc-update: that bundle with a rebuilt binary in place (a new cdhash, as an update has)"
          bundle prov io.github.some-du6e.clack.probe-provisional adhoc build/unprobe-rebuilt.test
          probe prov adhoc-update none
          echo "== linker-provisional: no bundle signature"
          bundle linker io.github.some-du6e.clack.probe-linker linker
          probe linker linker-provisional provisional,post
          echo "== adhoc-open: launched through LaunchServices (open), as Finder and the Dock launch it"
          bundle open io.github.some-du6e.clack.probe-open adhoc
          out=$(mktemp -d)
          open -W -n --stdout "$out/open.out" --stderr "$out/open.err" build/open/Clack.app --args -test.v -test.timeout 4m -test.run '^TestUserNotifyProbe$' -probe=adhoc-open -probe.steps=prompt,post -probe.wait=10s
          echo "  open exit $?"
          cat "$out/open.out" "$out/open.err"
          echo "== usernoted's log"
          log show --last 10m --style compact --predicate 'process == "usernoted" OR subsystem BEGINSWITH "com.apple.UserNotifications"' | grep -i -E 'some-du6e|clack|unprobe' | tail -200
          exit $shown
      # docs/GAPS-2026-11-14.md gaps 3 and 4 (W35). Gio patch 24 on real
      # NSWindows: the hidden title bar (content under it, the traffic
      # lights at {12, 12} through a title change, a resize and a key
      # change), where AppKit sends a click in the title bar band, a
      # double-click on a drag area per AppleActionOnDoubleClick, Hide and
      # the shows after it, Hide in full screen. Then Clack's own window:
      # the red button and ⌘W hide it, the Dock's reopen and the app's
      # activation show it, ⌘Q quits it while hidden. TestMain runs app.Main
      # on the main goroutine for these (CLACK_MACOS_WINDOW_TESTS).
      - name: macOS window (Gio patch 24, W35)
        if: ${{ !cancelled() }}
        env:
          CLACK_MACOS_WINDOW_TESTS: "1"
        run: |
          set +e
          sw_vers
