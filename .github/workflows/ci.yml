name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config

permissions:
  contents: read

jobs:
  # gofmt, vet and the linux binary. The linux work that used to be one
  # job (21 min, all of it serial) is these linux-* jobs, in parallel.
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: vet
        run: go vet ./...
      - name: build
        if: ${{ !cancelled() }}
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -o dist/clack-linux-amd64 ./cmd/clack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: clack-linux-amd64
          path: dist/clack-linux-amd64

  # `go test ./...`, split: internal/ui's and internal/ui/messages' top-level
  # tests hashed by name into 4 shards (test-shard.py), every other package
  # in the rest shard. linux-coverage checks the shards ran every test.
  linux-test:
    runs-on: ubuntu-latest
    name: linux-test (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4, rest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: test (${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
          HEAVY: github.com/some-du6e/clack/internal/ui,github.com/some-du6e/clack/internal/ui/messages
        run: |
          if [ "$SHARD" = rest ]; then set -- --rest; else set -- --shard "$SHARD"; fi
          python3 .github/scripts/test-shard.py run --heavy "$HEAVY" "$@" --out "$RUNNER_TEMP/shard"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: test-shard-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shard
          retention-days: 7

  # Fails unless every package finished in its shard and each of the
  # split packages' tests ran exactly once across the shards.
  linux-coverage:
    needs: linux-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: test-shard-*
          path: ${{ runner.temp }}/shards
      - name: every test ran in some shard
        run: python3 .github/scripts/test-shard.py check "$RUNNER_TEMP"/shards/test-shard-*

  # Gio patches on the vendored gioui.org, Xvfb and Mesa's llvmpipe
  linux-gio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      # Gio patch 11 (third_party/gioui.org/CLACK_PATCHES.md): OS file-drop
      # events through Window.Event, text/uri-list parsing (X11, Wayland)
      - name: Gio file-drop events (vendored gioui.org/app)
        if: ${{ !cancelled() }}
        run: go test -count=1 -v -run 'FileDrop|URIList' gioui.org/app
      # Gio patches 18 and 19: the router's and the renderer's per-frame
      # buffers let go of earlier frames' tags and images, the shaper of the
      # text it shaped
      - name: Gio lets go of what earlier frames held (vendored gioui.org/io/input, gpu, text)
        if: ${{ !cancelled() }}
        run: go test -count=1 -v -run 'ReleasesTagsOfEarlierFrames|ReleaseImagesOfEarlierFrames|ShaperReleasesSource' gioui.org/io/input gioui.org/gpu gioui.org/text
      # Gio patch 21: a hover-only Source (the inspect tool lays the window
      # out with one): hover, scroll and focus stay, clicks and keys don't
      - name: Gio hover-only input (vendored gioui.org/io/input)
        if: ${{ !cancelled() }}
        run: go test -count=1 -v -run 'HoverOnly' gioui.org/io/input
      # Gio patch 22: what each point of a window with a hidden title bar
      # is (the caption buttons, the top band, the caption, the client);
      # the Windows codes on real windows are windows-applog's
      - name: Gio hidden title bar hit test (vendored gioui.org/app)
        if: ${{ !cancelled() }}
        run: go test -count=1 -v -run 'TestCaptionHit|TestHiddenTitleBarOption' gioui.org/app
      # the X11 path on a real X server: python-xlib plays a file manager's
      # XDND source against a Gio window (enter, positions, drop, leave)
      - name: XDND file drops on Xvfb (Gio patch 11)
        if: ${{ !cancelled() }}
        env:
          CLACK_X11_DROP_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq xvfb libgl1-mesa-dri libegl-mesa0 python3-xlib
          xvfb-run -a go test -count=1 -v -timeout 5m -run 'TestXDNDFileDrop' gioui.org/app
      - name: pixel tests (Mesa llvmpipe)
        env:
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq xvfb libgl1-mesa-dri libegl-mesa0
          # -p 1: test binaries bringing up Mesa's EGL at once is what made
          # eglInitialize fail (0x3001); pixeltest.NewWindow also retries.
          # TestTextMatchesChrome: text against Chrome 156's (theme/testdata/text-render; font-shots' text-render jobs re-measure it)
          xvfb-run -a go test -p 1 -count=1 -run 'TestCodeSpanAfterEmoji|TestInlineCodeDraws|TestEmojiTooltip|TestReactionTooltipDraws|TestPlaceholderHashMatchesText|TestSlugPillNotUnderlined|TestDecorationShots|TestTextMatchesChrome' ./internal/ui/richview ./internal/ui/composer ./internal/ui/messages ./internal/ui/theme
      - name: Gio drawLayers fix (patched passes, stock v0.10.3 panics)
        env:
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: .github/scripts/gio-layer-fix.sh xvfb-run -a

  linux-race-taut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: plugins start in parallel with boot (race detector; the JS engine is one wasm instance)
        run: go test -race -count=1 -timeout 30m ./internal/taut ./internal/slick

  linux-race-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: sign-out stops all traffic (50 runs, race detector)
        run: go test -race -count=50 -run 'TestAuthFailedStopsCore$' ./internal/core
      - name: plugins start in parallel with boot, 20 runs (race detector)
        run: go test -race -count=20 -run 'TestPluginsStartBeforeBoot$' ./internal/taut

  linux-idle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      # Idle: the client left alone for 10 s per surface (channel, thread,
      # Activity, Preferences, the sidebar with unreads, the huddle window),
      # with and without reduced motion; fails past a caret's blinks plus
      # a clock tick, and logs who asked for every frame.
      - name: idle frames (TestIdleFrames, TestHuddleWindowIdleFrames)
        if: ${{ !cancelled() }}
        env:
          CLACK_IDLE_FRAMES: "1"
        run: go test -count=1 -v -timeout 20m -run '^(TestIdleFrames|TestHuddleWindowIdleFrames)$' ./internal/ui ./internal/ui/huddleui

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: resources (icon #1, manifest, version info)
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --in packaging/windows/winres.json --out cmd/clack/rsrc --arch amd64 --file-version 0.0.0.0 --product-version "0.0.0-dev+${GITHUB_SHA::7}"
      - name: mingw (cgo, for miniaudio huddle audio)
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq gcc-mingw-w64-x86-64
      - name: build (cross, cgo via mingw)
        run: |
          mkdir -p dist
          CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H windowsgui" -o dist/clack-windows-amd64.exe ./cmd/clack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clack-windows-amd64
          path: dist/clack-windows-amd64.exe


  # the log file on Windows: %LOCALAPPDATA% paths, renames while rotating;
  # the OS hooks, the clipboard, OS file drops, typed text, the reply box gap,
  # the frameless window's title bar.
  # The windows-applog steps run in four windows-* jobs, each on its own
  # runner and desktop session; the steps that change the runner's
  # registry, shell and Notification Center state (windows-shell) keep
  # their order.
  windows-applog:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: applog tests
        run: go test -count=1 -v ./internal/applog
      - name: huddle OS hooks (WTS lock events, RegisterHotKey Ctrl+Shift+Space)
        if: ${{ !cancelled() }}
        run: go test -count=1 -v ./internal/ui/screenlock ./internal/ui/globalkey
      # PowerShell puts a bitmap, a PNG, rich text and an Explorer file list
      # on the real clipboard; the composer's paste reader takes them back.
      - name: clipboard paste (CF_DIB/CF_DIBV5, "PNG", CF_HDROP)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_CLIPBOARD_TESTS: "1"
        run: go test -count=1 -v -run 'TestWinClipboard|TestDIBToPNG|TestParseHDROP|TestRichCopy' ./internal/ui/composer
      # A copy as Slack's desktop app makes it: text, "HTML Format" and the
      # custom types (slack/html, slack/texty) in Chromium's web custom data.
      - name: rich copy (CF_UNICODETEXT, HTML Format, Chromium Web Custom MIME Data Format)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_CLIPBOARD_TESTS: "1"
        run: go test -count=1 -v -run 'TestWinRichCopy|TestEncodeCustom|TestCFHTML' ./internal/ui/richclip
      # Files dragged onto a Gio window by another process through OLE
      # (PowerShell C#: DoDragDrop with a CF_HDROP DataObject, moving the
      # cursor), Esc's cancel, and WM_DROPFILES (Gio patch 11).
      - name: OS file drops (IDropTarget across processes, WM_DROPFILES)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_DROP_TESTS: "1"
        run: go test -count=1 -v -timeout 10m -run 'TestOLEFileDrop|TestWMDropFiles|FileDrop|URIList' gioui.org/app
      # SendInput Shift+1 and A onto a Gio window whose focused tag isn't an
      # editor (a list, like Threads'): the key.Event, then WM_CHAR's text
      # as a key.EditEvent to the same tag (gap-w26's shifted symbols).
      - name: typed text on a focused list (SendInput, WM_KEYDOWN then WM_CHAR)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_KEY_TESTS: "1"
        run: go test -count=1 -v -timeout 5m -run 'TestWinKeyText' gioui.org/app
      # Karim's 2026-11-12 report came from Windows (gap-w29): the thread
      # pane's reply box 12px under the last reply, laid out with the
      # Windows build's fonts and text shaping on internal/fakeslack (no
      # GPU here: the geometry, not the pixels; threads-audit has those).
      - name: thread reply box gap (layout, fakeslack)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
        run: |
          go test -count=1 -v -run '^TestThreadComposerTopMargin$' ./internal/ui/composer
          go test -count=1 -v -timeout 10m -run '^TestThreadsAuditReplyGap$' ./internal/ui
      # Slack's frameless window (gap 2, W34). Gio patch 22's HiddenTitleBar
      # on real windows: no caption over the client area, WM_NCHITTEST for
      # the caption buttons (HTMAXBUTTON: Snap Layouts), the caption and the
      # top edge, the buttons' input reaching Gio's widgets through
      # SendInput and not run by Windows. Then App.Run's own window signed
      # in to internal/fakeslack: Electron's caption buttons over the top
      # nav (light and dark, hovered), maximize and restore, a double-click
      # on the nav, close to the tray, Slack's 668x400 minimum.
      # Screenshots of the window's top go in titlebar-shots.
      - name: the title bar (HiddenTitleBar, Clack's caption buttons over the top nav)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_TITLEBAR_TESTS: "1"
          CLACK_TITLEBAR_SHOTS: ${{ runner.temp }}\titlebar-shots
        run: |
          go test -count=1 -v -timeout 10m -run 'TestCaptionHit|TestHiddenTitleBar' gioui.org/app
          go test -count=1 -v -timeout 15m -run '^(TestTitleBarWindow|TestMainWindowOptions|TestWcoGeometry|TestWcoThemeText)$' ./internal/ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: titlebar-shots
          path: ${{ runner.temp }}/titlebar-shots
          if-no-files-found: ignore

  # Clack's slack:// registration and the single-instance hand-off, close to
  # the tray, toasts, the taskbar
  windows-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: slack:// handler (HKCU registration, the shell's list of slack:// handlers, the hand-off over the instance socket)
        if: ${{ !cancelled() }}
        env:
          CLACK_WINDOWS_ASSOC_TESTS: "1" # TestURLHandlerShell changes the runner user's slack:// association
        run: go test -count=1 -v -run 'TestURLHandler|TestHandlerCommands|TestForwardOnWindows|TestURLLaunchArgs' ./internal/desktop
      # The real exe: it registers itself at start (reg query), Windows
      # routes `start slack://…` to it (nothing else on the runner has
      # slack://), and the running Clack takes the link from the launch
      # Windows started. slack://T0FAKE/… fails ParseMagicLink (team ids are
      # 9+ characters), so the sign-in stops before any request: nothing
      # here talks to Slack.
      - name: Clack.exe and slack:// links (registration at start, start slack://… reaching the running Clack, the flags)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go install github.com/tc-hib/go-winres@v0.3.3
          & (Join-Path (go env GOPATH) 'bin\go-winres.exe') make --in packaging/windows/winres.json --out cmd/clack/rsrc --arch amd64 --file-version 0.0.0.0 --product-version 0.0.0-ci
          if ($LASTEXITCODE -ne 0) { throw 'go-winres' }
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags="-s -w -H windowsgui" -o build\Clack.exe .\cmd\clack
          if ($LASTEXITCODE -ne 0) { throw 'go build' }
          $exe = (Resolve-Path build\Clack.exe).Path
          $cmd = "`"$exe`" `"%1`""
          $log = Join-Path $env:LOCALAPPDATA 'Clack\logs\clack.log'
          $script:mark = 0
          function Mark-Log { $script:mark = if (Test-Path $log) { @(Get-Content $log).Count } else { 0 } }
          function Wait-Log([string]$text, [string]$what, [int]$secs = 90) {
            for ($i = 0; $i -lt $secs * 4; $i++) {
              if ((Test-Path $log) -and (@(Get-Content $log | Select-Object -Skip $script:mark) | Where-Object { $_.Contains($text) })) { return }
              Start-Sleep -Milliseconds 250
            }
            if (Test-Path $log) { Get-Content $log | Select-Object -Skip $script:mark | Select-Object -Last 80 }
            throw "no '$text' in the log after ${secs}s: $what"
          }
          function Assert-Reg([string]$key, [string]$value, [string]$want) {
            $a = if ($value -eq '') { @($key, '/ve') } else { @($key, '/v', $value) }
            $out = (& reg query @a 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "reg query $key [$value]: $out" }
            Write-Host $out.Trim()
            if (-not $out.Contains($want)) { throw "reg query $key [$value]: want '$want'" }
          }
          function Assert-NoReg([string]$key, [string]$value) {
            $a = if ($value) { @($key, '/v', $value) } else { @($key) }
            $out = (& reg query @a 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0) { throw "reg query $key [$value] still finds: $out" }
          }
          function Stop-Clack($p) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            $p.WaitForExit(15000) | Out-Null
          }

          # nothing on the runner has slack://
          Assert-NoReg 'HKCU\Software\Classes\slack'
          Assert-NoReg 'HKCU\Software\Classes\Clack.slack'

          # 1. A start registers Clack, and takes the legacy key: no other app has slack://
          Mark-Log
          $p = Start-Process -PassThru -FilePath $exe
          try {
            Wait-Log 'desktop: slack:// handler: Clack is registered and is the default' 'the registration at start'
            Assert-Reg 'HKCU\Software\Classes\Clack.slack' 'URL Protocol' 'REG_SZ'
            Assert-Reg 'HKCU\Software\Classes\Clack.slack\shell\open\command' '' $cmd
            Assert-Reg 'HKCU\Software\Classes\Clack.slack\DefaultIcon' '' "`"$exe`",0"
            Assert-Reg 'HKCU\Software\Clack\Capabilities' 'ApplicationName' 'Clack'
            Assert-Reg 'HKCU\Software\Clack\Capabilities' 'ApplicationDescription' 'native Slack client'
            Assert-Reg 'HKCU\Software\Clack\Capabilities\URLAssociations' 'slack' 'Clack.slack'
            Assert-Reg 'HKCU\Software\RegisteredApplications' 'Clack' 'Software\Clack\Capabilities'
            Assert-Reg 'HKCU\Software\Classes\slack' 'URL Protocol' 'REG_SZ'
            Assert-Reg 'HKCU\Software\Classes\slack\shell\open\command' '' $cmd
            Assert-Reg 'HKCU\Software\Classes\slack\OpenWithProgids' 'Clack.slack' 'REG_NONE'

            # 2. Windows starts Clack.exe "slack://…"; that launch hands the link to this one and exits
            Mark-Log
            cmd /c start "" "slack://T0FAKE/magic-login/xyz"
            Wait-Log 'desktop: another launch handed over a slack:// sign-in link' 'the running Clack getting the link'
            Wait-Log 'sign-in: a sign-in link came from outside Clack; signing in with it' 'the sign-in card taking it'
            Wait-Log "sign-in: couldn't read the team and token from the sign-in link" 'the sign-in attempt (the fake link stops it there)'
            if ($p.HasExited) { throw "the first Clack exited ($($p.ExitCode))" }
            for ($i = 0; $i -lt 40 -and @(Get-Process -Name Clack -ErrorAction SilentlyContinue).Count -gt 1; $i++) { Start-Sleep -Milliseconds 250 }
            $n = @(Get-Process -Name Clack -ErrorAction SilentlyContinue).Count
            if ($n -ne 1) { throw "$n Clack processes: the launch Windows started didn't hand over and exit" }
            if (Select-String -Path $log -SimpleMatch -Pattern 'magic-login/xyz' -Quiet) { throw 'the sign-in link is in the log' }
          } finally { Stop-Clack $p }

          # 3. Another app takes the legacy key (as Slack desktop does at its start): Clack's next start leaves it
          $other = Join-Path $env:SystemRoot 'System32\cmd.exe'
          $otherCmd = "`"$other`" /c exit `"%1`""
          Set-ItemProperty -Path 'HKCU:\Software\Classes\slack\shell\open\command' -Name '(default)' -Value $otherCmd
          Mark-Log
          $p = Start-Process -PassThru -FilePath $exe
          try {
            Wait-Log 'has the default, so Windows asks which app to use' 'the registration beside another app'
            Assert-Reg 'HKCU\Software\Classes\slack\shell\open\command' '' $otherCmd
            Assert-Reg 'HKCU\Software\Classes\Clack.slack\shell\open\command' '' $cmd
            Assert-Reg 'HKCU\Software\RegisteredApplications' 'Clack' 'Software\Clack\Capabilities'
          } finally { Stop-Clack $p }

          # 4. -unregister-url-handler removes Clack's keys and leaves the other app's
          $r = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList '-unregister-url-handler'
          if ($r.ExitCode -ne 0) { throw "-unregister-url-handler exited $($r.ExitCode)" }
          Assert-NoReg 'HKCU\Software\Classes\Clack.slack'
          Assert-NoReg 'HKCU\Software\Clack\Capabilities'
          Assert-NoReg 'HKCU\Software\RegisteredApplications' 'Clack'
          Assert-NoReg 'HKCU\Software\Classes\slack\OpenWithProgids' 'Clack.slack'
          Assert-Reg 'HKCU\Software\Classes\slack\shell\open\command' '' $otherCmd

          # 5. -register-url-handler takes the legacy key on request; unregistering then removes it
          $r = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList '-register-url-handler'
          if ($r.ExitCode -ne 0) { throw "-register-url-handler exited $($r.ExitCode)" }
          Assert-Reg 'HKCU\Software\Classes\slack\shell\open\command' '' $cmd
          Assert-Reg 'HKCU\Software\Clack\Capabilities\URLAssociations' 'slack' 'Clack.slack'
          $r = Start-Process -Wait -PassThru -FilePath $exe -ArgumentList '-unregister-url-handler'
          if ($r.ExitCode -ne 0) { throw "-unregister-url-handler exited $($r.ExitCode)" }
          Assert-NoReg 'HKCU\Software\Classes\slack\shell\open\command'
          Assert-NoReg 'HKCU\Software\Classes\Clack.slack'
          Get-Content $log | Select-String -SimpleMatch 'slack://', 'sign-in:' | ForEach-Object { $_.Line }
          exit 0 # the last reg query's expected exit 1 would otherwise end the step

      # Closing the window keeps Clack in the notification area (Slack's
      # runFromTray): Gio patch 13's Window.Hide and the show in
      # ActionRaise on real HWNDs (windowed and maximized), the hidden
      # window's wake-ups without frames, a title or minimum size keeping a
      # hidden or minimized window as it was (patch 20), the caret blink time from
      # GetCaretBlinkTime (set on the runner with SetCaretBlinkTime and put
      # back), the RunFromTray balloon through Shell_NotifyIcon, and
      # App.Run's own window signed in to internal/fakeslack hiding on
      # SC_CLOSE / WM_CLOSE, running posted work while hidden, coming back
      # on Raise and closing on Quit.
      - name: close to the tray (Window.Hide, the tray balloon, runFromTray in App.Run, the caret blink time)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_TRAY_TESTS: "1"
        run: |
          go test -count=1 -v -timeout 10m -run 'TestHideAndRaise|TestHideWithoutDriver|TestCaretBlinkFromOS|TestOptionKeepsHiddenAndMinimized' gioui.org/app
          go test -count=1 -v -run 'TestNotifyIconDataSize|TestTrayBalloon|TestPutUTF16' ./internal/desktop
          go test -count=1 -v -timeout 15m -run '^(TestCloseToTrayWindow|TestCloseToTray|TestRunFromTrayRow|TestDrainIdleRunsPosted)$' ./internal/ui

      # Toasts (WinRT, internal/desktop/toast_windows.go). Windows drops a
      # toast from an app id it doesn't know without an error, so a scratch
      # id shows one without and one with the registration Clack writes
      # (HKCU\Software\Classes\AppUserModelId), and Notification Center's
      # history says which Windows kept. Then UI Automation clicks a toast's
      # button in the shell's toast window: the Activated event has to reach
      # the test process. Screenshots of the desktop go in toast-shots.
      - name: toasts (app id registration, Notification Center, a click through UI Automation)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_TOAST_TESTS: "1"
          CLACK_TOAST_SHOTS: ${{ runner.temp }}\toast-shots
        run: go test -count=1 -v -timeout 10m -run 'TestToast' ./internal/desktop
      # The installer registers Clack's own id (and its icon) for the toasts
      # an installed Clack shows, and the uninstaller removes both.
      - name: toasts from the installed Clack (the installer's app id registration, uninstall)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_TOAST_TESTS: "1"
          CLACK_TOAST_SHOTS: ${{ runner.temp }}\toast-shots
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path build\Clack.exe)) {
            go install github.com/tc-hib/go-winres@v0.3.3
            & (Join-Path (go env GOPATH) 'bin\go-winres.exe') make --in packaging/windows/winres.json --out cmd/clack/rsrc --arch amd64 --file-version 0.0.0.0 --product-version 0.0.0-ci
            go build -trimpath -ldflags="-s -w -H windowsgui" -o build\Clack.exe .\cmd\clack
            if ($LASTEXITCODE -ne 0) { throw 'go build' }
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'choco install innosetup failed' }
          }
          & $iscc /Qp '/DAppVersion=0.0.1' '/DAppVersionNum=0.0.1.0' "/DSourceExe=$PWD\build\Clack.exe" "/DOutputDir=$PWD\dist" packaging\windows\clack.iss
          if ($LASTEXITCODE -ne 0) { throw 'iscc failed' }
          $key = 'HKCU:\Software\Classes\AppUserModelId\io.github.some-du6e.clack'
          $png = Join-Path $env:LOCALAPPDATA 'Clack\clack.png'
          if (Test-Path $key) { throw "$key exists before the install" }
          $p = Start-Process -Wait -PassThru -FilePath (Get-Item dist\Clack-0.0.1-windows-amd64-setup.exe).FullName -ArgumentList '/VERYSILENT', '/CURRENTUSER', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($p.ExitCode -ne 0) { throw "setup exited $($p.ExitCode)" }
          $k = Get-ItemProperty $key
          Write-Host "DisplayName '$($k.DisplayName)', IconUri '$($k.IconUri)'"
          if ($k.DisplayName -ne 'Clack') { throw "DisplayName is '$($k.DisplayName)'" }
          if ($k.IconUri -ne $png) { throw "IconUri is '$($k.IconUri)', want '$png'" }
          if (-not (Test-Path $png)) { throw "no $png" }
          $env:CLACK_TOAST_INSTALLED = '1'
          go test -count=1 -v -run 'TestToastInstalledAUMID' ./internal/desktop
          if ($LASTEXITCODE -ne 0) { throw 'TestToastInstalledAUMID' }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Clack'
          Start-Process -Wait -FilePath "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # the uninstaller finishes from a temp copy of itself: wait for its keys to go
          for ($i = 0; $i -lt 120 -and (Test-Path $key); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $key) { throw "uninstall left $key" }
          for ($i = 0; $i -lt 20 -and (Test-Path $png); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $png) { throw "uninstall left $png" }
      # Clack's own toasts (internal/ui notify_windows_test.go): the WinRT
      # notifier shows a fakeslack DM's toast, UI Automation types into its
      # reply box and clicks a second DM's toast in Notification Center, and
      # Clack sends the reply and opens the DM.
      - name: Clack's toasts (a fakeslack DM's toast clicked opens the DM; the reply box sends)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_TOAST_TESTS: "1"
          CLACK_TOAST_SHOTS: ${{ runner.temp }}\toast-shots
        run: go test -count=1 -v -timeout 15m -run '^TestWindowsToast' ./internal/ui
      # The taskbar button (gap-w19, internal/desktop/taskbar_windows.go,
      # internal/ui/dock.go): Slack's unread badge as the overlay icon
      # through ITaskbarList3 (S_OK, and the HICON's pixels read back), the
      # frame flash as the shell hears it (HSHELL_FLASH through
      # RegisterShellHookWindow), the "idle" flash's show-inactive and
      # minimize of a window hidden to the tray, GetLastInputInfo's idle
      # time after a SendInput, and App.Run's own window doing all of it
      # from Clack's count, close and notification paths. Screenshots of
      # the taskbar go in toast-shots.
      - name: taskbar (the unread badge overlay, the frame flash, windowFlashBehavior's close and revive)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_TASKBAR_TESTS: "1"
          CLACK_TOAST_SHOTS: ${{ runner.temp }}\toast-shots
          BADGE_SHOTS_DIR: ${{ runner.temp }}\toast-shots
        run: |
          go test -count=1 -v -timeout 10m -run 'TestTaskbar|TestSystemIdleTime|TestBadge|TestLanczos' ./internal/desktop
          go test -count=1 -v -timeout 15m -run '^(TestTaskbarWindow|TestTaskbarOverlayFollowsCount|TestFlashOnNotification|TestCloseKeepsAppInTaskbar|TestWindowsAppearancePref|TestCloseToTray|TestTitleDockTaskbarAgreeLikeSlack)$' ./internal/ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: toast-shots
          path: ${{ runner.temp }}/toast-shots
          if-no-files-found: ignore


  windows-scroll:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # Wheel scrolling on Windows: frame times while synthetic mouse-wheel
      # notches scroll a long fakeslack channel at 60 Hz (layout, and the
      # Direct3D 11 render when the runner has a device). The numbers are
      # in the log; nothing fails on them.
      - name: wheel scrolling frame times (internal/ui TestWheelFrameProbe)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
          CLACK_WHEEL_PROBE: "1"
          CLACK_BENCH_GPU: "1"
        run: go test -count=1 -v -timeout 30m -run '^TestWheelFrameProbe$' ./internal/ui

      # Middle-click autoscroll (Gio patch 14), on by default on Windows as
      # in Chromium: the router tests, Chromium's panning cursors made from
      # their .cur files, and SendInput's real middle button held and
      # clicked over a long fakeslack channel in Clack's own window.
      - name: middle-click autoscroll (TestPanCursors, internal/ui/autoscroll, SendInput on Clack's window)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
          CLACK_WINDOWS_AUTOSCROLL_TESTS: "1"
        run: |
          go test -count=1 -v -run '^TestPanCursors$' gioui.org/app
          go test -count=1 -v ./internal/ui/autoscroll
          go test -count=1 -v -timeout 10m -run '^(TestAutoscrollWindow|TestAutoscrollInClack)$' ./internal/ui


  windows-idle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # The idle-frame budget on Windows (see linux-idle).
      - name: idle frames (TestIdleFrames, TestHuddleWindowIdleFrames)
        if: ${{ !cancelled() }}
        env:
          CGO_ENABLED: "0"
          CLACK_IDLE_FRAMES: "1"
        run: go test -count=1 -v -timeout 20m -run '^(TestIdleFrames|TestHuddleWindowIdleFrames)$' ./internal/ui ./internal/ui/huddleui


  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # docs/GAPS-2026-11-14.md gap 1 (W33): can an ad-hoc signed Clack.app
      # get UNUserNotificationCenter authorization? usernotifyprobe's test
      # runs from Clack.app bundles built the way release.yml builds one,
      # each with its own bundle id so each starts undecided, and logs what
      # the center answers (the PROBE lines). The answers are the result: the
      # step fails only when the probe doesn't build.
      - name: notification probe (UNUserNotificationCenter in ad-hoc signed bundles)
        run: |
          set -u
          out=$PWD/build/notify-probe
          mkdir -p "$out"
          go test -c -o build/unprobe.test ./internal/desktop/usernotifyprobe || exit 1
          go test -c -o build/unprobe-rebuilt.test -ldflags "-X github.com/some-du6e/clack/internal/desktop/usernotifyprobe.build=2" ./internal/desktop/usernotifyprobe || exit 1
          sw_vers
          echo "user $(id -un) ($(id -u)); console owner $(stat -f %Su /dev/console)"
          launchctl print gui/$(id -u) 2>&1 | head -3
          # bundle DIR ID SIGN [BINARY]: a Clack.app as release.yml makes one,
          # the probe's test binary as its executable. SIGN adhoc is the
          # release's codesign --sign - over the bundle; linker leaves only the
          # Go linker's signature on the binary (Info.plist not bound).
          bundle() {
            app=build/$1/Clack.app
            mkdir -p $app/Contents/MacOS $app/Contents/Resources
            cp ${4:-build/unprobe.test} $app/Contents/MacOS/clack
            cp assets/icon/clack.icns $app/Contents/Resources/clack.icns
            sed "s/@VERSION@/0.0.1/g" packaging/macos/Info.plist > $app/Contents/Info.plist
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $2" $app/Contents/Info.plist
            printf 'APPL????' > $app/Contents/PkgInfo
            if [ "$3" = adhoc ]; then
              codesign --force --deep --sign - --entitlements packaging/macos/Clack.entitlements $app
            fi
            codesign -dv --verbose=2 $app 2>&1 | grep -E '^(Identifier|Format|CodeDirectory|CDHash|Signature|TeamIdentifier|Info.plist|Sealed|Runtime)' | sed "s/^/  $1: /"
          }
          probe() { # DIR VARIANT STEPS
            build/$1/Clack.app/Contents/MacOS/clack -test.v -test.timeout 4m -test.run '^TestUserNotifyProbe$' -probe=$2 -probe.steps=$3 -probe.out="$out"
            echo "  exit $?"
          }
          echo "== bare: the test binary outside any bundle"
          build/unprobe.test -test.v -test.timeout 4m -test.run '^TestUserNotifyProbe$' -probe=bare -probe.steps=provisional -probe.out="$out"
          echo "== adhoc-prompt: Clack's bundle id, signed as the release is, run from Contents/MacOS"
          bundle adhoc io.github.some-du6e.clack adhoc
          probe adhoc adhoc-prompt prompt,post
          echo "== adhoc-provisional: the same with provisional authorization (no prompt)"
          bundle prov io.github.some-du6e.clack.probe-provisional adhoc
          probe prov adhoc-provisional provisional,post
          echo "== adhoc-update: that bundle with a rebuilt binary in place (a new cdhash, as an update has)"
          bundle prov io.github.some-du6e.clack.probe-provisional adhoc build/unprobe-rebuilt.test
          probe prov adhoc-update none
          echo "== linker-provisional: no bundle signature"
          bundle linker io.github.some-du6e.clack.probe-linker linker
          probe linker linker-provisional provisional,post
          echo "== adhoc-open: launched through LaunchServices (open), as Finder and the Dock launch it"
          bundle open io.github.some-du6e.clack.probe-open adhoc
          open -W -n --stdout "$out/open.out" --stderr "$out/open.err" build/open/Clack.app --args -test.v -test.timeout 4m -test.run '^TestUserNotifyProbe$' -probe=adhoc-open -probe.steps=prompt,post -probe.out="$out"
          echo "  open exit $?"
          cat "$out/open.out" "$out/open.err"
          echo "== control: osascript's display notification (Apple-signed)"
          osascript -e 'display notification "osascript control" with title "Clack probe"'
          echo "  osascript exit $?"
          sleep 3
          screencapture -x "$out/control-osascript.png"
          echo "  screencapture exit $?"
          echo "== Notification Center's records of the probe bundles (com.apple.ncprefs)"
          plutil -p ~/Library/Preferences/com.apple.ncprefs.plist | grep -B3 -A14 'some-du6e' | head -200
          echo "== usernoted's log"
          log show --last 10m --style compact --predicate 'process == "usernoted" OR subsystem BEGINSWITH "com.apple.UserNotifications"' | grep -i -E 'some-du6e|clack|unprobe' | tail -200
          ls -la "$out"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: notify-probe
          path: build/notify-probe
          if-no-files-found: ignore
      - name: macOS-only tests (system fonts, AppKit glue, the menu bar)
        run: |
          go test -count=1 -v -run 'TestCodeRunsHaveOutlines|TestCodeSpanAfterEmoji|TestInlineCodeDraws' ./internal/ui/theme ./internal/ui/richview ./internal/ui/composer
          go test -count=1 -v -run 'TestEmoji' ./internal/ui/theme
          go test -count=1 -v -run 'TestOwnProfilePane|TestOtherProfilePane' ./internal/ui/popups
          go test -count=1 -v -run 'TestSwipe|TestNav|TestNativeMenuBar|TestMacMenu|TestMenuState|TestZoom|TestDiagnosticsText|TestMissedFrameLogLine|TestTitleDockTaskbarAgreeLikeSlack' ./internal/ui
          go test -count=1 -v ./internal/applog
          go test -count=1 -v ./internal/ui/menubar
          go test -count=1 -v ./internal/ui/screenlock ./internal/ui/globalkey
          # Cmd+Backspace / Cmd+Delete / Option+Backspace in Block Kit text inputs (Gio editor patch 4)
          go test -count=1 -v -run 'TestModalTextInputsEdit$' ./internal/ui/blockkit
          go test -count=1 -v -run 'TestBlockKitModalFieldsEdit$' ./internal/ui
      - name: Gio drawLayers fix on Metal (patched passes, stock v0.10.3 panics)
        env:
          CLACK_PIXEL_TESTS: "1"
        run: .github/scripts/gio-layer-fix.sh
      - name: macOS freeze guards (no blocking work on the AppKit main thread)
        run: |
          go test -count=1 -v ./internal/ui/uiguard
          go test -count=1 -v -run 'TestThemeMapping|TestHCTSolveBounded|TestParseIAThemeJunk|FuzzIATheme' ./internal/ui/theme
          go test -count=1 -v -run 'TestNoExecOnUIPaths|TestOSPrefersDarkOffUI|TestOSSchemeFollow|TestWatchdogReport|TestTakeShaperDoesNotWait|TestAccountTheme|TestAppearancePageDraws|TestFormatWithMarkupPref' ./internal/ui
          go test -count=1 -timeout 20m -v -run 'TestStartupStatesNeverBlock|TestStartupWithHangingTools|TestEveryExecSetsWaitDelay' ./internal/ui
          go test -count=1 -v -run 'Paste|TestAttRunHangingChild' ./internal/ui/composer
      - name: build
        if: ${{ !cancelled() }}
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -ldflags="-s -w" -o dist/clack-darwin-arm64 ./cmd/clack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clack-darwin-arm64
          path: dist/clack-darwin-arm64
