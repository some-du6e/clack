  # the log file on Windows: %LOCALAPPDATA% paths, renames while rotating;
  # the OS hooks, the clipboard, OS file drops, typed text, the reply box gap,
  # the frameless window's title bar.
  # The windows-applog steps run in four windows-* jobs, each on its own
  # runner and desktop session; the steps that change the runner's
  # registry, shell and Notification Center state (windows-shell) keep
  # their order.
  windows-applog:
    if: ${{ !inputs.only || startsWith('windows-applog', inputs.only) }}
    runs-on: windows-latest
    timeout-minutes: 20 # budget, min (p95 10.5): docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: applog tests
        run: go test -count=1 -v ./internal/applog
      # Gio patches 37-44 on Direct3D 11 (WARP): the state caches change no
      # pixel, the window's drawing held to the old way (theme's
      # TestFrameCostPixels), shared layer pages, sub-pixel paths, atlas
      # pages; patch 46: partial frames are the whole frame's pixels, the
      # frame texture's copy included (TestClackPartial*); patch 51: a
      # shader resource view the device made, drawn as an external image,
      # gives an ImageOp's pixels, wrapped once per key, a new key damaging
      # only its op; linux-gio runs them on llvmpipe, macos-idle on Metal
      - name: Gio frame cost on Direct3D 11 (WARP)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CGO_ENABLED: "0"
          CLACK_PIXEL_TESTS: "1"
        run: |
          go test -count=1 -v -timeout 15m -run '^(TestClackAtlasShrinks|TestClackAtlasShrinksUsedNowAndThen|TestClackAtlasGrowKeepsSize|TestClackStateCacheIdentical|TestClackLayerPages|TestClackSubPixelCache|TestClackSplitsUnderTransform|TestClackPartialFrames|TestClackPartialSameOps|TestClackPartialDamageRects|TestClackPartialSpinner|TestClackExternalImage|TestClackExternalKeys|TestClackExternalPartial|TestClackSetSize|TestClackRollbackKeys)$' gioui.org/gpu/headless
          go test -count=1 -v -timeout 25m -run '^(TestFrameCostPixels|TestFrameCostSeams)$' ./internal/ui/theme
