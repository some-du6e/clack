name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: |
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o dist/yoloslack-$os-$arch$ext ./cmd/yoloslack
          done
      - uses: actions/upload-artifact@v4
        with:
          name: yoloslack-linux-amd64
          path: dist/yoloslack-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: yoloslack-all
          path: dist/
