name: menus-tooltips
# Menus, selects, buttons and tooltips (docs/EXPERIMENTS.md "Menus, selects
# and buttons", docs/MESSAGES-AUDIT.md's menu rows): the theme's tooltip
# (the dark mode outline) and Slack Kit v2 Button through Gio's GPU renderer
# (Mesa llvmpipe), the message menu's Slack rows and the select toggles
# over internal/fakeslack, and screenshots of them, light and dark
# (menus-tooltips-shots artifact: synthetic content only). Nothing here
# talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run menus-tooltips.yml --ref <branch>)
    paths:
      - "internal/ui/theme/tooltip*.go"
      - "internal/ui/theme/button*.go"
      - "internal/ui/popups/menu.go"
      - "internal/ui/popups/menu_badge.go"
      - "internal/ui/popups/button_v2.go"
      - "internal/ui/popups/experiments.go"
      - "internal/ui/popups/exp_menus_test.go"
      - "internal/ui/popups/exp_menus_shots_test.go"
      - "internal/ui/popups/actions_message.go"
      - "internal/ui/popups/optionlist.go"
      - "internal/core/message_menu.go"
      - ".github/workflows/menus-tooltips.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  menus-tooltips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS fonts-lato
      - name: tests and screenshots
        env:
          EXP_MENUS_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          CLACK_PIXEL_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          mkdir -p "$EXP_MENUS_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestTooltip|TestButtonV2' ./internal/ui/theme
          xvfb-run -a go test -count=1 -v -run 'TestEmojiTooltip|TestCSSEmojiTooltip' ./internal/ui/richview
          xvfb-run -a go test -count=1 -v -timeout 15m -run 'TestMessageMenuSlack|TestClientExtras|TestSessionToggleGroups|TestSlackKitV2Button|TestForwardPicker|TestSelectListToggles|TestMenuTagAndBadge|TestTooltipColorsFromTheme|TestNotifyMenuCustomizedTag|TestExpMenusShots' ./internal/ui/popups
          ls -la "$EXP_MENUS_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: menus-tooltips-shots
          path: dist/shots
