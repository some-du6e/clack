name: activity-shots
# Renders the Activity feed headlessly from the synthetic fixture
# (internal/core/testdata/activity_feed.json: one entry per activity.feed
# item type) in Detailed and Dense, light and dark, and uploads the
# screenshots. Nothing here talks to Slack.
on:
  push:
    paths:
      - "internal/ui/views/activity*.go"
      - "internal/core/activity*.go"
      - "internal/core/testdata/activity_feed.json"
      - ".github/workflows/activity-shots.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  activity-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: activity feed screenshots
        env:
          ACTIVITY_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          mkdir -p "$ACTIVITY_SHOTS_DIR"
          go test -count=1 -v -run 'TestActivityItemShapes' ./internal/core
          xvfb-run -a go test -count=1 -v -run 'TestActivityEveryItemTypeRenders' ./internal/ui/views
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: activity-shots
          path: dist/shots
