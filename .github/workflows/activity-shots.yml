name: activity-shots
# Renders the Activity feed headlessly from the synthetic fixture
# (internal/core/testdata/activity_feed.json: one entry per activity.feed
# item type) in Detailed and Dense, light and dark, plus the hover bar,
# the item menu and the "Clear all before" dialog, runs the Activity
# parity tests (core against internal/fakeslack's feed, the view's
# clicks, menus and filters) and uploads the screenshots. The side-*.png
# side-by-sides put Clack's Dense and Detailed rows next to the same rows
# in Slack's markup under Slack's shipping CSS (client-boot-styles, the
# public CDN file) and design tokens (.github/scripts/activity_ref.py).
# Nothing here talks to Slack's API or opens the Slack client.
on:
  push:
    paths:
      - "internal/ui/views/activity*.go"
      - "internal/core/activity*.go"
      - "internal/core/testdata/activity_feed.json"
      - "internal/core/manage.go"
      - "internal/fakeslack/activity.go"
      - "internal/fakeslack/views.go"
      - "internal/ui/popups/activity_exports.go"
      - "internal/ui/views/kit.go"
      - "internal/ui/theme/account.go"
      - ".github/scripts/activity_ref.py"
      - ".github/workflows/activity-shots.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  activity-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS fonts-lato
      - name: activity feed screenshots
        env:
          ACTIVITY_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          VIEWS_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          mkdir -p "$ACTIVITY_SHOTS_DIR"
          go test -count=1 -v -run 'TestActivityItemShapes|TestActivityFakeslack|TestActivityClearBefore|TestActivityFeedParams|TestActivityDensityRoundTrip|TestActivityInvite|TestActivityReminderWrites|TestActivityClearAllViewsAndSuppress|TestActivityRepliedReacted' ./internal/core
          xvfb-run -a go test -count=1 -v -run 'TestActivity' ./internal/ui/views
      - name: side-by-sides with Slack's CSS
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p /tmp/slack-ref
          curl -sfL --compressed --retry 5 -o /tmp/slack-ref/client-boot-styles.css https://a.slack-edge.com/bv1-13-br/client-boot-styles.cf726c4f2eaecc74.min.css
          curl -sfL --retry 5 -o /tmp/slack-ref/icons.json https://raw.githubusercontent.com/IzieStratt/slack-datamine-plus/main/build/icons.json
          python3 .github/scripts/activity_ref.py dist/shots /tmp/slack-ref/client-boot-styles.css internal/ui/slackc/css/slackvars.go /tmp/slack-ref/icons.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: activity-shots
          path: dist/shots
