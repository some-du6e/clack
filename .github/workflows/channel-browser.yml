name: channel-browser
# The channel browser and sidebar rows of docs/CHANNELS-AUDIT.md rendered
# headlessly at 1440x900 against internal/fakeslack: the Directories tab
# icons, the Workspaces / Organizations / Title / Location filter popovers
# and pills, and a sidebar row's draft pencil. Synthetic only: nothing here
# talks to Slack.
on:
  push:
    paths:
      - "internal/ui/views/directories.go"
      - "internal/ui/views/dir_filters*.go"
      - "internal/ui/channel_browser_test.go"
      - "internal/ui/directories_wire.go"
      - "internal/ui/sidebar.go"
      - "internal/ui/icons/directory.go"
      - "internal/core/browse*.go"
      - ".github/workflows/channel-browser.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb

permissions:
  contents: read

jobs:
  channel-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: browser and sidebar screenshots
        env:
          PREVIEW_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$PREVIEW_SHOTS_DIR"
          go test -count=1 -v -run 'TestBrowseFilterParams|TestConnectedOrgsAndEnterpriseTeams' ./internal/core
          go test -count=1 -v -run 'TestDir' ./internal/ui/views
          go test -count=1 -v -run 'TestCleanTextKeepsHangulFillers' ./internal/ui/theme
          xvfb-run -a go test -count=1 -v -run 'TestMaybeLeaveChannel' ./internal/ui/popups
          xvfb-run -a go test -count=1 -v -run 'TestChannelBrowserFilters$|TestPeopleBrowserFacetFilters$|TestSidebarDraftPencil$|TestChannelBrowserShot$' ./internal/ui/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: channel-browser-shots
          path: dist/shots
