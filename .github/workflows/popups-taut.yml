name: popups-taut
# Builds the Taut plugins popups' wiring is tested with (CopyReacted,
# QuickJoin, Nicknames, OwlMode, Censorship) with Taut's own `build:user-plugin`, and
# runs internal/ui/popups' Taut tests against them over a synthetic
# workspace and a fake Slack API. The built plugins (GPLv3) are uploaded
# as an artifact and never committed.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run popups-taut.yml --ref <branch>)
    paths:
      - "internal/ui/popups/**"
      - "internal/ui/slackc/**"
      - "internal/taut/**"
      - ".github/workflows/popups-taut.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "taut git ref (branch, tag or sha); empty = TAUT_PIN"
        required: false
        default: ""

# Taut is third-party code (GPLv3) built and run here: by default CI uses the
# reviewed commit TAUT_PIN; dispatch with ref=main (or any ref) to test upstream.
env:
  TAUT_PIN: 6fe5123e3b4cffaa16c6dda71291ad5d82cdad37
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config

permissions:
  contents: read

jobs:
  popups-taut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: clone taut
        env:
          TAUT_REF: ${{ inputs.ref || env.TAUT_PIN }}
        run: |
          git clone -q https://github.com/jeremy46231/taut /tmp/taut
          case "$TAUT_REF" in -*|"") echo "bad taut ref: $TAUT_REF" >&2; exit 1;; esac
          git -C /tmp/taut checkout -q "$TAUT_REF"
          git -C /tmp/taut log --oneline -1
      - name: install taut deps (no scripts)
        working-directory: /tmp/taut
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: build:user-plugin
        working-directory: /tmp/taut
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/taut-plugins"
          for name in CopyReacted QuickJoin Nicknames OwlMode Censorship; do
            f=$(ls plugins/$name.ts plugins/$name.tsx 2>/dev/null | head -1)
            npm run -s build:user-plugin -- "$f" "$GITHUB_WORKSPACE/dist/taut-plugins/$name.js"
          done
          ls -la "$GITHUB_WORKSPACE/dist/taut-plugins"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: taut-plugins
          path: dist/taut-plugins
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # this job runs third-party code; never share its Go cache
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: vet popups
        run: go vet ./internal/ui/popups/
      - name: popups Taut tests
        env:
          TAUT_PLUGINS_DIR: ${{ github.workspace }}/dist/taut-plugins
        run: go test -count=1 -timeout 10m -v -run 'TestTaut' ./internal/ui/popups/
