name: popups-taut
# Builds the Taut plugins popups' wiring is tested with (CopyReacted,
# QuickJoin, Nicknames, OwlMode) with Taut's own `build:user-plugin`, and
# runs internal/ui/popups' Taut tests against them over a synthetic
# workspace and a fake Slack API. The built plugins (GPLv3) are uploaded
# as an artifact and never committed.
on:
  push:
    paths:
      - "internal/ui/popups/**"
      - "internal/ui/slackc/**"
      - "internal/taut/**"
      - ".github/workflows/popups-taut.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "taut git ref (branch, tag or sha)"
        required: false
        default: "main"

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config

jobs:
  popups-taut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: clone taut
        run: |
          git clone -q https://github.com/jeremy46231/taut /tmp/taut
          git -C /tmp/taut checkout -q "${{ inputs.ref || 'main' }}"
          git -C /tmp/taut log --oneline -1
      - name: install taut deps (no scripts)
        working-directory: /tmp/taut
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: build:user-plugin
        working-directory: /tmp/taut
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist/taut-plugins"
          for name in CopyReacted QuickJoin Nicknames OwlMode; do
            f=$(ls plugins/$name.ts plugins/$name.tsx 2>/dev/null | head -1)
            npm run -s build:user-plugin -- "$f" "$GITHUB_WORKSPACE/dist/taut-plugins/$name.js"
          done
          ls -la "$GITHUB_WORKSPACE/dist/taut-plugins"
      - uses: actions/upload-artifact@v4
        with:
          name: taut-plugins
          path: dist/taut-plugins
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: vet popups
        run: go vet ./internal/ui/popups/
      - name: popups Taut tests
        env:
          TAUT_PLUGINS_DIR: ${{ github.workspace }}/dist/taut-plugins
        run: go test -count=1 -timeout 10m -v -run 'TestTaut' ./internal/ui/popups/
