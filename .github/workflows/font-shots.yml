name: font-shots
# Preferences > Appearance > Font: the woff2 decoder, Slack's option list
# and fallbacks, the ui.json round trip and the re-layout after a switch,
# then a channel screenshotted in every font option (light mode) and the
# open font menu, rendered headlessly over an offline core. The web fonts
# come from Slack's public CDN without a cookie; Arial, Georgia, Verdana
# and Comic Sans MS are installed from Debian's msttcorefonts so the
# system-font options show the real fonts (fonts.txt in the artifact says
# what each option resolved to). Nothing here talks to Slack's API.
#
# text-render-linux / text-render-windows: Clack's text against the
# browser's. TestTextRenderShots (internal/ui/theme/textrender_test.go)
# draws Slack's message (15px), sidebar (13px) and meta (12px) text, 400 and
# 700, dark and light, at 1, 1.25, 1.5 and 2x through Gio (Mesa llvmpipe;
# D3D11 on Windows) and writes the same cells as HTML; headless Chrome
# (and Edge on Windows) screenshot them in the embedded Lato and in Slack's
# own Lato from its CDN, and .github/scripts/text_render_compare.py
# measures ink, stem and bar darkness, edges and alignment per cell and
# writes 400% side-by-sides (text-render-* artifacts).
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run font-shots.yml --ref <branch>)
    paths:
      - "internal/woff2/**"
      - "internal/ui/uifont/**"
      - "internal/ui/theme/uifont.go"
      - "internal/ui/theme/textrender*_test.go"
      - "internal/ui/prefs_font*.go"
      - "internal/ui/font_shots_test.go"
      - "internal/ui/messages/font_switch_test.go"
      - ".github/scripts/text_render_compare.py"
      - ".github/workflows/font-shots.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "text-render: run only the text-render jobs"
        required: false
        default: ""

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb

permissions:
  contents: read

jobs:
  font-shots:
    if: ${{ inputs.only != 'text-render' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps and fonts
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq
          sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS fonts-liberation ttf-mscorefonts-installer
          fc-list : family | sort -u | head -80
      - name: tests
        run: |
          go test -count=1 -v ./internal/woff2 ./internal/ui/uifont
          go test -count=1 -v -run 'TestFontPrefRoundTrip|TestFontPickLatestWins' ./internal/ui/
          go test -count=1 -v -run 'TestFontSwitchRelayout|TestIdle|TestFling' ./internal/ui/messages/
      - name: screenshots
        env:
          FONT_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$FONT_SHOTS_DIR"
          xvfb-run -a go test -count=1 -timeout 15m -v -run 'TestFontShots$' ./internal/ui/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: font-shots
          path: dist/shots

  text-render-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS libgl1-mesa-dri libegl-mesa0
      - name: Gio's rendering of the reference cells (Mesa llvmpipe)
        env:
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
          CLACK_TEXT_RENDER_DIR: ${{ github.workspace }}/dist/text-render
        run: xvfb-run -a go test -count=1 -v -run 'TestTextRenderShots$' ./internal/ui/theme/
      - name: Slack's own Lato (public CDN, no cookie)
        run: |
          python3 -m pip install --quiet pillow numpy brotli
          python3 .github/scripts/text_render_compare.py fetch-fonts dist/text-render
      - name: Chrome's rendering of the same pages
        run: |
          set -euo pipefail
          d="$GITHUB_WORKSPACE/dist/text-render"
          google-chrome --version | tee "$d/browsers.txt"
          read -r w h scales < <(python3 -c 'import json,sys;c=json.load(open(sys.argv[1]));print(c["cell_w"],len(c["cells"])*c["cell_h"]," ".join("%g"%s for s in c["scales"]))' "$d/cases.json")
          shot() { # name scale page [chrome flags]
            local name=$1 s=$2 page=$3; shift 3
            local prof; prof=$(mktemp -d)
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --user-data-dir="$prof" \
              --force-device-scale-factor="$s" --window-size="$w,$h" --virtual-time-budget=5000 "$@" \
              --screenshot="$d/$name-${s}x.png" "file://$d/$page" 2>/dev/null
            test -s "$d/$name-${s}x.png"
          }
          for s in $scales; do
            shot chrome "$s" "page-${s}x.html"
            shot chrome-cdn "$s" "page-${s}x-cdn.html"
          done
          ls -la "$d"
      - name: compare
        run: python3 .github/scripts/text_render_compare.py dist/text-render linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: text-render-linux
          path: dist/text-render

  text-render-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: what Chromium reads for text on Windows (font smoothing, ClearType, the Avalon.Graphics key), and the display adapter
        shell: pwsh
        run: |
          Add-Type -Namespace W -Name U -MemberDefinition '[DllImport("user32.dll")] public static extern bool SystemParametersInfo(uint a, uint b, ref uint c, uint d);'
          foreach ($p in @(@('SPI_GETFONTSMOOTHING', 0x004A), @('SPI_GETFONTSMOOTHINGTYPE', 0x200A), @('SPI_GETFONTSMOOTHINGCONTRAST', 0x200C), @('SPI_GETFONTSMOOTHINGORIENTATION', 0x2012))) {
            $v = [uint32]0; [void][W.U]::SystemParametersInfo($p[1], 0, [ref]$v, 0); "$($p[0]) = $v"
          }
          if (Test-Path 'HKCU:\Software\Microsoft\Avalon.Graphics') { Get-ChildItem -Recurse 'HKCU:\Software\Microsoft\Avalon.Graphics' | Format-List | Out-String } else { 'no HKCU\Software\Microsoft\Avalon.Graphics: Chromium uses SK_GAMMA_CONTRAST and SK_GAMMA_EXPONENT (font_util_win.cc)' }
          Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion, CurrentHorizontalResolution, CurrentVerticalResolution | Out-String
      - name: Gio's rendering of the reference cells (D3D11), and a real window's swapchain read back from the screen
        env:
          CLACK_PIXEL_TESTS: "1"
          CLACK_TEXT_RENDER_DIR: ${{ github.workspace }}\dist\text-render
        run: go test -count=1 -v -run 'TestTextRenderShots$|TestD3D11WindowSRGB$' ./internal/ui/theme/
      - name: Slack's own Lato (public CDN, no cookie)
        run: |
          python -m pip install --quiet pillow numpy brotli
          python .github/scripts/text_render_compare.py fetch-fonts dist/text-render
      - name: Chrome's and Edge's rendering of the same pages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $d = (Resolve-Path dist\text-render).Path
          $chrome = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe').'(default)'
          $edge = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\msedge.exe').'(default)'
          "chrome $((Get-Item $chrome).VersionInfo.ProductVersion)", "edge $((Get-Item $edge).VersionInfo.ProductVersion)" | Tee-Object -FilePath "$d\browsers.txt"
          $c = Get-Content "$d\cases.json" -Raw | ConvertFrom-Json
          $w = $c.cell_w; $h = $c.cells.Count * $c.cell_h
          $url = 'file:///' + ($d -replace '\\', '/')
          function Shot($exe, $name, $s, $page, [string[]]$extra) {
            $out = "$d\$name-${s}x.png"
            $a = @('--headless=new', '--hide-scrollbars', "--user-data-dir=$env:RUNNER_TEMP\prof-$name-$s", "--force-device-scale-factor=$s", "--window-size=$w,$h", '--virtual-time-budget=5000') + $extra + @("--screenshot=$out", "$url/$page")
            $p = Start-Process -FilePath $exe -ArgumentList $a -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "$name ${s}x: timed out" }
            for ($i = 0; $i -lt 40 -and -not (Test-Path $out); $i++) { Start-Sleep -Milliseconds 250 }
            if (-not (Test-Path $out)) { throw "$name ${s}x: no screenshot" }
          }
          foreach ($s in $c.scales) {
            Shot $chrome 'chrome' $s "page-${s}x.html" @()
            Shot $chrome 'chrome-nolcd' $s "page-${s}x.html" @('--disable-lcd-text')
            Shot $chrome 'chrome-linear' $s "page-${s}x.html" @('--text-contrast=0', '--text-gamma=1')
            Shot $chrome 'chrome-cdn' $s "page-${s}x-cdn.html" @()
            Shot $edge 'edge' $s "page-${s}x.html" @()
          }
          Get-ChildItem $d | Format-Table Name, Length | Out-String
      - name: compare
        run: python .github/scripts/text_render_compare.py dist/text-render windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: text-render-windows
          path: dist/text-render
