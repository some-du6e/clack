name: search
# Search and the quick switcher against internal/fakeslack: the
# search.modules / search.inline / search.autocomplete.files / search.save
# params Slack's web client sends, the modifier parser, the popover (blank
# slate, Recent places, history mode, keys, Enter), the results page
# (sources and counts, More menu, pagination, Nothing turned up, Files),
# search in channel, and light/dark screenshots (GPU, synthetic data
# only: nothing here talks to Slack).
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run search.yml --ref <branch>)
    paths:
      - "internal/core/search*.go"
      - "internal/core/types.go"
      - "internal/slack/more.go"
      - "internal/fakeslack/search.go"
      - "internal/fakeslack/workobjects.go"
      - "internal/ui/richview/workobject*.go"
      - "internal/ui/popups/search*.go"
      - "internal/ui/popups/menu.go"
      - "internal/ui/secondary.go"
      - "internal/ui/macmenu.go"
      - ".github/workflows/search.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: search tests and screenshots
        env:
          SEARCH_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$SEARCH_SHOTS_DIR"
          go test -count=1 -v -run 'TestSearch' ./internal/core
          go test -count=1 -v ./internal/fakeslack
          go test -count=1 -v -run 'TestNoHardCodedHints' ./internal/ui/shortcut
          xvfb-run -a go test -count=1 -v -run 'TestSearch' ./internal/ui/popups
          ls -la "$SEARCH_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: search-shots
          path: dist/shots
