name: files-shots
# Files in messages, the file menu and uploads, audited against Slack's
# web client (docs/FILES-AUDIT.md): gallery v3 geometry and the file
# cards (internal/ui/richview), their FileActions on hover and the
# snippets' highlighting and Show more (files.info's content), the upload
# sequence (files.getUploadURL,
# the POST, files.completeUpload, files.share) and the file menu's
# writes, the #files-gallery render test, and screenshots of the whole
# channel, the file menu, the delete dialog and the viewer, light and
# dark, rendered headlessly against internal/fakeslack. Synthetic only:
# nothing here talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run files-shots.yml --ref <branch>)
    paths:
      - "internal/richtext/message.go"
      - "internal/richtext/types.go"
      - "internal/richtext/codemirror.go"
      - "internal/store/snippets.go"
      - "internal/core/snippets.go"
      - "internal/fakeslack/snippets.go"
      - "internal/ui/richview/file_actions.go"
      - "internal/ui/richview/snippet.go"
      - "internal/slack/more.go"
      - "internal/slack/client.go"
      - "internal/core/writes.go"
      - "internal/core/manage.go"
      - "internal/fakeslack/files.go"
      - "internal/fakeslack/emails.go"
      - "internal/richtext/emailhtml.go"
      - "internal/ui/richview/email.go"
      - "internal/ui/email_pane.go"
      - "internal/ui/email_files_test.go"
      - "internal/fakeslack/drafts.go"
      - "internal/ui/richview/cards.go"
      - "internal/ui/richview/blocks.go"
      - "internal/ui/richview/view.go"
      - "internal/ui/popups/actions_context.go"
      - "internal/ui/popups/lightbox.go"
      - "internal/ui/popups/lightbox_video.go"
      - "internal/ui/video_viewer_test.go"
      - "internal/ui/video_pip*.go"
      - "internal/ui/videoplayer/pip*.go"
      - "internal/ui/files_shots_test.go"
      - "internal/ui/audio_test.go"
      - "internal/ui/videoplayer/audio*.go"
      - "internal/ui/richview/media*.go"
      - "internal/media/goaudio/**"
      - "internal/media/mediatest/audio.go"
      - "internal/ui/drop_overlay.go"
      - "internal/ui/drop_overlay_test.go"
      - "internal/ui/composer/taut.go"
      - "internal/ui/richview/textfile_test.go"
      - "internal/ui/views/files.go"
      - "internal/ui/views/files_svgicon_test.go"
      - "internal/ui/popups/search_rows.go"
      - "internal/ui/popups/search_svgicon_test.go"
      - "internal/ui/popups/files_filters.go"
      - "internal/ui/views/files_filters_test.go"
      - "internal/ui/popups/lightbox_sidebar*.go"
      - "internal/ui/popups/file_details_host.go"
      - "internal/ui/popups/lightbox_gallery.go"
      - "internal/ui/popups/lightbox_fileid.go"
      - "internal/ui/popups/file_action.go"
      - "internal/ui/popups/video_menu.go"
      - "internal/ui/file_details_pane*.go"
      - "internal/ui/media_viewer_details*_test.go"
      - "internal/core/file_details*.go"
      - "internal/core/exp_media_viewer.go"
      - "internal/ui/richview/file_details*.go"
      - "internal/ui/canvasview/render.go"
      - ".github/workflows/files-shots.yml"
  workflow_dispatch:
    inputs:
      expect_fail:
        description: "proof runs: the tests that must fail, comma-separated (TestA,TestB/sub); the run passes only if each fails and nothing else does (docs/CI-SPEED.md, Proof runs)"
        required: false
        default: ""

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb

permissions:
  contents: read

# A newer run for the same branch, tag or PR cancels this one while it is
# queued or running, so stale pushes don't pile up in the shared queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  files-shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # budget: 1.5 x p95 (10.0 min) + 3, docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # ui as it is, for the media viewer's video checks run on it too
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ui
          path: before-ui
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/expect-fail
        with:
          tests: ${{ inputs.expect_fail }}
          leg: ${{ github.job }}-${{ strategy.job-index }}
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: geometry, uploads and the file menu
        run: |
          go test -count=1 -v -run 'TestFileImage|TestMediaGallery|TestGalleryPair|TestGalleryBox|TestVideoCard|TestAudioCard|TestGenericFileCard|TestSnippet|TestPillowGrid|TestFileActions|TestGalleryExpandStillOpens|TestStillPlayButtonAndExpand|TestFileCardSectionButton|TestEmailFile|TestTextFileCards|TestAudioCardSlot|TestAudioClipSlot' ./internal/ui/richview/
          go test -count=1 -v -run 'TestTruncateHTML|TestParseCodeMirror|TestSnippetFields|TestFiles$|TestEmailFields|TestEmailBlocks' ./internal/richtext/
          go test -count=1 -v -run 'TestUploadProgressAndPrepared|TestUploadForInput|TestDraftFiles|TestExpandSnippet|TestSnippetDisplayCut' ./internal/core/
          go test -count=1 -v -run 'TestFileMenuLaterAndDelete|TestContextMenuShapes|TestSearchFileTileSvgIcons' ./internal/ui/popups/
          go test -count=1 -v -run 'TestFileTileSvgIcons' ./internal/ui/views/
      - name: render
        run: xvfb-run -a go test -count=1 -v -run 'TestFilesChannel$|TestFileSnippetExpand$|TestFileDrop|TestDropSubtitle|TestDropTiming|TestEmailInbox$|TestAudioInlinePlay$' ./internal/ui/
      - name: screenshots
        env:
          FILES_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$FILES_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -timeout 13m -run 'TestFilesShots$|TestFileActionsShots$|TestDropOverlayShots$|TestEmailShots$|TestAudioPlayerShots$' ./internal/ui/
          # the Files browser's Filters modal (docs/FILES-AUDIT.md)
          xvfb-run -a go test -count=1 -v -run 'TestFilesViewFiltersShots$' ./internal/ui/views/
          ls -la "$FILES_SHOTS_DIR"
      - name: the media viewer plays videos, and the same checks on ui (before-ui)
        if: ${{ !cancelled() }}
        env:
          FILES_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/dump-before-budget.sh" 13 & wd=$!
          trap 'kill $wd 2>/dev/null' EXIT
          set +e
          mkdir -p "$FILES_SHOTS_DIR"
          rc=0
          # the branch: a gallery's video, Expand and the Files tab open the
          # viewer playing; its keys, auto-hide and end; shots *-after.png
          xvfb-run -a go test -count=1 -v -timeout 18m -run 'TestVideoViewer|TestVideoPip' ./internal/ui/ || rc=1
          go test -count=1 -v -run 'TestChannelFilesVideoViewer$' ./internal/ui/views/ || rc=1
          # ui, where there's no player (the stand-in hooks): every check
          # fails and the shots (*-before.png) show what ui does. Until ui
          # has the viewer's videos (NewVideoViewer), a ui run that fails
          # none of them fails this step: the comparison is the evidence.
          cp internal/ui/video_viewer_test.go internal/ui/video_pip_test.go before-ui/internal/ui/
          cp internal/ui/testdata/video_viewer_hooks_ui.go.txt before-ui/internal/ui/video_viewer_hooks_test.go
          cp internal/ui/testdata/video_pip_hooks_ui.go.txt before-ui/internal/ui/video_pip_hooks_test.go
          cp internal/ui/views/channel_files_video_test.go before-ui/internal/ui/views/
          (cd before-ui && git log -1 --format='before = ui at %H' && VIDEO_VIEWER_SHOTS_TAG=before xvfb-run -a go test -count=1 -v -timeout 18m -run 'TestVideoViewer|TestVideoPip' ./internal/ui/ > "$FILES_SHOTS_DIR/video-viewer-before-ui.log" 2>&1)
          (cd before-ui && go test -count=1 -v -run 'TestChannelFilesVideoViewer$' ./internal/ui/views/ > "$FILES_SHOTS_DIR/video-viewer-before-views.log" 2>&1)
          fixed=0
          grep -q 'func NewVideoViewer' before-ui/internal/ui/popups/lightbox_video.go 2>/dev/null && grep -q 'func (c \*Controller) PipOn' before-ui/internal/ui/videoplayer/pip.go 2>/dev/null && fixed=1
          for f in "$FILES_SHOTS_DIR"/video-viewer-before-*.log; do
            echo "== $f (ui): results, then one report per failing check (numbers folded)"
            grep -E '^\s*--- (PASS|FAIL)|^(ok|FAIL)\b' "$f" || true
            grep -E '_test.go:[0-9]+: ' "$f" | awk '{k=$0; sub(/^[^:]*:[0-9]+: /, "", k); gsub(/[0-9]+(\.[0-9]+)?/, "#", k); if (!seen[k]++) print}' | head -40 || true
            if [ "$fixed" = 0 ] && ! grep -q -- '--- FAIL' "$f"; then
              echo "::error::$f: ui passed every copied check (or didn't build): the comparison shows nothing"
              rc=1
            fi
          done
          ls -la "$FILES_SHOTS_DIR"
          exit $rc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: files-shots
          path: dist/shots
      - if: ${{ always() && env.XF_ID }}
        uses: ./.github/actions/expect-fail-report

  # The media viewer's sidebar and its Details tab (media_viewer_file_details_tab):
  # the viewer, FileDetails (eg5B), the entry points that carry the file,
  # and the viewer-details-* shots.
  media-viewer-details:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/expect-fail
        with:
          tests: ${{ inputs.expect_fail }}
          leg: ${{ github.job }}-${{ strategy.job-index }}
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: the viewer's sidebar, FileDetails and the entry points
        shell: bash
        run: |
          set +e
          rc=0
          go test -count=1 -v -timeout 5m -run '^(TestMediaViewer|TestPendingViewerNoDetails|TestViewFile|TestRichFileFromCore|TestSearchOpenFileViewer|TestOpenFileCardActions|TestLightboxImageMenu|TestViewerShowsBMPOriginal)' ./internal/ui/popups/ || rc=1
          go test -count=1 -v -timeout 5m -run '^(TestFileDetailsImagePreview|TestFileImage)' ./internal/ui/richview/ || rc=1
          go test -count=1 -v -timeout 5m -run '^TestFileDetailsFetch$' ./internal/core/ || rc=1
          go test -count=1 -v -timeout 5m -run '^TestCalendarDateOrNamedDay$' ./internal/i18n/ || rc=1
          go test -count=1 -v -timeout 5m -run '^(TestCanvasFileClick|TestCanvasImageViewerCarriesTheFile)$' ./internal/ui/canvasview/ || rc=1
          go test -count=1 -v -timeout 5m -run '^(TestFilesViewOpen|TestFilesViewUnthumbedImage|TestChannelFilesUnthumbedImage)$' ./internal/ui/views/ || rc=1
          xvfb-run -a go test -count=1 -v -timeout 8m -run '^(TestFileDetailsPane|TestOpenFileDetails|TestFileDetailsStates|TestFileDetailsName|TestFileCreatedText|TestMediaViewerDetailsInApp|TestMediaViewerDetailsDrawn)$' ./internal/ui/ || rc=1
          exit $rc
      - name: screenshots (viewer-details-*)
        env:
          FILES_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$FILES_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -timeout 8m -run '^TestMediaViewerDetailsShots$' ./internal/ui/
          ls -la "$FILES_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: media-viewer-details-shots
          path: dist/shots
      - if: ${{ always() && env.XF_ID }}
        uses: ./.github/actions/expect-fail-report

  # expect_fail's verdict across the jobs (docs/CI-SPEED.md, "Proof runs"):
  # every listed test failed in some job and passed in none, nothing else
  # failed, every job that ran succeeded. Proof runs only. A new job goes
  # in its needs (.github/scripts/expect_fail_wire.py adds it).
  expect-fail:
    needs:
      - files-shots
      - media-viewer-details
    if: ${{ always() && inputs.expect_fail != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10 # budget, min (a checkout, setup-go and the check)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: tools/expectfail
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: expect-fail-*
          path: ${{ runner.temp }}/xf
      - name: every listed test failed, nothing else did
        env:
          EXPECT_FAIL: ${{ inputs.expect_fail }}
          NEEDS: ${{ toJSON(needs) }}
        run: go run ./tools/expectfail -check "$RUNNER_TEMP/xf"
