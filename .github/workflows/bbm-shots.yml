name: bbm-shots
# Simplified layout mode (internal/ui/bbm*.go, docs/PREFS-AUDIT.md): runs
# its tests on internal/fakeslack (synthetic data; nothing talks to Slack)
# headlessly through Gio's GPU renderer (Mesa llvmpipe), and uploads light
# and dark screenshots of each surface in the mode (bbm-shots).
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run bbm-shots.yml --ref <branch>)
    paths:
      - "internal/ui/bbm*.go"
      - "internal/ui/sidebar.go"
      - "internal/ui/prefs_pages.go"
      - "internal/ui/messages/persist.go"
      - "internal/ui/messages/bbm_test.go"
      - "internal/ui/icons/bbm.go"
      - ".github/workflows/bbm-shots.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  bbm-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: tests and screenshots
        env:
          BBM_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          mkdir -p "$BBM_SHOTS_DIR"
          xvfb-run -a go test -p 1 -count=1 -v -run 'TestBBM|TestPrefsPagesMatchSlack' ./internal/ui
          go test -count=1 -run 'BBM|TestPersistActions' ./internal/ui/messages
          go test -count=1 -run 'TestIconRefsExist' ./internal/ui/icons
          ls -la "$BBM_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: bbm-shots
          path: dist/shots
