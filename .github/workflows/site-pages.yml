name: site-pages
# Deploys site/ to GitHub Pages at the domain in site/CNAME. NOT ENABLED: it
# has no automatic trigger, Pages is off for the repository, and no custom
# domain is set. site/README.md ("Going live") has the steps and the
# Porkbun DNS records; nothing here runs until they're done.
#
# The build job makes the page from the newest complete release and the
# plugin Library index (build.mjs --refresh --pages, which adds site/CNAME),
# then holds that build to the same budgets as site.yml: the static checks,
# the headless Chrome weigh and Lighthouse. The directory those checks
# passed is the one uploaded and deployed. Once Pages is on, uncomment
# workflow_run below to redeploy after every release, and push to deploy
# site changes that land on main.
on:
  workflow_dispatch:
  # workflow_run:
  #   workflows: [release]
  #   types: [completed]
  # push:
  #   branches: [main]
  #   paths:
  #     - "site/**"
  #     - "assets/icon.svg"
  #     - "internal/pluginlib/compat.go"
  #     - ".github/workflows/site-pages.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: tools (Lighthouse CI)
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: build (newest complete release, site.json's url as the canonical base, CNAME)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node build.mjs --refresh --strict --pages
      # the deploy's guard too, so Pages can't ship TRY THE DEMO without the
      # demo's program and licences: bring a green site run's site-demo
      # artifact in with build.mjs --demo <dir> (site/README.md) before turning
      # this workflow on
      - name: static checks (indexable, CNAME, the demo)
        run: node tools/check.mjs --production --pages --demo
      - name: page weight in headless Chrome
        run: node tools/weigh.mjs
      - name: Lighthouse, mobile
        run: ./node_modules/.bin/lhci autorun --config=lighthouserc.json
      - name: Lighthouse, desktop
        run: ./node_modules/.bin/lhci autorun --config=lighthouserc.desktop.json
      # the directory every check above passed, unchanged
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
