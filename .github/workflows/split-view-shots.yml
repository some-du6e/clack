name: split-view-shots
# Slack's split view (internal/ui/split.go, docs/SPLIT-VIEW.md) rendered
# headlessly at 1440x900 against internal/fakeslack: a channel opened from
# its ⋮ menu, a thread inside it, a dragged width, the sidebar's modifier
# click, the same channel in both views and dark mode; and the wide
# sidebar's resizer on the DMs list and Activity (sidebar_wide.go).
# Synthetic only: nothing here talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run split-view-shots.yml --ref <branch>)
    paths:
      - "internal/ui/split.go"
      - "internal/ui/split_view_test.go"
      - "internal/ui/sidebar_wide*.go"
      - "internal/ui/views/dms.go"
      - "internal/ui/views/activity_panel.go"
      - "internal/ui/app.go"
      - "internal/ui/channel.go"
      - "internal/ui/secondary.go"
      - "internal/ui/popups/split.go"
      - "internal/ui/messages/thread.go"
      - ".github/workflows/split-view-shots.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb

permissions:
  contents: read

jobs:
  split-view-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: split view screenshots
        env:
          PREVIEW_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$PREVIEW_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestSplitView|TestWideSidebarResizeLikeSlack|TestSidebarWideBoundsLikeSlack' ./internal/ui/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: split-view-shots
          path: dist/shots
