name: bk-agent-shots
# Renders Slack's agent blocks (plan, task_card, context_actions with
# feedback_buttons / icon_button) in every state, a streamed reply frame
# by frame, and an agent DM's Tasks tab (rows, hover actions, paused,
# delete confirm, empty and error states), light and dark, with the GPU renderer (Mesa llvmpipe)
# against internal/fakeslack's synthetic agent fixtures, and uploads the
# PNGs. Also runs the agent tests across richtext, core, composer and
# blockkit. Synthetic only: nothing here talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run bk-agent-shots.yml --ref <branch>)
    paths:
      - "internal/ui/blockkit/agent*.go"
      - "internal/richtext/agent*.go"
      - "internal/ui/richview/agent*.go"
      - "internal/ui/messages/agent*.go"
      - "internal/core/agent*.go"
      - "internal/fakeslack/agents.go"
      - "internal/fakeslack/agent_tasks.go"
      - "internal/ui/views/agent_tasks.go"
      - "internal/ui/agent_tasks_tab*.go"
      - "internal/ui/blockkit/apphome.go"
      - "internal/ui/messages/plan_block_test.go"
      - "internal/ui/app_plan_test.go"
      - "internal/ui/composer/typing*.go"
      - ".github/workflows/bk-agent-shots.yml"
  workflow_dispatch:
    inputs:
      expect_fail:
        description: "proof runs: the tests that must fail, comma-separated (TestA,TestB/sub); the run passes only if each fails and nothing else does (docs/CI-SPEED.md, Proof runs)"
        required: false
        default: ""

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

# A newer run for the same branch, tag or PR cancels this one while it is
# queued or running, so stale pushes don't pile up in the shared queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # budget: 1.5 x p95 (5.3 min) + 3, docs/CI-SPEED.md
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/expect-fail
        with:
          tests: ${{ inputs.expect_fail }}
          leg: ${{ github.job }}-${{ strategy.job-index }}
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: agent tests
        run: |
          go test -count=1 -run 'TestAgent|TestStringTitle' ./internal/richtext ./internal/core ./internal/ui/richview
          go test -count=1 -run 'TestAssistantStatusLine' ./internal/ui/composer
      - name: agent block screenshots (light and dark)
        env:
          BK_AGENT_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          AGENT_TASKS_SHOTS_DIR: ${{ github.workspace }}/dist/shots # the agent DM's Tasks tab (agent_tasks_tab_test.go)
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$BK_AGENT_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestAgent' ./internal/ui/blockkit
          xvfb-run -a go test -count=1 -v -run 'TestAppPlanRows|TestAgent' ./internal/ui/messages
          xvfb-run -a go test -count=1 -v -run 'TestAppPlanWindow|TestAgentTasks|TestAgentSession' ./internal/ui
          ls -l "$BK_AGENT_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: bk-agent-shots
          path: dist/shots
      - if: ${{ always() && env.XF_ID }}
        uses: ./.github/actions/expect-fail-report

  # expect_fail's verdict across the jobs (docs/CI-SPEED.md, "Proof runs"):
  # every listed test failed in some job and passed in none, nothing else
  # failed, every job that ran succeeded. Proof runs only. A new job goes
  # in its needs (tools/expectfail's TestWorkflowsWireExpectFail says so).
  expect-fail:
    needs:
      - agent-shots
    if: ${{ always() && inputs.expect_fail != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10 # budget, min (a checkout, setup-go and the check)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: tools/expectfail
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: expect-fail-*
          path: ${{ runner.temp }}/xf
      - name: every listed test failed, nothing else did
        env:
          EXPECT_FAIL: ${{ inputs.expect_fail }}
          NEEDS: ${{ toJSON(needs) }}
        run: go run ./tools/expectfail -check "$RUNNER_TEMP/xf"
