name: code-channels
# Code channels (Slack Code): the core model and status rules
# (internal/core/codechannel_test.go), the shell's render test, and
# screenshots of a code channel in each agent status plus the archived
# and preview cases, light and dark, rendered headlessly over an offline
# core with the fakeslack fixtures. Synthetic only: nothing here talks to
# Slack.
on:
  push:
    paths:
      - "internal/core/codechannel*.go"
      - "internal/core/app.go"
      - "internal/core/events.go"
      - "internal/fakeslack/codechannels.go"
      - "internal/ui/codechannel*.go"
      - "internal/ui/icons/codechannel.go"
      - "internal/ui/channel.go"
      - "internal/ui/sidebar.go"
      - "internal/ui/slackc_shell.go"
      - "internal/ui/composer/slack.go"
      - "internal/ui/messages/list.go"
      - ".github/workflows/code-channels.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb

permissions:
  contents: read

jobs:
  code-channels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $GIO_DEPS
      - name: core
        run: go test -count=1 -v -run 'TestParseCodeChannel|TestCodeChannel|TestSnapshotAndSections' ./internal/core/
      - name: render
        run: xvfb-run -a go test -count=1 -v -run 'TestCodeChannelsShell$' ./internal/ui/
      - name: screenshots
        env:
          CODE_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$CODE_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestCodeChannelShots$' ./internal/ui/
          ls "$CODE_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: code-channels-shots
          path: dist/shots
