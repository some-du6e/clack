name: huddles-audit-shots
# The huddles audit (docs/HUDDLES-AUDIT.md) rendered headlessly against the
# fake Chime (huddle.NewFake) and internal/fakeslack: the huddle window's
# title, toolbar, closed captions, ⋯ menu, banners and hidden self-view;
# the compact window at 2 and 4 people with a theme, light and dark;
# the docked bar with the window closed and open; the sidebar row's
# huddle badge; the sidebar Huddles link's faces and invite badge; the
# header button, its menu and the invite window and card; sharing your screen (the picker, the presenter's mini panel, the
# alerts) with the synthetic test screen; the Huddles page (views:
# huddles-page-*) with its rows, filters, live and suggested cards and
# hero against fakeslack's synthetic history. Synthetic only: nothing here
# joins, starts or rings a real huddle, and no screen is captured.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run huddles-audit-shots.yml --ref <branch>)
    paths:
      - "internal/ui/huddleui/**"
      - "internal/ui/huddle_wire.go"
      - "internal/ui/sidebar_huddles_link.go"
      - "internal/ui/huddles_link_test.go"
      - "internal/fakeslack/huddles.go"
      - "internal/ui/views/huddles*.go"
      - "internal/core/huddles_page.go"
      - "internal/fakeslack/huddles_page.go"
      - "internal/ui/popups/emoji_picker.go"
      - ".github/workflows/huddles-audit-shots.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0 x11-utils # x11-utils: xprop for TestMiniPanelShowsInactive

permissions:
  contents: read

jobs:
  huddles-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: huddle screenshots (Mesa llvmpipe)
        env:
          CLACK_PIXEL_TESTS: "1"
          CLACK_SHOTS: ${{ github.workspace }}/dist/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$CLACK_SHOTS"
          # TestShareFlow: share-picker-*, share-window-*, share-mini-panel, share-alert-* (the test screen, CLACK_HUDDLE_TESTSCREEN)
          # TestMiniPanelShowsInactive: the panel's real X11 window maps inactive (Gio's app.Panel)
          # TestHuddleShotsWindowCompact: window-compact-{light,dark}-{2,4}[-tray] (Slack's compact window, the Arizona theme from Slack's CDN)
          # TestHuddleShotsW9: w9-window-{video,leave,quick}-*, w9-dock[-quick]-* (Video settings, Leave options, the quick picker's Reactions tab)
          # gap-w23: w23-sticker-grid-{window,dock}-* (HuddleStickerGrid), w23-lounge-{window,window-later,dock}-* (HuddleLoungeMusicBanner), w23-dock-*-{1200,1000,760,560} (useResponsiveHuddleToolbarButtons)
          xvfb-run -a go test -count=1 -v -run 'TestHuddleShotsW9$|TestCameraButtonLikeSlack$|TestVideoMenuLikeSlack$|TestCanEndForAllLikeSlack$|TestEndHuddleForAll$|TestQuickPickerLikeSlack$|TestHuddleShotsAudit$|TestHeaderShots$|TestHuddleShotsInvite|TestHuddleShotsMic|TestSidebarSuffixFaces$|TestSidebarFaceSteps$|TestHuddleChannelTooltipText$|TestSidebarActiveMembersSelfLast$|TestSidebarSuffixTooltipHover$|TestSidebarFaceCrescent$|TestSidebarTooltipShots$|TestSectionHuddlePick$|TestShareFlow$|TestShareButtonStates$|TestMiniPanelShowsInactive$|TestHuddleShotsWindowCompact$|TestStickerEmojiFits$|TestHuddleShotsTiles$|TestStickerGridLikeSlack$|TestLoungeBannerLikeSlack$|TestDockResponsiveButtonsLikeSlack$' ./internal/ui/huddleui
          ls -la "$CLACK_SHOTS"
      - name: the Huddles page (views; Mesa llvmpipe)
        if: ${{ !cancelled() }}
        env:
          HUDDLES_PAGE_SHOTS: ${{ github.workspace }}/dist/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$HUDDLES_PAGE_SHOTS"
          # huddles-page-{history,enhancements,missed,no-results,empty,suggestions,live}-{light,dark}
          go test -count=1 -v -run 'TestHuddleHistoryParamsLikeSlack|TestParseHuddlePageFields' ./internal/core
          xvfb-run -a go test -count=1 -v -run 'TestHuddlesPage|TestSuggestedHuddlesLikeSlack|TestSlickViewBetterHuddles|TestRoomFromEvent' ./internal/ui/views
          ls -la "$HUDDLES_PAGE_SHOTS"
      - name: the sidebar's Huddles link (the whole client over fakeslack; Mesa llvmpipe)
        if: ${{ !cancelled() }}
        env:
          PREVIEW_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$PREVIEW_SHOTS_DIR"
          # huddles-link-{faces-tip,invite-off,badge,badge-2,seen}-{light,dark}: the link's facepile, an invite with
          # huddles_link_v2 unassigned and on, and the Huddles page marking the invites seen
          xvfb-run -a go test -count=1 -v -timeout 15m -run 'TestHuddlesLinkInvites$' ./internal/ui/
          ls -la "$PREVIEW_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: huddles-audit-shots
          path: dist/shots
