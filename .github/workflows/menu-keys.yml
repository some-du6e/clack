name: menu-keys
# Menu item keys (L = Copy link, U, E, R, T, F, A, M, P, ⌘C, ⇧⌘S, Delete)
# and per-platform shortcut hints (⌘C on macOS, Ctrl+C elsewhere), driven
# through Gio's router, plus screenshots of the message context menu with
# both hint styles, light and dark. Synthetic only: the fake Slack in
# internal/fakeslack, nothing talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run menu-keys.yml --ref <branch>)
    paths:
      - "internal/ui/shortcut/**"
      - "internal/ui/popups/menu*.go"
      - "internal/ui/popups/actions_*.go"
      - "internal/ui/popups/search_view.go"
      - "internal/ui/popups/style.go"
      - "internal/ui/popups/popover.go"
      - "internal/ui/keys.go"
      - "internal/ui/menu_keys*.go"
      - "internal/ui/menubar/**"
      - "internal/ui/composer/chrome.go"
      - "internal/ui/slackc/kit/menus.go"
      - "internal/ui/popups/button_v2.go"
      - "internal/ui/popups/experiments.go"
      - "internal/ui/popups/exp_menus*_test.go"
      - "internal/ui/popups/optionlist.go"
      - "internal/ui/theme/tooltip*.go"
      - "internal/ui/theme/button*.go"
      - "internal/core/message_menu.go"
      - "internal/ui/popups/message_actions*_test.go"
      - "internal/ui/popups/button_group.go"
      - "internal/ui/popups/modal.go"
      - "internal/ui/workflow_details*.go"
      - "internal/ui/toast_slack.go"
      - "internal/ui/composer/schedule_share*.go"
      - "internal/fakeslack/moderation.go"
      - ".github/workflows/menu-keys.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0
  MENU_TESTS: "TestMenuKey|TestMenuTypeAhead|TestMenuHintsPerOS|TestMenuTemplateShortcuts|TestContextMenuShapes|TestMessageContextMenuThreadAction|TestMenuTemplate"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: formatter table, key ids, no hard-coded hints
        run: go test -count=1 -v ./internal/ui/shortcut
      - name: menu keys through the router
        run: go test -count=1 -v -timeout 15m -run "$MENU_TESTS" ./internal/ui/popups
      - name: bindings and the menu bar's accelerators
        run: |
          go test -count=1 -v -run 'TestParseCombo|TestNav|TestCreateChannelEntryPoints' ./internal/ui
          go test -count=1 -v ./internal/ui/menubar
      - name: screenshots (mac glyphs and Ctrl, light and dark)
        env:
          MENU_KEYS_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$MENU_KEYS_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -timeout 15m -run 'TestMenuKeysShots$' ./internal/ui/
          ls -l "$MENU_KEYS_SHOTS_DIR"
      # the message menu's Slack rows, the menu tag and badge, the select
      # toggles and the v2 Button over internal/fakeslack; the tooltip's
      # dark-mode outline in pixels; shots of them light and dark
      - name: menu rows, selects, v2 Button and tooltips
        env:
          EXP_MENUS_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$EXP_MENUS_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -run 'TestTooltip|TestButtonV2' ./internal/ui/theme
          xvfb-run -a go test -count=1 -v -run 'TestEmojiTooltip|TestCSSEmojiTooltip' ./internal/ui/richview
          xvfb-run -a go test -count=1 -v -timeout 15m -run 'TestMessageMenuSlack|TestClientExtras|TestSessionToggleGroups|TestSlackKitV2Button|TestForwardPicker|TestSelectListToggles|TestMenuTagAndBadge|TestTooltipColorsFromTheme|TestNotifyCustomized|TestMenuTagTemplate|TestExpMenusShots' ./internal/ui/popups
          ls -l "$EXP_MENUS_SHOTS_DIR"
      # message actions (branch message-actions-2): the right-click menu's
      # share row, the share dialog (title, Copy Link's Copied!, 32px rows,
      # Save Draft, the schedule caret and scheduled forwards), the Flag
      # row and FlagMessageDialog, the workflow rows and the workflow
      # details view, over internal/fakeslack; shots light and dark
      - name: message actions (share, flag, workflow details)
        env:
          EXP_MENUS_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          WORKFLOWS_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$EXP_MENUS_SHOTS_DIR"
          go test -count=1 -v -run 'TestFlagContentCall|TestContentReviewEnabled|TestTriggerPreviewsStore|TestWorkflowDetailsData|TestSaveDraftNoDestination|TestExperimentReadsListed' ./internal/core
          go test -count=1 -v -run 'TestShareScheduleMenuLikeSlack' ./internal/ui/composer
          xvfb-run -a go test -count=1 -v -timeout 15m -run 'TestContextMenuShareRowLikeSlack|TestForwardDialogChromeLikeSlack|TestForwardSaveDraftLikeSlack|TestForwardScheduleLikeSlack|TestMessageMenuFlagRowLikeSlack|TestFlagMessageDialogLikeSlack|TestMessageMenuWorkflowRowsLikeSlack|TestMessageContextMenuThreadAction|TestMessageActionsShots' ./internal/ui/popups
          xvfb-run -a go test -count=1 -v -timeout 15m -run 'TestMessageActionsHooksWired|TestWorkflowDetailsPaneLikeSlack' ./internal/ui/
          ls -l "$EXP_MENUS_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: menu-keys-shots
          path: dist/shots

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: native macOS (Mod is ⌘, the delete key is Backspace)
        run: |
          go test -count=1 -v ./internal/ui/shortcut
          go test -count=1 -v -timeout 15m -run "$MENU_TESTS" ./internal/ui/popups
          go test -count=1 -v -run 'TestParseCombo|TestNav' ./internal/ui
          go test -count=1 -v ./internal/ui/menubar
