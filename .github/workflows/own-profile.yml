name: own-profile
# The full profile pane (popups.ProfileView) on internal/fakeslack's
# users.profile.getSections, light and dark: render tests, the plain-text
# emoji tofu scan (theme, richview, slackc and the pane), and screenshots.
# Synthetic only: nothing here talks to Slack.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run own-profile.yml --ref <branch>)
    paths:
      - "internal/ui/popups/profile_*.go"
      - "internal/ui/popups/app_card.go"
      - "internal/ui/icons/profile.go"
      - "internal/core/profile_actions*.go"
      - "internal/ui/popups/style.go"
      - "internal/ui/theme/text.go"
      - "internal/ui/theme/emojislot*"
      - "internal/ui/theme/embolden.go"
      - "internal/core/profile_sections*.go"
      - "internal/fakeslack/profile.go"
      - ".github/workflows/own-profile.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  own-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: profile tests, tofu scan and screenshots
        env:
          PROFILE_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$PROFILE_SHOTS_DIR"
          go test -count=1 -v -run 'TestEmoji' ./internal/ui/theme
          go test -count=1 -v -run 'TestProfileSections|TestPeopleBrowseCustomFields|TestProfileActionCalls|TestVIPError' ./internal/core
          go test -count=1 -v -run 'TestEmojiTofu' ./internal/ui/richview ./internal/ui/slackc
          xvfb-run -a go test -count=1 -v -run 'TestOwnProfilePane|TestOtherProfilePane|TestProfileNameIsRealName|TestProfileMoreMenu|TestProfilePresenceColor|TestProfileDate|TestProfileVIPToggle|TestProfileMenuViewFiles|TestProfileFieldLink|TestProfileOpenFullWithoutHooks|TestProfileViewAs|TestAppAddToChannel|TestUserGroupPane|TestProfilePaneBackButton' ./internal/ui/popups
          ls -la "$PROFILE_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: own-profile-shots
          path: dist/shots
