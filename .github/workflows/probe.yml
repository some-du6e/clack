name: core-probe
# Builds the internal/core live probe (a developer tool; not shipped).
on:
  push:
    branches: [backend]
    paths: ['internal/**', 'go.mod', 'go.sum', '.github/workflows/probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - run: CGO_ENABLED=0 go build -trimpath -o dist/core-probe ./internal/core/probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-probe-linux-amd64
          path: dist/core-probe
