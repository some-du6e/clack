name: create-channel
# The create-channel flow end to end against internal/fakeslack (entry
# points, name checks, visibility, create, Add people, a restricted org),
# rendered headlessly at 1440x900 with each step saved as a screenshot;
# and the Create menu's other modal, "Invite people" (popups/invite.go:
# the email tokens, requests, guests, the invite link, the summary), with
# its shots light and dark. Synthetic only: nothing here talks to Slack,
# and the invites go to internal/fakeslack's recorder.
on:
  push:
    branches: [ui, main] # agent branches run only ci + supply-chain on push; dispatch this one by hand (gh workflow run create-channel.yml --ref <branch>)
    paths:
      - "internal/ui/create_channel*.go"
      - "internal/ui/popups/create_channel*.go"
      - "internal/ui/popups/modal.go"
      - "internal/core/create*.go"
      - "internal/core/invite*.go"
      - "internal/ui/popups/invite*.go"
      - "internal/fakeslack/channels.go"
      - "internal/fakeslack/invites.go"
      - ".github/workflows/create-channel.yml"
  workflow_dispatch:

env:
  GIO_DEPS: libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev pkg-config xvfb libgl1-mesa-dri libegl-mesa0

permissions:
  contents: read

jobs:
  create-channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gio deps
        run: sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" update -qq && sudo sh "$GITHUB_WORKSPACE/.github/apt.sh" install -y -qq $GIO_DEPS
      - name: core + fake + modal tests
        run: |
          go test -count=1 -v -run 'TestNormalizeChannelName|TestChannelNameErrorText|TestValidateChannelName|TestCreateChannel' ./internal/core
          go test -count=1 -v -run 'TestCreateChannelModal' ./internal/ui/popups
          go test -count=1 -v -run 'TestInviteRules|TestMemberIDByEmail|TestSendInvites|TestInviteLink' ./internal/core
          go test -count=1 -v -run 'TestInviteSplit|TestInviteTokenize|TestInviteTokenErrors|TestInviteModal' ./internal/ui/popups
      - name: flow + screenshots
        env:
          CREATE_CHANNEL_SHOTS_DIR: ${{ github.workspace }}/dist/shots
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$CREATE_CHANNEL_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -timeout 15m -run 'TestCreateChannelEntryPoints|TestCreateChannelFlow' ./internal/ui/
          ls -l "$CREATE_CHANNEL_SHOTS_DIR"
      - name: invite modal screenshots (light, dark)
        if: ${{ !cancelled() }}
        env:
          INVITE_SHOTS_DIR: ${{ github.workspace }}/dist/shots/invite
          CLACK_PIXEL_TESTS: "1"
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          mkdir -p "$INVITE_SHOTS_DIR"
          xvfb-run -a go test -count=1 -v -timeout 15m -run 'TestInviteShots$' ./internal/ui/popups
          ls -l "$INVITE_SHOTS_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: create-channel-shots
          path: dist/shots
