<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slack</title>

<link rel="preconnect" href="https://a.slack-edge.com">

<body>
<div class="p-theme_background"></div>
<div class="p-client" id="client">

    <div class="p-top_nav__left"></div>
    <div class="p-top_nav__history">

      <button class="c-icon_button p-top_nav__button" id="nav-fwd" aria-label="Forward" data-tip="Forward"><svg viewBox="0 0 20 20"><path d="M10.97 4.47a.75.75 0 0 1 1.06 0l5 5a.75.75 0 0 1 0 1.06l-5 5a.75.75 0 1 1-1.06-1.06l3.72-3.72H4a.75.75 0 0 1 0-1.5h10.69l-3.72-3.72a.75.75 0 0 1 0-1.06" fill="currentColor"/></svg></button>

    </div>
    <button class="p-top_nav__search" id="top-search"><svg viewBox="0 0 20 20"><path fill="currentColor" d="M9 3a6 6 0 1 0 0 12A6 6 0 0 0 9 3M1.5 9a7.5 7.5 0 1 1 13.307 4.746l3.473 3.474a.75.75 0 1 1-1.06 1.06l-3.474-3.473A7.5 7.5 0 0 1 1.5 9"/></svg><span class="p-top_nav__search__text">Search</span></button>
    <div class="p-top_nav__right">
      <button class="p-top_nav__help c-icon_button" aria-label="Help" data-tip="Help"><svg viewBox="0 0 20 20"><path fill="currentColor" d="M10 2.5a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15M1 10a9 9 0 1 1 18 0 9 9 0 0 1-18 0m9-3.5c-.83 0-1.5.67-1.5 1.5a.75.75 0 0 1-1.5 0 3 3 0 1 1 3.75 2.9v.35a.75.75 0 0 1-1.5 0V10a.75.75 0 0 1 .75-.75 1.5 1.5 0 0 0 0-3M10 15a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/></svg></button>
    </div>
  </header>
  <nav class="p-tab_rail" id="tab-rail"></nav>
  <main class="p-client_workspace" id="workspace">
    <div class="p-client_workspace__layout">
      <section class="p-view_contents--sidebar" id="sidebar-pane"></section>
      <div class="p-sidebar_resizer" id="sidebar-resizer"></div>
      <section class="p-view_contents--primary" id="primary"></section>
      <section class="p-view_contents--secondary" id="secondary" hidden></section>
    </div>
  </main>
</div>
<div id="popups"></div>
<div id="tooltip" class="c-tooltip" hidden></div>

<script type="module" src="/js/app.js"></script>
