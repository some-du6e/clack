<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slack</title>
<link rel="icon" href="/img/icon.svg">
<link rel="preconnect" href="https://a.slack-edge.com">
<link rel="preconnect" href="https://ca.slack-edge.com">
<link rel="preconnect" href="https://emoji.slack-edge.com">
<link rel="preconnect" href="https://avatars.slack-edge.com">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/messages.css">
<link rel="stylesheet" href="/css/popups.css">
<link rel="stylesheet" href="/css/views.css" onerror="this.remove()">
<link rel="modulepreload" href="/js/app.js">
<link rel="modulepreload" href="/js/api.js">
<link rel="modulepreload" href="/js/state.js">
<link rel="modulepreload" href="/js/util.js">
<link rel="modulepreload" href="/js/icons.js">
<link rel="modulepreload" href="/js/channel.js">
<link rel="modulepreload" href="/js/messages.js">
<link rel="modulepreload" href="/js/composer.js">
<link rel="modulepreload" href="/js/sidebar.js">
<link rel="modulepreload" href="/js/rail.js">
<link rel="modulepreload" href="/js/thread.js">
<script>try{if((JSON.parse(localStorage.getItem('yoloslack.prefs'))||{}).theme==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
</head>
<body>
<div class="p-theme_background"></div>
<div class="p-client" id="client">
  <header class="p-top_nav" id="top-nav">
    <div class="p-top_nav__left">
      <div class="p-top_nav__history">
        <button class="p-top_nav__button" id="nav-back" aria-label="Back" data-tip="Back" disabled><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10H4.5M9 5 4 10l5 5"/></svg></button>
        <button class="p-top_nav__button" id="nav-fwd" aria-label="Forward" data-tip="Forward" disabled><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h11.5M11 5l5 5-5 5"/></svg></button>
      </div>
      <button class="p-top_nav__button p-top_nav__button--history" id="nav-history" aria-label="History" data-tip="History"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="M10 6.25V10l2.5 2"/></svg></button>
    </div>
    <div class="p-top_nav__middle">
      <button class="p-top_nav__search" id="top-search"><svg class="p-top_nav__search__icon" viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8.75" cy="8.75" r="5.75"/><path d="m13 13 4.25 4.25"/></svg><span class="p-top_nav__search__text">Search</span></button>
    </div>
    <div class="p-top_nav__right">
      <button class="p-top_nav__button p-top_nav__help" aria-label="Help" data-tip="Help"><svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M8 8.1a2 2 0 1 1 2.6 1.9c-.4.15-.6.5-.6.9v.6"/><circle cx="10" cy="13.6" r=".5" fill="currentColor" stroke="none"/></svg></button>
    </div>
  </header>
  <nav class="p-tab_rail" id="tab-rail" aria-label="Tabs"></nav>
  <main class="p-client_workspace" id="workspace">
    <div class="p-client_workspace__layout">
      <section class="p-view_contents--sidebar" id="sidebar-pane"></section>
      <div class="p-sidebar_resizer" id="sidebar-resizer" role="separator" aria-orientation="vertical"></div>
      <section class="p-view_contents--primary" id="primary"></section>
      <section class="p-view_contents--secondary" id="secondary" hidden></section>
    </div>
  </main>
</div>
<div id="popups"></div>
<div id="tooltip" class="c-tooltip" hidden></div>
<div id="boot" class="p-boot"><div class="p-boot__spinner"></div></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
